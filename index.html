es sur les soins » (plan santé, nov. 2026)"], null, null, [-2, "https://www.pcf.fr/objectif_2", "Programme PCF : supprimer franchises et participations forfaitaires"], null, null, [-2, "https://lafrancehumaniste.fr/articles/protection-sociale.html", "« limitant le reste à charge annuel d'un ménage en fonction de son revenu » (bouclier sanitaire, chronique Vers une protection sociale rénovée, déc. 2025 ; franchises non nommées)"], null]}, {"id": "H4", "tp": 7, "q": "Il faut supprimer les agences régionales de santé (ARS).", "k": 0, "i": "Les agences régionales de santé (ARS), créées en 2010, organisent l'offre de soins dans chaque région : autorisations des hôpitaux, répartition des moyens. Elles ont été très critiquées pendant le Covid pour leur lourdeur administrative.", "p": [null, null, null, null, [2, "https://www.debout-la-france.fr/projet/sante/", "Supprimer les ARS, directions départementales sous le préfet"], null, null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Supprimer les ARS (2024)"], [1, "https://www.unenouvelleenergie.fr/questions/quelles-economies-david-lisnard-propose-t-il-et-ou-exactement/", "« On réorientera, on supprimera l’essentiel de ces machins » (Le Crayon, oct. 2026) ; ARS citées parmi les agences visées (résumé du site, reprenant i24NEWS, juin 2026) ; suppression des ARS non formulée", 1], null, null, null, [2, "https://www.pcf.fr/objectif_2", "Programme PCF : remplacer les ARS par des services démocratiques"], null, null, null, [2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : suppression des ARS (2026)"]]}, {"id": "H5", "tp": 7, "q": "Il faut une Sécurité sociale qui rembourse 100 % des soins prescrits.", "k": 0, "i": "", "p": [[2, "https://lutte-ouvriere.org/journal/article/honorairesnbspmedicaux-depasse-bornes-187610.html", "LO : service public de santé gratuit pour tous (oct. 2025)"], null, null, null, null, null, null, null, null, [2, "https://melenchon.fr/2026/11/07/grand-meeting-du-bourget-notre-programme-de-gouvernement/", "« nous ferons aussi le 100 % sécu » (discours du Bourget, 7 nov. 2026)"], null, null, [2, "https://assets.nationbuilder.com/pcf/pages/36196/attachments/original/1766073347/document_-_cahier_se%CC%81cu_v2.pdf?1766073347", "Cahier PCF 2025 : remboursement à 100 % des soins prescrits"], null, null, [1, "https://lafrancehumaniste.fr/articles/protection-sociale.html", "« Au-delà de ce seuil, tout serait pris en charge. » (bouclier sanitaire, chronique Vers une protection sociale rénovée, déc. 2025 ; pas de 100 % généralisé)", 1], null]}, {"id": "H6", "tp": 7, "q": "Il faut rouvrir des lits d'hôpital et des maternités de proximité, même peu rentables.", "k": 0, "i": "Depuis vingt ans, des dizaines de milliers de lits d'hôpital et de nombreuses petites maternités ont fermé, souvent pour des raisons de sécurité (trop peu d'accouchements) ou de manque de personnel. Leurs défenseurs mettent en avant les temps de trajet qui s'allongent dans les territoires ruraux.", "p": [null, null, null, null, [2, "https://www.debout-la-france.fr/projet/sante/", "Arrêter fermetures de lits, rouvrir un établissement/maternité par département"], null, null, [1, "https://rassemblementnational.fr/documents/projet/projet-la-sante.pdf", "Moratoire sur les suppressions de lits (2022)"], null, [2, "https://melenchon2027.fr/programme/plans-thematiques/sante/", "Rouvrir des lits, des urgences et des « maternités de proximité » à moins de 30 minutes de chacun (plan santé, nov. 2026)"], null, null, [2, "https://www.pcf.fr/objectif_5", "Programme PCF : rouvrir les maternités de proximité"], null, null, null, null]}, {"id": "H7", "tp": 7, "q": "Il faut un ratio minimum de soignants par résident dans les Ehpad, financé par l'État.", "k": 0, "i": "Il n'existe pas de nombre minimum de soignants par résident dans les Ehpad (établissements pour personnes âgées dépendantes). La moyenne française est d'environ 6 soignants pour 10 résidents ; plusieurs rapports recommandent d'atteindre 8.", "p": [null, null, null, null, [1, "https://www.debout-la-france.fr/projet/dependance-fin-de-vie/", "+25 % du taux d’encadrement en Ehpad (80 000 postes)"], null, [1, "https://www.assemblee-nationale.fr/dyn/17/scrutins/600", "POUR la proposition de loi « instaurant un nombre minimum de soignants par patient » (scrutin n°600, 23 jan. 2025). Ehpad non précisé"], [1, "https://rassemblementnational.fr/documents/projet/projet-la-sante.pdf", "Médecin coordonnateur et infirmière 24 h/24 dans chaque Ehpad (2022)"], null, [2, "https://melenchon2027.fr/programme/plans-thematiques/sante/", "« Rendre obligatoire des ratios minimum de soignant·es par patient·es », 300 000 recrutements dans le médico-social et les Ehpad (plan santé, nov. 2026)"], null, null, [2, "https://www.pcf.fr/objectif_2", "2025 : ratio d'un soignant pour un résident en Ehpad"], null, null, null, null]}, {"id": "H9", "tp": 7, "q": "Les jours de carence pour les arrêts maladie doivent être augmentés, y compris dans la fonction publique.", "k": 0, "i": "Le délai de carence est la période d'un arrêt maladie qui n'est pas indemnisée : 3 jours dans le privé (souvent compensés par l'employeur) et 1 jour dans la fonction publique. L'augmenter vise à réduire les arrêts courts et les dépenses ; ses opposants y voient une sanction des malades.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/arrets-maladie-salaries-diete-182430.html", "LO dénonce la baisse d'indemnisation des arrêts maladie, « vol de 1,5 milliard d'euros » (mars 2025)"], null, null, null, null, null, null, null, null, [-2, "https://lcp.fr/actualites/arrets-maladie-dans-la-fonction-publique-le-projet-de-reforme-bien-accueilli-par-les", "Bompard (LFI) juge « scandaleuse » la hausse des jours de carence des fonctionnaires (LCP, oct. 2024)"], [2, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "« 3 jours de carence pour tout le monde, dans le privé comme le public » (programme, 2026)"], [2, "https://acteurspublics.fr/articles/bruno-retailleau-veut-faire-travailler-davantage-les-fonctionnaires/", "Trois jours de carence dans la fonction publique « à l'image du privé », contre un seul aujourd'hui (Acteurs publics, oct. 2026)"], null, null, null, null, null]}, {"id": "ED1", "tp": 7, "q": "Il faut des groupes de niveau au collège (« choc des savoirs »).", "k": 1, "i": "Le « choc des savoirs », lancé en 2023, prévoyait de regrouper les élèves de 6e et 5e par niveau en français et en maths. La mesure a été largement assouplie et laissée à l'appréciation des établissements.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/plan-colleges-bla-bla-remplace-ba-ba-190316.html", "Les groupes de niveau d'Attal avaient « à juste titre scandalisé les enseignants, les parents et les élèves » (janv. 2026)"], [2, "https://attalpresident.fr/programme/education", "« Rétablir les mesures » du choc des savoirs (2026)"], null, null, [2, "https://www.debout-la-france.fr/projet/instruction-publique/", "Classes de niveau au collège"], null, null, null, [1, "https://www.unenouvelleenergie.fr/david-lisnard-sur-cnews-et-europe-1-je-ne-suis-pas-candidat-pour-un-poste-je-viens-pour-redresser-le-pays/", "résumé fidèle : « revenir sur le collège unique » (CNEWS/Europe 1, 27 oct. 2026) ; groupes de niveau non cités", 1], [-2, "https://melenchon2027.fr/synthese-des-contributions/", "« Abroger le Choc des savoirs, fin des groupes de niveaux » (programme, juil. 2026)"], null, [2, "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-veut-refonder-lecole-autour-de-quatre-axes-principaux", "« Développer les groupes de niveau » (2026)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : abroger le « choc des savoirs »"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Abroger le « choc des savoirs »"], [-2, "https://lesecologistes.fr/document/6gMGZGdo5Fliov7rcvUda5/dossierpresse-rentree.pdf", "Abroger le « choc des savoirs » (2026)"], null, [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Fin du collège unique, classes de niveau (2022)"]]}, {"id": "ED2", "tp": 7, "q": "L'uniforme doit être généralisé à l'école.", "k": 0, "i": "Le port d'une tenue commune à l'école a été expérimenté dans une centaine d'établissements depuis 2024. Il vise à réduire les inégalités visibles et le harcèlement ; ses opposants doutent de son efficacité et de son coût pour les familles.", "p": [[-2, "https://www.lutte-ouvriere.org/journal/article/luniforme-gadget-reactionnaire-177670.html", "LO : l'uniforme, « un gadget réactionnaire » (sept. 2024)"], [1, "https://lcp.fr/actualites/desmicardiser-debureaucratiser-deverrouiller-les-principales-annonces-de-gabriel-attal-a", "PM : uniforme généralisé si expérimentation concluante (2024)"], null, null, [2, "https://www.debout-la-france.fr/projet/instruction-publique/", "Uniforme obligatoire"], null, null, [2, "https://rassemblementnational.fr/documents/projet/projet-l-ecole.pdf", "Uniforme en primaire et au collège (2022)"], null, null, [0, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-attentive-a-ses-enfants", "Laisser aux chefs d'établissement la liberté « d'imposer l'uniforme » (programme, 2026)"], [1, "https://republicains.fr/wp-content/uploads/2026/09/LR_Ecole_vF.pdf", "Port de l'uniforme « encouragé », non imposé (LR, 2026)"], null, null, null, null, [1, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Rétablir la blouse à l’école primaire (2022)"]]}, {"id": "ED3", "tp": 7, "q": "Parcoursup doit être supprimé.", "k": 1, "i": "Parcoursup est la plateforme nationale d'admission dans l'enseignement supérieur après le bac. Les formations sélectionnent les candidats sur dossier. Elle est critiquée pour son opacité et le stress qu'elle génère.", "p": [[1, "https://lutte-ouvriere.org/journal/article/parcoursup-non-lutte-places-205845.html", "LO hostile à Parcoursup, « un système de tri », sans demander explicitement sa suppression (oct. 2026)"], [-1, "https://attalpresident.fr/actualites/gabriel-attal-en-meeting-a-lyon-un-pacte-pour-la-jeunesse", "Réformer Parcoursup, pas le supprimer (meeting de Lyon, 2026)"], null, null, [2, "https://www.debout-la-france.fr/actualite/communique-nicolas-dupont-aignan-a-limoges/", "« Suppression de Parcoursup » (20 mesures, Limoges, 20 oct. 2026)"], [0, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "« Repenser en profondeur Parcoursup » par concertation, pas suppression (Acte I PP)"], null, null, [-1, "https://www.unenouvelleenergie.fr/david-lisnard-sur-cnews-et-europe-1-je-ne-suis-pas-candidat-pour-un-poste-je-viens-pour-redresser-le-pays/", "résumé fidèle : Parcoursup critiqué, mais « la difficulté fondamentale résidait dans le refus d’assumer la sélection » (CNEWS/Europe 1, 27 oct. 2026) ; suppression non évoquée", 1], [2, "https://melenchon.fr/2026/11/07/grand-meeting-du-bourget-notre-programme-de-gouvernement/", "« La suppression de Parcoursup, de Mon Master » (discours du Bourget, 7 nov. 2026)"], null, [-2, "https://republicains.fr/wp-content/uploads/2026/09/LR_Ecole_vF.pdf", "Parcoursup « refondé » en outil de sélection, non supprimé (LR, 2026)"], [2, "https://www.pcf.fr/objectif_3", "Programme PCF : « Parcoursup sera supprimé »"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Abolir Parcoursup"], [2, "https://lesecologistes.fr/document/6gMGZGdo5Fliov7rcvUda5/dossierpresse-rentree.pdf", "Remplacer Parcoursup et MonMaster par une vraie plateforme (2026)"], [-1, "https://lafrancehumaniste.fr/articles/refonder-lecole-pour-refaire-societe.html", "« la plateforme Parcoursup sera recalibrée en instrument d'aide à la décision » (chronique école, sept. 2026)"], null]}, {"id": "ED4", "tp": 7, "q": "La cantine scolaire doit être gratuite pour tous les élèves.", "k": 0, "i": "La cantine scolaire est aujourd'hui payante, avec des tarifs souvent modulés selon les revenus des familles. Les fournitures restent à la charge des familles, aidées par l'allocation de rentrée scolaire sous condition de ressources.", "p": [null, null, null, null, null, null, null, null, null, [2, "https://melenchon.fr/2026/11/07/grand-meeting-du-bourget-notre-programme-de-gouvernement/", "« nous voulons tant les cantines bio et gratuites » (discours du Bourget, 7 nov. 2026)"], null, null, [1, "https://www.pcf.fr/objectif_6", "Programme PCF : repas à 1 € généralisé (pas gratuit)"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Premiers pas vers la gratuité scolaire, cantine"], [0, "https://lesecologistes.fr/document/2jMAmmuTuvrct5nbKLuPd2/dp-bouclier-social-pour-envoi.pdf", "Cantines à 1 €, pas de gratuité totale (2026)"], null, null]}, {"id": "ED5", "tp": 7, "q": "Les écoles privées sous contrat doivent respecter des objectifs de mixité sociale, sous peine de perdre leurs financements.", "k": 0, "i": "Les écoles privées sous contrat, majoritairement catholiques, scolarisent environ 17 % des élèves et sont financées en grande partie par l'État, qui paie leurs enseignants. Elles accueillent en moyenne des élèves plus favorisés que le public.", "p": [null, null, null, null, [-1, "https://www.debout-la-france.fr/projet/instruction-publique/", "Accepter les ouvertures de classes du privé, inspections régulières"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Privé sous contrat intégré à la carte scolaire (Acte I PP)"], null, null, null, [1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : moduler les dotations, y compris du privé"], null, [-1, "https://republicains.fr/wp-content/uploads/2026/09/LR_Ecole_vF.pdf", "Supprimer la règle 80/20 limitant les moyens du privé (LR, 2026)"], [1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : moduler dotations, y compris du privé"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Financement du privé conditionné à la mixité"], [2, "https://lesecologistes.fr/document/6gMGZGdo5Fliov7rcvUda5/dossierpresse-rentree.pdf", "Financement du privé réduit, conditionné à la mixité sociale (2026)"], [2, "https://lafrancehumaniste.fr/articles/refonder-lecole-pour-refaire-societe.html", "« Le privé, largement financé sur fonds publics, doit prendre toute sa part de la mixité sociale. » (chronique école, sept. 2026)"], null]}, {"id": "ED6", "tp": 7, "q": "Il faut un service national obligatoire pour les jeunes (civique ou militaire).", "k": 0, "i": "Le service militaire obligatoire a été suspendu en 1997. Le Service national universel (SNU), créé en 2019, est resté facultatif. Un service militaire volontaire a été annoncé fin 2025.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/nouveau-service-militaire-mise-condition-197136.html", "LO contre le nouveau service militaire, « chair à canon » (sept. 2026)"], [2, "https://attalpresident.fr/actualites/gabriel-attal-presente-ses-mesures-pour-la-jeunesse-et-l-avenir-de-la-france", "Un mois d'engagement civique obligatoire avant 25 ans (mesures jeunesse, oct. 2026)"], null, null, [2, "https://www.debout-la-france.fr/projet/defense/", "Service national civique obligatoire de trois mois"], [2, "https://www.publicsenat.fr/actualites/politique/fiscalite-ecole-immigration-ce-que-propose-raphael-glucksmann", "Service civique obligatoire de dix mois (2026)"], null, [-1, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Seulement un service national du patrimoine volontaire, expérimental (2024)"], null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "Conscription citoyenne obligatoire de 9 mois pour les moins de 25 ans, abrogation du SNU (programme, juil. 2026)"], null, null, null, [-1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Arrêt du SNU"], [-1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Arrêt du SNU"], null, [-1, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Service militaire seulement volontaire, 10 000 jeunes/an (2022)"]]}, {"id": "ED7", "tp": 7, "q": "L'éducation à la vie affective et sexuelle doit être renforcée à l'école.", "k": 0, "i": "", "p": [null, null, null, null, [-2, "https://www.debout-la-france.fr/projet/instruction-publique/", "Suppression du programme EVARS"], null, null, null, null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Garantir les trois séances annuelles d'éducation à la vie affective, relationnelle et sexuelle » (programme, juil. 2026)"], null, null, null, null, [2, "https://lesecologistes.fr/document/79R6mBUDDQU6tylI4f0C9e/livret-santereproductive-11sep.pdf", "« Garantir partout une EVARS […] réellement effective », heures banalisées et budget dédié (livret santé reproductive, sept. 2026)"], [1, "https://lafrancehumaniste.fr/articles/refonder-lecole-pour-refaire-societe.html", "« l'éducation aux émotions et aux compétences psycho-sociales » (chronique école, sept. 2026 ; éducation sexuelle non nommée)", 1], null]}, {"id": "ED8", "tp": 7, "q": "Il faut une allocation d'autonomie pour tous les étudiants.", "k": 0, "i": "Une allocation d'autonomie serait versée à tous les étudiants, indépendamment des revenus de leurs parents, pour leur permettre d'étudier sans travailler à côté. Aujourd'hui, les bourses sont attribuées selon les revenus des parents.", "p": [null, null, null, null, null, null, null, null, null, [1, "https://melenchon2027.fr/programme/plans-thematiques/esr/", "Garantie d'autonomie pour les jeunes « détaché·es du foyer fiscal de leurs parents » (1 337 €), pas pour tous les étudiants (plan ESR, oct. 2026)"], null, null, [2, "https://www.pcf.fr/objectif_3", "Programme PCF : revenu de 850 €/mois pour tous les étudiants"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Garantie d'autonomie dès 18 ans"], [1, "https://lesecologistes.fr/document/1zrfjEXlD1ZXUpT2K7sLiu/livret-enfance-vf.pdf", "« Un minima social accessible à toutes les personnes indépendantes fiscalement dès 18 ans », pas une allocation pour tous les étudiants (livret enfance, sept. 2026)"], null, null]}, {"id": "ED9", "tp": 7, "q": "Les accompagnants d'élèves en situation de handicap (AESH) doivent devenir fonctionnaires.", "k": 0, "i": "Les AESH accompagnent en classe les élèves en situation de handicap. Ils sont environ 140 000, majoritairement à temps partiel imposé et avec des salaires proches du SMIC. Les rendre fonctionnaires leur donnerait un statut et un emploi stable.", "p": [null, null, null, null, null, null, null, null, null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Titulariser les accompagnants d'élèves en situation de handicap (AESH) » (programme, juil. 2026)"], null, [0, "https://republicains.fr/wp-content/uploads/2026/09/LR_Ecole_vF.pdf", "État employeur unique des AESH, sans statut de fonctionnaire (LR, 2026)"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé par le PCF) : titulariser les AESH"], null, [2, "https://lesecologistes.fr/document/6gMGZGdo5Fliov7rcvUda5/dossierpresse-rentree.pdf", "Statut de fonctionnaire et titularisation des 144 000 AESH (2026)"], null, null]}, {"id": "L1", "tp": 7, "q": "Il faut encadrer les loyers dans toutes les zones tendues.", "k": 1, "i": "L'encadrement des loyers fixe un loyer maximum par mètre carré selon le quartier. Il est expérimenté à Paris, Lyon, Lille, Bordeaux, Montpellier et dans d'autres villes volontaires. Une zone « tendue » est une zone où la demande de logements dépasse l'offre.", "p": [null, null, null, null, null, [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Encadrer les loyers en zones de grande tension (Acte I PP)"], null, null, null, [2, "https://melenchon2027.fr/programme-partage/chapitre-7/", "2026 : étendre l'encadrement des loyers à tout le territoire"], null, [-2, "https://www.journaldelagence.com/1411841-presidentielle-2027-les-propositions-de-bruno-retailleau-pour-relancer-le-logement", "Supprimer l'encadrement des loyers (propositions logement, mai 2026)"], [2, "https://assets.nationbuilder.com/pcf/pages/36197/attachments/original/1766073372/document_-_cahier_logement_ppp.pdf?1766073372", "Cahier PCF 2025 : encadrement sur toutes les zones tendues"], [2, "https://nouspresident.fr/face-a-la-crise-du-logement-faire-sauter-le-verrou/", "Généraliser l'encadrement des loyers à tout le territoire (2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Généraliser et pérenniser l'encadrement des loyers (2026)"], null, null]}, {"id": "L2", "tp": 7, "q": "La loi SRU (25 % de logements sociaux par commune) doit être assouplie.", "k": 1, "i": "La loi SRU oblige les communes de plus de 3 500 habitants (1 500 en Île-de-France) à avoir 20 ou 25 % de logements sociaux, sous peine d'amendes. L'assouplir permettrait par exemple de compter les logements intermédiaires ou de réduire les sanctions.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/logement-vrai-probleme-fausses-reponses-197323.html", "LO critique Le Pen qui veut supprimer l'obligation de logements sociaux, « déjà bien légère » (sept. 2026)", 1], [1, "https://lcp.fr/actualites/desmicardiser-debureaucratiser-deverrouiller-les-principales-annonces-de-gabriel-attal-a", "PM : SRU élargie aux logements intermédiaires (2024)"], null, null, [1, "https://www.debout-la-france.fr/projet/logement/", "Adapter la loi SRU (accession sociale comptée)"], null, null, [2, "https://www.batiweb.com/actualites/legislation/marine-le-pen-propositions-logement-2027-49281", "Abroger la loi SRU (discours d'Hénin-Beaumont, sept. 2026, AFP)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« suppression de l’article 55 de la loi SRU » (programme, date non indiquée)"], [-2, "https://melenchon2027.fr/programme/plans-investissement/btp-logement/", "Relever le seuil SRU à 30 % (plan BTP-logement, sept. 2026)"], null, [2, "https://www.journaldelagence.com/1411841-presidentielle-2027-les-propositions-de-bruno-retailleau-pour-relancer-le-logement", "Quotas SRU remplacés par des objectifs négociés avec les collectivités (mai 2026)"], [-2, "https://assets.nationbuilder.com/pcf/pages/36197/attachments/original/1766073372/document_-_cahier_logement_ppp.pdf?1766073372", "Cahier PCF 2025 : relever le seuil SRU à 30 %"], [-2, "https://nouspresident.fr/face-a-la-crise-du-logement-faire-sauter-le-verrou/", "Dénonce le projet d'abroger la loi SRU (2026)"], [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Renforcer les sanctions SRU (2026)"], [-2, "https://lafrancehumaniste.fr/articles/protection-sociale.html", "« Le quota de logements sociaux doit être relevé dans les zones où les tensions sont les plus fortes » (chronique Vers une protection sociale rénovée, déc. 2025 ; loi SRU renforcée, pas assouplie)"], [2, "https://www.publicsenat.fr/actualites/politique/presidentielle-2022-eric-zemmour-detaille-son-programme-et-assume-le-terme", "Supprimer la loi SRU (2022)"]]}, {"id": "L3", "tp": 7, "q": "Il faut réquisitionner les logements vacants.", "k": 0, "i": "La loi permet déjà au préfet de réquisitionner des logements vides depuis longtemps appartenant à des personnes morales (entreprises, banques, assurances), mais elle est très rarement appliquée. Il y a environ 3 millions de logements vacants en France.", "p": [[1, "https://lutte-ouvriere.org/journal/article/non-guerre-entre-travailleurs-197106.html", "Éditorial Arthaud reprochant à Le Pen de ne pas proposer « de réquisitionner les logements vides » (sept. 2026)", 1], [1, "https://www.publicsenat.fr/actualites/politique/discours-de-politique-generale-on-vous-resume-les-annonces-de-gabriel-attal", "PM : réquisitionner des bâtiments vides, notamment de bureaux (2024)"], null, null, null, [0, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Taxer la vacance longue, préemption des immeubles vides, pas réquisition (Acte I PP)"], null, null, null, [2, "https://melenchon2027.fr/programme/plans-investissement/btp-logement/", "Appliquer la loi de réquisition des logements vides (plan BTP-logement, sept. 2026)"], null, null, [2, "https://assets.nationbuilder.com/pcf/pages/36197/attachments/original/1766073372/document_-_cahier_logement_ppp.pdf?1766073372", "Cahier PCF 2025 : droit de réquisition des locaux vacants par les maires"], [1, "https://nouspresident.fr/face-a-la-crise-du-logement-faire-sauter-le-verrou/", "Faciliter l'expropriation des logements vacants dégradés, pas « réquisition » (2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Utiliser le droit de réquisition (2026)"], null, null]}, {"id": "L4", "tp": 7, "q": "Les locations touristiques de type Airbnb doivent être fortement limitées.", "k": 0, "i": "Les locations touristiques meublées (Airbnb, etc.) sont accusées de réduire le nombre de logements disponibles pour les habitants dans les villes touristiques. La loi de 2024 permet aux communes de limiter leur nombre et réduit leurs avantages fiscaux.", "p": [null, null, null, null, [1, "https://www.debout-la-france.fr/projet/logement/", "Réguler les locations type Airbnb, pouvoirs aux maires"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Réguler davantage les meublés touristiques (Acte I PP)"], null, null, null, [2, "https://melenchon2027.fr/programme/plans-investissement/btp-logement/", "Meublés touristiques limités à 60 jours par an (plan BTP-logement, sept. 2026)"], null, null, [1, "https://assets.nationbuilder.com/pcf/pages/36197/attachments/original/1766073372/document_-_cahier_logement_ppp.pdf?1766073372", "Cahier PCF 2025 : alourdir la fiscalité des meublés touristiques"], [1, "https://nouspresident.fr/face-a-la-crise-du-logement-faire-sauter-le-verrou/", "Taxer au moins deux fois plus les locations occasionnelles (2026)"], [1, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Renforcer obligations et contrôle des plateformes type Airbnb (2026)"], null, null]}, {"id": "L5", "tp": 7, "q": "L'objectif « zéro artificialisation nette » (ZAN) doit être supprimé ou fortement assoupli.", "k": 0, "i": "Le « zéro artificialisation nette » (ZAN), prévu par la loi Climat de 2021, vise à ne plus bétonner de nouveaux espaces naturels ou agricoles d'ici 2050, sauf à en rendre autant à la nature. Les élus locaux le jugent souvent trop contraignant pour construire.", "p": [null, null, null, null, [2, "https://www.debout-la-france.fr/projet/logement/", "Réformer la loi Climat pour mettre fin au ZAN"], [-1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Défendre le ZAN, en adaptant son application (Acte I PP)"], null, [2, "https://www.batiweb.com/actualites/legislation/marine-le-pen-propositions-logement-2027-49281", "Supprimer le ZAN, « norme idéologique » (discours d'Hénin-Beaumont, sept. 2026, AFP)"], null, [-2, "https://melenchon2027.fr/programme/plans-thematiques/ruralite/", "Mettre en œuvre le ZAN dans l'Hexagone (plan ruralité, oct. 2026)"], null, [2, "https://www.publicsenat.fr/actualites/politique/logement-bruno-retailleau-propose-de-deduire-de-l-imot-les-interets-d-emprunt-pour-un-pret-immobilier-en-fonction-du-nombre-d-enfants", "Supprimer l'objectif ZAN (2026)"], [0, "https://assets.nationbuilder.com/pcf/pages/36197/attachments/original/1766073372/document_-_cahier_logement_ppp.pdf?1766073372", "Cahier PCF 2025 : « rendre compatible la production avec les règles de non-artificialisation des sols »"], [-1, "https://nouspresident.fr/face-a-la-crise-du-logement-faire-sauter-le-verrou/", "Réduire l'artificialisation, sans engagement explicite ZAN (2026)"], [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Renforcer la trajectoire ZAN (2026)"], [-1, "https://lafrancehumaniste.fr/articles/pourquoi-je-suis-ecogaulliste.html", "« nous devons les protéger de l'artificialisation et de l'érosion » (chronique Pourquoi je suis écogaulliste ?, juin 2026 ; ZAN non nommé)", 1], null]}, {"id": "L6", "tp": 7, "q": "Il faut transférer davantage de pouvoirs aux collectivités locales.", "k": 0, "i": "La décentralisation consiste à transférer des compétences et des moyens de l'État vers les régions, départements et communes. Ses partisans la jugent plus efficace et proche du terrain ; ses opposants craignent des inégalités entre territoires.", "p": [null, [1, "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "Plus de compétences et moyens aux territoires (2026)"], [2, "https://www.nousfrance.fr/2026/08/on-a-beaucoup-de-points-communs-entre-la-normandie-et-les-hauts-de-france-xavier-bertrand-de-passage-a-granville-ouest-france/", "« faire sauter le verrou parisien » (Ouest-France, repris sur nousfrance.fr, août 2026). Recoupe la page d'accueil nousfrance.fr (2026, date non indiquée) : « Pour le reste, laissons les territoires faire pour libérer le pays… »."], null, [1, "https://www.debout-la-france.fr/projet/equilibre-territoire-monde-rural/", "Clause de compétence générale aux communes et départements"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Nouvelle loi de décentralisation (Acte I PP)"], null, [1, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Simplifier le millefeuille pour donner plus de pouvoir aux élus locaux (2024)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/etre-maitre-de-notre-destin/", "« transférer le pouvoir normatif d’application de la loi » aux collectivités territoriales (programme, date non indiquée)"], [1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : décentralisation effective dans l'unité de la République"], [1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "Décentraliser des compétences, pouvoir de sanction aux maires (2026)"], [1, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Formation professionnelle transférée aux régions (2026)"], [1, "https://www.pcf.fr/moyen_2", "Programme PCF : nouvelle étape de décentralisation, compétence générale"], null, null, [2, "https://lafrancehumaniste.fr/programme/economie.html", "« Une compétence, une collectivité, un impôt voté localement » (proposition 20, programme économique, 2026, date non affichée)"], null]}, {"id": "L7", "tp": 7, "q": "La Corse doit obtenir une autonomie inscrite dans la Constitution.", "k": 0, "i": "Un processus engagé en 2022 vise à donner à la Corse un statut d'autonomie inscrit dans la Constitution, avec un pouvoir d'adapter certaines lois. Le projet doit être adopté par le Parlement réuni en Congrès.", "p": [null, null, null, null, null, null, [0, "https://www.assemblee-nationale.fr/dyn/17/scrutins/7454", "ABSTENTION sur le projet de loi constitutionnelle « pour une Corse autonome au sein de la République » (scrutin n°7454, 23 juin 2026)"], [0, "https://www.corsenetinfos.corsica/Ajaccio-Le-Rassemblement-national-assume-son-virage-regionaliste_a93103.html", "Contre-proposition d’autonomie encadrée par le Parlement (2026)"], null, [1, "https://melenchon2027.fr/programme-partage-nupes-2022/chapitre-5/", "NUPES 2022 : statut de l'article 74 pour la Corse"], [-1, "https://www.publicsenat.fr/actualites/politique/revision-de-la-constitution-philippe-aborde-le-volet-corse-83572", "PM : simple mention de la Corse dans la Constitution, pas d'autonomie (2018)"], [-2, "https://www.publicsenat.fr/actualites/parlementaire/autonomie-de-la-corse-bruno-retailleau-denonce-des-difficultes-absolument-majeures", "« Constitutionnalisation du communautarisme » (2024)"], [-1, "https://melenchon2027.fr/programme-partage-nupes-2022/chapitre-5/", "NUPES 2022 : PCF non favorable au statut article 74"], null, null, [-2, "https://lafrancehumaniste.fr/articles/risque-identitaire-territoires.html", "« il porte en lui les ferments d'une dislocation nationale » (projet de loi constitutionnelle sur le statut de la Corse, chronique juin 2026 ; il admet une « autonomie de responsabilité » mais rejette une autonomie d'identité)"], null]}, {"id": "L8", "tp": 7, "q": "L'accord de Bougival sur la Nouvelle-Calédonie (« État de la Nouvelle-Calédonie » au sein de la République) doit être mis en œuvre.", "k": 0, "i": "Après les émeutes de 2024, l'accord de Bougival, signé en juillet 2025 entre l'État et les forces politiques calédoniennes, prévoit un « État de la Nouvelle-Calédonie » inscrit dans la Constitution française, avec une nationalité calédonienne. Il est contesté par une partie des indépendantistes.", "p": [null, null, null, null, [-2, "https://www.lejdd.fr/politique/depecage-de-la-france-forfaiture-haute-trahison-les-souverainistes-sinsurgent-contre-laccord-sur-lavenir-de-la-nouvelle-caledonie-160134", "Bougival : « haute trahison », appelle à voter non (2025)"], null, null, [-1, "https://www.maire-info.com/nouvelle-cal%C3%A9donie/situation-bloquee-apres-le-rejet-du-projet-de-loi-constitutionnelle-sur-la-nouvelle-caledonie%EF%BF%BD-article-30660", "Accord « profondément ambigu » ; RN vote le rejet du projet constitutionnel (2026)"], null, [-2, "https://outremers360.com/bassin-pacifique-appli/reforme-constitutionnelle-la-nouvelle-caledonie-le-texte-rejete-par-lassemblee-nationale-les-signataires-de-bougival-reunis-la-semaine-prochaine", "2026 : LFI vote la motion de rejet du texte Bougival"], null, null, [-1, "https://lcp.fr/actualites/nouvelle-caledonie-l-assemblee-nationale-rejette-le-projet-de-loi-constitutionnelle", "2026 : motion de rejet du texte Bougival portée par le groupe GDR"], null, null, null, null]}, {"id": "L9", "tp": 7, "q": "Il faut bloquer les prix ou encadrer les marges de la grande distribution pour lutter contre la vie chère en outre-mer.", "k": 0, "i": "Les prix de l'alimentation en outre-mer sont de 30 à 40 % plus élevés qu'en métropole, à cause du transport, de l'octroi de mer (une taxe locale) et de la concentration de la distribution. Des mobilisations contre la vie chère ont eu lieu notamment en Martinique en 2024.", "p": [null, null, null, null, [0, "https://www.debout-la-france.fr/projet/outre-mer/", "Vie chère : plus de concurrence dans la distribution, réforme octroi de mer"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Plafonner les prix des biens de première nécessité outre-mer (Acte I PP)"], null, null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : blocage des prix essentiels, bouclier qualité-prix outre-mer renforcé"], null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé par le PCF) : blocage des prix, bouclier qualité-prix outre-mer"], null, [1, "https://lesecologistes.fr/document/2jMAmmuTuvrct5nbKLuPd2/dp-bouclier-social-pour-envoi.pdf", "Renforcer le Bouclier qualité prix outre-mer, panier à prix coûtant (2026)"], null, null]}, {"id": "L10", "tp": 7, "q": "Il faut construire massivement des logements sociaux (au moins 150 000 par an).", "k": 0, "i": "Environ 80 000 à 90 000 logements sociaux sont financés chaque année ces dernières années, bien moins que les 120 000 à 150 000 visés par le passé, alors que près de 2,8 millions de ménages attendent un HLM.", "p": [[1, "https://lutte-ouvriere.org/journal/article/logement-vrai-probleme-fausses-reponses-197323.html", "« imposer aux sociétés du bâtiment comme Bouygues ou Vinci de construire davantage » ; pas d'objectif chiffré (sept. 2026)"], null, null, null, null, null, null, null, [-1, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« ne doit plus être dogmatique et fondée sur le seul logement social » (programme, date non indiquée) ; loi SRU qualifiée d’« idéologique et dirigiste »", 1], [2, "https://melenchon2027.fr/programme/plans-investissement/btp-logement/", "Objectif de 200 000 logements publics par an dont 140 000 très sociaux (plan BTP-logement, sept. 2026)"], null, null, [2, "https://assets.nationbuilder.com/pcf/pages/36197/attachments/original/1766073372/document_-_cahier_logement_ppp.pdf?1766073372", "Cahier PCF logement : « Créer 200 000 nouveaux logements sociaux par an » pendant cinq ans (2025)"], [2, "https://nouspresident.fr/face-a-la-crise-du-logement-faire-sauter-le-verrou/", "« Production massive de logements publics — à loyer réglementé » : 200 000 par an (cahier logement, sept. 2026)"], null, null, null]}, {"id": "IN1", "tp": 8, "q": "Il faut instaurer la proportionnelle aux élections législatives.", "k": 1, "i": "Les députés sont élus au scrutin majoritaire dans 577 circonscriptions. Avec la proportionnelle, les sièges sont répartis selon le pourcentage de voix de chaque liste au niveau national ou départemental. Elle reflète mieux les votes mais rend les majorités plus difficiles à former.", "p": [null, null, null, null, [-2, "https://www.europe1.fr/politique/la-proportionnelle-est-mensongere-par-rapport-la-democratie-assure-nicolas-dupont-aignan-235458", "« La proportionnelle, c'est institutionnaliser l'émiettement politique et l'immobilisme » (Europe 1, déc. 2024)"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "« Instaurer immédiatement la proportionnelle » (Acte I PP)"], null, [2, "https://www.europe1.fr/politique/congres-du-rn-a-orleans-ce-quil-faut-retenir-du-premier-discours-de-campagne-de-marine-le-pen-1181118", "« Un scrutin proportionnel avec prime majoritaire » (discours d'Orléans, 25 oct. 2026)"], null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : instaurer la proportionnelle"], [-1, "https://lcp.fr/actualites/proportionnelle-aux-legislatives-francois-bayrou-consulte-les-avis-divergent-sur-le", "Préfère le scrutin majoritaire, sauf retour du cumul (2025)"], [-2, "https://lcp.fr/actualites/proportionnelle-aux-legislatives-francois-bayrou-consulte-les-avis-divergent-sur-le", "La proportionnelle, « le plus sûr moyen de ne pas donner à la France une majorité » (LCP, avr. 2025)"], [2, "https://www.pcf.fr/moyen_2", "Programme PCF : proportionnelle intégrale"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Instaurer la proportionnelle"], [2, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "« Adopter un mode de scrutin proportionnel pour les prochaines élections législatives » (plan de sortie de crise, sept. 2025)"], null, null]}, {"id": "IN2", "tp": 8, "q": "Il faut créer un référendum d'initiative citoyenne (RIC).", "k": 0, "i": "Le référendum d'initiative citoyenne (RIC) permettrait aux citoyens, en réunissant un certain nombre de signatures, de déclencher eux-mêmes un référendum pour proposer ou abroger une loi. Revendication phare des Gilets jaunes.", "p": [null, null, null, null, [2, "https://www.europe1.fr/politique/presidentielle-2027-nicolas-dupont-aignan-promet-de-decoloniser-la-france-en-sortant-de-lue-1089125", "RIC pour « redonner le pouvoir au peuple » (AFP, sept. 2026)"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Droit d'initiative citoyenne, référendums locaux et nationaux (Acte I PP)"], null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Inscrire le RIC dans la Constitution (2024)"], [1, "https://www.unenouvelleenergie.fr/notre-programme/etre-maitre-de-notre-destin/", "« demander aux citoyens d’arbitrer par référendum » (programme, date non indiquée) ; RIC non cité", 1], [2, "https://melenchon2027.fr/programme/synthese-des-contributions/chapitre-1-le-pouvoir-au-peuple/", "RIC au programme, à étendre au niveau local (synthèse, juil. 2026)"], null, [0, "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-veut-renverser-la-table-avec-une-profonde-reforme-constitutionnelle", "Élargir le champ du référendum et abaisser le seuil du RIP à 2,5 millions de signatures, sans proposer de RIC (Public Sénat, sept. 2026)"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : RIC ; programme : référendum par 1 M citoyens"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Instaurer le RIC"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Instaurer le RIC"], null, null]}, {"id": "IN3", "tp": 8, "q": "Il faut passer à une VIe République par une Assemblée constituante.", "k": 0, "i": "La Ve République est le régime actuel, fondé sur la Constitution de 1958 qui donne beaucoup de pouvoir au président. Une VIe République changerait le régime, par exemple au profit du Parlement, en faisant rédiger une nouvelle Constitution par une assemblée élue.", "p": [null, [-1, "https://lcp.fr/actualites/a-arras-gabriel-attal-prone-une-nouvelle-republique-en-vue-de-l-election-presidentielle", "Prône une « Ve République du XXIe siècle » plutôt qu'un changement de République (Arras, LCP, sept. 2025)"], [1, "https://lobservateur.fr/xavier-bertrand-lance-son-parti-nous-france-deja-tourne-vers-2027/", "« Nous France portera une nouvelle République : la République des territoires. Cela passera par un référendum et une nouvelle constitution. » (L'Observateur, octobre 2022). Déduit, proche de IN3 mais avec un référendum et non une constituante.", 1], null, null, [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Convention citoyenne préparant une constituante (Acte I PP)"], null, null, null, [2, "https://melenchon2027.fr/programme/synthese-des-contributions/chapitre-1-le-pouvoir-au-peuple/", "« Réunir une assemblée constituante pour passer à la 6e République », validée par référendum (juil. 2026)"], null, null, [1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : constituante ; PCF : « nouvelle République » (2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Convoquer une assemblée constituante"], [1, "https://www.lagazettefrance.fr/article/2027-les-ecologistes-veulent-instaurer-la-premiere-republique-ecologique-et-citoyenne", "AFP : « Première République écologique et citoyenne », fin du présidentialisme (2026)"], [-1, "https://lafrancehumaniste.fr/articles/chemin-gaulliste.html", "« La Ve République est née de la prescience des circonstances exceptionnelles » (chronique Le chemin gaulliste, mai 2026 ; défense de la Ve République, constituante non évoquée)", 1], null]}, {"id": "IN4", "tp": 8, "q": "Il faut limiter fortement ou supprimer l'usage du 49.3.", "k": 0, "i": "L'article 49.3 de la Constitution permet au gouvernement de faire adopter une loi sans vote de l'Assemblée, sauf si une motion de censure le renverse. Son usage est limité depuis 2008 à un texte par session, plus les budgets.", "p": [null, null, null, null, null, [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Censure constructive pour mettre fin au 49.3 (Acte I PP)"], null, null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : abroger le 49.3"], null, null, [2, "https://www.pcf.fr/moyen_2", "Programme PCF : l'article 49-3 sera abrogé"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Abroger le 49.3"], [2, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "Gouverner sans recourir au 49.3 (plan de sortie de crise, sept. 2025)"], null, null]}, {"id": "SO1", "tp": 8, "q": "Il faut légaliser l'aide active à mourir, sous conditions strictes.", "k": 1, "i": "L'aide active à mourir permettrait à une personne majeure atteinte d'une maladie grave et incurable, avec des souffrances insupportables, de demander un produit létal. Une proposition de loi a été adoptée en première lecture à l'Assemblée en 2025. La sédation profonde est déjà autorisée en fin de vie.", "p": [[1, "https://www.lutte-ouvriere.org/journal/article/aide-mourir-egalite-vie-mort-184256.html", "LO juge le projet d'aide à mourir trop restrictif (mai 2025)"], [2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/2107%20", "A voté pour la loi sur l'aide à mourir (2025)"], null, null, [-2, "https://www.europe1.fr/societe/fin-de-vie-comment-des-parlementaires-ont-pu-voter-ca-sinterroge-nicolas-dupont-aignan-965466", "Aide à mourir : « une mort organisée des plus faibles », priorité aux soins palliatifs (Europe 1, juil. 2026)"], null, [2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/2107", "POUR la proposition de loi créant un droit à l'aide à mourir (1re lecture, scrutin n°2107, 27 mai 2025). Idem POUR en scrutins n°5729 (25 fév. 2026), 7894 (30 juin 2026), 8280 (15 juil. 2026)"], [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/5729", "A voté contre la loi sur l’aide à mourir (février 2026)"], null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : instaurer un droit à mourir dans la dignité"], [0, "https://www.assemblee-nationale.fr/dyn/17/scrutins/2107", "Groupe Horizons divisé sur l'aide à mourir : 14 pour, 13 contre (2025)"], [-2, "https://www.europe1.fr/politique/aide-a-mourir-retailleau-soppose-au-texte-line-renaud-et-gabriel-attal-le-defendent-736337", "« Rupture anthropologique », se battra contre (2025)"], [1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : droit à mourir dans la dignité"], [2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/2107", "Vote pour le droit à l'aide à mourir (2025)"], [2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/2107", "Groupe écologiste 33 pour aide à mourir (2025)"], null, null]}, {"id": "SO2", "tp": 8, "q": "Il faut légaliser le cannabis récréatif.", "k": 0, "i": "Le cannabis est aujourd'hui interdit en France, avec une amende forfaitaire de 200 € pour usage. Plusieurs pays l'ont légalisé pour un usage récréatif (Canada, Allemagne, Uruguay…), en encadrant la vente.", "p": [null, null, null, null, [-2, "https://www.cnews.fr/france/2022-02-01/repression-legalisation-depenalisation-que-pensent-les-candidats-la-presidentielle", "Ferme partisan de la prohibition du cannabis (2022)"], [0, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Convention citoyenne sur les drogues, dont cannabis (Acte I PP)"], null, [-2, "https://www.cnews.fr/france/2022-02-01/repression-legalisation-depenalisation-que-pensent-les-candidats-la-presidentielle", "Refuse toute dépénalisation ou légalisation du cannabis (2022)"], null, [2, "https://melenchon2027.fr/programme/plans-thematiques/sante/", "« Légaliser et encadrer par un monopole d'État » le cannabis récréatif (plan santé, nov. 2026)"], [-1, "https://horizonsleparti.fr/le-plan-dedouard-philippe-contre-le-narcotrafic/", "Veut sanctionner davantage l'usage de stupéfiants (2026)"], [-2, "https://www.publicsenat.fr/actualites/politique/au-bout-dun-joint-dun-rail-de-coke-il-y-a-des-criminels-bruno-retailleau-annonce-vouloir-sattaquer-aux-consommateurs-de-stupefiants", "Ministre : refuse l'usage « récréatif » des stupéfiants (2024)"], [0, "https://melenchon2027.fr/programme-partage-nupes-2022/chapitre-6/", "NUPES 2022 : le PS et le PCF « proposeront l'organisation d'un débat public » au lieu de la légalisation défendue par LFI"], null, null, null, null]}, {"id": "SO3", "tp": 8, "q": "Le voile islamique doit être interdit dans l'espace public.", "k": 1, "i": "Le voile intégral (burqa, niqab) est interdit dans l'espace public depuis 2010, et les signes religieux visibles sont interdits à l'école publique depuis 2004. La mesure étendrait l'interdiction au simple foulard dans la rue et les lieux publics.", "p": [[-2, "https://www.lutte-ouvriere.org/portail/brochures/meeting-26-septembre-2026-discours-nathalie-arthaud-197446.html", "Arthaud range « interdiction du voile dans l'espace public » parmi les mesures RN qu'elle combat (meeting, 26 sept. 2026)"], [-1, "https://attalpresident.fr/actualites/bfm-tv-gabriel-attal-veut-changer-de-modele-pour-redonner-de-la-puissance-a-la-france", "Pas d'interdiction générale du voile pour les adultes, protéger les mineures (BFM, sept. 2026)"], null, null, [0, "https://www.debout-la-france.fr/projet/combat-pour-les-femmes/", "Bannir les signes religieux à l'université, à l'hôpital et en entreprise, rien sur l'espace public (projet DLF)", 1], null, null, [2, "https://www.lejdd.fr/politique/voile-mosquees-freres-musulmans-marine-le-pen-promet-un-referendum-sur-la-lutte-contre-lislamisme-183690", "« L'objectif sera d'interdire le voile », après référendum (LCI, sept. 2026)"], null, null, null, null, null, null, null, null, [2, "https://www.lejdd.fr/politique/interdiction-du-voile-dans-lespace-public-eric-zemmour-abonde-dans-le-sens-du-rn-182307", "« Totalement d'accord » avec l'interdiction du voile dans l'espace public (JDD, sept. 2026)"]]}, {"id": "SO6", "tp": 8, "q": "La PMA pour toutes les femmes doit être maintenue.", "k": 0, "i": "La PMA (procréation médicalement assistée) est ouverte depuis 2021 aux couples de femmes et aux femmes seules, et remboursée par la Sécurité sociale.", "p": [null, null, null, null, null, null, null, [0, "https://www.cnews.fr/france/2022-02-02/marine-le-pen-eric-zemmour-ce-qui-differencie-leurs-programmes-1177398", "Opposée à la PMA pour toutes mais sans abrogation (2022)"], null, [2, "https://melenchon2027.fr/programme-partage-nupes-2022/chapitre-7/", "NUPES 2022 : rembourser la PMA, l'ouvrir aux personnes trans"], null, null, [2, "https://melenchon2027.fr/programme-partage-nupes-2022/chapitre-7/", "NUPES 2022 (signé PCF) : rembourser la PMA"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : PMA remboursée et élargie"], [2, "https://lesecologistes.fr/document/79R6mBUDDQU6tylI4f0C9e/livret-santereproductive-11sep.pdf", "Défend l'AMP ouverte à toutes et veut l'élargir aux personnes trans et à la ROPA (livret santé reproductive, sept. 2026)"], null, [-2, "https://www.cnews.fr/france/2022-02-02/marine-le-pen-eric-zemmour-ce-qui-differencie-leurs-programmes-1177398", "Veut revenir sur la loi ouvrant la PMA à toutes (2022)"]]}, {"id": "SO7", "tp": 8, "q": "Il faut une loi-cadre dotée de 2 à 3 milliards d'euros par an contre les violences faites aux femmes.", "k": 0, "i": "Une loi-cadre regrouperait dans un seul texte la prévention, la protection des victimes et la sanction des violences faites aux femmes. Les associations estiment le besoin à 2 à 3 milliards d'euros par an, bien plus que les moyens actuels.", "p": [null, [1, "https://lcp.fr/actualites/la-loi-integrale-contre-les-violences-sexuelles-et-sexistes-adoptee-a-l-unanimite-par-l", "Groupe EPR a voté la loi intégrale, moyens non chiffrés (2026)"], null, null, null, null, [1, "https://www.assemblee-nationale.fr/dyn/17/scrutins/8705", "POUR la proposition de loi « apportant une réponse intégrale » aux violences sexuelles et sexistes (1re lecture, scrutin n°8705, 13 oct. 2026). Montant de 2-3 Md€ non vérifié"], null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : budget violences faites aux femmes à 2,6 Md€"], [1, "https://lcp.fr/actualites/la-loi-integrale-contre-les-violences-sexuelles-et-sexistes-adoptee-a-l-unanimite-par-l", "Groupe Horizons a voté la loi intégrale, moyens non chiffrés (2026)"], [1, "https://lcp.fr/actualites/la-loi-integrale-contre-les-violences-sexuelles-et-sexistes-adoptee-a-l-unanimite-par-l", "Groupe LR a voté la loi intégrale, moyens non chiffrés (2026)"], [2, "https://www.pcf.fr/objectif_5", "Programme PCF : 1 Md€ et loi-cadre violences ; NFP 2,6 Md€"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Loi intégrale VSS dotée de 2,6 Md€"], [2, "https://lesecologistes.fr/document/1zrfjEXlD1ZXUpT2K7sLiu/livret-enfance-vf.pdf", "Loi intégrale contre les violences sexistes et sexuelles dotée de 3 Md€ (livret enfance, sept. 2026)"], null, null]}, {"id": "SO8", "tp": 8, "q": "Il faut interdire l'élevage intensif en cage.", "k": 0, "i": "Environ un quart des poules pondeuses françaises sont encore élevées en cage. La France a interdit les nouveaux bâtiments d'élevage en cage en 2018. L'UE s'était engagée à proposer une interdiction générale, sans l'avoir encore fait.", "p": [null, null, null, null, null, [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Sortie de l'élevage en cage au niveau européen (Acte I PP)"], null, null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : interdire l'élevage en cages d'ici fin de mandature"], null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : interdire l'élevage en cages"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Arrêt des élevages en cage"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Interdire fermes-usines et élevage en cage (2026)"], null, null]}, {"id": "SO9", "tp": 8, "q": "La chasse doit être davantage encadrée (par exemple un jour sans chasse).", "k": 0, "i": "La chasse est autorisée tous les jours de la semaine pendant la saison dans la plupart des départements. Un jour sans chasse, souvent proposé le dimanche ou le mercredi, viserait à sécuriser les autres usagers de la nature après des accidents.", "p": [null, null, null, null, null, [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Moratoire chasse des espèces menacées (Acte I PP)"], null, null, null, [2, "https://melenchon2027.fr/programme-partage-nupes-2022/chapitre-2/", "NUPES 2022 : jours sans chasse (PCF et PS réservés)"], null, null, [-2, "https://melenchon2027.fr/programme-partage-nupes-2022/chapitre-2/", "NUPES 2022 : le PCF ne soutiendra pas les restrictions de chasse"], null, [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Une journée sans chasse par semaine (2026)"], null, null]}, {"id": "SO10", "tp": 8, "q": "Le port du voile doit être interdit aux mineures dans l'espace public.", "k": 0, "i": "Le voile intégral est interdit dans l'espace public depuis 2010, et les signes religieux visibles à l'école publique depuis 2004. La mesure interdirait le foulard aux mineures dans la rue et les lieux publics. Une proposition de loi en ce sens a été déposée en 2026.", "p": [[-2, "https://www.lutte-ouvriere.org/journal/article/propagande-antimusulmans-repandent-poison-188738.html", "LO range les projets d'interdire le voile aux mineures dans une « campagne de stigmatisation des musulmans » (nov. 2025)"], [1, "https://www.lejdd.fr/politique/gabriel-attal-veut-interdire-le-voile-islamique-pour-les-moins-de-15-ans-158277", "Interdire le voile dans l'espace public aux moins de 15 ans et créer un délit de « contrainte au port du voile » (JDD, mai 2025)"], null, null, null, null, null, [1, "https://www.lejdd.fr/politique/voile-mosquees-freres-musulmans-marine-le-pen-promet-un-referendum-sur-la-lutte-contre-lislamisme-183690", "Veut interdire le voile dans tout l'espace public après référendum, sans mesure spécifique aux mineures (LCI, sept. 2026)", 1], null, [-2, "https://lcp.fr/actualites/voile-des-mineures-le-texte-de-laurent-wauquiez-qui-veut-l-interdire-dans-l-espace", "Groupe LFI : texte « inconstitutionnel, islamophobe et inutile » (Gabrielle Cathala), rejeté en commission (LCP, janv. 2026)"], null, null, null, null, null, null, [2, "https://www.lejdd.fr/politique/interdiction-du-voile-dans-lespace-public-eric-zemmour-abonde-dans-le-sens-du-rn-182307", "Va plus loin : interdiction du voile dans tout l'espace public, mineures comprises (JDD, sept. 2026)", 1]]}, {"id": "SO11", "tp": 8, "q": "L'État doit dissoudre les structures liées aux Frères musulmans et durcir la lutte contre « l'entrisme islamiste ».", "k": 0, "i": "Les Frères musulmans sont un mouvement islamiste fondé en Égypte. Un rapport gouvernemental publié en 2025 a décrit une stratégie d'influence (« entrisme ») dans les associations, les écoles et les mosquées. L'État peut déjà dissoudre une association qui provoque à la haine ou menace la République.", "p": [[-2, "https://www.lutte-ouvriere.org/portail/journal/demagogie-anti-musulmans-course-mensonges-184636.html", "LO qualifie la campagne sur le rapport Frères musulmans de « démagogie anti-musulmans » (mai 2025)"], [1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "Une « loi contre l'entrisme islamiste » visant les Frères musulmans, sans dissolution annoncée (convention Renaissance, mai 2025)"], null, null, [1, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "« Fermeture immédiate des mosquées s sur la contribution française à l'UE (contre-budget, oct. 2026)"], null, [1, "https://melenchon2027.fr/synthese-des-contributions/", "« Le conditionnement de la contribution française au budget de l'Union européenne » (programme, juil. 2026)"], null, null, null, null, null, null, [2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : retour au budget UE pré-Covid (2026)"]]}, {"id": "EU4", "tp": 9, "q": "L'UE doit se doter d'une défense commune.", "k": 1, "i": "Il n'existe pas d'armée européenne : la défense reste nationale, coordonnée au sein de l'OTAN. Une défense commune impliquerait des achats d'armement communs, un budget partagé, voire des forces sous commandement européen.", "p": [null, [0, "https://attalpresident.fr/actualites/gabriel-attal-dans-politico-europe-ukraine-ia-et-finances-publiques-quatre-priorites-pour-preparer-la-france-de-demain", "États-Unis d'Europe sans transfert des compétences régaliennes (2026)"], null, null, [-2, "https://www.sudradio.fr/linvite-politique/ukraine-nous-avons-la-chance-davoir-donald-trump-qui-veut-la-paix-affirme-nicolas-dupont-aignan", "« Un pays libre doit assurer seul sa défense » (2025)"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Fonds défense 500 Md€ par emprunt commun (Acte I PP)"], [2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/977", "POUR « Appeler l'Union européenne (UE) à bâtir une défense européenne » (scrutin n°977, 12 mars 2025). Résolution"], [-2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Refus de tout transfert de compétence de défense à l’UE (2024)"], null, [-2, "https://melenchon2027.fr/comparateur-place-publique-2025/", "2025 : défense compétence nationale, non déléguée à l'UE"], [1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "Défend une « souveraineté européenne intégrale » (2026)"], [-1, "https://www.lejdd.fr/politique/bruno-retailleau-la-dissuasion-nucleaire-francaise-ne-se-partage-pas-167502", "Europe de la défense fondée d'abord sur des armées nationales qui coopèrent, pas une défense commune (tribune, JDD, mars 2026)"], [-2, "https://assets.nationbuilder.com/pcf/pages/41211/attachments/original/1779954906/document_cahier_paix_ppp_stc.pdf?1779954906", "Cahier PCF 2026 : contre une défense européenne militarisée"], null, [1, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Chapitre « armée française dans l'Europe de la défense » (2026)"], [2, "https://lafrancehumaniste.fr/articles/moment-europeen-europe-souveraine.html", "« Nous devons accepter une commande publique européenne pilotée par la commission » (manifeste européen, mars 2026)"], [-1, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Revoir l’engagement dans les programmes d’armement européens (2022)"]]}, {"id": "EU5", "tp": 9, "q": "L'adhésion de l'Ukraine à l'UE doit être engagée.", "k": 0, "i": "L'Ukraine est officiellement candidate à l'adhésion à l'UE depuis 2022, et les négociations ont été ouvertes en 2024. L'adhésion suppose de nombreuses réformes et l'accord unanime des 27 pays ; elle aurait un coût important pour le budget européen, notamment agricole.", "p": [null, [2, "https://lcp.fr/actualites/situation-en-ukraine-et-securite-en-europe-que-retenir-du-debat-qui-a-eu-lieu-a-l", "Utiliser les avoirs russes et accélérer l'adhésion de l'Ukraine à l'UE (débat à l'Assemblée, LCP, mars 2025)"], null, null, [-2, "https://www.lejdd.fr/International/nicolas-dupont-aignan-ladhesion-de-lukraine-a-lue-serait-une-faute-historique-majeure-176019", "L'adhésion de l'Ukraine serait « une faute historique majeure » (tribune, Le JDD, juin 2026)"], [1, "https://howtheyvote.eu/votes/195067", "Vote pour rapport 2025 sur l'Ukraine (2026)"], [1, "https://www.assemblee-nationale.fr/dyn/17/scrutins/973", "CONTRE « Supprimer la mention d'une adhésion de l'Ukraine à l'Union européenne (UE) » (scrutin n°973, 12 mars 2025). Il maintient la mention, sans soutien explicite à l'adhésion"], [-2, "https://rassemblementnational.fr/documents/202411-programme-europeennes.pdf", "Refuser l’élargissement de l’UE à l’Ukraine (2024)"], null, null, null, null, [-2, "https://www.publicsenat.fr/actualites/economie/pour-lagriculture-la-premiere-menace-cest-lukraine-affirme-fabien-roussel", "« L'intégration de l'Ukraine dans l'Union européenne pose un problème, au moins pour protéger nos agriculteurs » (Salon de l'agriculture, Public Sénat, fév. 2025)"], null, [1, "https://howtheyvote.eu/votes/195067", "Eurodéputés écologistes pour rapport Ukraine (2026)"], [1, "https://lafrancehumaniste.fr/articles/moment-europeen-europe-souveraine.html", "« soit une procédure accélérée mais fondée sur des seuils successifs d'intégration » (adhésion ukrainienne, sous conditions, manifeste européen, mars 2026)"], [-2, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Refuser tout nouvel élargissement de l’UE (2024)"]]}, {"id": "EU6", "tp": 9, "q": "Les règles budgétaires européennes doivent être assouplies pour permettre d'investir.", "k": 0, "i": "Les règles budgétaires européennes demandent aux États de limiter leur déficit (3 % du PIB) et de réduire leur dette (objectif de 60 % du PIB). Les assouplir permettrait d'investir davantage (transition écologique, défense), au prix d'une dette plus élevée.", "p": [null, [1, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "Sanctuariser les dépenses climat dans les règles budgétaires UE (2025)"], null, null, null, null, null, null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : refuser le pacte de stabilité budgétaire"], null, null, [2, "https://www.pcf.fr/moyen_3", "Programme PCF : fin des 3 % et du pacte de stabilité"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAM éens » (européennes 2024)"]]}, {"id": "EU8", "tp": 9, "q": "La France doit organiser un référendum sur sa sortie de l'Union européenne.", "k": 0, "i": "", "p": [null, null, null, null, [2, "https://www.debout-la-france.fr/projet/affaires-europeennes/", "« Nous organiserons un référendum sur l'appartenance à l'Union européenne » (projet DLF, Frexit annoncé sept. 2026)"], null, null, [-2, "https://rassemblementnational.fr/documents/202411-programme-europeennes.pdf", "Propose une « Alliance européenne des nations » et la réforme des traités, sans évoquer de sortie de l'UE (programme européennes 2024)", 1], [-2, "https://www.unenouvelleenergie.fr/notre-programme/etre-maitre-de-notre-destin/", "« Ni le fédéralisme ni le repli vers des États-Nations isolés ne sont des solutions. » (programme, date non indiquée) ; sortie de l’UE non évoquée", 1], null, null, null, null, null, [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Chapitre « Avancer vers une Europe fédérale », à l'opposé d'une sortie de l'UE (programme, juil. 2026)", 1], [-2, "https://lafrancehumaniste.fr/articles/appel-paix-civile-sociale.html", "« S'engager à ne pas sortir de l'Union européenne » (plateforme commune proposée, appel à la paix civile, oct. 2026 ; référendum non évoqué)", 1], null]}, {"id": "EU9", "tp": 9, "q": "L'Union européenne doit lancer de nouveaux grands emprunts communs (défense, industrie, climat).", "k": 0, "i": "", "p": [null, [1, "https://attalpresident.fr/actualites/gabriel-attal-a-reims-batir-les-etats-unis-d-europe-pour-retrouver-notre-puissance", "Une « dette commune » pour financer l'adaptation climatique ; innovation financée « par de la dette européenne » selon la convention (Reims, sept. 2026)"], null, null, null, [2, "https://lcp.fr/actualites/presidentielle-raphael-glucksmann-devoile-les-premieres-lignes-de-son-possible-programme", "Plan de souveraineté européenne financé par un « grand emprunt européen » (LCP, mai 2026)"], null, [-2, "h raeliennes-les-ecologistes-appellent-a-traduire-les-engagements-aux-niveaux-national-et-europeen", "Suspendre l'accord UE-Israël, sanctions, embargo sur l'économie coloniale (2026)"], [2, "https://www.arabnews.fr/france/gaza-lex-premier-ministre-francais-villepin-appelle-a-isoler-israel-pour-empecher-une-epuration-ethnique-502397", "« suspendre immédiatement l'accord européen avec Israël » (franceinfo, rapporté par AFP, mai 2025 ; il demande aussi un embargo sur les armes et une saisine de la CPI)"], null]}, {"id": "D5", "tp": 9, "q": "La dissuasion nucléaire française doit être partagée ou européanisée avec nos partenaires.", "k": 0, "i": "La France est la seule puissance nucléaire de l'UE. Sa dissuasion relève de la seule décision du président. La partager ou l'« européaniser » consisterait par exemple à associer des partenaires à sa doctrine ou à déployer des moyens sur leur territoire.", "p": [null, [1, "https://attalpresident.fr/programme/frontieres", "Soutient la « doctrine de dissuasion nucléaire avancée » proposée par le président de la République (programme, 2026)"], null, null, [-2, "https://www.sudradio.fr/linvite-politique/ukraine-nous-avons-la-chance-davoir-donald-trump-qui-veut-la-paix-affirme-nicolas-dupont-aignan", "Refuse le partage de la dissuasion nucléaire (2025)"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Étendre la dissuasion française aux pays de l'UE (Acte I PP)"], null, [-2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Préserver la pleine souveraineté de la dissuasion (2024)"], null, [-2, "https://melenchon2027.fr/comparateur-place-publique-2025/", "2025 : refuse tout partage européen de la dissuasion"], null, [-2, "https://www.lejdd.fr/politique/bruno-retailleau-la-dissuasion-nucleaire-francaise-ne-se-partage-pas-167502", "« La dissuasion nucléaire française ne se partage pas », « ne s'élargit pas » (tribune, JDD, mars 2026)"], [-2, "https://assets.nationbuilder.com/pcf/pages/41
