tien de l'emploi en France.", "k": 0, "i": "Les entreprises reçoivent chaque année des aides publiques (exonérations, crédits d'impôt, subventions) estimées à plus de 150 milliards d'euros selon les définitions. La mesure obligerait à les rembourser en cas de délocalisation ou de licenciements.", "p": [null, null, [1, "https://www.debout-la-france.fr/projet/produire-en-france/", "Aides à l’investissement contre implantation d’usines en France"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Critique l'absence de conditionnement des aides (Acte I PP)"], null, [2, "https://melenchon2027.fr/programme-partage/chapitre-6/", "2026 : conditionner les aides à des contreparties sociales/écologiques"], null, null, [2, "https://www.pcf.fr/objectif_3", "Programme PCF : aides conditionnées à l'embauche de jeunes en CDI"], [2, "https://nouspresident.fr/pour-proteger-notre-industrie-relocaliser-100-produits-strategiques/", "Aides conditionnées à 10 ans d'emploi en France, sinon remboursement (cahier, oct. 2026)"], [2, "https://lesecologistes.fr/document/3uFsOCRc1JbiqUtDqkoLVd/dossierpresse-budget2027.pdf", "Aides conditionnées à l'emploi et à l'impact environnemental (2026)"], null]}, {"id": "E6", "tp": 3, "q": "Il faut simplifier fortement les normes et la réglementation pour les entreprises.", "k": 0, "i": "Les entreprises doivent respecter de nombreuses règles (droit du travail, environnement, déclarations administratives). Les simplifier vise à réduire les coûts et les délais, notamment pour les petites entreprises.", "p": [null, [2, "https://attalpresident.fr/actualites/gabriel-attal-vision-economique-liberer-innover-independance-france", "Réduire la charge administrative des entreprises « d'un quart », réécriture complète du Code du travail (28 oct. 2026)"], [2, "https://www.debout-la-france.fr/projet/economie-travail/", "Diviser par deux les normes administratives"], null, [2, "https://rassemblementnational.fr/documents/WEB-GRN-LIVRET-ENTREPRISE.pdf", "Grande simplification législative et réglementaire (≈400 000 normes)"], null, [2, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-du-conseil-national-a-reims-10-mai-2026/", "« On va faire des suppressions » de normes, par ordonnance (2026)"], [2, "https://lcp.fr/index%2ephp/actualites/face-a-une-france-quasiment-en-faillite-bruno-retailleau-presente-un-plan-d-economies-de", "Normes « au bulldozer » : « on l'abroge » (2026)"], null, [-1, "https://nouspresident.fr/pour-une-exception-agriculturelle-francaise/", "Critique la « simplification » comme recul des normes (2026)"], null, [1, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Interdire la surtransposition des normes européennes (2022)"]]}, {"id": "E8", "tp": 3, "q": "Il faut limiter fortement les importations et les investissements chinois (voitures électriques, technologies sensibles).", "k": 0, "i": "La Chine domine la production de voitures électriques, de panneaux solaires et de batteries, avec d'importantes aides publiques. L'UE a imposé en 2024 des droits de douane supplémentaires sur les voitures électriques chinoises et contrôle davantage les investissements étrangers dans les secteurs sensibles.", "p": [null, [2, "https://attalpresident.fr/programme/frontieres", "Droits de douane ciblés sur la Chine, contrôle de ses investissements, exclusion des marchés publics (2026)"], [1, "https://www.debout-la-france.fr/projet/produire-en-france/", "Droits compensateurs, modèle de la taxe US de 100 % sur VE chinois"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Barrières douanières contre la concurrence chinoise (Acte I PP)"], null, [1, "https://melenchon2027.fr/programme/plans-investissement/automobile/", "Protéger le marché intérieur face aux VE chinois (plan automobile, oct. 2026)"], [1, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "Protéger le marché européen de la concurrence déloyale chinoise (programme, 2026)"], null, null, [1, "https://nouspresident.fr/pour-proteger-notre-industrie-relocaliser-100-produits-strategiques/", "Faire cesser le dumping chinois (cahier industrie, oct. 2026)"], null, [2, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Droits de douane à 50 % sur les véhicules électriques chinois (2024)"]]}, {"id": "E9", "tp": 3, "q": "Les grandes entreprises doivent payer davantage d'impôt sur les sociétés (maintien ou hausse de la surtaxe).", "k": 0, "i": "Le taux normal de l'impôt sur les sociétés est de 25 %. Une surtaxe exceptionnelle a été appliquée en 2025 aux entreprises réalisant plus d’un milliard d’euros de chiffre d’affaires, et son maintien fait débat. La question est de la prolonger ou de taxer davantage les grands groupes.", "p": [[1, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "Déplore qu'il ne soit « jamais question d'augmenter les impôts des grandes entreprises » ; prône surtout la confiscation des profits (brochure LO, été 2026)", 1], [-2, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "« Nous refuserons toute hausse d'impôt sur les entreprises » (convention Renaissance, juil. 2025)"], null, null, null, [2, "https://melenchon2027.fr/programme/synthese-des-contributions/chapitre-6-partage-des-richesses/", "« Rendre l'impôt sur les sociétés progressif », mesure déjà au programme, plus taxe sur les superprofits (synthèse du programme, juil. 2026)"], [-1, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "Baisse de 50 Md€ des impôts de production et « pas de nouvel impôt sur le quinquennat » ; pas de position explicite sur la surtaxe d'IS (programme, 2026)"], null, [1, "https://www.pcf.fr/moyen_1", "Programme PCF : « Un nouvel impôt sur les sociétés » progressif selon le chiffre d'affaires et les résultats, alourdi pour les groupes pollueurs"], null, [2, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "« Prolongation de la contribution exceptionnelle des grandes entreprises » (plan de sortie de crise, sept. 2025)"], null]}, {"id": "E10", "tp": 3, "q": "Les autoroutes doivent être renationalisées (gestion publique à la fin ou avant la fin des concessions).", "k": 0, "i": "Les autoroutes ont été privatisées en 2006 et sont exploitées par des sociétés privées (Vinci, Eiffage, Abertis) sous contrat jusqu'en 2031-2036 environ. Les renationaliser avant l'échéance obligerait à indemniser ces sociétés ; attendre la fin des contrats ne coûterait pas d'indemnité.", "p": [null, null, [2, "https://www.debout-la-france.fr/projet/transport-automobilistes/", "« Renationaliser les autoroutes » sans indemniser les concessionnaires, fin des péages d'ici 2030 (projet DLF)"], null, [2, "https://rassemblementnational.fr/22-mesures", "« Renationaliser les autoroutes pour baisser de 15 % les péages » (2022), autoroutes nationalisées toujours chiffrées dans le contre-budget d'oct. 2026"], [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Renationalisation des autoroutes », mesure déjà au programme (synthèse des contributions, juil. 2026)"], null, null, [2, "https://assets.nationbuilder.com/pcf/pages/36198/attachments/original/1766073432/document_-_cahier_mobilite_ppp.pdf?1766073432", "Cahier PCF mobilités : nationaliser les autoroutes, privatisation qualifiée de « scandaleux hold-up » (cahiers Jours heureux)"], [2, "https://nouspresident.fr/temps-loisirs/", "« Reprise en main des autoroutes (fin des concessions, tarification publique) » (cahier loisirs, sept. 2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "« Renationaliser progressivement les autoroutes » (programme, juil. 2026)"], [-1, "https://www.cnews.fr/france/2022-02-02/marine-le-pen-eric-zemmour-ce-qui-differencie-leurs-programmes-1177398", "Opposé à la renationalisation des autoroutes, jugée trop coûteuse (CNews, 2022)", 1]]}, {"id": "E11", "tp": 3, "q": "L'État doit nationaliser des entreprises stratégiques (énergie, banques, industrie).", "k": 0, "i": "L'État détient déjà EDF à 100 % et des participations dans plusieurs grandes entreprises (Engie, Airbus, Renault…). Nationaliser consisterait à prendre le contrôle complet d'entreprises privées jugées stratégiques, comme des banques ou TotalEnergies, en indemnisant leurs actionnaires.", "p": [[1, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure_caravane_2026-01_-_couleur.pdf", "Expropriation « sans indemnité ni rachat », d'abord pétrole et armement, mais rejette les simples « nationalisations » réformistes (brochure LO, 2026)", 1], null, [1, "https://www.debout-la-france.fr/projet/economie-travail/", "Rétablir « le monopole de production et de distribution d'EDF » et le monopole public du gaz, pas de nationalisations plus larges (projet DLF)"], null, [0, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "Pas de nationalisation mais « achat d'une golden share dans ATOS, Arcelor et Opella » (contre-budget, oct. 2025)"], [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Renationaliser des secteurs ciblés », dont EDF et Engie, et pôle public bancaire (programme, juil. 2026)"], null, null, [2, "https://www.pcf.fr/moyen_1", "Programme PCF : « nationalisation de groupes stratégiques », des grandes banques et assurances ; EDF et Engie « renationalisées » (objectif 4)"], [1, "https://nouspresident.fr/pour-proteger-notre-industrie-relocaliser-100-produits-strategiques/", "L'État doit devenir « majoritaire dans des pôles de production ciblés » (santé, défense, numérique), sans nationalisations générales (cahier industrie, oct. 2026)"], [1, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "« Socialiser certains domaines clés pour la transition », sans nationalisations nommées (programme, juil. 2026)"], null]}, {"id": "EN1", "tp": 4, "q": "La France doit construire de nouveaux réacteurs nucléaires.", "k": 1, "i": "Le nucléaire produit environ 65 % de l'électricité française. Le gouvernement a lancé la construction de six nouveaux réacteurs EPR2, avec une option sur huit autres, pour remplacer les centrales vieillissantes après 2035.", "p": [null, [2, "https://attalpresident.fr/actualites/gabriel-attal-vision-economique-liberer-innover-independance-france", "« Plan Messmer II » et « accélération du programme de 14 réacteurs EPR2 » (vision économique, 28 oct. 2026)"], [2, "https://www.debout-la-france.fr/projet/environnement-energie/", "Réacteurs de 4e génération, nucléaire ≥70 % de l’électricité"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Conforter le nucléaire, nouvelles unités ; « besoin des deux » (Acte I PP)"], [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Plan de relance du nucléaire : EPR, SMR, neutrons rapides (2024)"], [-2, "https://melenchon2027.fr/comparateur-place-publique-2025/", "2025 : AEC prône la sortie du nucléaire d'ici 2050"], [2, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-conquerante", "8 EPR supplémentaires en plus des 6 prévus (programme, 2026)"], [2, "https://www.europe1.fr/politique/economiquement-vertueuse-ecologiquement-responsable-bruno-retailleau-clarifie-la-position-des-republicains-sur-les-energies-renouvelables-762050", "Nucléaire « priorité nationale », renouvellement du parc (2025)"], [2, "https://www.pcf.fr/ue_25_discours_fr", "2025 : construire 20 nouvelles centrales nucléaires"], [2, "https://nouspresident.fr/travaillisme-ecologique/", "Poursuivre six EPR2, prolonger centrales (2026)"], [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Fin des programmes EPR2 et SMR (2026)"], [2, "https://www.publicsenat.fr/actualites/politique/presidentielle-2022-eric-zemmour-detaille-son-programme-et-assume-le-terme", "14 nouveaux réacteurs EPR (2022)"]]}, {"id": "EN2", "tp": 4, "q": "Il faut arrêter de développer de nouvelles éoliennes.", "k": 1, "i": "Les éoliennes produisent environ 10 % de l'électricité française. Elles sont critiquées pour leur impact sur les paysages et leur intermittence, et défendues comme un moyen rapide et peu coûteux de produire une électricité bas carbone.", "p": [null, [-1, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "Accélérer l'éolien en mer (convention Renaissance, 2025)"], [2, "https://www.debout-la-france.fr/projet/equilibre-territoire-monde-rural/", "« Stopper les projets éoliens »"], [-2, "https://lcp.fr/actualites/glucksmann-face-a-royal-divisions-sur-lfi-lycees-ce-qu-il-faut-retenir-du-dernier-debat", "« La France a besoin des deux » nucléaire et renouvelables (2026)"], [2, "https://vert.eco/chaleurs-actuelles/marine-le-pen-presente-le-contre-budget-du-rn-pour-2027-une-attaque-contre-les-renouvelables-et-les-agences-environnementales/", "Moratoire sur les nouveaux projets éoliens et solaires, fin des subventions (contre-budget, oct. 2026)"], [-2, "https://melenchon2027.fr/synthese-des-contributions/", "« Plan d'urgence pour l'éolien maritime » et 100 % renouvelables en 2050 (programme, juil. 2026)"], [-1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "Vante l'usine d'éoliennes offshore du Havre, mise sur les renouvelables (2026)"], [1, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Fin du soutien public aux nouvelles éoliennes (2026)"], [-1, "https://www.pcf.fr/objectif_4", "Programme PCF : investir dans solaire, éolien, hydraulique"], [-2, "https://nouspresident.fr/travaillisme-ecologique/", "« Poursuivrons le développement de l'énergie éolienne » (2026)"], [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Développer éolien offshore et terrestre (2026)"], [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Fin de tous les projets éoliens actuels et futurs (2022)"]]}, {"id": "EN3", "tp": 4, "q": "Il faut maintenir la fin de la vente de voitures thermiques neuves en 2035.", "k": 0, "i": "L'Union européenne a décidé en 2023 d'interdire la vente de voitures neuves à moteur essence ou diesel à partir de 2035, pour imposer l'électrique. Les voitures d'occasion resteraient autorisées. La Commission européenne a proposé fin 2025 de l'assouplir.", "p": [null, null, [-2, "https://www.debout-la-france.fr/projet/transport-automobilistes/", "Supprimer l’interdiction des thermiques en 2035"], null, [-2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Renoncer à l’interdiction des thermiques en 2035 (2024)"], [2, "https://melenchon2027.fr/programme/plans-investissement/automobile/", "Anticiper la fin du thermique neuf de 2035 (plan automobile, oct. 2026)"], null, null, [-1, "https://assets.nationbuilder.com/pcf/pages/36198/attachments/original/1766073432/document_-_cahier_mobilite_ppp.pdf?1766073432", "Cahier PCF mobilités : « la production de voitures thermiques peu polluantes doit être développée » (pas de mention de 2035)", 1], null, [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Maintenir 100 % véhicules neufs zéro émission en 2035 (2026)"], [-2, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Supprimer l’interdiction des thermiques en 2035 (européennes 2024)"]]}, {"id": "EN4", "tp": 4, "q": "La France doit sortir du marché européen de l'électricité pour fixer ses propres prix.", "k": 1, "i": "Le prix de l'électricité en Europe est fixé sur un marché commun, souvent aligné sur le coût des centrales à gaz, même si la France produit surtout du nucléaire bon marché. En sortir permettrait de fixer des prix nationaux, mais réduirait les échanges d'électricité avec les voisins.", "p": [null, [-1, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "« Poursuivrons la réforme de l'Europe de l'énergie », sans proposer de sortir du marché européen (convention Renaissance, 2025)", 1], [2, "https://www.debout-la-france.fr/actualite/communique-nicolas-dupont-aignan-a-limoges/", "Électricité -50 % « par la sortie du marché européen » (20 oct. 2026)"], [0, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Réformer prix électricité vers coûts de production, pas sortie (Acte I PP)"], [1, "https://www.publicsenat.fr/actualites/politique/marche-europeen-de-lelectricite-sortie-ou-reforme-les-paradoxes-de-la-normalisation-du-rn", "Position du parti : Jordan Bardella, président du RN, veut rester dans le marché européen mais changer la fixation des prix (avr. 2026)"], [2, "https://melenchon2027.fr/synthese-des-contributions/", "Sortir du marché européen de l'électricité et du gaz, mesure présente au programme (synthèse, juil. 2026)"], null, [-2, "https://www.publicsenat.fr/actualites/politique/marche-europeen-de-lelectricite-sortie-ou-reforme-les-paradoxes-de-la-normalisation-du-rn", "Sortir du marché européen : « une fausse piste » (X, avr. 2026)"], [2, "https://www.pcf.fr/40e_congres_discours_de_cloture_de_fabien_roussel", "2026 : « sortie du marché spéculatif européen de l'électricité »"], [1, "https://nouspresident.fr/travaillisme-ecologique/", "Supprimer la concurrence sur la vente d'électricité (2026)"], null, [1, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Supprimer les règles de concurrence du marché européen de l’électricité (2024)"]]}, {"id": "EN5", "tp": 4, "q": "Il faut développer massivement le solaire.", "k": 1, "i": "Le solaire et l'éolien représentent environ 15 % de l'électricité française. La programmation énergétique prévoit de les augmenter fortement d'ici 2035, en complément du nucléaire.", "p": [null, [1, "https://attalpresident.fr/actualites/gabriel-attal-presente-un-plan-de-desendettement-et-un-messmer-ii-pour-sortir-des-dependances-francaises", "Accélérer les renouvelables, en « neutralité technologique » (2026)"], [-2, "https://www.lejdd.fr/politique/presidentielle-nicolas-dupont-aignan-officialise-sa-candidature-et-fait-le-pari-du-frexit-183876", "Supprimer les 12 Md€ d'aides à l'éolien et au solaire (sept. 2026)"], [1, "https://www.publicsenat.fr/actualites/politique/europeennes-2024-raphael-glucksmann-prone-dans-son-programme-une-revolution-ecologique", "Investissement « massif » dans les renouvelables, sans mention spécifique du solaire (européennes 2024)"], [-2, "https://vert.eco/chaleurs-actuelles/marine-le-pen-presente-le-contre-budget-du-rn-pour-2027-une-attaque-contre-les-renouvelables-et-les-agences-environnementales/", "Moratoire sur tous les nouveaux projets éoliens et solaires, « on n'en a pas besoin » (contre-budget, oct. 2026)"], [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Organiser le 100 % d'énergies renouvelables en 2050 », solaire et éolien compris (programme, juil. 2026)"], [1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "Énergie décarbonée : nucléaire et renouvelables (2026)"], [-2, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Fin du soutien au photovoltaïque et à l'éolien (2026)"], [1, "https://www.pcf.fr/ue_26_discours_fr", "Doubler l'électricité décarbonée « autant des énergies renouvelables que du nucléaire » ; programme : solaire et éolien mais « surtout » l'hydraulique (université d'été, août 2026)"], [1, "https://nouspresident.fr/travaillisme-ecologique/", "Soutient l'essor solaire et éolien, sans cible (2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "44 % d'ENR dans l'électricité en 2030 (2026)"], [-1, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : fin du soutien public aux renouvelables intermittentes (2026)"]]}, {"id": "EN7", "tp": 4, "q": "Les zones à faibles émissions (ZFE) doivent être supprimées.", "k": 1, "i": "Les ZFE (zones à faibles émissions) sont des périmètres, dans une vingtaine de grandes agglomérations, où les véhicules les plus polluants (classés selon leur vignette Crit'Air) ne peuvent plus circuler. Elles visent à réduire la pollution de l'air ; elles sont critiquées parce qu'elles pénalisent les ménages modestes qui n'ont pas les moyens de changer de voiture. L'Assemblée a voté leur suppression en 2025 ; leur avenir reste débattu.", "p": [[0, "https://www.lutte-ouvriere.org/portail/journal/fin-zfe-vrais-pollueurs-toujours-inquietes-184826.html", "LO renvoie dos à dos : « Avec ou sans ZFE, c'est d'abord le profit qui pourrit la vie des travailleurs » (juin 2025)"], [-2, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "« Nous avons choisi de nous opposer à la suppression des ZFE » (convention Renaissance, juil. 2025)"], [2, "https://www.debout-la-france.fr/projet/transport-automobilistes/", "Suppression définitive des ZFE"], null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Supprimer les ZFE (2024)"], [1, "https://lcp.fr/actualites/pourquoi-le-rn-risque-d-avoir-du-mal-a-faire-voter-la-suppression-des-zfe-lors-de-sa", "2025 vote LFI pour suppression ; 2026 préfère un moratoire"], [-1, "https://lcp.fr/actualites/la-suppression-des-zfe-confirmee-lors-de-l-ultime-vote-sur-la-loi-de-simplification-a-l", "Groupe Horizons majoritairement pour maintenir les ZFE (2025)"], [1, "https://lcp.fr/actualites/la-suppression-des-zfe-confirmee-lors-de-l-ultime-vote-sur-la-loi-de-simplification-a-l", "Groupe LR majoritairement pour supprimer les ZFE (2025)"], [0, "https://assets.nationbuilder.com/pcf/pages/36198/attachments/original/1766073432/document_-_cahier_mobilite_ppp.pdf?1766073432", "Cahier PCF : ZFE socialement injustes, alternatives sans suppression"], [0, "https://nouspresident.fr/travaillisme-ecologique/", "ZFE décidées localement, « ne viendront plus d'en haut » (2026)"], [-2, "https://lesecologistes.fr/document/3yW70joEwOl5nJotwTUb4b/livretthematique-environnement-vf.pdf", "« Compléter les Zones à Faible Émission (ZFE) » par une politique Air-Santé-Mobilité (livret santé environnementale, mai 2026)"], [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Fin des ZFE (2022)"]]}, {"id": "EN8", "tp": 4, "q": "La France doit tenir l'objectif de neutralité carbone en 2050, même si cela coûte cher.", "k": 0, "i": "La neutralité carbone signifie ne pas émettre plus de gaz à effet de serre que ce que les forêts, les sols et les technologies peuvent absorber. La France et l'UE se sont engagées à l'atteindre en 2050, conformément à l'accord de Paris sur le climat.", "p": [null, [2, "https://attalpresident.fr/actualites/gabriel-attal-presente-un-plan-de-desendettement-et-un-messmer-ii-pour-sortir-des-dependances-francaises", "Fossiles sous 30 % en 2035, neutralité carbone en 2050 (2026)"], null, [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Neutralité climat 2050, -90 % en 2040 (Acte I PP)"], [1, "https://www.europe1.fr/politique/budget-2027-marine-le-pen-promet-140-milliards-deuros-nets-deconomies-dici-2032-pour-eviter-a-la-france-le-defaut-de-paiement-1126400", "Promet un programme écologique pour atteindre « la neutralité carbone avant 2050 », par le nucléaire (contre-budget, oct. 2026)"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : plan climat visant la neutralité carbone 2050"], null, null, [2, "https://www.pcf.fr/objectif_4", "Programme PCF : neutralité carbone visée 2040-2050"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Neutralité carbone en 2050"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Planifier l'atteinte de la neutralité carbone 2050 (2026)"], [-1, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Revoir l’objectif neutralité carbone 2050, abroger le Pacte vert (2024)"]]}, {"id": "EN9", "tp": 4, "q": "Il faut interdire les vols intérieurs quand une alternative en train existe, ou taxer fortement le kérosène.", "k": 0, "i": "Depuis 2023, les vols intérieurs sont interdits quand le même trajet existe en train en moins de 2 h 30, ce qui concerne peu de lignes. Le kérosène des avions n'est pas taxé comme l'essence des voitures.", "p": [null, null, null, [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Étendre interdiction vols intérieurs, fin exemption kérosène (Acte I PP)"], null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Supprimer les lignes aériennes quand l'alternative en train est inférieure à quatre heures » (programme, juil. 2026)"], null, null, [2, "https://assets.nationbuilder.com/pcf/pages/36198/attachments/original/1766073432/document_-_cahier_mobilite_ppp.pdf?1766073432", "Cahier PCF : fin de l'exonération de taxe sur le kérosène"], [2, "https://nouspresident.fr/travaillisme-ecologique/", "Interdire vols intérieurs si train < 4 h (2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Interdire vols si train < 4h30, taxer billets (2026)"], null]}, {"id": "EN10", "tp": 4, "q": "Il faut renforcer fortement la protection de la biodiversité (aires protégées, zones humides), même si cela contraint certaines activités économiques.", "k": 0, "i": "La biodiversité désigne l'ensemble des espèces vivantes et des milieux naturels. Environ un tiers du territoire français est en aire protégée, dont une petite partie en protection forte. Les zones humides, qui stockent l'eau et le carbone, ont perdu une grande partie de leur surface depuis un siècle.", "p": [null, null, [1, "https://www.debout-la-france.fr/projet/environnement-energie/", "30 % des eaux françaises en aires marines protégées"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Aires marines réellement protégées (chalutage), préservation du vivant (Acte I PP)"], [-1, "https://vert.eco/chaleurs-actuelles/marine-le-pen-presente-le-contre-budget-du-rn-pour-2027-une-attaque-contre-les-renouvelables-et-les-agences-environnementales/", "OFB, agences de l'eau et Ademe visées par la suppression d'agences (contre-budget, oct. 2026)"], [1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : protéger strictement 10 % des terres et des mers"], null, [-1, "https://republicains.fr/wp-content/uploads/2026/03/LR_Agriculture.pdf", "Supprimer l'OFB, obligations minimales en Natura 2000 (LR, 2026)"], [1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé par le PCF) : protéger strictement 10 % des terres"], [1, "https://nouspresident.fr/travaillisme-ecologique/", "« Certaines zones doivent être strictement protégées » (2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Étendre parcs et réserves, mieux protéger les zones humides (2026)"], [-1, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Réformer directives Oiseaux/Habitats pour élargir les prélèvements (2024)"]]}, {"id": "EN11", "tp": 4, "q": "La gestion de l'eau doit être publique, avec la gratuité des premiers mètres cubes vitaux.", "k": 0, "i": "La distribution de l'eau est gérée soit directement par les collectivités (régie publique), soit par des entreprises privées (Veolia, Suez, Saur) sous contrat. La gratuité des premiers mètres cubes viserait à garantir l'eau nécessaire aux besoins essentiels.", "p": [null, [0, "https://attalpresident.fr/actualites/gabriel-attal-plan-eau-argeles-sur-mer", "Bouclier tarifaire sur les litres vitaux, sans gestion publique (plan eau, août 2026)"], null, [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Tarification sociale de l'eau, « Parlements de l'eau » (Acte I PP)"], null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "Tarification de l'eau avec « gratuité des usages vitaux » et gestion publique (programme, juil. 2026)"], null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé par le PCF) : eau publique, gratuité des premiers m³"], null, [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Régies publiques de l'eau, premiers mètres cubes gratuits (2026)"], null]}, {"id": "AG1", "tp": 3, "q": "Les normes environnementales imposées aux agriculteurs (pesticides, etc.) doivent être assouplies.", "k": 1, "i": "Les agriculteurs doivent respecter des règles sur les pesticides, l'usage de l'eau ou la protection des haies. La loi Duplomb (2025) a assoupli certaines de ces règles, notamment en autorisant à nouveau un insecticide de la famille des néonicotinoïdes ; cette disposition a été censurée par le Conseil constitutionnel.", "p": [[-2, "https://www.lutte-ouvriere.org/portail/breves/duplomb-laile-184600.html", "LO contre la loi Duplomb, « taillée sur mesure pour les gros patrons du secteur agricole » (mai 2025)"], [1, "https://attalpresident.fr/actualites/gabriel-attal-debat-avec-les-francais-a-blois-et-a-bourges", "Aligner les normes agricoles sur le niveau européen, simplifier les normes de stockage de l'eau (Blois, oct. 2026)"], [1, "https://www.debout-la-france.fr/projet/agriculture/", "Fin du Pacte vert, simplifier les normes agricoles"], null, [2, "https://rassemblementnational.fr/documents/projet/projet-l-agriculture.pdf", "Plus d’interdiction de substance sans alternative équivalente (2022)"], [-2, "https://lcp.fr/actualites/la-proposition-de-loi-lfi-visant-a-interdire-l-acetamipride-rejetee-en-commission-444131", "Groupe LFI : PPL pour rétablir l'interdiction de pesticides réautorisés, contre la « dépendance à l'agrochimie » (LCP, oct. 2026)"], [1, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "« Zéro surtransposition agricole » (programme, 2026)"], [2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/2957", "Groupe LR : 47 pour, 0 contre la loi Duplomb (2025)"], [-2, "https://www.pcf.fr/ue_25_discours_fr", "2025 : s'oppose à la loi Duplomb"], [-1, "https://nouspresident.fr/pour-une-exception-agriculturelle-francaise/", "Critique loi Duplomb et retour des pesticides (2026)"], [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Sortie des pesticides de synthèse, CMR interdits (2026)"], [1, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Pesticides : réduction « réaliste et non dogmatique » (2022)"]]}, {"id": "AG2", "tp": 3, "q": "Il faut interdire le glyphosate.", "k": 0, "i": "Le glyphosate est l'herbicide le plus utilisé au monde. Classé « cancérogène probable » par une agence de l'OMS en 2015, il est jugé sans risque inacceptable par les agences européennes. L'UE a renouvelé son autorisation jusqu'en 2033.", "p": [null, null, null, [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Interdire glyphosate et néonicotinoïdes (Acte I PP)"], [-1, "https://rassemblementnational.fr/documents/projet/projet-l-agriculture.pdf", "Refus d’interdire une substance sans alternative (2022)"], [2, "https://melenchon2027.fr/programme/plans-thematiques/sante/", "« Interdiction immédiate des plus dangereux (glyphosate, néonicotinoïdes, etc.) » (plan santé, nov. 2026)"], null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : interdire le glyphosate"], [2, "https://nouspresident.fr/travaillisme-ecologique/", "« Sortir des engrais fossiles et des pesticides de synthèse » ; glyphosate rangé parmi les « scandales sanitaires » (cahiers écologie et agriculture, 2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Interdiction du glyphosate"], [-1, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Pas d’interdiction sans étude d’impact ; financer des alternatives au glyphosate (2024)"]]}, {"id": "AG3", "tp": 3, "q": "Il faut des prix planchers garantis pour les produits agricoles.", "k": 0, "i": "Un prix plancher est un prix minimum garanti aux agriculteurs, en dessous duquel les industriels et la grande distribution ne pourraient pas acheter. Les lois Egalim visent déjà à mieux prendre en compte les coûts de production, sans garantie de prix.", "p": [null, [1, "https://attalpresident.fr/actualites/gabriel-attal-debat-avec-les-francais-a-blois-et-a-bourges", "Coûts de production indexés par filière, pour que les agriculteurs ne vendent pas sous leurs coûts (Blois, oct. 2026)"], [2, "https://www.debout-la-france.fr/projet/agriculture/", "Prix garantis rétablis (lait, viande, céréales)"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Prix planchers rémunérateurs (Acte I PP)"], [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Prix garantis rémunérateurs pour les agriculteurs (2024)"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : prix plancher rémunérateur pour les agriculteurs"], null, [0, "https://republicains.fr/wp-content/uploads/2026/03/LR_Agriculture.pdf", "Livret LR : sanctuariser le coût des matières premières dans les prix, sans prix plancher garanti (mars 2026)", 1], [2, "https://www.pcf.fr/objectif_4", "Programme PCF : prix de base rémunérateurs, interdire revente à perte"], [2, "https://nouspresident.fr/pour-une-exception-agriculturelle-francaise/", "Prix minimums garantis fondés sur coûts de production (2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Adopter des prix planchers (2026)"], null]}, {"id": "AG4", "tp": 3, "q": "Les grandes réserves d'eau agricoles (« méga-bassines ») doivent être soutenues.", "k": 1, "i": "Les « méga-bassines » sont de grandes réserves d'eau, remplies en hiver en pompant dans les nappes, pour irriguer les cultures l'été. Elles sont défendues pour sécuriser les récoltes et contestées pour leur effet sur les nappes et parce qu'elles profitent à un nombre limité d'exploitations.", "p": [null, [1, "https://www.assemblee-nationale.fr/dyn/17/scrutins/2957", "Loi Duplomb votée : retenues d'eau d'intérêt général majeur (2025)"], null, [-2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "« Refuser les méga-bassines » (Acte I PP)"], [2, "https://rassemblementnational.fr/documents/projet/projet-l-agriculture.pdf", "Création de réserves d’eau jugée indispensable (2022)"], [-2, "https://melenchon2027.fr/synthese-des-contributions/", "« Interdire les méga-bassines », mesure déjà au programme (synthèse, juil. 2026)"], [1, "https://lcp.fr/actualites/chomage-edouard-philippe-veut-abaisser-la-duree-d-indemnisation-a-douze-mois-maximum", "Veut développer le stockage de l'eau (2026)"], [2, "https://republicains.fr/actualites/2026/08/09/face-au-rechauffement-climatique-adapter-la-france-plutot-que-punir/", "Stocker l'eau l'hiver pour irriguer, retenues déclarées « projets d'intérêt public majeur » (tribune, La Tribune Dimanche, août 2026)"], [-1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : moratoire sur les méga-bassines"], [-2, "https://nouspresident.fr/pour-une-exception-agriculturelle-francaise/", "Reproche au pouvoir de s'allier aux « fervents défenseurs des pesticides et des méga-bassines » (cahier agriculture, oct. 2026)"], [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Moratoire sur tous les projets de mégabassines (2026)"], [2, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Soutien aux bassines et retenues collinaires (2024)"]]}, {"id": "AG6", "tp": 3, "q": "Il faut réautoriser certains pesticides néonicotinoïdes (acétamipride) pour les filières sans alternative.", "k": 1, "i": "Les néonicotinoïdes sont des insecticides accusés de nuire aux abeilles, interdits en France depuis 2018. La loi Duplomb de 2025 prévoyait de réautoriser l'acétamipride pour certaines filières (betterave, noisette) ; le Conseil constitutionnel a censuré cette disposition. Ce pesticide reste autorisé dans le reste de l'UE.", "p": [[-2, "https://www.lutte-ouvriere.org/portail/breves/duplomb-laile-184600.html", "LO contre la loi Duplomb qui veut « réintroduire des pesticides tueurs d'abeilles » (mai 2025)"], [1, "https://www.publicsenat.fr/actualites/politique/gabriel-attal-denonce-la-grande-regression-climatique-y-compris-au-sein-meme-du-gouvernement-tout-en-assumant-son-vote-sur-la-loi-duplomb", "A voté la loi Duplomb (réautorisation de l'acétamipride) et assume ce vote, en renvoyant à l'avis de l'Anses (Public Sénat, juil. 2025)"], null, null, null, [-2, "https://lcp.fr/actualites/la-proposition-de-loi-lfi-visant-a-interdire-l-acetamipride-rejetee-en-commission-444131", "Groupe LFI : PPL visant à rétablir l'interdiction de l'acétamipride et du flupyradifurone (LCP, oct. 2026)"], null, [2, "https://republicains.fr/wp-content/uploads/2026/03/LR_Agriculture.pdf", "Livret LR : « Nous autoriserons de nouveau l'usage de certains néonicotinoïdes, dont l'acétamipride » (mars 2026)"], [-2, "https://www.pcf.fr/ue_25_discours_fr", "Salue les « 2 millions de personnes [qui] disent non à la loi Duplomb et à l'acétamipride », veut interdire les importations traitées (université d'été, août 2025)"], [-2, "https://nouspresident.fr/pour-une-exception-agriculturelle-francaise/", "Veut « se passer des néonicotinoïdes », critique la loi Duplomb (cahier agriculture, oct. 2026)"], [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "« Empêcher toute tentative de réintroduction des néonicotinoïdes » (programme, juil. 2026)"], null]}, {"id": "TR1", "tp": 4, "q": "Il faut investir massivement dans le train, notamment les petites lignes et les trains du quotidien.", "k": 0, "i": "Les « petites lignes » sont des lignes ferroviaires régionales peu fréquentées, dont beaucoup ont fermé ou sont dégradées. L'autoroute A69 entre Castres et Toulouse est l'exemple le plus connu de projet routier contesté.", "p": [null, null, [1, "https://www.debout-la-france.fr/projet/equilibre-territoire-monde-rural/", "« Maintenir et rénover le réseau ferroviaire traditionnel qui irrigue l'ensemble de nos territoires », sans plan massif chiffré (projet DLF)"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Plan rail, trains de nuit, LGV (Acte I PP)"], [1, "https://rassemblementnational.fr/documents/202411-programme-europeennes.pdf", "« Redéploiement massif du transport ferroviaire » (2024)"], [2, "https://melenchon2027.fr/programme/plans-thematiques/ruralite/", "« La réouverture des lignes du quotidien » et renforcement des petites lignes (plan ruralité, oct. 2026)"], null, null, [2, "https://assets.nationbuilder.com/pcf/pages/36198/attachments/original/1766073432/document_-_cahier_mobilite_ppp.pdf?1766073432", "Cahier PCF mobilités : « 10 milliards d'euros par an pendant 20 ans » pour le rail, défense des « petites lignes », relance des TER et Intercités"], [2, "https://nouspresident.fr/travaillisme-ecologique/", "Trains du quotidien : « plus de fréquence, plus de fiabilité, plus d'amplitude horaire », tripler le fret ferroviaire (cahier écologie, sept. 2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Régénérer le réseau, y compris les « petites » lignes rurales, loi de programmation ferroviaire (programme, juil. 2026)"], null]}, {"id": "TR3", "tp": 4, "q": "Il faut interdire les jets privés ou les taxer très fortement.", "k": 0, "i": "Un jet privé émet par passager 5 à 14 fois plus de CO₂ qu'un avion de ligne. Il existe depuis 2025 une taxe sur les billets d'avion plus élevée pour les vols en jet privé.", "p": [null, null, null, [2, "https://place-publique.eu/posts/4dFSUW5ZRZ36O2SvNhPLah/place-publique-jeunes-et-plus-de-50-elus-es-place-publique-pour-une-revolution-ecologique", "Position du parti : « Nous voulons taxer les superprofits et les jets privés » (tribune d'élus Place publique, juil. 2026)"], null, [2, "https://lcp.fr/actualites/jets-prives-une-proposition-de-loi-pour-interdire-leur-usage-en-france-137024", "2022 : PPL des députés LFI pour interdire les jets privés"], null, null, [1, "https://assets.nationbuilder.com/pcf/pages/36198/attachments/original/1766073432/document_-_cahier_mobilite_ppp.pdf?1766073432", "Cahier PCF : relever la taxe sur l'aviation d'affaires"], null, [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Interdire l'atterrissage des jets privés (2026)"], null]}, {"id": "TR4", "tp": 4, "q": "Les transports en commun devraient être gratuits.", "k": 0, "i": "La gratuité des transports en commun existe déjà dans une quarantaine de villes, comme Dunkerque ou Montpellier. Elle est financée par les impôts locaux et le versement mobilité payé par les entreprises, au lieu des tickets.", "p": [null, null, null, [0, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Ticket climat à tarif abordable, pas gratuité (Acte I PP)"], null, [1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : gratuité ciblée (jeunes, précaires)"], null, null, [2, "https://www.pcf.fr/objectif_4", "Programme PCF : gratuité des transports urbains instaurée"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Gratuité ciblée jeunes et précaires"], [1, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Gratuité ciblée jeunes et ménages précaires (2026)"], null]}, {"id": "TR5", "tp": 4, "q": "Il faut créer un crime d'écocide.", "k": 0, "i": "L'écocide désigne une atteinte grave et durable à l'environnement (pollution massive, destruction d'écosystèmes). La loi Climat de 2021 a créé un délit d'écocide ; en faire un crime le rendrait plus lourdement puni.", "p": [null, null, null, null, null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Reconnaître un crime d'écocide » (programme, juil. 2026)"], null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : crime d'écocide"], [1, "https://nouspresident.fr/travaillisme-ecologique/", "« Délit de faute systémique » pour dirigeants de grands pollueurs (2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Reconnaître le crime d'écocide"], null]}, {"id": "I1", "tp": 5, "q": "Il faut réduire fortement l'immigration légale.", "k": 1, "i": "L'immigration légale correspond aux titres de séjour délivrés chaque année, environ 340 000 en 2025 : études, famille, travail, asile. La réduire fortement suppose de restreindre une ou plusieurs de ces catégories.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure_caravane_2026-01_-_couleur.pdf", "2026 : liberté de circulation et d'installation"], [1, "https://attalpresident.fr/programme/frontieres", "« Accueillir moins pour accueillir mieux », système à points (2026)"], [2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Immigration économique conditionnée au chômage, regroupement strictement limité"], [-1, "https://lcp.fr/actualites/presidentielle-raphael-glucksmann-devoile-les-premieres-lignes-de-son-possible-programme", "« L'immigration zéro n'est ni souhaitable, ni possible » (2026)"], [2, "https://rassemblementnational.fr/documents/projet/projet-controle-de-limmigration.pdf", "« Maîtrise stricte des flux migratoires » (2022)"], [-2, "https://melenchon2027.fr/synthese-des-contributions/", "« Faciliter l'accès aux visas, régulariser les travailleurs, étudiants, parents d'enfants scolarisés » (programme, juil. 2026)"], [2, "https://www.edouardphilippe.fr/actualites/trois-principales-annonces-dedouard-philippe-a-lheure-de-verite", "« Diviser par deux l'immigration » sur le quinquennat (L'Heure de vérité, oct. 2026)"], [2, "https://www.publicsenat.fr/actualites/politique/referendum-sur-limmigration-primaute-du-droit-national-le-projet-de-bruno-retailleau-est-il-faisable", "Référendum pour « réduire drastiquement l'immigration » (2026)"], [-2, "https://www.pcf.fr/moyen_3", "Programme PCF : ouvrir des voies légales et sécurisées aux migrants"], [0, "https://www.publicsenat.fr/actualites/politique/presidentielle-limmigration-nouveau-clivage-a-gauche", "« Hostile à l'immigration pour le travail », vision « humaniste » (2026)"], null, [2, "https://www.publicsenat.fr/actualites/politique/eric-zemmour-officialise-sa-candidature-a-la-presidentielle-2027", "« Des robots à la place des immigrés » pour remplacer l'immigration de travail ; expulsion après un an de chômage (BFMTV, sept. 2026)"]]}, {"id": "I2", "tp": 5, "q": "Les sans-papiers qui travaillent dans les métiers en tension doivent pouvoir être régularisés.", "k": 1, "i": "Une personne sans papiers est un étranger sans titre de séjour valide. La loi immigration de 2024 a créé, à titre expérimental, un titre de séjour pour ceux qui travaillent dans des métiers où les employeurs peinent à recruter (bâtiment, restauration, aide à domicile…).", "p": [[2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "2026 : régularisation de tous les sans-papiers"], null, [-2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Supprimer la régularisation des étrangers en situation irrégulière"], [2, "https://lcp.fr/actualites/glucksmann-face-a-royal-divisions-sur-lfi-lycees-ce-qu-il-faut-retenir-du-dernier-debat", "Régulariser travailleurs sans papiers : « Nous le ferons » (2026)"], [-2, "https://rassemblementnational.fr/documents/projet/projet-controle-de-limmigration.pdf", "Régularisation impossible sauf cas exceptionnels (2022)"], [2, "https://melenchon2027.fr/synthese-des-contributions/", "Régulariser notamment « les travailleurs et les parents d'élèves scolarisés » (programme, juil. 2026)"], null, [-2, "https://www.publicsenat.fr/actualites/societe/immigration-ce-qui-va-changer-avec-la-nouvelle-circulaire-de-fermete-de-bruno-retailleau", "Ministre : circulaire durcissant les régularisations (2025)"], [2, "https://www.publicsenat.fr/actualites/politique/immigration-fabien-roussel-propose-la-regularisation-de-tous-les-travailleurs-sans", "2022 : régulariser « tous les sans-papiers qui travaillent »"], [1, "https://www.sudradio.fr/linvite-politique/je-refuse-une-immigration-choisie-qui-vienne-combler-les-manques-estime-francois-ruffin", "Pour régulariser ceux qui travaillent déjà ici (Sud Radio, 2022)"], [2, "https://www.lagazettefrance.fr/article/presidentielle-tondelier-propose-un-socle-programmatique-aux-autres-partis-de-gauche", "Socle proposé à la gauche : « régularisation des travailleurs sans-papiers » (AFP, avril 2026)"], [-2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Interdire la régularisation des entrés illégalement (2022)"]]}, {"id": "I4", "tp": 5, "q": "Le droit du sol doit être supprimé ou fortement restreint.", "k": 1, "i": "Le droit du sol permet à un enfant né en France de parents étrangers de devenir français, au plus tard à sa majorité s'il a vécu en France plusieurs années. Il a été restreint à Mayotte en 2018 puis en 2025.", "p": [[-2, "https://www.lutte-ouvriere.org/portail/breves/droit-sol-xenophobie-decomplexee-181795.html", "LO : restreindre le droit du sol, une « surenchère xénophobe » (fév. 2025)"], [-1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "« Refusons la suppression du droit du sol » dans l'Hexagone (2025)"], [2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Supprimer le droit du sol par référendum"], null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Suppression du droit du sol (2024)"], [-2, "https://melenchon2027.fr/synthese-des-contributions/", "« Rétablir le droit du sol pour les enfants nés en France » (programme, juil. 2026)"], null, [2, "https://www.leclubdesjuristes.com/en-bref/presidentielle-2027-bruno-retailleau-veut-supprimer-le-droit-du-sol-par-referendum-17273/", "Veut « mettre fin au droit du sol » par référendum (2026)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : droit du sol intégral"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Rétablir le droit du sol intégral"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Rétablir le droit du sol intégral"], [2, "https://www.publicsenat.fr/actualites/politique/presidentielle-2022-eric-zemmour-detaille-son-programme-et-assume-le-terme", "Suppression du droit du sol (2022)"]]}, {"id": "I5", "tp": 5, "q": "L'Aide médicale d'État (AME) doit être supprimée ou réduite aux soins urgents.", "k": 1, "i": "L'Aide médicale d'État (AME) prend en charge les soins des étrangers en situation irrégulière vivant en France depuis plus de trois mois, avec de faibles ressources. Elle coûte environ 1,2 milliard d'euros par an. La réduire aux soins urgents la transformerait en « aide médicale d'urgence ».", "p": [[-2, "https://www.lutte-ouvriere.org/portail/journal/aide-medicale-detat-deux-decrets-scelerats-191415.html", "LO : décrets restreignant l'AME « scélérats » (fév. 2026)"], [-1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "« Réformer l'AME en mettant en œuvre les recommandations du rapport Evin-Stefanini », sans la supprimer (convention Renaissance, mai 2025)"], [2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Supprimer l’AME, dispensaire d’urgence par département"], null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "AME remplacée par une aide d’urgence vitale (2024)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : garantir l'accès à l'AME"], null, [2, "https://www.publicsenat.fr/actualites/politique/suppression-de-lame-gerald-darmanin-fait-du-en-meme-temps-constate-bruno-retailleau", "Soutient la suppression de l'AME votée au Sénat (2023)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : garantir l'accès à l'AME"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Garantir l'accès à l'AME"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Garantir l'accès à l'AME"], [2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : fin de l'aide médicale d'État (2026)"]]}, {"id": "I6", "tp": 5, "q": "Il faut organiser un référendum sur l'immigration.", "k": 0, "i": "La Constitution ne permet aujourd'hui de soumettre à référendum que certains sujets (organisation des pouvoirs publics, politique économique, sociale ou environnementale). Un référendum sur l'immigration suppose, selon la plupart des juristes, de modifier d'abord la Constitution.", "p": [null, null, [2, "https://www.lejdd.fr/politique/presidentielle-nicolas-dupont-aignan-officialise-sa-candidature-et-fait-le-pari-du-frexit-183876", "Référendums sur l'immigration, les institutions, le Code pénal (sept. 2026)"], [0, "https://www.publicsenat.fr/actualites/politique/fiscalite-ecole-immigration-ce-que-propose-raphael-glucksmann", "Propose une convention citoyenne, pas un référendum (2026)"], [2, "https://rassemblementnational.fr/22-mesures", "Référendum sur l’immigration (2022, réaffirmé 2024)"], null, [0, "https://www.europe1.fr/politique/immigration-retraite-pouvoir-dachat-ce-quil-faut-retenir-de-linterview-dedouard-philippe-dans-lheure-de-verite-1133483", "« S'il faut modifier la Constitution, le peuple peut » être consulté (article 89) sur l'immigration (France 2, oct. 2026)", 1], [2, "https://www.leclubdesjuristes.com/en-bref/presidentielle-2027-bruno-retailleau-veut-supprimer-le-droit-du-sol-par-referendum-17273/", "Référendum sur les questions migratoires (2026)"], null, null, null, [2, "https://www.publicsenat.fr/actualites/politique/presidentielle-2022-eric-zemmour-detaille-son-programme-et-assume-le-terme", "Référendum sur l’immigration, la sécurité et la justice (2022)"]]}, {"id": "I7", "tp": 5, "q": "Le regroupement familial doit être fortement restreint ou supprimé.", "k": 0, "i": "Le regroupement familial permet à un étranger installé légalement en France depuis au moins 18 mois, avec des ressources et un logement suffisants, de faire venir son conjoint et ses enfants mineurs. Il concerne environ 15 000 personnes par an.", "p": [null, [1, "https://attalpresident.fr/programme/frontieres", "Regroupement familial « mieux encadré » et en baisse (2026)"], [2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "« Limiter strictement le regroupement familial »"], null, [1, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Durcir les conditions du regroupement familial (2024)"], null, [2, "https://www.boursorama.com/actualite-economique/actualites/edouard-philippe-veut-diviser-par-deux-l-immigration-legale-et-un-moratoire-sur-le-regroupement-familial-37969ad94de781018cc34edaaa67f5db", "Moratoire sur le regroupement familial (2026)"], [1, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Réduction du regroupement familial chiffrée dans son plan (2026)"], null, null, null, [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "« Supprimer le droit au regroupement familial » (2022)"]]}, {"id": "I8", "tp": 5, "q": "La France doit accueillir davantage de réfugiés et ouvrir des voies légales d'accès.", "k": 0, "i": "Un réfugié est une personne protégée parce qu'elle risque des persécutions dans son pays. Les « voies légales » permettent de venir en Europe sans traversée dangereuse : visas humanitaires, réinstallation depuis des camps.", "p": [[2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "2026 : liberté de circulation et d'installation pour chacun"], null, [-2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Asile limité aux demandes aux frontières, retour des réfugiés"], [1, "https://www.publicsenat.fr/actualites/politique/europeennes-2024-raphael-glucksmann-prone-dans-son-programme-une-revolution-ecologique", "Voie légale européenne, devoir de sauvetage (européennes 2024)"], [-2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Demandes d’asile seulement en ambassades et consulats (2024)"], [2, "https://melenchon2027.fr/synthese-des-contributions/", "Faciliter l'accès aux visas et abroger le pacte européen asile et migration (programme, juil. 2026)"], [-1, "https://fr.euronews.com/2026/10/09/presidentielle-2027-edouard-philippe-mise-sur-le-travail-et-la-reduction-des-depenses-publ", "Liste UE de pays sûrs exclus de l'asile, asile « dévoyé » (2026)"], [-2, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Traitement des demandes d'asile hors des frontières (2026)"], [2, "https://www.pcf.fr/moyen_3", "Programme PCF : voies légales ; politique d'humanité d'accueil"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Ouvrir des voies légales d'immigration"], [1, "https://lesecologistes.fr/posts/63GKwLp9RJsHhcZA1rnvXq/centre-de-retention-administrative-a-nantes-marine-tondelier-rejoint-la-lutte", "« Politiques d'accueil dignes », fin du « tout-répressif » migratoire (2026)"], [-2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Asile limité à une centaine de personnes par an (2022)"]]}, {"id": "I9", "tp": 5, "q": "Les étrangers condamnés pour un crime ou un délit grave doivent être systématiquement expulsés.", "k": 0, "i": "Un étranger condamné peut déjà être expulsé, mais certaines protections existent (arrivé enfant, parent d'enfant français…) et l'expulsion dépend de l'accord du pays d'origine. La mesure rendrait l'expulsion automatique après certaines condamnations.", "p": [null, [1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "Interdiction du territoire pour tout délit, expulsions accélérées (2025)"], [2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Tout étranger condamné à la prison ferme expulsé"], null, [2, "https://rassemblementnational.fr/documents/projet/projet-controle-de-limmigration.pdf", "Lever tous les obstacles à l’expulsion des condamnés (2022)"], null, [2, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "« Étrangers délinquants expulsés », privés d'aides sociales (2026)"], [1, "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-veut-renverser-la-table-avec-une-profonde-reforme-constitutionnelle", "Faciliter l'éloignement des étrangers condamnés (2026)"], null, null, null, [2, "https://www.publicsenat.fr/actualites/politique/eric-zemmour-officialise-sa-candidature-a-la-presidentielle-2027", "Expulser détenus étrangers et condamnés sous bracelet ou TIG (BFMTV, sept. 2026)"]]}, {"id": "I10", "tp": 5, "q": "Il faut donner le droit de vote aux étrangers non européens aux élections locales.", "k": 0, "i": "Les citoyens de l'UE vivant en France peuvent déjà voter aux élections municipales et européennes. La mesure étendrait ce droit aux étrangers non européens résidant légalement en France, pour les élections municipales. Elle nécessite une révision de la Constitution.", "p": [null, null, [-2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Droit de vote réservé aux seuls nationaux"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Droit de vote des extra-communautaires aux élections locales (Acte I PP)"], [-2, "https://rassemblementnational.fr/documents/projet/projet-controle-de-limmigration.pdf", "Seuls les nationaux votent (hors municipales pour citoyens UE)"], [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Accorder le droit de vote des étrangers aux élections locales » (programme, juil. 2026)"], null, null, [2, "https://www.pcf.fr/moyen_2", "Programme PCF : vote des étrangers aux élections locales et européennes"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Droit de vote des étrangers aux locales"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Droit de vote des étrangers aux locales"], null]}, {"id": "I11", "tp": 5, "q": "La maîtrise du français doit conditionner tout titre de séjour de longue durée.", "k": 0, "i": "Depuis la loi de 2024, la carte de résident de 10 ans exige un certain niveau de français. La mesure étendrait et durcirait cette exigence à tous les titres de séjour longs.", "p": [null, [1, "https://attalpresident.fr/programme/frontieres", "Système à points incluant la maîtrise du français (2026)"], [1, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Maîtrise de la langue pour naturalisation et regroupement conjoint"], null, [1, "https://rassemblementnational.fr/documents/projet/projet-controle-de-limmigration.pdf", "Titre de séjour subordonné à l’engagement d’assimilation (2022)"], null, null, [1, "https://www.publicsenat.fr/actualites/societe/immigration-ce-qui-va-changer-avec-la-nouvelle-circulaire-de-fermete-de-bruno-retailleau", "Ministre : français certifié valorisé pour être régularisé (2025)"], null, null, null, [1, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "« Parfaite maîtrise de la langue » pour la naturalisation (2022)"]]}, {"id": "I12", "tp": 5, "q": "La France doit pouvoir déroger à la Convention européenne des droits de l'homme (CEDH) sur l'immigration, voire en sortir.", "k": 0, "i": "La Convention européenne des droits de l'homme, que la France a ratifiée en 1974, est appliquée par la Cour de Strasbourg. Celle-ci a parfois condamné la France ou bloqué des expulsions. En déroger ou en sortir permettrait de durcir la politique migratoire, au prix de moindres garanties pour les droits fondamentaux.", "p": [null, null, [1, "https://www.debout-la-france.fr/projet/justice/", "Dénonce les arrêts CEDH/CJUE bloquant les expulsions, primauté du droit français à « rétablir par référendum », sans sortie explicite de la CEDH (projet DLF)", 1], null, [1, "https://rassemblementnational.fr/documents/projet/projet-controle-de-limmigration.pdf", "Rendre inapplicables certaines stipulations de la CEDH sur l'immigration, sans « dénonciation » de la Convention (projet 2022)"], null, [0, "https://lcp.fr/actualites/edouard-philippe-veut-diviser-par-deux-l-immigration-legale-et-propose-un-moratoire-sur", "Pas de sortie ni de dérogation : veut un « protocole additionnel, discuté avec les autres États » sur le droit à la vie familiale (France 2, oct. 2026)"], [1, "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-propose-une-revolution-copernicienne-dans-laquelle-la-constitution-ne-serait-plus-le-bouclier-qui-prote", "« Qu'une loi organique puisse revenir sur une jurisprudence européenne » de la CEDH, sans sortie de la Convention (Le Figaro via Public Sénat, sept. 2026)"], [-2, "https://www.pcf.fr/moyen_3", "Programme PCF : la France « exigera de ses partenaires européens le respect de la Convention européenne des droits de l'Homme »"], null, null, [2, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "« Quitter la CEDH, modifier la réglementation européenne sur le non-refoulement » (programme européennes 2024)"]]}, {"id": "I14", "tp": 5, "q": "Il faut dénoncer l'accord franco-algérien de 1968 sur l'immigration.", "k": 1, "i": "L'accord de 1968 fixe des règles particulières pour l'entrée, le séjour et l'emploi des Algériens en France, plus favorables sur certains points que le droit commun. L'Assemblée a adopté en octobre 2025 une résolution du RN demandant de le dénoncer, sans effet juridique.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/france-algerie-entre-surencheres-interets-compris-188576.html", "LO : le vote RN-LR pour dénoncer l'accord de 1968 relève de « la surenchère xénophobe et anti-algérienne » (nov. 2025)"], [2, "https://www.europe1.fr/politique/gabriel-attal-appelle-denoncer-laccord-franco-algerien-de-1968-238850", "Appelle à « dénoncer l'accord franco-algérien de 1968 » (Europe 1, janv. 2025) ; son groupe s'est divisé sur la résolution RN d'oct. 2025 (30 contre sur 92)"], [2, "https://x.com/dupontaignan/status/1983831053740503229", "Souhaite que les députés « votent enfin la dénonciation des accords de 1968 avec l'Algérie » (compte officiel, oct. 2025)"], null, [2, "https://lcp.fr/actualites/denonciation-des-accords-franco-algeriens-de-1968-un-texte-du-rn-adopte-a-une-voix-pres", "Groupe RN : résolution visant à dénoncer l'accord de 1968, adoptée 185 voix contre 184, « journée historique » (oct. 2025)"], [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/3260", "Groupe LFI : 52 voix contre la résolution RN dénonçant l'accord de 1968 (scrutin n°3260, 30 oct. 2025)"], [2, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-sure", "« Dénoncer l'accord de 1968 avec l'Algérie » (programme, 2026)"], [2, "https://www.europe1.fr/politique/accords-de-1968-expulsions-bruno-retailleau-durcit-le-ton-face-a-alger-764621", "Veut « sortir des accords de 1968 » ; « favorable à la dénonciation » dès nov. 2024 (Europe 1, juil. 2025)"], [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/3260", "Groupe GDR : vote contre la résolution RN dénonçant l'accord franco-algérien de 1968 (scrutin n°3260, 30 oct. 2025)"], null, [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/3260", "Groupe écologiste : 32 contre la résolution RN dénonçant l'accord de 1968 (oct. 2025)"], null]}, {"id": "I16", "tp": 5, "q": "Il faut instaurer la « priorité nationale » pour l'accès au logement social.", "k": 0, "i": "Les logements sociaux (HLM) sont attribués selon les ressources et la situation des ménages, sans condition de nationalité pour les étrangers en situation régulière. La « priorité nationale » donnerait la priorité aux Français. Beaucoup de juristes estiment qu'elle exige une révision de la Constitution.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/non-guerre-entre-travailleurs-197106.html", "Éditorial Arthaud contre la « préférence nationale » de Le Pen qui priverait de logement les travailleurs immigrés (sept. 2026)"], null, null, null, [2, "https://www.publicsenat.fr/actualites/politique/la-premiere-mesure-sociale-sera-de-garantir-a-tous-les-francais-detre-prioritaires-chez-eux-defend-laurent-jacobelli", "Priorité aux Français pour le logement social, « la famille française passe avant » (meeting d'Hénin-Beaumont, sept. 2026)"], null, null, [-1, "https://www.publicsenat.fr/actualites/politique/logement-bruno-retailleau-propose-de-deduire-de-l-imot-les-interets-d-emprunt-pour-un-pret-immobilier-en-fonction-du-nombre-d-enfants", "« N'a pas été jusqu'à promettre la priorité nationale » ; HLM réservés aux actifs « français ou étrangers en situation régulière » (Public Sénat, sept. 2026)", 1], [-2, "https://assets.nationbuilder.com/pcf/pages/36197/attachments/original/1766073372/document_-_cahier_logement_ppp.pdf?1766073372", "Cahier PCF logement : la « préférence nationale » dans le logement est une discrimination institutionnalisée (2025)"], null, null, [2, "https://www.publicsenat.fr/actualites/politique/presidentielle-2022-eric-zemmour-detaille-son-programme-et-assume-le-terme", "Va plus loin : étrangers exclus du logement social (programme 2022, Public Sénat)"]]}, {"id": "I17", "tp": 5, "q": "Les aides sociales non contributives doivent être réservées aux étrangers résidant légalement en France depuis plusieurs années (par exemple 5 ans).", "k": 0, "i": "Les aides non contributives (RSA, allocations familiales, APL…) sont financées par l'impôt, sans cotisation préalable. Pour les étrangers non européens, le RSA exige déjà cinq ans de séjour régulier. La mesure étendrait une telle durée de résidence à d'autres aides.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/non-guerre-entre-travailleurs-197106.html", "Éditorial Arthaud : supprimer les APL « aux uns » sert à « renflouer les caisses de l'État » (sept. 2026)"], null, [2, "https://www.debout-la-france.fr/actualite/communique-nicolas-dupont-aignan-a-limoges/", "Va plus loin : « suppression des aides sociales non contributives aux étrangers » (20 mesures, Limoges, 20 oct. 2026)"], null, [2, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "« Réserver le bénéfice des prestations de solidarité aux étrangers ayant au moins 5 ans ETP travaillés en France » (contre-budget, oct. 2025)"], null, null, [2, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Prestations non contributives réservées aux étrangers avec cinq ans de résidence et de travail (plan d'économies, Public Sénat, oct. 2026)"], null, null, null, [2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : va plus loin : prestations non contributives (RSA, APL, allocations familiales) réservées aux Français (2026)"]]}, {"id": "S1", "tp": 6, "q": "Il faut instaurer des peines planchers (peines minimales obligatoires).", "k": 1, "i": "Les peines planchers sont des peines minimales que le juge doit prononcer pour certains délits, sauf décision motivée. Elles ont existé de 2007 à 2014. Les prisons françaises comptent environ 62 000 places pour plus de 80 000 détenus.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/darmanin-surenchere-securitaire-184994.html", "LO dénonce les peines minimales de Darmanin, « l'équivalent des peines plancher de Sarkozy » (juin 2025)"], [1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "Seuils minimaux de peines, loi d'urgence prisons (convention, 2025)"], [1, "https://www.debout-la-france.fr/actualite/communique-nicolas-dupont-aignan-a-limoges/", "Peines planchers pour les agressions de policiers, prison ferme pour les multirécidivistes (20 mesures, Limoges, 20 oct. 2026)"], null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Peines planchers et construction de prisons (2024)"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2020/04/avenir-en-commun-maj-avril-2020.pdf", "AEC 2020 : en finir avec le tout carcéral ; NFP surpopulation"], [1, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-sure", "Peines planchers pour les infractions les plus graves (programme, 2026)"], [2, "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-propose-une-revolution-copernicienne-dans-laquelle-la-constitution-ne-serait-plus-le-bouclier-qui-prote", "Peines minimales obligatoires constitutionnalisées (2026)"], [-1, "https://www.pcf.fr/moyen_2", "Programme PCF : limiter la détention, développer les alternatives"], null, null, [2, "https://www.lejdd.fr/politique/violences-urbaines-il-ny-aura-pas-de-retour-a-la-paix-sociale-sans-la-remigration-martele-eric-zemmour-186411", "Rétablir les peines planchers et la loi anticasseurs (CNews, oct. 2026)"]]}, {"id": "S2", "tp": 6, "q": "Les mineurs de 16 ans et plus doivent pouvoir être jugés comme des majeurs.", "k": 1, "i": "Les mineurs sont jugés par une justice spécifique qui privilégie l'éducation et prévoit des peines réduites de moitié (« excuse de minorité »). La mesure permettrait de juger les 16-18 ans comme des adultes, notamment pour les faits graves.", "p": [null, [1, "https://attalpresident.fr/actualites/gabriel-attal-rtl-retablir-ordre-jeunesse-avenir-france", "« Comparution immédiate pour les récidivistes dès 16 ans », fin de l'excuse de minorité pour les récidivistes (RTL, 19 oct. 2026)"], [2, "https://www.debout-la-france.fr/actualite/communique-nicolas-dupont-aignan-a-limoges/", "« Baisse de la majorité pénale à 16 ans » (20 oct. 2026)"], null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Majorité pénale abaissée à 16 ans (2024)"], [-2, "https://melenchon2027.fr/programme-partage-nupes-2022/chapitre-6/", "NUPES 2022 : respect des principes de l'ordonnance de 1945"], [1, "https://horizonsleparti.fr/le-plan-dedouard-philippe-contre-le-narcotrafic/", "Levée de l'excuse de minorité pour le narcotrafic (2026)"], null, [-2, "https://www.pcf.fr/moyen_2", "Programme PCF : supprimer l'enfermement des 13-16 ans, limiter 16-18"], [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/1624", "Vote contre loi Attal justice des mineurs (2025)"], [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/1624", "Groupe écologiste contre loi Attal mineurs (2025)"], [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Majorité pénale abaissée à 16 ans (2022)"]]}, {"id": "S3", "tp": 6, "q": "Il faut autoriser durablement la vidéosurveillance algorithmique (détection automatique de situations à risque).", "k": 0, "i": "La vidéosurveillance algorithmique utilise des logiciels pour repérer automatiquement des situations à risque (mouvements de foule, objets abandonnés) sur les images des caméras. Elle a été expérimentée pendant les JO de 2024. La reconnaissance faciale, qui identifie les personnes, reste interdite dans l'espace public.", "p": [null, [1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "« Prolonger et étendre l'expérimentation » de la vidéoprotection algorithmique (convention Renaissance, mai 2025)"], null, null, null, [-2, "https://melenchon2027.fr/synthese-des-contributions/", "Le programme rejette la vidéosurveillance de masse et la reconnaissance faciale (synthèse, juil. 2026)"], null, [1, "https://republicains.fr/wp-content/uploads/2026/07/LR_IA.pdf", "Livret IA LR : autoriser « la vision par ordinateur pour certains objectifs de sécurité », dans un cadre encadré (juil. 2026)"], [-1, "https://www.pcf.fr/moyen_2", "Programme PCF : « Une loi protégera nos concitoyen·ne·s de la surveillance numérique de masse » ; NFP 2024 : évaluer de manière indépendante la vidéosurveillance"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Interdire la reconnaissance faciale"], null, null]}, {"id": "S4", "tp": 6, "q": "Il faut créer une présomption de légitime défense pour les policiers.", "k": 1, "i": "Aujourd'hui, un policier qui fait usage de son arme doit prouver qu'il était en situation de légitime défense ou d'absolue nécessité. Une présomption inverserait la charge : ce serait à l'accusation de prouver qu'il n'était pas en légitime défense.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/bas-loi-permis-tuer-197118.html", "LO contre la présomption d'usage légitime de l'arme, « une loi inique qui doit être retirée » (sept. 2026)"], null, [2, "https://www.debout-la-france.fr/projet/securite/", "Présomption de légitime défense pour les policiers"], null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Présomption de légitime défense pour policiers et gendarmes (2024)"], [-2, "https://melenchon2027.fr/programme-partage/chapitre-4/", "2026 : abroger la loi Cazeneuve sur le refus d'obtempérer"], null, [1, "https://lcp.fr/actualites/violences-du-17-octobre-qui-propose-quoi-sur-le-maintien-de-l-ordre-444073", "L'action d'un policier ne doit pas être « présumée fautive » (LCP, oct. 2026)"], [-1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : réviser la loi sur l'ouverture du feu"], [-1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Réformer l'usage des armes (refus d'obtempérer)"], [-2, "https://lcp.fr/actualites/violences-du-17-octobre-qui-propose-quoi-sur-le-maintien-de-l-ordre-444073", "Abroger la loi Cazeneuve de 2017 sur l'ouverture du feu (LCP, oct. 2026)"], [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Présomption de légitime défense pour policiers et gendarmes (2022)"]]}, {"id": "S5", "tp": 6, "q": "Il faut réformer la police (IGPN indépendante, interdiction de certaines techniques d'interpellation).", "k": 0, "i": "L'IGPN est l'inspection qui enquête sur les fautes des policiers ; elle dépend du ministère de l'Intérieur, et ses critiques lui reprochent un manque d'indépendance. Certaines techniques d'interpellation, comme le plaquage ventral ou la clé d'étranglement, sont accusées de provoquer des morts.", "p": [null, null, null, null, null, [2, "https://lcp.fr/actualites/violences-du-17-octobre-qui-propose-quoi-sur-le-maintien-de-l-ordre-444073", "Désescalade, interdire LBD et grenades, dissoudre la BRAV-M (LCP, oct. 2026)"], null, null, [2, "https://www.pcf.fr/moyen_2", "Programme PCF : instance indépendante de contrôle de la police"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Remplacer IGPN, interdire LBD, démanteler BRAV-M"], [2, "https://lcp.fr/actualites/violences-du-17-octobre-qui-propose-quoi-sur-le-maintien-de-l-ordre-444073", "Doctrine de désescalade, interdire LBD et grenades, démanteler la BRAV-M (LCP, oct. 2026)"], [-1, "https://www.lejdd.fr/politique/violences-urbaines-il-ny-aura-pas-de-retour-a-la-paix-sociale-sans-la-remigration-martele-eric-zemmour-186411", "Veut « en finir avec le syndrome Malik Oussekine » (CNews, oct. 2026)"]]}, {"id": "S6", "tp": 6, "q": "Les courtes peines de prison doivent être remplacées par des alternatives (travaux d'intérêt général, bracelet).", "k": 0, "i": "Une courte peine est une peine de prison de quelques mois. Depuis 2020, les peines de moins d'un mois sont interdites, et celles de moins de six mois doivent en principe être exécutées hors de prison (bracelet électronique, travail d'intérêt général).", "p": [null, null, [-2, "https://www.debout-la-france.fr/projet/justice/", "Abroger la loi de 2019 évitant la prison pour courtes peines"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Peines adaptées, TIG, contre surpopulation carcérale (Acte I PP)"], [-1, "https://rassemblementnational.fr/documents/projet/projet-la-securite.pdf", "Critique la loi de 2019 sur les courtes peines (2022)"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2020/04/avenir-en-commun-maj-avril-2020.pdf", "AEC 2020 : peines alternatives à la prison"], [-2, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "Veut des peines de prison très courtes systématiques (2026)"], null, [1, "https://www.pcf.fr/moyen_2", "Programme PCF : développer les alternatives à l'incarcération"], null, null, [-2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Fin des aménagements de peine (2022)"]]}, {"id": "S7", "tp": 6, "q": "Les consommateurs de drogue doivent être plus sévèrement sanctionnés pour lutter contre le narcotrafic.", "k": 1, "i": "L'usage de stupéfiants est un délit puni d'une amende forfaitaire de 200 €, voire d'un an de prison. Durcir les sanctions vise à réduire la demande qui finance les trafics ; ses opposants estiment que la répression des usagers n'a pas fait baisser la consommation.", "p": [[-2, "https://www.lutte-ouvriere.org/portail/breves/drogue-poudre-yeux-195191.html", "LO dénonce la répression des usagers, la drogue étant « un véritable problème de santé publique » (juin 2026)"], [1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "Étendre les amendes forfaitaires délictuelles contre la drogue (2025)"], [2, "https://www.cnews.fr/france/2022-02-01/repression-legalisation-depenalisation-que-pensent-les-candidats-la-presidentielle", "Réprimer plus durement vendeurs et consommateurs (2022)"], [-2, "https://www.publicsenat.fr/actualites/politique/narcotrafic-de-courtes-peines-de-prison-pour-les-consommateurs-de-drogue-une-proposition-qui-divise-les-mondes-judiciaires-et-politiques", "Contre la chasse policière aux fumeurs de joints (2024)"], [1, "https://www.cnews.fr/france/2022-02-01/repression-legalisation-depenalisation-que-pensent-les-candidats-la-presidentielle", "Amende forfaitaire jugée « début de dépénalisation », plus de répression (2022)"], [-2, "https://melench
