<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concordance 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : colonne de lecture type bulletin ; écrans intro → classement des sujets → questionnaire → résultats ; aucune couleur de parti */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#18202C; --muted:#5A6474; --line:#DCE0E6;
  --accent:#1F6670; --accent-ink:#FFFFFF; --accent-soft:#E2EFF0; --warn:#A8481F; --warn-soft:#F7E6DC;
  --agree:#2E7D5B; --agree-soft:#7FBF9F; --neutral:#9AA3AF; --disagree-soft:#E0A27E; --disagree:#B4532A; --none:#E6E8EC;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161C; --surface:#1B2129; --ink:#E7EAEE; --muted:#9AA4B2; --line:#2D3540;
  --accent:#5FB3BC; --accent-ink:#0E1A1C; --accent-soft:#1E3236; --warn:#F0956A; --warn-soft:#3A2419;
  --agree:#5DBB8C; --agree-soft:#3C7A5E; --neutral:#6B7482; --disagree-soft:#8E5A3E; --disagree:#E08A5E; --none:#262D36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1B2129; --ink:#E7EAEE; --muted:#9AA4B2; --line:#2D3540;
  --accent:#5FB3BC; --accent-ink:#0E1A1C; --accent-soft:#1E3236; --warn:#F0956A; --warn-soft:#3A2419;
  --agree:#5DBB8C; --agree-soft:#3C7A5E; --neutral:#6B7482; --disagree-soft:#8E5A3E; --disagree:#E08A5E; --none:#262D36; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.wide{max-width:1100px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:1.125rem;max-width:62ch}
.muted{color:var(--muted)} .small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.notice{border-left:3px solid var(--accent);padding:4px 0 4px 14px;color:var(--muted);font-size:.9rem}
button,select{font:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cand{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.cand b{font-weight:600}
.cand span{font-size:.82rem;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.steps div{display:flex;flex-direction:column;gap:4px}
.steps .n{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.mode b{font-family:var(--f-display);font-size:1.1rem}
.mode.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}

/* Classement */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 8px 8px 12px}
.rank .pos{font-family:var(--f-mono);font-weight:600;color:var(--accent)}
.rank .w{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.rank .arrows{display:flex;gap:4px}
.rank .arrows button{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;font-size:1rem;line-height:1}
.rank .arrows button:hover:not([disabled]){border-color:var(--accent)}
.rank .arrows button[disabled]{opacity:.3;cursor:default}
.rank li.moved{border-color:var(--accent)}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.scale button b{font-family:var(--f-mono);font-size:1.1rem}
.scale button span{font-size:.75rem;color:var(--muted);text-align:center}
.scale button:hover{border-color:var(--accent)}
.scale button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}

.flags{border:1px solid var(--line);border-left:4px solid var(--agree);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.flags.bad{border-left-color:var(--warn);background:var(--warn-soft)}
.flags ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.flags li{display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.flags .pp{font-size:.82rem;color:var(--muted)}
.blk[disabled]{opacity:.6;cursor:default}

.qrow{display:flex;gap:12px;align-items:flex-start}
.qrow .qtext{flex:1;min-width:0}
.info{flex:none;width:32px;height:32px;margin-top:4px;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:1.05rem;line-height:1}
.info:hover,.info[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.infop{background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.95rem;max-width:70ch}
details.mini{font-size:.82rem;color:var(--muted)}
details.mini summary{cursor:pointer;color:var(--accent)}
details.mini p{margin-top:4px}

/* Quiz */
.progress{height:6px;background:var(--none);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtheme{align-self:flex-start;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--ink);padding:3px 8px;border-radius:4px}
.qtext{font-family:var(--f-display);font-size:clamp(1.4rem,4.2vw,1.9rem);font-weight:700;line-height:1.2;text-wrap:balance}
.answers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:620px){.answers{grid-template-columns:1fr}}
.ans{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px 8px;font-weight:600;font-size:.92rem;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
@media (max-width:620px){.ans{flex-direction:row;justify-content:flex-start;padding:12px 14px}}
.ans .dot{width:14px;height:14px;border-radius:50%;flex:none}
.ans:hover{border-color:var(--accent)}
.ans.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.blk{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:12px 14px;width:100%}
.blk .box{flex:none;width:20px;height:20px;border-radius:4px;border:2px solid var(--muted);display:grid;place-items:center;font-size:.8rem;color:var(--accent-ink);margin-top:2px}
.blk.on{border-style:solid;border-color:var(--warn);background:var(--warn-soft)}
.blk.on .box{background:var(--warn);border-color:var(--warn)}
.blk b{display:block}
.blk span{font-size:.86rem;color:var(--muted)}

/* Résultats */
.res{display:flex;flex-direction:column;gap:6px}
.resrow{display:grid;grid-template-columns:28px minmax(0,1fr) 70px;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-align:left;color:var(--ink);width:100%}
.resrow:hover{border-color:var(--accent)}
.resrow.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rk{font-family:var(--f-mono);color:var(--muted);font-size:.9rem}
.nm{display:flex;flex-direction:column;gap:6px;min-width:0}
.nm b{font-weight:600}
.nm small{color:var(--muted);font-weight:400}
.bar{height:8px;background:var(--none);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.pct{font-family:var(--f-mono);font-weight:600;font-size:1.1rem;text-align:right;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.pill.low{background:var(--none);color:var(--muted)}
.fiche{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:20px}
.fiche select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.tbars{display:flex;flex-direction:column;gap:8px}
.tbar{display:grid;grid-template-columns:minmax(0,1fr) 140px 52px;gap:10px;align-items:center;font-size:.9rem}
@media (max-width:520px){.tbar{grid-template-columns:minmax(0,1fr) 80px 46px}}
.tbar .pct{font-size:.9rem}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.groups{grid-template-columns:1fr}}
.grp{display:flex;flex-direction:column;gap:8px;min-width:0}
.grp h3{display:flex;align-items:center;gap:8px}
.grp h3 .c{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-weight:400}
.grp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.grp li{border-top:1px solid var(--line);padding-top:8px;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.grp li .pp{font-size:.8rem;color:var(--muted)}
.grp li .src{font-size:.8rem}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.d{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.v2{background:var(--agree)} .v1{background:var(--agree-soft)} .v0{background:var(--neutral)} .vm1{background:var(--disagree-soft)} .vm2{background:var(--disagree)} .vn{background:transparent;border:1.5px dashed var(--neutral)}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
details.box summary{cursor:pointer;font-weight:600}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
th{font-weight:600;font-size:.75rem;color:var(--muted);white-space:nowrap}
th.q,td.q{text-align:left;min-width:240px;max-width:340px;padding-left:4px;position:sticky;left:0;background:var(--surface)}
td.q .t{font-family:var(--f-mono);font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.you{background:var(--accent-soft)}
th.vert{writing-mode:vertical-rl;transform:rotate(180deg);height:120px;text-align:left;padding:8px 4px}
td a{display:inline-flex}
.sources{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
/* Onglets et fiches candidats */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:-8px}
.tab{border:0;background:transparent;color:var(--muted);padding:10px 14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chead{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem;flex:none}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:.88rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.news li{border-left:2px solid var(--line);padding-left:10px}
table.olist th,table.olist td{text-align:left}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

.boursorama.com/actualite-economique/actualites/primaire-de-la-droite-et-du-centre-les-heritiers-du-macronisme-ne-pourront-pas-la-gagner-affirme-retailleau-c537c57c46d18fda7b182464ed5fb476"], ["3 nov. 2026", "Propose trois débats télévisés avec Lisnard, Attal et Philippe avant une éventuelle primaire (BFMTV)", "https://fr.news.yahoo.com/pouvoir-dachat-%C3%A9cologie-%C3%A9tat-r%C3%A9galien-233050661.html"]]}, {"id": "roussel", "n": "Fabien Roussel", "p": "PCF", "s": "Déclaré (vote des adhérents, 6 sept.)", "prog": {"titre": "L'ambition communiste pour de nouveaux jours heureux (PCF, 180 propositions)", "url": "https://www.pcf.fr/le_programme"}, "r": "Secrétaire national du PCF", "d": "6 septembre 2026, après un vote des adhérents (72 %)", "site": "https://www.pcf.fr/", "news": []}, {"id": "ruffin", "n": "François Ruffin", "p": "Debout !", "s": "Déclaré", "prog": {"titre": "Nous Président ! — cahiers de campagne 2027 (+ programme NFP 2024)", "url": "https://nouspresident.fr/notre-programme/"}, "r": "Député de la Somme, fondateur de Debout !", "d": "2026", "site": "https://nouspresident.fr/", "news": []}, {"id": "tondelier", "n": "Marine Tondelier", "p": "Les Écologistes", "s": "Candidature soumise au vote des adhérents (10-13 déc.) ; n'exclut pas de se retirer", "prog": {"titre": "Pour une prospérité écologique — programme des Écologistes (juillet 2026)", "url": "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf"}, "r": "Secrétaire nationale des Écologistes", "d": "Candidature confirmée par un vote des adhérents prévu du 10 au 13 décembre 2026", "site": "https://lesecologistes.fr/", "news": [["5 nov. 2026", "« Personne ne gagnera seul » : appelle à une candidature unique de la gauche et n'exclut pas de se retirer", "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-personne-ne-gagnera-seul-assure-marine-tondelier"]]}, {"id": "zemmour", "n": "Éric Zemmour", "p": "Reconquête", "s": "Déclaré", "prog": {"titre": "Programme présidentiel 2022 d’Éric Zemmour (+ européennes 2024, plan budget2027)", "url": "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf"}, "r": "Président de Reconquête", "d": "17 septembre 2026", "site": "https://www.ericzemmour.fr/", "news": []}];
const Q=[{"id": "R1", "tp": 1, "q": "L'âge légal de départ à la retraite doit être ramené à 62 ans ou moins.", "k": 1, "i": "L'âge légal est l'âge minimum pour partir à la retraite. La réforme de 2023 l'a porté progressivement de 62 à 64 ans ; son application a été suspendue fin 2025 jusqu'après la présidentielle. Ramener l'âge à 62 ans ou moins coûterait plusieurs milliards par an à financer.", "p": [[2, "https://www.lutte-ouvriere.org/journal/article/2022-04-06-nathalie-arthaud-la-lutte-de-classe-est-notre-boussole_251898.html", "« Pas seulement pour assurer la retraite à 60 ans » : se battre au-delà (meeting Arthaud, avril 2022)"], [-1, "https://attalpresident.fr/programme/travail-salaires", "Miser sur la durée de cotisation plutôt que sur l'âge de départ (programme, 2026)"], [0, "https://www.europe1.fr/politique/presidentielle-2027-nicolas-dupont-aignan-promet-de-decoloniser-la-france-en-sortant-de-lue-1089125", "Âge de départ à 62 ans et 9 mois, pas de retour à 62 ans (AFP, sept. 2026)"], [2, "https://lcp.fr/actualites/glucksmann-face-a-royal-divisions-sur-lfi-lycees-ce-qu-il-faut-retenir-du-dernier-debat", "« On ne pourra pas faire 60 ans, ce sera 62 ans » (2026)"], [2, "https://www.publicsenat.fr/actualites/politique/au-rn-la-reforme-des-retraites-divise-jordan-bardella-et-marine-le-pen-sur-le-programme-pour-la-presidentielle-2027", "MLP maintient le retour à 62 ans, 60 pour carrières longues (2026)"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "Retraite à 60 ans avec 40 annuités, sur un mandat (plan budgétaire, oct. 2026)"], [-2, "https://www.publicsenat.fr/actualites/politique/reculer-ou-avancer-lage-legal-avec-ou-sans-capitalisation-ce-que-proposent-les-principaux-candidats-a-lelection-presidentielle-sur-les-retraites", "Propose âge légal 65 ans et 45 annuités (2026)"], [-1, "https://lcp.fr/actualites/retraites-bruno-retailleau-veut-un-age-minimal-de-depart-a-63-ans-et-un-taux-plein-a-65", "Âge minimal 63 ans avec décote, taux plein 65 ans (2026)"], [2, "https://assets.nationbuilder.com/pcf/pages/36196/attachments/original/1766073347/document_-_cahier_se%CC%81cu_v2.pdf?1766073347", "Cahier PCF 2025 : retraite pleine et entière à 60 ans"], [2, "https://nouspresident.fr/statut-travailleurs-essentiels/", "Cahier campagne : « la retraite à 60 ans » (2026)"], [2, "https://fr.finance.yahoo.com/actualites/presidentielle-2027-proposent-candidats-retraite-120000835.html", "Abroger la réforme de 2023 et revenir immédiatement à 62 ans (Capital, sept. 2026)"], [-2, "https://www.europe1.fr/politique/la-france-en-face-on-va-etre-oblige-de-travailler-plus-longtemps-declare-eric-zemmour-936434", "« On va être obligé de travailler plus longtemps », cotisation portée à 44-46 ans (Europe 1/CNews, mai 2026)"]]}, {"id": "R2", "tp": 1, "q": "Il faut introduire une part de retraite par capitalisation dans le système obligatoire.", "k": 1, "i": "Aujourd'hui, la retraite de base fonctionne par répartition : les cotisations des actifs paient les pensions des retraités. La capitalisation consiste à placer une partie des cotisations de chacun sur les marchés financiers pour financer sa propre retraite future.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure_caravane_2026-01_-_couleur.pdf", "2026 : dénonce le projet RN de capitalisation"], [2, "https://attalpresident.fr/actualites/gabriel-attal-rassemblement-eviter-second-tour-rn-lfi-hausse-salaires", "Retraites « reposant davantage sur la durée de cotisation et l'introduction d'une part de capitalisation » (2 nov. 2026)"], [1, "https://www.lejdd.fr/politique/presidentielle-nicolas-dupont-aignan-officialise-sa-candidature-et-fait-le-pari-du-frexit-183876", "Livret de 10 000 € par nouveau-né, « minimum retraite par capitalisation » (sept. 2026)"], null, [1, "https://www.lejdd.fr/politique/lycees-bardella-presidentielle-ce-quil-faut-retenir-de-linterview-de-marine-le-pen-sur-cnews-186144", "Réforme des retraites avec un « pilier de capitalisation », détails le 17 nov. (CNews, oct. 2026)"], null, [2, "https://www.publicsenat.fr/actualites/politique/reculer-ou-avancer-lage-legal-avec-ou-sans-capitalisation-ce-que-proposent-les-principaux-candidats-a-lelection-presidentielle-sur-les-retraites", "Fonds collectif obligatoire par capitalisation (2026)"], [2, "https://lcp.fr/actualites/retraites-bruno-retailleau-veut-un-age-minimal-de-depart-a-63-ans-et-un-taux-plein-a-65", "Capitalisation 25-30 % pour les jeunes entrants (2026)"], [-2, "https://assets.nationbuilder.com/pcf/pages/36196/attachments/original/1766073347/document_-_cahier_se%CC%81cu_v2.pdf?1766073347", "Cahier PCF 2025 : capitalisation, « système cannibale »"], null, null, [2, "https://www.europe1.fr/politique/en-direct-immigration-pouvoir-dachat-narcotrafic-ce-quil-faut-retenir-de-linterview-deric-zemmour-dans-la-france-en-face-936419", "« Injecter une partie de capitalisation » dans la répartition (Europe 1, 2025)"]]}, {"id": "R3", "tp": 1, "q": "Aucune pension pour une carrière complète ne doit être inférieure au SMIC.", "k": 0, "i": "Le minimum contributif garantit un plancher aux personnes ayant cotisé toute leur carrière, mais il reste inférieur au SMIC net (environ 1 400 €). La mesure porterait toutes les pensions de carrière complète au moins à ce niveau.", "p": [null, null, null, null, null, [2, "https://melenchon2027.fr/programme-partage/chapitre-8/", "2026 : pensions a minima au niveau du SMIC revalorisé"], null, null, [2, "https://www.pcf.fr/ue_26_discours_fr", "Aucune retraite sous le SMIC (université d'été, août 2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Minimum contributif aligné sur le SMIC"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Minimum contributif aligné sur le SMIC"], null]}, {"id": "R4", "tp": 1, "q": "Le versement du RSA doit être conditionné à 15 à 20 heures d'activité par semaine.", "k": 1, "i": "Le RSA (revenu de solidarité active) est une aide d'environ 650 € par mois pour une personne seule sans ressources. Depuis 2025, les allocataires doivent s'inscrire à France Travail et suivre un accompagnement d'au moins 15 heures d'activité par semaine (formation, stages, démarches), avec des adaptations selon la situation.", "p": [[-2, "https://www.lutte-ouvriere.org/portail/breves/offensive-contre-chomeurs-guerre-contre-travailleurs-184769.html", "LO : 15 h d'activité pour le RSA = « travail forcé » (juin 2025)"], [2, "https://lcp.fr/actualites/desmicardiser-debureaucratiser-deverrouiller-les-principales-annonces-de-gabriel-attal-a", "PM : généralise les 15 h d'activité pour le RSA (2024)"], null, null, null, [-2, "https://melenchon2027.fr/programme-partage/chapitre-8/", "2026 : s'oppose au RSA contre 15 h d'activité"], null, [2, "https://www.publicsenat.fr/actualites/politique/la-fete-est-finie-bruno-retailleau-veut-supprimer-les-35-heures-inciter-a-la-reprise-dactivite-et-plafonner-les-aides-sociales-pour-relancer-lemploi", "15 heures d'activité obligatoires pour le RSA (2026)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : abroger les réformes Macron du RSA"], null, null, null]}, {"id": "R5", "tp": 1, "q": "La durée maximale d'indemnisation du chômage doit être réduite.", "k": 1, "i": "Un demandeur d'emploi de moins de 53 ans peut aujourd'hui être indemnisé jusqu'à environ 18 mois. Réduire cette durée diminue les dépenses de l'assurance chômage ; ses partisans y voient une incitation à reprendre un emploi, ses opposants une précarisation des chômeurs.", "p": [null, [2, "https://www.publicsenat.fr/actualites/emploi/nouvelles-regles-de-lassurance-chomage-ce-qui-va-changer-pour-les-demandeurs-demploi", "PM : durée max d'indemnisation de 18 à 15 mois (2024)"], null, [-1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Abroger la réforme Macron de l'assurance chômage (Acte I PP)"], [-2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Annuler la réforme de l’assurance chômage (2024)"], [-2, "https://melenchon2027.fr/programme-partage/chapitre-8/", "2026 : supprimer les réformes successives de l'assurance-chômage"], [2, "https://fr.euronews.com/2026/10/09/presidentielle-2027-edouard-philippe-mise-sur-le-travail-et-la-reduction-des-depenses-publ", "Indemnisation chômage ramenée de 18 à 12 mois pour les moins de 50 ans (Euronews, oct. 2026)"], [2, "https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf", "Livret LR : « réduire la durée maximale d'indemnisation (de 18 à 15 mois) » (Travail gagnant, janv. 2026)"], [-2, "https://www.pcf.fr/objectif_1", "Programme PCF : abroger loi Borne, rétablir droits des chômeurs"], [-2, "https://nouspresident.fr/statut-travailleurs-essentiels/", "Dénonce le durcissement de l'assurance-chômage par décrets en 2019 et 2021 (cahier travailleurs essentiels, juin 2026)"], [-2, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "« L'abrogation des réformes de l'assurance chômage » (plan de sortie de crise, sept. 2025)"], null]}, {"id": "R6", "tp": 1, "q": "La lutte contre la fraude sociale doit être une priorité, quitte à durcir les contrôles des allocataires.", "k": 0, "i": "La fraude sociale désigne les prestations versées à tort de manière intentionnelle (fausses déclarations de ressources, d'adresse, arrêts de travail fictifs…). Elle est estimée à plusieurs milliards d'euros par an, à comparer à la fraude fiscale et aux cotisations non versées par certaines entreprises.", "p": [null, [1, "https://www.maire-info.com/fraude-sociale-un-vaste-plan-avec-une-mesure-phare-fusionner-carte-vitale-et-carte-d'identite-article2-27553", "Ministre : plan antifraude sociale, conditions de résidence durcies (AFP, 2023)"], [2, "https://www.debout-la-france.fr/projet/economie-travail/", "Renforcer les contrôles contre la fraude sociale, objectif 20 Md€"], null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Ministère dédié à la lutte contre la fraude (2024)"], null, [1, "https://lcp.fr/index%2Ephp/actualites/chomage-edouard-philippe-veut-abaisser-la-duree-d-indemnisation-a-douze-mois-maximum", "Veut « mettre fin à l'open bar » des arrêts maladie (2026)"], [1, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "5 Md€ attendus de la lutte contre la fraude (2026)"], null, null, null, [2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : lutte contre la fraude sociale (2026)"]]}, {"id": "R7", "tp": 1, "q": "Les allocations familiales doivent être versées dès le premier enfant.", "k": 0, "i": "Les allocations familiales ne sont versées qu'à partir du deuxième enfant, et leur montant dépend des revenus depuis 2015. Les verser dès le premier enfant est présenté comme une mesure de soutien à la natalité.", "p": [null, null, null, null, null, [1, "https://www.assemblee-nationale.fr/dyn/17/amendements/0325/CION-SOC/AS1174.pdf", "Groupe LFI : amendement (rejeté) demandant un rapport sur « l'opportunité d'un versement des allocations familiales dès le premier enfant » (2024)", 1], [2, "https://www.edouardphilippe.fr/actualites/trois-principales-annonces-dedouard-philippe-a-lheure-de-verite", "Allocation familiale unique de 350 € par mois dès le premier enfant (L'Heure de vérité, oct. 2026)"], [2, "https://republicains.fr/wp-content/uploads/2026/05/LR_Famille_vFinale.pdf", "Revenu familial versé « dès le premier enfant » (LR, 2026)"], [2, "https://www.assemblee-nationale.fr/17/pdf/propositions/pion1342.pdf", "2025 : PPL GDR, allocations familiales dès le premier enfant"], null, [2, "https://lesecologistes.fr/document/1zrfjEXlD1ZXUpT2K7sLiu/livret-enfance-vf.pdf", "Allocations familiales : « attribuer un même montant dès le premier enfant » (livret enfance, sept. 2026)"], null]}, {"id": "R9", "tp": 1, "q": "L'âge légal de départ à la retraite doit être ramené à 60 ans.", "k": 1, "i": "L'âge légal est aujourd'hui de 62 ans et 9 mois pour les générations qui partent en 2026, la hausse vers 64 ans étant suspendue jusqu'après la présidentielle. Revenir à 60 ans, l'âge en vigueur de 1982 à 2010, coûterait nettement plus cher que revenir à 62 ans.", "p": [[2, "https://www.lutte-ouvriere.org/journal/article/2022-04-06-nathalie-arthaud-la-lutte-de-classe-est-notre-boussole_251898.html", "« Pas seulement pour assurer la retraite à 60 ans » : se battre au-delà (meeting Arthaud, avril 2022 ; rien de plus récent trouvé)"], [-1, "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "« L'âge légal, ce n'est plus le débat, il faut changer de système de retraites » (meeting de Paris, Public Sénat, mai 2026)"], [-2, "https://www.europe1.fr/politique/retraites-nicolas-dupont-aignan-veut-une-capitalisation-publique-1138481", "Veut « rester là où on en est, c'est-à-dire 62 ans et 9 mois », pas de retour à 60 ans (Europe 1, oct. 2026)"], [-2, "https://www.publicsenat.fr/actualites/politique/fiscalite-ecole-immigration-ce-que-propose-raphael-glucksmann", "S'oppose au retour à 60 ans : « Ceux qui ont une espérance de vie en bonne santé plus longue doivent en revanche partir plus tard » (Public Sénat, août 2026)"], [-1, "https://www.publicsenat.fr/actualites/politique/au-rn-la-reforme-des-retraites-divise-jordan-bardella-et-marine-le-pen-sur-le-programme-pour-la-presidentielle-2027", "Retour à 62 ans, 60 ans seulement pour les carrières longues, mesure qui « reste d'actualité » (RTL, mai 2026)"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "Abroger la réforme Borne puis retour à la retraite à 60 ans avec 40 annuités sur le mandat (plan budgétaire, oct. 2026)"], [-2, "https://www.publicsenat.fr/actualites/politique/reculer-ou-avancer-lage-legal-avec-ou-sans-capitalisation-ce-que-proposent-les-principaux-candidats-a-lelection-presidentielle-sur-les-retraites", "Vise « un âge légal de départ à 65 ans » en moins de dix ans (vidéo de campagne, sept. 2026)"], [-2, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Départ possible dès 63 ans avec décote, taux plein à 65 ans, à l'opposé d'un retour à 60 ans (plan d'économies, Public Sénat, oct. 2026)"], [2, "https://www.pcf.fr/objectif_1", "Programme PCF : « Une loi rétablira la retraite à 60 ans, à taux plein » (programme Jours heureux, toujours en ligne)"], [2, "https://nouspresident.fr/statut-travailleurs-essentiels/", "Cahier de campagne : « la retraite à 60 ans » (cahier travailleurs essentiels, juin 2026)"], [1, "https://fr.finance.yahoo.com/actualites/presidentielle-2027-proposent-candidats-retraite-120000835.html", "« L'objectif d'un départ à 60 ans, en priorité pour les personnes ayant commencé à travailler tôt », modalités à préciser (Capital, sept. 2026)"], [-2, "https://www.europe1.fr/politique/la-france-en-face-on-va-etre-oblige-de-travailler-plus-longtemps-declare-eric-zemmour-936434", "« On ne peut pas avoir la retraite à 60 ans, ce n'est pas raisonnable » (Europe 1/CNews, mai 2026)"]]}, {"id": "T1", "tp": 0, "q": "Il faut augmenter fortement le SMIC (vers 1 600 € net ou plus).", "k": 1, "i": "Le SMIC est le salaire minimum légal. Il est d'environ 1 430 € net par mois pour un temps plein en 2026. Le porter à 1 600 € net ou plus est une hausse de plus de 10 %, que ses opposants jugent risquée pour l'emploi dans les petites entreprises.", "p": [[2, "https://www.lutte-ouvriere.org/portail/brochures/meeting-26-septembre-2026-discours-nathalie-arthaud-197446.html", "2026 : « SMIC à 2 200 € nets »"], null, null, [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "SMIC à 1 600 € net en deux ans (Acte I PP)"], [-1, "https://www.europe1.fr/politique/marine-le-pen-contre-une-augmentation-du-smic-si-elle-est-elue-2960186", "Contre une hausse du SMIC, « charge supplémentaire » pour les entreprises (2017)"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "SMIC à 1 700 € net (plan budgétaire, oct. 2026)"], null, null, [2, "https://www.pcf.fr/ue_26_discours_fr", "SMIC à 1 700 € net, +5 % pour tous les salaires (université d'été, août 2026)"], [2, "https://nouspresident.fr/statut-travailleurs-essentiels/", "Cahier campagne : « le SMIC à 1 600 € » (2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : SMIC net à 1 600 €"], null]}, {"id": "T2", "tp": 0, "q": "Il faut passer à la semaine de 32 heures.", "k": 0, "i": "La durée légale du travail est de 35 heures par semaine : au-delà, les heures sont payées en heures supplémentaires. Passer à 32 heures, sans baisse de salaire selon ses partisans, reviendrait à généraliser la semaine de quatre jours.", "p": [[1, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "2026 : baisser le temps de travail sans perte de salaire"], null, null, null, null, [1, "https://melenchon2027.fr/synthese-des-contributions/", "« Passer aux 32 heures de travail par semaine pour les métiers pénibles » (programme, juil. 2026)"], null, [-2, "https://www.publicsenat.fr/actualites/politique/la-fete-est-finie-bruno-retailleau-veut-supprimer-les-35-heures-inciter-a-la-reprise-dactivite-et-plafonner-les-aides-sociales-pour-relancer-lemploi", "Veut sortir des 35 heures et allonger la durée annuelle (2026)"], [2, "https://www.pcf.fr/objectif_1", "Programme PCF : 32 heures sans diminution de salaire"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : 32 h seulement métiers pénibles ou de nuit"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : 32 h seulement métiers pénibles ou de nuit"], null]}, {"id": "T3", "tp": 0, "q": "Il faut assouplir ou supprimer les 35 heures.", "k": 1, "i": "Les 35 heures, instaurées en 2000, fixent le seuil à partir duquel les heures sont majorées. Les assouplir permettrait de travailler plus longtemps sans payer ces majorations, ou de négocier la durée entreprise par entreprise.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "2026 : baisser le temps et la charge de travail"], [1, "https://attalpresident.fr/programme/travail-salaires", "« Constitution du travail » : organisation fixée par branche et entreprise, fin du plafond de 220 h sup (2026)"], null, null, [-1, "https://www.europe1.fr/politique/35-heures-retraite-a-60-ans-robert-menard-compare-marine-le-pen-a-un-leader-de-la-cgt-3418643", "Maintien des 35 h légales, dérogations par accords de branche (2017)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : rétablir la durée effective de 35 heures"], [2, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "« Fixer librement le temps de travail pour sortir des 35h » (programme, 2026)"], [2, "https://www.publicsenat.fr/actualites/politique/la-fete-est-finie-bruno-retailleau-veut-supprimer-les-35-heures-inciter-a-la-reprise-dactivite-et-plafonner-les-aides-sociales-pour-relancer-lemploi", "Sortir des 35 heures par annualisation (2026)"], [-2, "https://www.pcf.fr/objectif_1", "Programme PCF : semaine de 32 heures"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Retour effectif aux 35 heures"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Retour effectif aux 35 heures"], null]}, {"id": "T4", "tp": 0, "q": "Les heures supplémentaires doivent être exonérées d'impôts et de cotisations.", "k": 1, "i": "Les heures supplémentaires sont aujourd'hui exonérées d'impôt sur le revenu jusqu'à environ 7 500 € par an et partiellement de cotisations salariales. La mesure étendrait ces exonérations, ce qui augmente le salaire net mais réduit les recettes publiques.", "p": [null, null, [2, "https://www.debout-la-france.fr/projet/economie-travail/", "Heures au-delà de 1 607 h/an défiscalisées « dans la limite de 300 heures/an », sans cotisations salariales (projet DLF, nov. 2026)"], null, [1, "https://rassemblementnational.fr/documents/WEB-GRN-LIVRET-ENTREPRISE.pdf", "Stabiliser défiscalisation et désocialisation des heures sup"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : soumettre les heures supplémentaires à cotisation"], [2, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "Heures en plus exonérées de cotisations et d'impôt sur le revenu (programme, 2026)"], [2, "https://www.publicsenat.fr/actualites/politique/la-fete-est-finie-bruno-retailleau-veut-supprimer-les-35-heures-inciter-a-la-reprise-dactivite-et-plafonner-les-aides-sociales-pour-relancer-lemploi", "« Zéro cotisation et zéro impôt » au-delà de 1 607 h (2026)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : heures sup soumises à cotisation"], [-1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Soumettre heures sup à cotisations"], [-1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Soumettre heures sup à cotisations"], [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Heures sup totalement exonérées d’impôts et de charges (2022)"]]}, {"id": "T6", "tp": 0, "q": "Les salariés doivent avoir beaucoup plus de sièges dans les conseils d'administration.", "k": 0, "i": "Dans les grandes entreprises, les salariés ont aujourd'hui un ou deux représentants au conseil d'administration, qui décide de la stratégie. En Allemagne (codétermination), ils peuvent occuper jusqu'à la moitié des sièges.", "p": [null, null, [1, "https://www.debout-la-france.fr/projet/economie-travail/", "Baisse d’IS pour entreprises ouvrant leur CA aux salariés"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Plus de salariés aux CA dès 100 salariés (Acte I PP)"], null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "Salariés à « au moins un tiers » des instances de décision des grandes entreprises (programme, juil. 2026)"], null, null, [2, "https://www.pcf.fr/fete_de_lhumanite_2026_discours_de_fabien_roussel", "Autant d'administrateurs salariés que d'actionnaires (Fête de l'Huma, sept. 2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Un tiers des sièges d'administrateurs aux salariés"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Un tiers des sièges d'administrateurs aux salariés"], null]}, {"id": "T8", "tp": 0, "q": "Les salaires doivent être indexés automatiquement sur l'inflation.", "k": 0, "i": "Indexer les salaires sur l'inflation signifie les augmenter automatiquement quand les prix montent, comme c'est déjà le cas pour le SMIC. Cette « échelle mobile des salaires » existait en France jusqu'en 1983.", "p": [[2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure_caravane_2026-01_-_couleur.pdf", "2026 : « quand les prix montent, notre salaire doit suivre »"], null, [1, "https://www.debout-la-france.fr/projet/economie-travail/", "Réindexer pensions et traitements des fonctionnaires sur l’inflation"], [0, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Seul le point d'indice indexé sur l'inflation (Acte I PP)"], null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Revaloriser le SMIC mensuel et indexer les salaires sur l'inflation » (programme, juil. 2026)"], null, null, [2, "https://www.pcf.fr/ue_26_discours_fr", "Rétablir l'échelle mobile des salaires (université d'été, août 2026)"], [2, "https://nouspresident.fr/statut-travailleurs-essentiels/", "« Nous indexerons les salaires sur l'inflation » (2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Indexation des salaires sur l'inflation"], null]}, {"id": "T9", "tp": 0, "q": "Les Français doivent travailler davantage dans l'année (suppression d'un jour férié, par exemple) pour financer les dépenses publiques.", "k": 1, "i": "La France compte 11 jours fériés. En 2025, le gouvernement Bayrou a proposé d'en supprimer deux pour financer le budget, avant d'y renoncer. La journée de solidarité (lundi de Pentecôte) fonctionne déjà sur ce principe.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/evenement/fichiers/2025/07/Tract_fête_Lyon_2025.pdf", "2025 : dénonce la feuille de route Bayrou « nous faire travailler plus »"], null, null, null, [-2, "https://www.publicsenat.fr/actualites/politique/francois-bayrou-pret-a-renoncer-a-la-suppression-de-deux-jours-feries-sous-condition-de-propositions-alternatives", "Le RN dénonce la suppression de deux jours fériés, « une attaque directe contre la France du travail » (Public Sénat, sept. 2025)"], [-2, "https://lcp.fr/actualites/ces-nouveaux-jours-feries-que-lfi-voudrait-voir-instaures-434818", "Groupe LFI : propose sept nouveaux jours fériés, « priver un seul salarié d'un jour férié » refusé (LCP, avr. 2026)"], [1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-du-conseil-national-a-reims-10-mai-2026/", "« Travailler collectivement un peu plus et un peu plus longtemps » (2026)"], [0, "https://www.publicsenat.fr/actualites/politique/la-fete-est-finie-bruno-retailleau-veut-supprimer-les-35-heures-inciter-a-la-reprise-dactivite-et-plafonner-les-aides-sociales-pour-relancer-lemploi", "1 623 h annuelles, deux jours de plus mais rémunérés (2026)"], [-2, "https://www.pcf.fr/moyen_2", "2025 : propose d'instaurer un jour férié national supplémentaire"], [-2, "https://www.brut.media/fr/articles/france/politique/budget-les-oppositions-menacent-de-censure-le-gouvernement-la-macronie-salue-un-moment-de-courage", "Dénonce « jours fériés sacrifiés », promet la censure (AFP, 2025)"], [-1, "https://www.brut.media/fr/articles/france/politique/budget-les-oppositions-menacent-de-censure-le-gouvernement-la-macronie-salue-un-moment-de-courage", "Critique la suppression du 8 mai férié (AFP, 2025)"], [1, "https://www.europe1.fr/politique/en-direct-immigration-pouvoir-dachat-narcotrafic-ce-quil-faut-retenir-de-linterview-deric-zemmour-dans-la-france-en-face-936419", "« Il faut globalement travailler plus », cotiser 44-46 ans (2025)"]]}, {"id": "T10", "tp": 0, "q": "Il faut baisser les cotisations payées par les salariés pour augmenter le salaire net.", "k": 1, "i": "Sur un salaire brut, le salarié paie environ 22 % de cotisations et de CSG, qui financent la retraite, la santé et le chômage. Les baisser augmente le salaire net, mais il faut compenser les recettes perdues par d'autres impôts ou par des économies.", "p": [null, [2, "https://attalpresident.fr/actualites/gabriel-attal-rassemblement-eviter-second-tour-rn-lfi-hausse-salaires", "« Aller droit au brut » en baissant les charges sur les salaires (2 nov. 2026)"], null, [2, "https://lcp.fr/actualites/glucksmann-face-a-royal-divisions-sur-lfi-lycees-ce-qu-il-faut-retenir-du-dernier-debat", "Financer par la taxe sur les méga-héritages « une réduction de la CSG sur les salaires » pour augmenter le net (débat de la primaire, LCP, oct. 2026)"], null, null, [1, "https://www.publicsenat.fr/actualites/emploi/presidentielle-le-regain-dinteret-pour-la-tva-sociale-idee-clivante-pour-augmenter-le-salaire-net", "Élargir le financement de la protection sociale, indispensable « si on veut ramener le brut proche du net » (débat présidentiel, août 2026)"], null, [-1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : « Augmenter de 0,25 point par an pendant 5 ans les cotisations vieillesse » ; hausse des salaires par l'employeur plutôt que baisse des cotisations"], null, null, null]}, {"id": "T11", "tp": 0, "q": "L'État doit bloquer ou plafonner les prix des produits de première nécessité (alimentation, énergie).", "k": 0, "i": "Bloquer les prix consiste à interdire par décret de dépasser un certain prix, ou à plafonner les marges, pour une liste de produits essentiels. Cela a été fait en France pour l'électricité et le gaz en 2022-2023 (bouclier tarifaire). Ses opposants craignent des pénuries ou un coût pour les finances publiques.", "p": [[1, "https://www.lutte-ouvriere.org/portail/brochures/meeting-26-septembre-2026-discours-nathalie-arthaud-197446.html", "Arthaud : « obliger Total à vendre son carburant à prix coûtant » (meeting, 26 sept. 2026)", 1], null, null, null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "Un « décret de blocage des prix du carburant » ramenant le litre à 1,70 € (plan budgétaire, oct. 2026)"], null, null, [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : « Bloquer les prix des biens de première nécessité dans l'alimentation, l'énergie et les carburants par décret »"], null, [1, "https://lesecologistes.fr/document/2jMAmmuTuvrct5nbKLuPd2/dp-bouclier-social-pour-envoi.pdf", "« Bloquer les prix des produits alimentaires qui subiraient une inflation anormale » (bouclier social, sept. 2026)"], null]}, {"id": "F2", "tp": 2, "q": "Il faut réduire fortement les dépenses publiques (plus de 100 milliards d'euros d'économies sur le quinquennat).", "k": 1, "i": "La dépense publique représente environ 57 % de la richesse produite en France, l'un des niveaux les plus élevés d'Europe. La réduire fortement passe par des économies sur les services publics, les prestations sociales ou les effectifs de fonctionnaires (environ 5,7 millions).", "p": [[-2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure_caravane_2026-01_-_couleur.pdf", "2026 : milliards pour hôpitaux, écoles ; embauches massives"], [2, "https://attalpresident.fr/actualites/gabriel-attal-vision-economique-liberer-innover-independance-france", "« 150 milliards d'euros d'économies sur cinq ans » et règle d'or dans la Constitution (vision économique, 28 oct. 2026)"], [1, "https://www.debout-la-france.fr/projet/economie-travail/", "« Économiser 40 milliards par an au terme de 5 ans » sur l'État, plus 20 Md€ attendus de la fraude sociale et 20 Md€ de la fraude fiscale (projet DLF, nov. 2026)", 1], null, [2, "https://www.europe1.fr/politique/budget-2027-marine-le-pen-promet-140-milliards-deuros-nets-deconomies-dici-2032-pour-eviter-a-la-france-le-defaut-de-paiement-1126400", "« 140 milliards d'euros nets d'économie » d'ici 2032, mais avec 30 Md€ de baisses d'impôts (contre-budget, oct. 2026)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "2026 : refuse les coupes, veut restaurer les services publics"], [1, "https://www.sudradio.fr/societe/a-lheure-de-verite-philippe-ebauche-une-france-a-nouveau-commandee-et-gouvernee", "Déficit ramené « en dessous de la barrière des 3 %, c'est-à-dire 2 % », moitié de l'effort sur les dépenses sociales, sans montant en milliards (L'Heure de vérité, oct. 2026)"], [2, "https://lcp.fr/index%2ephp/actualites/face-a-une-france-quasiment-en-faillite-bruno-retailleau-presente-un-plan-d-economies-de", "197 Md€ d'économies, 400 000 fonctionnaires non remplacés (2026)"], [-2, "https://www.pcf.fr/objectif_2", "Programme PCF : 500 000 emplois publics ; 2026 contre l'austérité"], [-1, "https://nouspresident.fr/plan-de-redressement/", "Rejette « une politique d'austérité » ; ajustement surtout par les recettes, environ 22 Md€ d'économies ciblées (aides aux entreprises, CIR) (plan de redressement, oct. 2026)"], [-1, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "Limite la « maîtrise des dépenses » à 16,6 Md€ en 2026, priorité aux recettes fiscales (plan de sortie de crise, sept. 2025)"], [2, "https://www.europe1.fr/politique/en-direct-immigration-pouvoir-dachat-narcotrafic-ce-quil-faut-retenir-de-linterview-deric-zemmour-dans-la-france-en-face-936419", "Baisse des dépenses publiques d'au moins 100 Md€ par an, plan budget2027 à 140 Md€ (Europe 1/CNews, mai 2026)"]]}, {"id": "F3", "tp": 2, "q": "Il faut augmenter les droits de succession sur les gros héritages.", "k": 1, "i": "Les droits de succession sont l'impôt payé sur un héritage. Chaque enfant bénéficie aujourd'hui d'un abattement de 100 000 € par parent, puis le taux monte progressivement jusqu'à 45 %. La mesure viserait les héritages les plus importants.", "p": [null, [-2, "https://attalpresident.fr/actualites/aux-assises-de-l-afer-gabriel-attal-defend-une-epargne-qui-finance-l-economie-francaise", "« Opposition à toute hausse de la fiscalité sur l'héritage », préfère faciliter les donations (Assises de l'AFER, sept. 2026)"], [-1, "https://www.debout-la-france.fr/projet/economie-travail/", "Exonérations de succession (résidence principale, entreprises)"], [2, "https://lcp.fr/actualites/glucksmann-face-a-royal-divisions-sur-lfi-lycees-ce-qu-il-faut-retenir-du-dernier-debat", "Taxer les « méga héritages » > 2 M€ (2026)"], [-1, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Supprimer les droits de succession des familles modestes et moyennes (2024)"], [2, "https://melenchon2027.fr/programme-partage/chapitre-6/", "2026 : refonte des successions, héritage maximal"], [-1, "https://lcp.fr/index%2Ephp/actualites/chomage-edouard-philippe-veut-abaisser-la-duree-d-indemnisation-a-douze-mois-maximum", "Défend le pacte Dutreil, hausse des plafonds de donation (2026)"], [-2, "https://republicains.fr/actualites/2026/08/26/je-serai-le-president-qui-baissera-les-impots-de-succession/", "Baisser les droits de succession « au maximum du possible » (L'Opinion, août 2026)"], [2, "https://www.pcf.fr/moyen_1", "Programme PCF : barème successions doublé, franchise 170 000 €"], [2, "https://nouspresident.fr/plan-de-redressement/", "« Imposer les grandes successions », taux marginal de 50 % au-delà de 6 M€ (plan de redressement, oct. 2026)"], [2, "https://lesecologistes.fr/document/3uFsOCRc1JbiqUtDqkoLVd/dossierpresse-budget2027.pdf", "+10 % sur héritages > 4 M€, +10 % > 13 M€ (2026)"], [-1, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Supprimer les droits sur les transmissions d’entreprises familiales (2022)"]]}, {"id": "F4", "tp": 0, "q": "La TVA sur l'énergie (électricité, gaz, carburants) doit baisser à 5,5 %.", "k": 0, "i": "La TVA est aujourd'hui de 20 % sur l'électricité, le gaz et les carburants. La baisser à 5,5 % (taux des produits de première nécessité) réduirait les factures, mais coûterait plusieurs milliards d'euros de recettes par an.", "p": [null, [-1, "https://attalpresident.fr/actualites/gabriel-attal-sur-rtl-je-suis-candidat-pour-gagner-cette-election-presidentielle", "Refuse de baisser les taxes sur l'énergie, préfère une aide ciblée (RTL, sept. 2026)"], [1, "https://www.debout-la-france.fr/projet/economie-travail/", "Supprimer TVA sur TICPE, électricité à 10 c/kWh (autre mécanisme)"], null, [2, "https://rassemblementnational.fr/22-mesures", "TVA de 20 % à 5,5 % sur carburants, fioul, gaz, électricité (2022)"], null, null, null, [2, "https://www.pcf.fr/objectif_4", "Programme PCF : TVA sur l'électricité et le gaz à 5,5 %"], null, [0, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Baisser TVA sur abonnement électrique seulement (2026)"], null]}, {"id": "F5", "tp": 2, "q": "La France doit revenir rapidement à l'équilibre budgétaire, même au prix d'efforts importants.", "k": 0, "i": "Le déficit public (l'écart entre dépenses et recettes de l'État et des administrations) est d'environ 5 % du PIB, et la dette publique dépasse 115 % du PIB. Les règles européennes demandent de revenir sous 3 % de déficit.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/journalnumero/fichiers/2026/08/3030-web.pdf", "2026 : contre l'austérité, dette à annuler"], [1, "https://attalpresident.fr/actualites/gabriel-attal-lettre-aux-francais-plan-finances-publiques", "Déficit sous 3 % avant 2032, zéro déficit en 2037, double règle d'or (lettre aux Français, oct. 2026)"], null, null, [1, "https://www.europe1.fr/politique/budget-2027-marine-le-pen-promet-140-milliards-deuros-deconomies-dici-2032-pour-eviter-a-la-france-le-defaut-de-paiement-1126400", "Équilibre primaire en 18 mois, déficit sous 3 % en 2030 (contre-budget, oct. 2026)"], [-2, "https://melenchon2027.fr/programme-partage/chapitre-6/", "2026 : supprimer la règle des 3 % de déficit"], [1, "https://www.boursedirect.fr/fr/actualites/categorie/politique/a-l-heure-de-verite-philippe-ebauche-une-france-a-nouveau-commandee-et-gouvernee-afp-b61ead8f6279ef25847a715f537619cb6675d12c", "Déficit ramené à 2 % fin de quinquennat (AFP, 2026)"], [1, "https://lcp.fr/index%2ephp/actualites/face-a-une-france-quasiment-en-faillite-bruno-retailleau-presente-un-plan-d-economies-de", "Déficit à 2,2 % en 2032, pas l'équilibre (2026)"], [-2, "https://www.pcf.fr/moyen_3", "Programme PCF : fin des 3 % ; 2026 refuse les coupes"], null, [-1, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Rejette l'austérité ; seulement « maîtrise des déficits » (2026)"], null]}, {"id": "F6", "tp": 2, "q": "L'impôt sur le revenu doit être plus progressif, avec davantage de tranches.", "k": 0, "i": "L'impôt sur le revenu compte aujourd'hui cinq tranches, de 0 % à 45 %. Le rendre plus progressif consiste à créer davantage de tranches pour taxer plus les hauts revenus et moins les revenus moyens.", "p": [null, null, null, null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "2026 : impôt sur le revenu à 14 tranches"], null, [-1, "https://lcp.fr/index%2ephp/actualites/face-a-une-france-quasiment-en-faillite-bruno-retailleau-presente-un-plan-d-economies-de", "Déduit du plan de 197 Md€ « sans augmentation d'impôts » ; rien de précis sur le barème de l'IR (2026)", 1], [2, "https://www.pcf.fr/moyen_1", "Programme PCF : impôt sur le revenu à 15 tranches"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Impôt sur le revenu à 14 tranches"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Impôt sur le revenu à 14 tranches"], null]}, {"id": "F7", "tp": 2, "q": "Il faut taxer les superprofits des grandes entreprises.", "k": 1, "i": "Les superprofits sont des bénéfices exceptionnels liés à une situation particulière (crise énergétique, hausse des prix) plutôt qu'à l'activité normale de l'entreprise. Une taxe dédiée prélèverait une partie de ces bénéfices.", "p": [[2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure_caravane_2026-01_-_couleur.pdf", "2026 : confisquer les bénéfices des profiteurs de guerre"], null, null, [2, "https://place-publique.eu/posts/4dFSUW5ZRZ36O2SvNhPLah/place-publique-jeunes-et-plus-de-50-elus-es-place-publique-pour-une-revolution-ecologique", "Position du parti : « Nous voulons taxer les superprofits et les jets privés » (tribune d'élus Place publique, juil. 2026)"], null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "2026 : « véritable taxe sur les superprofits »"], [-2, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "« Je ne taxerai pas davantage les entreprises » (2026)"], [-1, "https://lcp.fr/index%2ephp/actualites/face-a-une-france-quasiment-en-faillite-bruno-retailleau-presente-un-plan-d-economies-de", "Déduit du plan de 197 Md€ « sans augmentation d'impôts » ; rien de précis sur les superprofits (2026)", 1], [2, "https://www.pcf.fr/moyen_1", "Programme PCF : contribution exceptionnelle sur profits des grands groupes"], [2, "https://nouspresident.fr/plan-de-redressement/", "« Contribution exceptionnelle sur les surprofits des entreprises pétrolières et du raffinage » (plan de redressement, oct. 2026)"], [2, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "Taxer les superprofits (plan de sortie de crise, sept. 2025)"], null]}, {"id": "F8", "tp": 2, "q": "Les dividendes et les rachats d'actions doivent être davantage taxés.", "k": 0, "i": "Les dividendes sont les bénéfices versés aux actionnaires ; les rachats d'actions permettent à une entreprise de racheter ses propres titres, ce qui fait monter leur valeur. Les revenus du capital sont aujourd'hui taxés à 30 % (« flat tax »).", "p": [null, null, null, null, [2, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "Taxe sur rachats d’actions et superdividendes (2025)"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "Taxer davantage les rachats d'actions (2,5 Md€ attendus) (plan budgétaire, oct. 2026)"], null, [-1, "https://lcp.fr/index%2ephp/actualites/face-a-une-france-quasiment-en-faillite-bruno-retailleau-presente-un-plan-d-economies-de", "Déduit du plan de 197 Md€ « sans augmentation d'impôts » ; rien de précis sur les dividendes (2026)", 1], [2, "https://www.pcf.fr/fete_de_lhumanite_2026_discours_de_fabien_roussel", "Cotisations sur revenus financiers et dividendes (Fête de l'Huma, sept. 2026)"], [2, "https://nouspresident.fr/travaillisme-ecologique/", "Taxe de 4 % sur les dividendes (2026)"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Soumettre dividendes à cotisations"], null]}, {"id": "F9", "tp": 2, "q": "Les retraités aisés doivent contribuer davantage (fin de l'abattement fiscal de 10 % sur les pensions, sous-indexation des pensions élevées).", "k": 0, "i": "Les retraités bénéficient d'un abattement de 10 % sur leurs pensions pour le calcul de l'impôt sur le revenu, comme les salariés pour leurs frais professionnels. La sous-indexation consiste à augmenter les pensions élevées moins vite que les prix.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/journalnumero/fichiers/2026/08/3030-web.pdf", "LO dénonce la sous-indexation des pensions des retraités « aisés » comme une nouvelle attaque (LO n°3030, août 2026)"], [1, "https://www.lejdd.fr/politique/presidentielle-le-plan-de-gabriel-attal-pour-redresser-les-finances-publiques-177987", "« Année blanche sur l'ensemble des prestations sociales » en épargnant les petites retraites (Le Parisien via JDD, juil. 2026)"], [-1, "https://www.debout-la-france.fr/projet/retraites/", "Indexer les retraites, dénonce hausses de CSG et rabots fiscaux"], [1, "https://lcp.fr/actualites/presidentielle-raphael-glucksmann-devoile-les-premieres-lignes-de-son-possible-programme", "Rééquilibrer la taxation entre travail, capital, héritage et retraites (2026)"], [-2, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "Indexation des retraites, maintien de l’abattement de 10 % (2025)"], [-1, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "2026 : refuse la désindexation, indexe toutes les pensions"], [1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "Demande aux retraités de « contribuer davantage » au modèle social (2026)"], [-1, "https://www.publicsenat.fr/actualites/politique/budget-bruno-retailleau-demande-au-gouvernement-le-retour-de-la-reforme-des-retraites", "« Hors de question de voter un appauvrissement des retraités » face aux pistes du gouvernement (franceinfo via Public Sénat, sept. 2026)"], null, [-1, "https://www.brut.media/fr/articles/france/politique/budget-les-oppositions-menacent-de-censure-le-gouvernement-la-macronie-salue-un-moment-de-courage", "Dénonce un budget où les « retraités [sont] visés » (AFP, 2025)"], null, null]}, {"id": "F10", "tp": 2, "q": "Il faut supprimer ou fusionner un grand nombre d'agences et d'opérateurs de l'État.", "k": 0, "i": "L'État s'appuie sur plusieurs centaines d'agences et d'opérateurs (France Travail, Ademe, agences de l'eau, ARS…) qui emploient des centaines de milliers de personnes. Les supprimer ou les fusionner vise à faire des économies et à simplifier l'administration.", "p": [null, [1, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "Revue des agences : « certaines pourront être supprimées » (convention Renaissance, juil. 2025)"], [2, "https://www.debout-la-france.fr/projet/economie-travail/", "« Supprimer progressivement les agences d'État : ADEME, ARS… » (projet DLF, nov. 2026)"], null, [2, "https://www.publicsenat.fr/actualites/politique/140-milliards-deuros-deconomies-dici-2032-leffort-radical-propose-par-marine-le-pen-pour-redresser-les-f", "Fin de « la quasi-totalité des agences » (contre-budget, oct. 2026)"], [-1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : rétablir les postes de l'ONF, OFB, Météo France, Cerema"], [2, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "Fusionner et supprimer des dizaines d'agences et d'opérateurs (programme, 2026)"], [2, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Suppression d'opérateurs « la règle », 7,5 Md€ attendus (2026)"], null, null, null, [2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : supprimer Ademe, Anah, ARS, CESE et autres organismes (2026)"]]}, {"id": "F11", "tp": 2, "q": "Il faut augmenter la TVA (« TVA sociale ») pour baisser les cotisations sur le travail.", "k": 0, "i": "La « TVA sociale » consiste à augmenter la TVA, payée sur la consommation y compris des produits importés, pour baisser les cotisations sur les salaires. Ses partisans y voient un gain de compétitivité ; ses opposants une hausse des prix qui pèse sur les ménages modestes.", "p": [null, null, [-2, "https://www.debout-la-france.fr/actualite/communique-nicolas-dupont-aignan-a-limoges/", "« TVA à 0 % pour les produits de première nécessité » (20 oct. 2026)"], null, [-1, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "Baisses de TVA (énergie, 100 produits), aucune hausse de TVA (2025)"], [-1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : baisser la TVA (transports en commun à 5,5 %)"], [1, "https://www.publicsenat.fr/actualites/emploi/presidentielle-le-regain-dinteret-pour-la-tva-sociale-idee-clivante-pour-augmenter-le-salaire-net", "« Toute la population » doit financer la protection sociale, logique TVA sociale (2026)"], null, [-2, "https://www.pcf.fr/moyen_2", "2025 : TVA impôt injuste, à baisser sur produits essentiels"], null, null, null]}, {"id": "F14", "tp": 2, "q": "Il faut instaurer la taxe Zucman (impôt minimum de 2 % sur les patrimoines de plus de 100 millions d'euros).", "k": 1, "i": "La taxe proposée par l'économiste Gabriel Zucman instaurerait un impôt minimum de 2 % par an sur les patrimoines supérieurs à 100 millions d'euros, soit environ 1 800 foyers. Adoptée par l'Assemblée en février 2025, elle a été rejetée par le Sénat puis lors du budget 2026.", "p": [[0, "https://lutte-ouvriere.org/portail/editoriaux/quils-ont-lont-vole-188208.html", "Éditorial Arthaud : la taxe Zucman « donnait juste l'illusion d'un peu plus de justice sociale », prône la propriété collective (nov. 2025)"], [-2, "https://lcp.fr/actualites/a-arras-gabriel-attal-prone-une-nouvelle-republique-en-vue-de-l-election-presidentielle", "Continue de dire non à la taxe Zucman (rentrée de Renaissance à Arras, LCP, sept. 2025)"], null, [1, "https://lcp.fr/actualites/budget-2026-la-taxe-zucman-sur-les-ultrariches-au-centre-de-l-equation-politique-398413", "Taxe sur les plus grandes fortunes « base de tout accord », mais « on peut discuter des modalités, de l'assiette, du montant » (RTL via LCP, sept. 2025)"], [-2, "https://www.publicsenat.fr/actualites/economie/contre-budget-du-rn-des-propositions-qui-manquent-de-credibilite-economique-mais-trahissent-une-veritable-coherence-doctrinale", "Le RN s'oppose à la taxe Zucman, lui préférant un impôt sur la fortune financière (contre-budget 2026, oct. 2025)"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "Taxe Zucman sur les patrimoines de « plus de 100 millions d'euros », 15 Md€ attendus (plan budgétaire, oct. 2026)"], [-2, "https://lcp.fr/actualites/budget-2026-la-taxe-zucman-rejetee-par-l-assemblee-nationale-413632", "Groupe Horizons : contre la taxe Zucman lors du budget 2026 (Assemblée, 2025)"], [-2, "https://lcp.fr/actualites/budget-2026-la-taxe-zucman-rejetee-par-l-assemblee-nationale-413632", "Groupe LR : opposé à la taxe Zucman à l'Assemblée (LCP, oct. 2025) ; plan 2026 « sans augmentation d'impôts »"], [2, "https://groupe-communiste.assemblee-nationale.fr/actualites/questions-au-gouvernement/article/taxe-zucman", "Groupe GDR : soutient la taxe Zucman de 2 % au-delà de 100 M€, « la plus petite goutte de justice sociale » (QAG Y. Monnet, juin 2025)"], [2, "https://nouspresident.fr/plan-de-redressement/", "Instaurer « une taxe annuelle de 2 % sur les patrimoines supérieurs à 100 M€ » (plan de redressement, oct. 2026)"], [2, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "Taxe Zucman « sur les fortunes de plus de 100 millions d'euros », au moins 2 % du patrimoine (plan de sortie de crise, sept. 2025 ; repris dans le dossier budget 2027)"], null]}, {"id": "F15", "tp": 2, "q": "Il faut rétablir un impôt sur la fortune (ISF) incluant le patrimoine financier.", "k": 0, "i": "L'ISF taxait chaque année l'ensemble du patrimoine au-delà de 1,3 million d'euros (immobilier, actions, épargne). Il a été remplacé en 2018 par l'IFI, qui ne porte plus que sur l'immobilier. La question est de savoir s'il faut à nouveau taxer aussi le patrimoine financier.", "p": [[0, "https://www.lutte-ouvriere.org/medias/journalnumero/fichiers/2026/08/3030-web.pdf", "LO juge « dérisoires » les impôts sur les grandes fortunes, qui n'empêchent pas leur croissance ; prône l'expropriation (LO n°3030, août 2026)"], [-1, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "Convention Renaissance : la suppression de l'ISF et la flat tax présentées comme des acquis ; plan d'économies « sans augmenter les impôts » (2025-2026)", 1], null, null, [1, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "« IFF à la place de la taxe sur les holdings et de l'IFI » : impôt sur la fortune financière, sans l'immobilier (contre-budget, oct. 2025, reconduit oct. 2026)"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "« Rétablissement d'un impôt sur la fortune renforcé (10 milliards d'euros) » (plan budgétaire, oct. 2026)"], [-1, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "Moratoire fiscal : « pas de nouvelle norme et de nouvel impôt sur le quinquennat », ce qui exclut un ISF (programme, 2026)"], null, [2, "https://www.pcf.fr/moyen_1", "Programme PCF : « L'impôt sur la fortune sera rétabli », taux et progressivité accentués, montant triplé"], null, [2, "https://lesecologistes.fr/document/3uFsOCRc1JbiqUtDqkoLVd/dossierpresse-budget2027.pdf", "« Un vrai ISF, avec un seuil d'entrée à 1,3 Millions d'euros », avec volet climatique (dossier budget 2027, 2026)"], null]}, {"id": "F16", "tp": 2, "q": "Il faut réduire fortement le nombre de fonctionnaires.", "k": 1, "i": "La fonction publique compte environ 5,7 millions d'agents (État, collectivités, hôpitaux). Les réduire passe en général par le non-remplacement d'une partie des départs à la retraite ; les opposants craignent une dégradation des services publics.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "Embauches massives dans santé, Ehpad, éducation : « des centaines de milliers d'emplois à créer » (brochure LO, été 2026)"], [1, "https://attalpresident.fr/actualites/gabriel-attal-lettre-aux-francais-plan-finances-publiques", "Supprimer 100 000 postes de fonctionnaires par départs volontaires, hors Éducation, Armées, Justice, Intérieur (lettre aux Français, oct. 2026)"], null, null, [1, "https://acteurspublics.fr/articles/la-reforme-de-letat-et-des-collectivites-au-coeur-des-economies-programmees-par-le-rn/", "« Une diminution du nombre d'agents publics nécessaires » par non-remplacement, douanes et DGCCRF renforcées (contre-budget, oct. 2026)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "Créer 10 000 postes dans l'éducation et au moins 10 000 soignants, point d'indice +10 % (plan budgétaire, oct. 2026)"], [2, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "« Supprimer un tiers des fonctionnaires partant à la retraite », soit plus de 250 000 postes (programme, 2026)"], [2, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Non-remplacement de 400 000 fonctionnaires partant à la retraite sur le quinquennat (plan d'économies, Public Sénat, oct. 2026)"], [-2, "https://www.pcf.fr/objectif_2", "Programme PCF : « Il sera créé 500 000 emplois dans la fonction publique et les services publics » (programme 2022, toujours en ligne)"], null, [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : « Lancer le rattrapage des postes manquants de fonctionnaires »"], [2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : non-remplacement de 800 000 départs de fonctionnaires sur le quinquennat (2026)"]]}, {"id": "E1", "tp": 3, "q": "Les cotisations patronales doivent baisser pour soutenir la compétitivité des entreprises.", "k": 1, "i": "Les cotisations patronales sont les sommes que l'employeur verse en plus du salaire brut pour financer la Sécurité sociale. Elles ont déjà été fortement allégées sur les bas salaires depuis les années 1990.", "p": [null, [1, "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "« Droit au brut » : baisser cotisations patronales et salariales (2026)"], [1, "https://www.debout-la-france.fr/projet/economie-travail/", "Exonérations patronales ciblées, baisse des impôts de production"], null, [1, "https://rassemblementnational.fr/documents/WEB-GRN-LIVRET-ENTREPRISE.pdf", "Exonération de cotisations sur hausses de salaires de 10 %"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "2026 : réduire les exonérations de cotisations au-delà de 2 SMIC"], [1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-du-conseil-national-a-reims-10-mai-2026/", "50 Md€ de baisse d'impôts de production contre baisse d'aides (2026)"], [2, "https://republicains.fr/wp-content/uploads/2026/02/LR_Produire_Plus_LIVRET.pdf", "Baisse directe des cotisations patronales non contributives (LR, 2026)"], [-2, "https://www.pcf.fr/moyen_1", "Programme PCF : supprimer exonérations sociales qui gonflent les profits"], [-1, "https://nouspresident.fr/plan-de-redressement/", "Lisser les réductions de cotisations patronales et « les geler à leur niveau actuel » (plan de redressement, oct. 2026)"], [-1, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "Exonérations recentrées jusqu'à 2 SMIC, sous conditions (sept. 2025)"], [2, "https://www.europe1.fr/politique/en-direct-immigration-pouvoir-dachat-narcotrafic-ce-quil-faut-retenir-de-linterview-deric-zemmour-dans-la-france-en-face-936419", "Baisse des charges sociales et des impôts financée par les économies (Europe 1/CNews, mai 2026)"]]}, {"id": "E3", "tp": 3, "q": "La France doit s'opposer à l'accord de libre-échange UE-Mercosur.", "k": 0, "i": "L'accord UE-Mercosur est un traité de libre-échange entre l'Union européenne et l'Argentine, le Brésil, le Paraguay et l'Uruguay. Il réduit les droits de douane, ce qui favorise les exportations européennes (voitures, machines) mais inquiète les agriculteurs face aux importations de viande et de sucre.", "p": [[0, "https://www.lutte-ouvriere.org/portail/journal/mercosur-hypocrisie-division-europeenne-189292.html", "LO renvoie dos à dos libre-échange et protectionnisme (déc. 2025)"], [1, "https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/seance/session-ordinaire-de-2024-2025/deuxieme-seance-du-mardi-26-novembre-2024-annexe.pdf", "A voté pour la déclaration du Gouvernement s'opposant à l'accord Mercosur en l'état (26 nov. 2024)"], [2, "https://www.debout-la-france.fr/projet/affaires-europeennes/", "Refuser définitivement l’accord UE-Mercosur"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "« S'opposer aux traités comme le Mercosur » (Acte I PP)"], [2, "https://rassemblementnational.fr/documents/projet/projet-l-agriculture.pdf", "La France ne ratifiera pas l’accord Mercosur (2022)"], [2, "https://melenchon2027.fr/programme-partage/chapitre-17/", "2026 : abroger les accords de libre-échange dont Mercosur"], [1, "https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/seance/session-ordinaire-de-2024-2025/deuxieme-seance-du-mardi-26-novembre-2024-annexe.pdf", "Groupe Horizons : 34 voix pour la déclaration du Gouvernement s'opposant à l'accord Mercosur en l'état (26 nov. 2024)"], [2, "https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/seance/session-ordinaire-de-2024-2025/deuxieme-seance-du-mardi-26-novembre-2024-annexe.pdf", "Groupe Droite républicaine : 46 voix pour la déclaration du Gouvernement s'opposant à l'accord Mercosur en l'état (26 nov. 2024)"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : renoncer à l'accord Mercosur"], [2, "https://nouspresident.fr/pour-une-exception-agriculturelle-francaise/", "« Sortir des traités de libre-échange », contre Mercosur (2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Abandon du CETA et du Mercosur"], [1, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Critique l'accord Mercosur et demande un moratoire sur les accords de libre-échange, sans rejet explicite (programme européennes 2024)"]]}, {"id": "E4", "tp": 3, "q": "Il faut davantage de protectionnisme (droits de douane) pour protéger la production française ou européenne.", "k": 1, "i": "Le protectionnisme consiste à taxer les produits importés (droits de douane) ou à fixer des quotas pour protéger la production locale. Les droits de douane relèvent aujourd'hui de l'Union européenne, pas de la France seule.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "2026 : « Le protectionnisme ne protège ni l'emploi ni les salaires »"], [1, "https://www.linfodurable.fr/politique/attal-propose-une-nouvelle-donne-ecologique-en-meme-temps-queconomique-52224", "« Assumer une part de protectionnisme » (AFP, 2025)"], [2, "https://www.debout-la-france.fr/projet/produire-en-france/", "« Protectionnisme intelligent », droits de douane compensateurs"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "« Protectionnisme ciblé et intelligent » (Acte I PP)"], [1, "https://rassemblementnational.fr/documents/202411-programme-europeennes.pdf", "Préférence nationale et européenne, moratoire sur les accords de libre-échange (2024)"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : protectionnisme écologique et social aux frontières UE"], [1, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-conquerante", "Prix du carbone aux frontières européennes (programme, 2026)"], [1, "https://republicains.fr/wp-content/uploads/2026/02/LR_Produire_Plus_LIVRET.pdf", "Livret LR : « clauses de réciprocité dans tous les accords commerciaux » (févr. 2026)"], [2, "https://www.pcf.fr/objectif_4", "Programme PCF : taxer lourdement les importations moins-disantes"], [2, "https://nouspresident.fr/pour-une-exception-agriculturelle-francaise/", "Quotas d'importation, barrières douanières agricoles (2026)"], [1, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Protéger les agriculteurs des « traités commerciaux léonins » (2026)"], [1, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "« Moratoire sur la participation de la France aux négociations » d'accords de libre-échange (programme 2022)"]]}, {"id": "E5", "tp": 3, "q": "Les aides publiques aux entreprises doivent être conditionnées au main
