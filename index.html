ctions (2026)"], null, null, null, null, [-1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-du-conseil-national-a-reims-10-mai-2026/", "La Russie « menace les frontières et la liberté de l'Europe » (2026)"], null, [1, "https://www.pcf.fr/ue_25_discours_fr", "2025 : traité de sécurité européen « de Brest à Vladivostok »"], null, [-1, "https://howtheyvote.eu/votes/185885", "Écologistes pour plus de sanctions contre Russie (2026)"], [2, "https://lafrancehumaniste.fr/articles/moment-europeen-europe-souveraine.html", "« la coexistence pacifique et un nouveau traité de Helsinki » (objectif ultime avec la Russie, manifeste européen, mars 2026)"], [1, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Paix en Ukraine puis dialogue avec toutes les parties, dont la Russie (2022)"]]}, {"id": "D7", "tp": 9, "q": "L'aide publique au développement doit être augmentée.", "k": 0, "i": "L'aide publique au développement est l'argent que la France consacre aux pays pauvres (santé, éducation, climat…). Elle représente environ 0,5 % du revenu national et a été fortement réduite dans les budgets 2025 et 2026.", "p": [null, null, null, null, null, null, null, [-1, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "« Rationalisation » de l’aide au développement, -2,3 Md€ (2025)"], null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : 0,7 % du RNB à l'aide au développement"], null, [-2, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Baisse de l'aide au développement prévue (2026)"], [2, "https://www.pcf.fr/moyen_3", "Programme PCF : aide au développement portée à 0,7 %"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : APD portée à 0,7 % du RNB"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : APD portée à 0,7 % du RNB"], null, [-2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : suppression de l’APD et de l’AFD (2026)"]]}, {"id": "D9", "tp": 9, "q": "La France doit être prête à envoyer des troupes en Ukraine dans une force de garantie après un cessez-le-feu.", "k": 0, "i": "Une « coalition des volontaires » menée par la France et le Royaume-Uni prépare une force de garantie pour l'Ukraine, déployée seulement après un cessez-le-feu, afin de dissuader une nouvelle attaque russe. Cela exposerait des soldats français sur le sol ukrainien.", "p": [[-2, "https://www.lutte-ouvriere.org/portail/brochures/meeting-14-fevrier-2026-discours-nathalie-arthaud-191591.html", "Dénonce les partis prêts à « envoyer nos soldats en Ukraine », c'est-à-dire à « sacrifier nos enfants » (meeting, 14 févr. 2026)"], null, null, null, [-2, "https://www.debout-la-france.fr/actualite/communique-envoyer-nos-soldats-en-ukraine-et-la-france-alors/", "Dénonce l'envoi de troupes pour « garantir la paix » dans « une guerre qui n'est pas la nôtre » (communiqué DLF, sept. 2025)"], null, null, [-2, "https://kyivindependent.com/france-can-provide-defense-aid-to-ukraine-but-should-scale-back-financial-support-le-pen-says/", "Opposée au déploiement de soldats français en Ukraine, favorable à l'équipement (entretien au Figaro du 16 sept. 2026, rapporté par le Kyiv Independent)"], null, null, [2, "https://www.lagazettefrance.fr/article/le-candidat-a-la-presidentielle-francaise-edouard-philippe-rencontre-zelensky-a-kiev", "« Je suis favorable à ce que des troupes européennes soient déployées en Ukraine une fois la paix revenue » (AFP, Kiev, mai 2026)"], null, [-2, "https://www.pcf.fr/coalition_des_volontaires_ukraine", "Communiqué Roussel, Peu, Cukierman : déployer « plusieurs milliers d'hommes » après un cessez-le-feu serait « une fuite en avant dangereuse » (janv. 2026)"], null, null, null, null]}, {"id": "D10", "tp": 9, "q": "Les avoirs russes gelés doivent être saisis pour financer l'Ukraine.", "k": 0, "i": "Environ 200 milliards d'euros d'avoirs de la Banque centrale russe sont gelés dans l'UE, surtout en Belgique. Leurs intérêts financent déjà l'Ukraine. Saisir le capital lui-même pose des questions juridiques et de confiance dans l'euro, et l'UE a préféré fin 2025 un prêt commun de 90 milliards.", "p": [null, [2, "https://attalpresident.fr/actualites/gabriel-attal-sur-rtl-je-suis-candidat-pour-gagner-cette-election-presidentielle", "« Faire payer à la Russie le coût de sa guerre » en « saisissant les avoirs russes gelés » (RTL, sept. 2026)"], null, null, null, [2, "https://lcp.fr/actualites/glucksmann-face-a-royal-divisions-sur-lfi-lycees-ce-qu-il-faut-retenir-du-dernier-debat", "Propose de « saisir les avoirs publics russes » pour financer l'aide à l'Ukraine (débat de la primaire, LCP, oct. 2026)"], null, null, null, [-2, "https://www.lejdd.fr/politique/un-soudain-respect-pour-la-propriete-privee-les-insoumis-sopposent-a-la-saisie-davoirs-russes-155645", "Groupe LFI (B. Lachaud) : favorable au gel, « nous nous opposons fermement à leur confiscation » (JDD, mars 2025)"], null, null, [-1, "https://www.pcf.fr/quel_avenir_pour_ukraine", "PCF (secteur international) : critique la volonté de « confiscation des avoirs de la Banque centrale russe en Europe » (CommunisteS, déc. 2025)"], null, null, null, null]}, {"id": "NU1", "tp": 8, "q": "Il faut interdire les réseaux sociaux aux moins de 15 ans.", "k": 1, "i": "Une loi de 2023 exige l'accord des parents pour l'inscription des moins de 15 ans sur les réseaux sociaux, mais elle n'est pas appliquée faute de vérification de l'âge. La mesure interdirait totalement les réseaux sociaux avant 15 ans, avec un contrôle de l'âge.", "p": [null, [2, "https://attalpresident.fr/programme/education", "« Aller au bout » de l'interdiction des réseaux sociaux avant 15 ans (2026)"], null, null, [-1, "https://www.lejdd.fr/politique/assemblee-nationale-linterdiction-des-reseaux-sociaux-pour-les-moins-de-15-ans-fait-reagir-166238", "« La protection des jeunes n'est qu'un prétexte pour censurer les réseaux sociaux » (Le JDD, janv. 2026)"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Interdire les réseaux sociaux aux moins de 15 ans (Acte I PP)"], [1, "https://www.assemblee-nationale.fr/dyn/17/scrutins/8431", "POUR l'ensemble de la proposition de loi visant à protéger les mineurs des risques liés aux réseaux sociaux (CMP, scrutin n°8431, 21 juil. 2026). Seuil de 15 ans non vérifié dans la page. Voir aussi CONTRE la motion de rejet (scrutin n°5156, 26 jan. 2026)"], [2, "https://www.publicsenat.fr/actualites/politique/reseaux-sociaux-deputes-et-senateurs-saccordent-sur-une-interdiction-totale-aux-moins-de-15-ans", "RN vote l’interdiction des réseaux sociaux avant 15 ans (CMP, juillet 2026)"], null, [-2, "https://www.linfodurable.fr/lassemblee-adopte-larticle-phare-du-texte-interdisant-les-reseaux-sociaux-aux-moins-de-15-ans-54275", "2026 : LFI vote contre, « paternalisme numérique » (AFP)"], [2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/8431", "Groupe Horizons : 33 pour sur 35 (texte de CMP, scrutin du 21 juil. 2026)"], [1, "https://www.assemblee-nationale.fr/dyn/17/scrutins/8431", "Groupe LR 40 pour, 3 abstentions (2026)"], [2, "https://www.linfodurable.fr/lassemblee-adopte-larticle-phare-du-texte-interdisant-les-reseaux-sociaux-aux-moins-de-15-ans-54275", "2026 : les communistes votent l'interdiction (AFP)"], [0, "https://www.assemblee-nationale.fr/dyn/17/scrutins/8431", "Abstention sur la loi réseaux sociaux et mineurs (2026)"], [0, "https://www.assemblee-nationale.fr/dyn/17/scrutins/5192", "Groupe écologiste divisé sur l'interdiction aux moins de 15 ans (3 pour, 2 contre, 2 abst., janv. 2026) ; le livret enfance préfère des « paramètres de limitation par défaut » (sept. 2026)"], [1, "https://lafrancehumaniste.fr/articles/la-republique-culturelle.html", "« interdiction du défilement infini pour les mineurs » (chronique La République culturelle, juil. 2026 ; interdiction générale des réseaux avant 15 ans non évoquée)", 1], null]}, {"id": "NU2", "tp": 8, "q": "Il faut renforcer la régulation des grandes plateformes, même au prix de tensions avec les États-Unis.", "k": 0, "i": "", "p": [null, null, null, null, null, [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Sortir de la dépendance aux GAFAM, sanctions abus (Acte I PP)"], null, [0, "https://rassemblementnational.fr/documents/projet/projet-le-numerique.pdf", "Contre la « censure » des plateformes, contre leurs abus de position (2022)"], null, null, null, null, [1, "https://www.pcf.fr/ue_25_discours_fr", "2025 : plateformes contrôlées, encadrées, fermées si hors-la-loi"], null, null, [2, "https://lafrancehumaniste.fr/articles/la-republique-culturelle.html", "« le passage des plateformes du statut d'hébergeur à celui d'éditeur » (chronique La République culturelle, juil. 2026 ; CORRECTION : passe de 1 à 2)"], null]}, {"id": "NU3", "tp": 8, "q": "L'audiovisuel public doit être privatisé.", "k": 1, "i": "L'audiovisuel public regroupe France Télévisions, Radio France, France Médias Monde, Arte et l'INA. Il est financé par l'État, environ 4 milliards d'euros par an, depuis la suppression de la redevance en 2022. Le privatiser reviendrait à vendre tout ou partie de ces médias.", "p": [null, null, null, null, [-1, "https://www.debout-la-france.fr/projet/culture-patrimoine/", "France Télévisions « devrait s'inspirer » de la BBC, sans privatisation proposée (projet DLF)", 1], [-2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Renforcer le service public de l'audiovisuel (Acte I PP)"], null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Privatiser l’audiovisuel public (2024)"], null, [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : garantir la pérennité de l'audiovisuel public"], null, null, [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : pérennité de l'audiovisuel public"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Garantir l'audiovisuel public"], [-2, "https://lesecologistes.fr/document/6YePMGpYSeEYieo43k3XwG/rapport-version-longue.pdf", "Rapport des Écologistes : constitutionnaliser l'audiovisuel public (2026)"], [-2, "https://lafrancehumaniste.fr/articles/la-republique-culturelle.html", "« Il est indispensable à l'indépendance de l'audiovisuel public de se voir garanti un financement pluriannuel » (chronique La République culturelle, juil. 2026 ; privatisation non nommée, opposition déduite)", 1], [2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : privatisation de l’audiovisuel public (2026)"]]}, {"id": "NU4", "tp": 8, "q": "Il faut limiter la concentration des médias entre les mains de milliardaires.", "k": 0, "i": "Plusieurs grands médias français appartiennent à des milliardaires (Bolloré, Arnault, Kretinsky, Niel, Saadé…). La mesure fixerait des seuils plus stricts de concentration ou des garanties d'indépendance pour les rédactions.", "p": [null, null, null, null, null, [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Réformer loi de 1986 pour limiter concentration (Acte I PP)"], null, null, null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Lutter contre la concentration des médias » (programme, juil. 2026)"], null, null, [2, "https://www.pcf.fr/moyen_2", "Programme PCF : loi contre les concentrations dans les médias"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Limiter strictement la concentration des médias"], [2, "https://lesecologistes.fr/document/6YePMGpYSeEYieo43k3XwG/rapport-version-longue.pdf", "Rapport des Écologistes : lutter contre la concentration des médias (2026)"], null, null]}, {"id": "NU5", "tp": 8, "q": "L'intelligence artificielle doit être fortement encadrée, même si cela freine l'innovation.", "k": 0, "i": "L'UE a adopté en 2024 le règlement sur l'intelligence artificielle (AI Act), qui classe les usages selon leur niveau de risque et interdit certains d'entre eux. La question est de savoir s'il faut aller plus loin, ou au contraire alléger ces règles pour ne pas freiner les entreprises européennes.", "p": [null, [0, "https://attalpresident.fr/actualites/gabriel-attal-dans-politico-europe-ukraine-ia-et-finances-publiques-quatre-priorites-pour-preparer-la-france-de-demain", "Régulation internationale de l'IA « qui n'entravera pas son développement » (2026)"], null, [1, "https://www.partiradicaldegauche.fr/tenir-la-promesse-de-la-france-la-lettre-aux-francais-de-bernard-cazeneuve/", "« un droit de recours à l'intelligence humaine, qui doit toujours prévaloir » (lettre, citée par le PRG, juillet 2026). Mesure partielle, d'où inf.", 1], [0, "https://www.debout-la-france.fr/projet/intelligence-artificielle/", "Souveraineté IA et agence d’éthique, critique de l’AI Act"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Traité international de régulation des usages de l'IA (Acte I PP)"], null, [-1, "https://rassemblementnational.fr/documents/202411-programme-europeennes.pdf", "Critique des règles européennes axées sur la régulation de l’IA (2024)"], [-1, "https://www.unenouvelleenergie.fr/david-lisnard-sur-cnews-et-europe-1-je-ne-suis-pas-candidat-pour-un-poste-je-viens-pour-redresser-le-pays/", "résumé fidèle : « Il a plaidé pour une régulation adaptée » avec transparence algorithmique, et non un encadrement fort (CNEWS/Europe 1, 27 oct. 2026)", 1], [1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : mission nationale de maîtrise de l'IA"], [-1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "Souhaite une « réglementation moins pesante » et l'IA dans l'État (2026)"], [-1, "https://republicains.fr/wp-content/uploads/2026/07/LR_IA.pdf", "Dérogation expérimentale à l'AI Act, rien au-delà des règles UE (livret IA LR, juil. 2026)"], null, [1, "https://nouspresident.fr/plan-data-centers/", "Moratoire de cinq ans sur les data centers non souverains, suspension de « l'entraînement des modèles d'IA » lors des pics de consommation (plan data centers, oct. 2026)"], null, [2, "https://lafrancehumaniste.fr/articles/humanisme-intelligence-artificielle.html", "« Je suis de l'école de la régulation, je ne crains pas de le dire. » (chronique IA, févr. 2026 ; CORRECTION : passe de 1 à 2 ; corroboré par la chronique IA de juin 2026 sur une Autorité de sûreté de l'IA)"], [-1, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Renégocier l’IA Act (2024)"]]}, {"id": "NU6", "tp": 8, "q": "Il faut taxer davantage les géants du numérique.", "k": 0, "i": "La France applique depuis 2019 une taxe de 3 % sur le chiffre d'affaires numérique des grandes plateformes (Google, Amazon, Meta…). Ces entreprises paient peu d'impôts en Europe grâce à des montages fiscaux. Les États-Unis menacent de représailles les pays qui les taxent.", "p": [null, [1, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "Taxe numérique européenne sur les GAFA pour financer l'innovation (2025)"], null, null, [2, "https://www.debout-la-france.fr/projet/economie-travail/", "Taxe « sur l'exploitation des données personnelles » et imposition des multinationales au prorata du chiffre d'affaires (projet DLF, nov. 2026)"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Hausse ciblée de la taxe GAFAM (Acte I PP)"], null, [2, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "Taxe sur l’usage du réseau par les géants du numérique (2025)"], null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "2026 : renforcement de la taxe Gafam"], null, null, [1, "https://melenchon2027.fr/programme-partage-nupes-2022/chapitre-3/", "NUPES 2022 (signé PCF) : relancer la taxation des GAFAM"], [1, "https://www.brut.media/fr/articles/france/politique/budget-les-oppositions-menacent-de-censure-le-gouvernement-la-macronie-salue-un-moment-de-courage", "Reproche au budget de ne rien demander aux Gafam (AFP, 2025)"], null, [2, "https://lafrancehumaniste.fr/articles/la-republique-culturelle.html", "« une contribution des plateformes numériques culturelles et notamment par l'extension aux réseaux sociaux » (chronique La République culturelle, juil. 2026 ; CORRECTION : passe de 1 à 2)"], null]}];

      const diff=Math.abs(a.v-p[0]), sim=1-diff/4, w=weight(q.tp)*(p[3]?0.5:1)*(a.imp?IMPW:1);
      num+=w*sim; den+=w; n++; tnum[q.tp]+=w*sim; tden[q.tp]+=w; tn[q.tp]++;
      per.push({q,diff,p});
      if(a.blk && a.v!==0 && diff>=3) conflicts.push({q,p});
    });
    const raw=den?100*num/den:null;
    const pct=raw===null?null:Math.round(raw);
    return {c,ci,pct,n,per,conflicts,unknown,
      topics:tden.map((d,t)=>d?{pct:Math.round(100*tnum[t]/d),n:tn[t]}:null)};
  }).sort((x,y)=>(y.pct??-1)-(x.pct??-1)||x.c.n.localeCompare(y.c.n));
}

  const groups=[

    {t:"Proches",d:"Un cran d'écart",f:x=>x.diff===1,cls:"v1"},
    {t:"Mitigés",d:"Deux crans d'écart",f:x=>x.diff===2,cls:"v0"},
    {t:"Opposés",d:"Positions contraires",f:x=>x.diff>=3,cls:"vm2"}

  const byPrio=(x,y)=>S.order.indexOf(x.q.tp)-S.order.indexOf(y.q.tp);
  const item=x=>{const a=ans(x.q); return `<li>
      <span>${esc(x.q.q)}${a.blk?` <span class="pill">bloquant</span>`:""}${a.imp?` <span class="pill ok">important</span>`:""}</span>

      <span class="pp">${esc(x.p[2])} · <a class="src" href="${esc(x.p[1])}" target="_blank" rel="noopener">${esc(host(x.p[1]))}</a> · ${reportA(r.c,x.q,x.p)}</span></li>`;};
  return `
    <div class="row between">
      <div class="stack" style="gap:4px">
        <span class="eyebrow">Fiche d'alignement · n°${rank} de ton classement</span>
        <h2>${esc(r.c.n)}</h2>
        <span class="muted small">${esc(r.c.p)} · ${esc(r.c.s)}</span>
      </div>
      <div class="stack" style="gap:6px;align-items:flex-end">
        <span class="pct" style="font-size:1.8rem">${r.pct===null?"—":r.pct+" %"}</span>
        <label class="small muted" for="fsel">Voir un autre candidat</label>
        <select id="fsel">${R.map(x=>`<option value="${x.c.id}"${x.c.id===r.c.id?" selected":""}>${esc(x.c.n)}</option>`).join("")}</select>
      </div>
    </div>
    ${flagsHTML(r)}
    <p class="small muted">Document de référence : ${r.c.prog&&r.c.prog.url?`<a href="${esc(r.c.prog.url)}" target="_blank" rel="noopener">${esc(r.c.prog.titre)}</a>`:"aucun programme consolidé publié"}. Comparaison sur ${r.n} des questions auxquelles tu as répondu.</p>

    <div class="stack">
      <h3>Proximité par sujet, dans l'ordre de tes priorités</h3>
      <div class="tbars">${S.order.map(tp=>{const t=r.topics[tp]; return `<div class="tbar"><span>${esc(TOPICS[tp])} <span class="muted small">${t?`(${t.n})`:""}</span></span><span class="bar"><i style="width:${t?t.pct:0}%"></i></span><span class="pct">${t?t.pct+" %":"—"}</span></div>`}).join("")}</div>
    </div>

    <div class="groups">${groups.map(g=>{const L=r.per.filter(g.f).sort(byPrio); return `
      <div class="grp"><h3><i class="d ${g.cls}"></i>${g.t} <span class="c">${L.length} · ${g.d.toLowerCase()}</span></h3>
        ${L.length?`<ul>${L.map(item).join("")}</ul>`:`<p class="muted small">Aucune question.</p>`}</div>`}).join("")}
    </div>`;
}

function flagsHTML(r){
  const blks=Q.filter(q=>{const a=ans(q); return a&&a.blk&&hasV(a)&&a.v!==0;});
  if(!blks.length) return `<p class="notice">Tu n'as marqué aucun point bloquant. Active « Point bloquant pour moi » sur une question (jusqu'à ${MAXBLK}) pour repérer les lignes rouges de chaque candidat.</p>`;
  const last=sn(r.c);
  const okN=blks.length-r.conflicts.length-r.unknown.length;
  return `<div class="flags${r.conflicts.length?" bad":""}">
    <h3>${r.conflicts.length?`⚑ ${r.conflicts.length} drapeau${r.conflicts.length>1?"x":""} rouge${r.conflicts.length>1?"s":""} sur tes points bloquants`:"Aucun drapeau rouge sur tes points bloquants"}</h3>
    <p class="small muted">${blks.length} point${blks.length>1?"s":""} bloquant${blks.length>1?"s":""} : ${r.conflicts.length} en opposition, ${r.unknown.length} sans position connue, ${okN} compatible${okN>1?"s":""} ou nuancé${okN>1?"s":""}. Les drapeaux ne modifient pas le score.</p>
    ${r.conflicts.length?`<ul>${r.conflicts.map(({q,p})=>`<li><b>${esc(q.q)}</b>
      <span class="pp">Toi : ${esc(LBL[ans(q).v].toLowerCase())} · ${esc(last)} : ${esc(CLBL(p[0],p[3]).toLowerCase())}</span>
      <span class="pp">${esc(p[2])} · <a href="${esc(p[1])}" target="_blank" rel="noopener">Vérifier la source (${esc(host(p[1]))})</a> · ${reportA(r.c,q,p)}</span></li>`).join("")}</ul>`:""}
    ${r.unknown.length?`<p class="small"><b>Position inconnue</b> sur : ${r.unknown.map(q=>esc(q.q)).join(" · ")}</p>`:""}
  </div>`;
}

/* ---------- 3. Fiabilité du score ---------- */
function relLvl(r,nA){ return r.n>=Math.max(20,nA*0.5)?"bonne":r.n>=10?"moyenne":"faible"; }
function relPill(r,nA){ const l=relLvl(r,nA); return `<span class="pill ${l==="bonne"?"ok":"low"}" title="Plus le score repose sur un grand nombre de questions, plus il est fiable">Fiabilité ${l}</span>`; }

/* ---------- 7. Mode duel ---------- */
function duelHTML(R){
  if(R.length<2) return "";
  if(!Array.isArray(S.duel)||S.duel.length!==2||S.duel[0]===S.duel[1]||!S.duel.every(id=>R.some(r=>r.c.id===id))) S.duel=[R[0].c.id,R[1].c.id];
  const [A,B]=S.duel.map(id=>R.find(r=>r.c.id===id));
  const rows=qlist().filter(q=>hasV(ans(q))&&(q.p[A.ci]||q.p[B.ci])).map(q=>{
    const u=ans(q).v, pa=q.p[A.ci], pb=q.p[B.ci], da=pa?Math.abs(u-pa[0]):null, db=pb?Math.abs(u-pb[0]):null;
    return {q,u,pa,pb,w:(da!==null&&db!==null)?(da<db?"A":db<da?"B":"="):null};});
  const both=rows.filter(x=>x.w), nAw=both.filter(x=>x.w==="A").length, nBw=both.filter(x=>x.w==="B").length, nE=both.length-nAw-nBw;
  const shown=S.duelDiff?rows.filter(x=>x.pa&&x.pb&&x.pa[0]!==x.pb[0]):rows;
  const cell=(p,win,c,q)=>`<td class="${win?"win":""}">${p?`<a href="${esc(p[1])}" target="_blank" rel="noopener" title="${esc(c.n)} : ${esc(CLBL(p[0],p[3]))} — ${esc(p[2])}"><i class="d ${CLS(p[0])}"></i></a>`:`<a href="${esc(issueURL(c,q,null))}" target="_blank" rel="noopener" title="${esc(c.n)} : position non sourcée (signaler une source)"><i class="d vn"></i></a>`}</td>`;
  const opt=sel=>R.map(x=>`<option value="${x.c.id}"${x.c.id===sel?" selected":""}>${esc(x.c.n)}</option>`).join("");
  return `<section class="fiche" id="duel">
    <div class="stack" style="gap:4px"><span class="eyebrow">Mode duel</span><h2>Comparer deux candidats</h2>
      <p class="muted small">Question par question, sur ${SHARED?"ces":"tes"} réponses : lequel des deux est le plus proche ? La case surlignée indique le plus proche.</p></div>
    <div class="duelhead"><select id="da" aria-label="Premier candidat">${opt(A.c.id)}</select><span class="muted">contre</span><select id="db" aria-label="Second candidat">${opt(B.c.id)}</select></div>
    <div class="dsum"><div><b>${nAw}</b><span class="small">${esc(sn(A.c))} plus proche</span></div><div><b>${nE}</b><span class="small">à égalité</span></div><div><b>${nBw}</b><span class="small">${esc(sn(B.c))} plus proche</span></div></div>
    <p class="muted small">Sur les ${both.length} questions où les deux positions sont sourcées. Scores globaux : ${esc(A.c.n)} ${A.pct??"—"} %, ${esc(B.c.n)} ${B.pct??"—"} %.</p>
    <label class="small row" style="gap:6px"><input type="checkbox" id="ddiff" ${S.duelDiff?"checked":""}> Seulement les questions où ils ne sont pas d'accord entre eux</label>
    <div class="tablewrap"><table class="duel"><thead><tr><th class="q">Affirmation</th><th>${SHARED?"Réponse":"Toi"}</th><th>${esc(sn(A.c))}</th><th>${esc(sn(B.c))}</th></tr></thead><tbody>
    ${shown.map(x=>`<tr><td class="q"><div class="t">${esc(TOPICS[x.q.tp])}</div>${esc(x.q.q)}</td><td class="you"><i class="d ${CLS(x.u)}" title="${esc(VNAME[String(x.u)])}"></i></td>${cell(x.pa,x.w==="A",A.c,x.q)}${cell(x.pb,x.w==="B",B.c,x.q)}</tr>`).join("")||`<tr><td colspan="4" class="muted">Aucune question.</td></tr>`}
    </tbody></table></div>
  </section>`;
}

/* ---------- 10. Carte 2D (analyse en composantes principales des positions des candidats) ---------- */
function jacobi(A0){
  const n=A0.length, A=A0.map(r=>r.slice()), V=A.map((r,i)=>r.map((_,j)=>i===j?1:0));
  for(let sw=0;sw<100;sw++){
    let off=0; for(let p=0;p<n;p++) for(let q=p+1;q<n;q++) off+=A[p][q]*A[p][q];
    if(off<1e-14) break;
    for(let p=0;p<n;p++) for(let q=p+1;q<n;q++){
      if(Math.abs(A[p][q])<1e-18) continue;
      const th=(A[q][q]-A[p][p])/(2*A[p][q]), t=(th>=0?1:-1)/(Math.abs(th)+Math.sqrt(th*th+1)), c=1/Math.sqrt(t*t+1), s=t*c;
      for(let k=0;k<n;k++){const a=A[k][p], b=A[k][q]; A[k][p]=c*a-s*b; A[k][q]=s*a+c*b;}
      for(let k=0;k<n;k++){const a=A[p][k], b=A[q][k]; A[p][k]=c*a-s*b; A[q][k]=s*a+c*b;}
      for(let k=0;k<n;k++){const a=V[k][p], b=V[k][q]; V[k][p]=c*a-s*b; V[k][q]=s*a+c*b;}
    }
  }
  return {val:A.map((r,i)=>r[i]), vec:V};
}
let PCA=null;
function pca(){
  if(PCA) return PCA;
  const mean=Q.map(q=>{const v=q.p.filter(Boolean).map(p=>p[0]); return v.reduce((a,b)=>a+b,0)/v.length;});
  const X=C.map((c,ci)=>Q.map((q,j)=>q.p[ci]?q.p[ci][0]-mean[j]:0));   // position manquante = moyenne des candidats
  const K=X.map(a=>X.map(b=>a.reduce((s,v,j)=>s+v*b[j],0)));
  const {val,vec}=jacobi(K), idx=val.map((v,i)=>i).sort((a,b)=>val[b]-val[a]);
  const total=val.filter(v=>v>0).reduce((a,b)=>a+b,0);
  const comps=[0,1].map(k=>{ const i=idx[k], lam=Math.max(val[i],1e-9), u=vec.map(r=>r[i]);
    const load=Q.map((q,j)=>X.reduce((s,row,ci)=>s+row[j]*u[ci],0)/Math.sqrt(lam));
    return {share:val[i]/total, load, score:u.map(x=>x*Math.sqrt(lam))}; });
  return PCA={mean,comps};
}
function mapHTML(nA){
  const head=`<div class="stack" style="gap:4px"><span class="eyebrow">Carte</span><h2>Où ${SHARED?"se situent ces réponses":"te situes-tu"} parmi les candidats ?</h2></div>`;
  if(nA<10) return `<section class="fiche">${head}<p class="muted small">La carte s'affiche à partir de 10 réponses.</p></section>`;
  const P=pca(), [c1,c2]=P.comps;
  const me=[c1,c2].map(cp=>Q.reduce((s,q,j)=>{const a=ans(q); return s+(hasV(a)?(a.v-P.mean[j])*cp.load[j]:0);},0));
  const pts=C.map((c,ci)=>({n:sn(c),x:c1.score[ci],y:c2.score[ci]}));
  const xs=pts.map(p=>p.x).concat(me[0]), ys=pts.map(p=>p.y).concat(me[1]);
  const W=640,H=440,pad=56, x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const X=v=>pad+(v-x0)/((x1-x0)||1)*(W-2*pad), Y=v=>H-pad-(v-y0)/((y1-y0)||1)*(H-2*pad);
  const lab=pts.map(p=>({n:p.n,px:X(p.x),py:Y(p.y)})).sort((a,b)=>a.py-b.py);
  const placed=[]; lab.forEach(l=>{ const w=l.n.length*7+4, rt=l.px>W-130, a=rt?l.px-10-w:l.px+10, b=a+w; let ly=l.py+4;
    while(placed.some(o=>Math.abs(o.ly-ly)<14&&o.a<b&&a<o.b)) ly+=14; placed.push(Object.assign(l,{ly,a,b})); });
  const top=(cp,sg)=>Q.map((q,j)=>({q,v:cp.load[j]*sg})).sort((a,b)=>b.v-a.v).slice(0,3).map(o=>`<li>${esc(o.q.q)}</li>`).join("");
  const pc=v=>Math.round(v*100);
  return `<section class="fiche">${head}
    <p class="muted small">Les candidats sont placés selon leurs positions sur toutes les questions, résumées en deux axes calculés automatiquement (analyse en composantes principales). Les axes ne sont pas « gauche » et « droite » : ce sont les deux directions qui séparent le plus les candidats. ${SHARED?"Le point":"Ton point"} est calculé à partir des réponses données : plus il y en a, plus il est précis.</p>
    <div class="mapwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carte des candidats et de ${SHARED?"ces réponses":"ta position"}">
      <line class="ax" x1="${pad/2}" x2="${W-pad/2}" y1="${H/2}" y2="${H/2}"/><line class="ax" y1="${pad/2}" y2="${H-pad/2}" x1="${W/2}" x2="${W/2}"/>
      ${placed.map(l=>`<circle class="cd" cx="${l.px.toFixed(1)}" cy="${l.py.toFixed(1)}" r="6"/><text class="cl" x="${(l.px>W-130?l.px-10:l.px+10).toFixed(1)}" y="${l.ly.toFixed(1)}" text-anchor="${l.px>W-130?"end":"start"}">${esc(l.n)}</text>`).join("")}
      <circle class="me" cx="${X(me[0]).toFixed(1)}" cy="${Y(me[1]).toFixed(1)}" r="9"/><text class="ml" text-anchor="${X(me[0])>W-130?"end":"start"}" x="${(X(me[0])>W-130?X(me[0])-13:X(me[0])+13).toFixed(1)}" y="${(Y(me[1])+5).toFixed(1)}">${SHARED?"Ces réponses":"Toi"}</text>
    </svg></div>
    <div class="axes">
      <div><b>Axe horizontal</b> <span class="muted">(${pc(c1.share)} % des écarts entre candidats)</span><br>Vers ▶, plus d'accord avec :<ul>${top(c1,1)}</ul>Vers ◀, plus d'accord avec :<ul>${top(c1,-1)}</ul></div>
      <div><b>Axe vertical</b> <span class="muted">(${pc(c2.share)} % des écarts)</span><br>Vers ▲, plus d'accord avec :<ul>${top(c2,1)}</ul>Vers ▼, plus d'accord avec :<ul>${top(c2,-1)}</ul></div>
    </div>
    <p class="muted small">Résumé simplifié : deux axes ne captent qu'une partie des différences. Le classement et la fiche restent la référence.</p>
  </section>`;
}

/* ---------- 2. Journal des mises à jour ---------- */
function renderLog(){
  const MO=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  const fmt=d=>{const [y,m,dd]=d.split("-"); return `${+dd} ${MO[+m-1]} ${y}`;};
  const cn=id=>(C.find(c=>c.id===id)||{n:id}).n;
  const kind=x=>x[2]===null?"Nouvelle position":x[3]===null?"Position retirée":x[2]===x[3]?"Statut « position déduite » modifié":"Position modifiée";
  const val=v=>v===null?"aucune position":VNAME[String(v)];
  app.innerHTML=`
  <header class="stack">
    <span class="eyebrow">Mise à jour : ${MAJ}</span>
    <h1>Journal des mises à jour</h1>
    <p class="lead">Chaque position ajoutée, modifiée ou retirée, avec sa date et la raison. Les sources remplacées par un document plus récent, sans changement de position, sont seulement comptées.</p>
  </header>
  <section class="log">${LOG.map((e,k)=>`<details${k===0?" open":""}>
    <summary><b>${esc(fmt(e.d))}</b><span>${esc(e.s)}</span><span class="muted small">${e.ch.length} changement${e.ch.length>1?"s":""} · ${e.ns} source${e.ns>1?"s":""} rafraîchie${e.ns>1?"s":""}</span></summary>
    ${e.ch.length?`<ul>${e.ch.map(x=>`<li><b>${esc(cn(x[0]))}</b> · ${esc(kind(x))} : « ${esc(LT[x[1]]||x[1])} »<span class="pp">${x[2]===null||x[2]===x[3]?"":esc(val(x[2]))+" → "}${esc(val(x[3]))}${x[4]?" · "+esc(x[4]):""}</span></li>`).join("")}</ul>`:`<p class="muted small" style="margin-top:8px">Aucune position modifiée : sources remplacées par des documents plus récents ou notes corrigées.</p>`}
  </details>`).join("")}</section>
  <p class="muted small">Une erreur, une source manquante ? <a href="${esc(REPO)}/issues" target="_blank" rel="noopener">Signale-la sur GitHub</a>, avec une source primaire.</p>`;
}

function methodHTML(){
  const nCodes=Q.reduce((s,q)=>s+q.p.filter(Boolean).length,0);
  return `
  <section class="stack">
    <h2>Méthode et limites</h2>
    <div class="stack small">
      <p><b>Calcul.</b> Chaque réponse va de −2 à +2. Sur une question, la proximité vaut 100 % si ta position et celle du candidat sont identiques, 75 % pour un cran d'écart, et 0 % si elles sont opposées. Le score est la moyenne pondérée de ces proximités : le poids dépend du rang du sujet dans ton classement : ×1 pour le n°10, jusqu'à l'écart que tu as choisi (×1 à ×5) pour le n°1, avec une progression régulière entre les deux. Une question marquée « important pour moi » compte double. Les points bloquants (5 au maximum) ne modifient pas le score : quand un candidat est opposé à toi sur l'un d'eux (écart de 3 ou 4 crans), il reçoit un drapeau rouge, avec la source pour vérifier. Un point bloquant sur lequel sa position n'est pas sourcée est signalé comme « position inconnue ».</p>
      <p><b>Sources.</b> Les ${nCodes} positions viennent de sources primaires : programmes et sites officiels des candidats et des partis, programmes 2022 et législatives 2024, votes au Parlement, et déclarations publiées dans la presse de référence. Les agrégateurs et les sites de comparaison non officiels ont été exclus. Chaque position renvoie à sa source dans la fiche et dans le tableau. Quand aucune position propre n'a été trouvée pour un candidat de gauche, on a repris le programme du Nouveau Front populaire de 2024 qu'il a signé ; la note l'indique (« NFP 2024 »).</p>
      <p><b>Positions manquantes.</b> Quand aucune source n'a été trouvée, la question est simplement retirée du calcul pour ce candidat : son score est la moyenne sur les seules questions où sa position est connue, il n'est donc ni pénalisé ni avantagé par un silence. Quand le candidat ne s'est pas exprimé personnellement, on utilise d'abord la position de son parti ou le vote de son groupe parlementaire (indiqué dans la note). Quand la position n'est que déduite d'une prise de position voisine, elle est marquée « position déduite » et ne compte que pour moitié. Les questions sourcées pour moins de 4 candidats ne sont pas affichées. Un score calculé sur peu de questions est moins fiable : chaque ligne du classement indique sur combien de tes réponses il repose.</p>
      <p><b>Neutralité.</b> Aucune couleur de parti ; candidats et questions (à l'intérieur de chaque sujet) présentés dans un ordre tiré au hasard pour chaque visiteur ; affirmations formulées tantôt dans un sens, tantôt dans l'autre. Le codage a été préparé avec l'aide d'une IA à partir des documents cités : vérifie les sources qui comptent pour toi. Dernière mise à jour : ${MAJ}.</p>
      <p><b>Erreurs et transparence.</b> Chaque position de la fiche a un lien « Signaler une erreur » qui ouvre un signalement public sur <a href="${esc(REPO)}/issues" target="_blank" rel="noopener">GitHub</a> (compte GitHub nécessaire) : merci de joindre une source primaire. L'onglet « Mises à jour » liste chaque position ajoutée, modifiée ou retirée, avec sa date.</p>
    </div>
    <details class="box"><summary>Documents de référence par candidat</summary>
      <ul class="sources">${C.map(c=>`<li><b>${esc(c.n)}</b> : ${c.prog&&c.prog.url?`<a href="${esc(c.prog.url)}" target="_blank" rel="noopener">${esc(c.prog.titre)}</a>`:"aucun document consolidé"}</li>`).join("")}</ul>
    </details>
  </section>`;
}

let QZ=null;
document.addEventListener("keydown",e=>{
  if(S.screen!=="quiz"||e.metaKey||e.ctrlKey||e.altKey||(e.target.closest&&e.target.closest("input,select,textarea"))) return;
  const map={"1":2,"2":1,"3":0,"4":-1,"5":-2}, k=e.key, click=id=>{const b=document.getElementById(id); if(b&&!b.disabled){e.preventDefault(); b.click();}};
  if(k in map){ const b=app.querySelector(`.ans[data-v="${map[k]}"]`); if(b){e.preventDefault(); b.click();} }
  else if(k==="ArrowLeft") click("prev");
  else if(k==="ArrowRight"){ if(QZ){e.preventDefault(); QZ.fwd();} }
  else if(k==="i"||k==="I") click("imp");
  else if(k==="b"||k==="B") click("blk");
});
let TX=null;
document.addEventListener("touchstart",e=>{ TX=S.screen==="quiz"&&e.touches.length===1?[e.touches[0].clientX,e.touches[0].clientY]:null; },{passive:true});
document.addEventListener("touchend",e=>{
  if(!TX||S.screen!=="quiz") return; const t=e.changedTouches[0], dx=t.clientX-TX[0], dy=t.clientY-TX[1]; TX=null;
  if(Math.abs(dx)<70||Math.abs(dy)>50) return;
  if(dx>0){ const b=document.getElementById("prev"); if(b&&!b.disabled) b.click(); } else if(QZ) QZ.fwd();
},{passive:true});

render();
</script>
