es qui n'ont pas les moyens de changer de voiture. L'Assemblée a voté leur suppression en 2025 ; leur avenir reste débattu.", "p": [[0, "https://www.lutte-ouvriere.org/portail/journal/fin-zfe-vrais-pollueurs-toujours-inquietes-184826.html", "LO renvoie dos à dos : « Avec ou sans ZFE, c'est d'abord le profit qui pourrit la vie des travailleurs » (juin 2025)"], [-2, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "« Nous avons choisi de nous opposer à la suppression des ZFE » (convention Renaissance, juil. 2025)"], null, null, [2, "https://www.debout-la-france.fr/projet/transport-automobilistes/", "Suppression définitive des ZFE"], null, [-1, "https://www.assemblee-nationale.fr/dyn/17/scrutins/6183", "POUR « Maintenir l'existence des ZFE mais les rendre facultatives » (scrutin n°6183, 14 avr. 2026). Partiel : il maintient les ZFE"], [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Supprimer les ZFE (2024)"], null, [1, "https://lcp.fr/actualites/pourquoi-le-rn-risque-d-avoir-du-mal-a-faire-voter-la-suppression-des-zfe-lors-de-sa", "2025 vote LFI pour suppression ; 2026 préfère un moratoire"], [-1, "https://lcp.fr/actualites/la-suppression-des-zfe-confirmee-lors-de-l-ultime-vote-sur-la-loi-de-simplification-a-l", "Groupe Horizons majoritairement pour maintenir les ZFE (2025)"], [1, "https://lcp.fr/actualites/la-suppression-des-zfe-confirmee-lors-de-l-ultime-vote-sur-la-loi-de-simplification-a-l", "Groupe LR majoritairement pour supprimer les ZFE (2025)"], [0, "https://assets.nationbuilder.com/pcf/pages/36198/attachments/original/1766073432/document_-_cahier_mobilite_ppp.pdf?1766073432", "Cahier PCF : ZFE socialement injustes, alternatives sans suppression"], [0, "https://nouspresident.fr/travaillisme-ecologique/", "ZFE décidées localement, « ne viendront plus d'en haut » (2026)"], [-2, "https://lesecologistes.fr/document/3yW70joEwOl5nJotwTUb4b/livretthematique-environnement-vf.pdf", "« Compléter les Zones à Faible Émission (ZFE) » par une politique Air-Santé-Mobilité (livret santé environnementale, mai 2026)"], null, [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Fin des ZFE (2022)"]]}, {"id": "EN8", "tp": 4, "q": "La France doit tenir l'objectif de neutralité carbone en 2050, même si cela coûte cher.", "k": 0, "i": "La neutralité carbone signifie ne pas émettre plus de gaz à effet de serre que ce que les forêts, les sols et les technologies peuvent absorber. La France et l'UE se sont engagées à l'atteindre en 2050, conformément à l'accord de Paris sur le climat.", "p": [null, [2, "https://attalpresident.fr/actualites/gabriel-attal-presente-un-plan-de-desendettement-et-un-messmer-ii-pour-sortir-des-dependances-francaises", "Fossiles sous 30 % en 2035, neutralité carbone en 2050 (2026)"], null, null, null, [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Neutralité climat 2050, -90 % en 2040 (Acte I PP)"], null, [1, "https://www.europe1.fr/politique/budget-2027-marine-le-pen-promet-140-milliards-deuros-nets-deconomies-dici-2032-pour-eviter-a-la-france-le-defaut-de-paiement-1126400", "Promet un programme écologique pour atteindre « la neutralité carbone avant 2050 », par le nucléaire (contre-budget, oct. 2026)"], null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : plan climat visant la neutralité carbone 2050"], null, null, [2, "https://www.pcf.fr/objectif_4", "Programme PCF : neutralité carbone visée 2040-2050"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Neutralité carbone en 2050"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Planifier l'atteinte de la neutralité carbone 2050 (2026)"], [2, "https://lafrancehumaniste.fr/articles/souverainete-agricole-et-alimentaire.html", "« Le net zéro en 2050 ne pourra être atteint que si les agriculteurs » (chronique agricole, févr. 2026 ; il reconnaît « Cette transition a un coût »)"], [-1, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Revoir l’objectif neutralité carbone 2050, abroger le Pacte vert (2024)"]]}, {"id": "EN9", "tp": 4, "q": "Il faut interdire les vols intérieurs quand une alternative en train existe, ou taxer fortement le kérosène.", "k": 0, "i": "Depuis 2023, les vols intérieurs sont interdits quand le même trajet existe en train en moins de 2 h 30, ce qui concerne peu de lignes. Le kérosène des avions n'est pas taxé comme l'essence des voitures.", "p": [null, null, null, null, null, [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Étendre interdiction vols intérieurs, fin exemption kérosène (Acte I PP)"], null, null, null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Supprimer les lignes aériennes quand l'alternative en train est inférieure à quatre heures » (programme, juil. 2026)"], null, null, [2, "https://assets.nationbuilder.com/pcf/pages/36198/attachments/original/1766073432/document_-_cahier_mobilite_ppp.pdf?1766073432", "Cahier PCF : fin de l'exonération de taxe sur le kérosène"], [2, "https://nouspresident.fr/travaillisme-ecologique/", "Interdire vols intérieurs si train < 4 h (2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Interdire vols si train < 4h30, taxer billets (2026)"], null, null]}, {"id": "EN10", "tp": 4, "q": "Il faut renforcer fortement la protection de la biodiversité (aires protégées, zones humides), même si cela contraint certaines activités économiques.", "k": 0, "i": "La biodiversité désigne l'ensemble des espèces vivantes et des milieux naturels. Environ un tiers du territoire français est en aire protégée, dont une petite partie en protection forte. Les zones humides, qui stockent l'eau et le carbone, ont perdu une grande partie de leur surface depuis un siècle.", "p": [null, null, null, null, [1, "https://www.debout-la-france.fr/projet/environnement-energie/", "30 % des eaux françaises en aires marines protégées"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Aires marines réellement protégées (chalutage), préservation du vivant (Acte I PP)"], null, [-1, "https://vert.eco/chaleurs-actuelles/marine-le-pen-presente-le-contre-budget-du-rn-pour-2027-une-attaque-contre-les-renouvelables-et-les-agences-environnementales/", "OFB, agences de l'eau et Ademe visées par la suppression d'agences (contre-budget, oct. 2026)"], null, [1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : protéger strictement 10 % des terres et des mers"], null, [-1, "https://republicains.fr/wp-content/uploads/2026/03/LR_Agriculture.pdf", "Supprimer l'OFB, obligations minimales en Natura 2000 (LR, 2026)"], [1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé par le PCF) : protéger strictement 10 % des terres"], [1, "https://nouspresident.fr/travaillisme-ecologique/", "« Certaines zones doivent être strictement protégées » (2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Étendre parcs et réserves, mieux protéger les zones humides (2026)"], [2, "https://lafrancehumaniste.fr/articles/souverainete-agricole-et-alimentaire.html", "« la restauration de la biodiversité perdue au cours des dernières décennies » (chronique agricole, févr. 2026)"], [-1, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Réformer directives Oiseaux/Habitats pour élargir les prélèvements (2024)"]]}, {"id": "EN11", "tp": 4, "q": "La gestion de l'eau doit être publique, avec la gratuité des premiers mètres cubes vitaux.", "k": 0, "i": "La distribution de l'eau est gérée soit directement par les collectivités (régie publique), soit par des entreprises privées (Veolia, Suez, Saur) sous contrat. La gratuité des premiers mètres cubes viserait à garantir l'eau nécessaire aux besoins essentiels.", "p": [null, [0, "https://attalpresident.fr/actualites/gabriel-attal-plan-eau-argeles-sur-mer", "Bouclier tarifaire sur les litres vitaux, sans gestion publique (plan eau, août 2026)"], null, null, null, [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Tarification sociale de l'eau, « Parlements de l'eau » (Acte I PP)"], null, null, null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "Tarification de l'eau avec « gratuité des usages vitaux » et gestion publique (programme, juil. 2026)"], null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé par le PCF) : eau publique, gratuité des premiers m³"], null, [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Régies publiques de l'eau, premiers mètres cubes gratuits (2026)"], null, null]}, {"id": "AG1", "tp": 3, "q": "Les normes environnementales imposées aux agriculteurs (pesticides, etc.) doivent être assouplies.", "k": 1, "i": "Les agriculteurs doivent respecter des règles sur les pesticides, l'usage de l'eau ou la protection des haies. La loi Duplomb (2025) a assoupli certaines de ces règles, notamment en autorisant à nouveau un insecticide de la famille des néonicotinoïdes ; cette disposition a été censurée par le Conseil constitutionnel.", "p": [[-2, "https://www.lutte-ouvriere.org/portail/breves/duplomb-laile-184600.html", "LO contre la loi Duplomb, « taillée sur mesure pour les gros patrons du secteur agricole » (mai 2025)"], [1, "https://attalpresident.fr/actualites/gabriel-attal-debat-avec-les-francais-a-blois-et-a-bourges", "Aligner les normes agricoles sur le niveau européen, simplifier les normes de stockage de l'eau (Blois, oct. 2026)"], null, null, [1, "https://www.debout-la-france.fr/projet/agriculture/", "Fin du Pacte vert, simplifier les normes agricoles"], null, null, [2, "https://rassemblementnational.fr/documents/projet/projet-l-agriculture.pdf", "Plus d’interdiction de substance sans alternative équivalente (2022)"], null, [-2, "https://lcp.fr/actualites/la-proposition-de-loi-lfi-visant-a-interdire-l-acetamipride-rejetee-en-commission-444131", "Groupe LFI : PPL pour rétablir l'interdiction de pesticides réautorisés, contre la « dépendance à l'agrochimie » (LCP, oct. 2026)"], [1, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "« Zéro surtransposition agricole » (programme, 2026)"], [2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/2957", "Groupe LR : 47 pour, 0 contre la loi Duplomb (2025)"], [-2, "https://www.pcf.fr/ue_25_discours_fr", "2025 : s'oppose à la loi Duplomb"], [-1, "https://nouspresident.fr/pour-une-exception-agriculturelle-francaise/", "Critique loi Duplomb et retour des pesticides (2026)"], [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Sortie des pesticides de synthèse, CMR interdits (2026)"], [1, "https://lafrancehumaniste.fr/articles/souverainete-agricole-et-alimentaire.html", "« Donnons-leur des cadres législatifs ouverts et responsabilisants plutôt que des règlements tatillons » (chronique agricole, févr. 2026)"], [1, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Pesticides : réduction « réaliste et non dogmatique » (2022)"]]}, {"id": "AG2", "tp": 3, "q": "Il faut interdire le glyphosate.", "k": 0, "i": "Le glyphosate est l'herbicide le plus utilisé au monde. Classé « cancérogène probable » par une agence de l'OMS en 2015, il est jugé sans risque inacceptable par les agences européennes. L'UE a renouvelé son autorisation jusqu'en 2033.", "p": [null, null, null, null, null, [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Interdire glyphosate et néonicotinoïdes (Acte I PP)"], null, [-1, "https://rassemblementnational.fr/documents/projet/projet-l-agriculture.pdf", "Refus d’interdire une substance sans alternative (2022)"], null, [2, "https://melenchon2027.fr/programme/plans-thematiques/sante/", "« Interdiction immédiate des plus dangereux (glyphosate, néonicotinoïdes, etc.) » (plan santé, nov. 2026)"], null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : interdire le glyphosate"], [2, "https://nouspresident.fr/travaillisme-ecologique/", "« Sortir des engrais fossiles et des pesticides de synthèse » ; glyphosate rangé parmi les « scandales sanitaires » (cahiers écologie et agriculture, 2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Interdiction du glyphosate"], [1, "https://lafrancehumaniste.fr/articles/souverainete-agricole-et-alimentaire.html", "« Il faut réduire de moitié l'usage total des produits phytosanitaires d'ici 2030 » (chronique agricole, févr. 2026 ; glyphosate non nommé)", 1], [-1, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Pas d’interdiction sans étude d’impact ; financer des alternatives au glyphosate (2024)"]]}, {"id": "AG3", "tp": 3, "q": "Il faut des prix planchers garantis pour les produits agricoles.", "k": 0, "i": "Un prix plancher est un prix minimum garanti aux agriculteurs, en dessous duquel les industriels et la grande distribution ne pourraient pas acheter. Les lois Egalim visent déjà à mieux prendre en compte les coûts de production, sans garantie de prix.", "p": [null, [1, "https://attalpresident.fr/actualites/gabriel-attal-debat-avec-les-francais-a-blois-et-a-bourges", "Coûts de production indexés par filière, pour que les agriculteurs ne vendent pas sous leurs coûts (Blois, oct. 2026)"], null, null, [2, "https://www.debout-la-france.fr/projet/agriculture/", "Prix garantis rétablis (lait, viande, céréales)"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Prix planchers rémunérateurs (Acte I PP)"], null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Prix garantis rémunérateurs pour les agriculteurs (2024)"], null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : prix plancher rémunérateur pour les agriculteurs"], null, [0, "https://republicains.fr/wp-content/uploads/2026/03/LR_Agriculture.pdf", "Livret LR : sanctuariser le coût des matières premières dans les prix, sans prix plancher garanti (mars 2026)", 1], [2, "https://www.pcf.fr/objectif_4", "Programme PCF : prix de base rémunérateurs, interdire revente à perte"], [2, "https://nouspresident.fr/pour-une-exception-agriculturelle-francaise/", "Prix minimums garantis fondés sur coûts de production (2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Adopter des prix planchers (2026)"], [1, "https://lafrancehumaniste.fr/articles/souverainete-agricole-et-alimentaire.html", "« ouvrant sans tabous la question de la garantie de rémunération et des prix planchers » (chronique agricole, févr. 2026 ; ouverture du débat, pas d'engagement)"], null]}, {"id": "AG4", "tp": 3, "q": "Les grandes réserves d'eau agricoles (« méga-bassines ») doivent être soutenues.", "k": 1, "i": "Les « méga-bassines » sont de grandes réserves d'eau, remplies en hiver en pompant dans les nappes, pour irriguer les cultures l'été. Elles sont défendues pour sécuriser les récoltes et contestées pour leur effet sur les nappes et parce qu'elles profitent à un nombre limité d'exploitations.", "p": [null, [1, "https://www.assemblee-nationale.fr/dyn/17/scrutins/2957", "Loi Duplomb votée : retenues d'eau d'intérêt général majeur (2025)"], null, null, null, [-2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "« Refuser les méga-bassines » (Acte I PP)"], null, [2, "https://rassemblementnational.fr/documents/projet/projet-l-agriculture.pdf", "Création de réserves d’eau jugée indispensable (2022)"], null, [-2, "https://melenchon2027.fr/synthese-des-contributions/", "« Interdire les méga-bassines », mesure déjà au programme (synthèse, juil. 2026)"], [1, "https://lcp.fr/actualites/chomage-edouard-philippe-veut-abaisser-la-duree-d-indemnisation-a-douze-mois-maximum", "Veut développer le stockage de l'eau (2026)"], [2, "https://republicains.fr/actualites/2026/08/09/face-au-rechauffement-climatique-adapter-la-france-plutot-que-punir/", "Stocker l'eau l'hiver pour irriguer, retenues déclarées « projets d'intérêt public majeur » (tribune, La Tribune Dimanche, août 2026)"], [-1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : moratoire sur les méga-bassines"], [-2, "https://nouspresident.fr/pour-une-exception-agriculturelle-francaise/", "Reproche au pouvoir de s'allier aux « fervents défenseurs des pesticides et des méga-bassines » (cahier agriculture, oct. 2026)"], [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Moratoire sur tous les projets de mégabassines (2026)"], null, [2, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Soutien aux bassines et retenues collinaires (2024)"]]}, {"id": "AG6", "tp": 3, "q": "Il faut réautoriser certains pesticides néonicotinoïdes (acétamipride) pour les filières sans alternative.", "k": 1, "i": "Les néonicotinoïdes sont des insecticides accusés de nuire aux abeilles, interdits en France depuis 2018. La loi Duplomb de 2025 prévoyait de réautoriser l'acétamipride pour certaines filières (betterave, noisette) ; le Conseil constitutionnel a censuré cette disposition. Ce pesticide reste autorisé dans le reste de l'UE.", "p": [[-2, "https://www.lutte-ouvriere.org/portail/breves/duplomb-laile-184600.html", "LO contre la loi Duplomb qui veut « réintroduire des pesticides tueurs d'abeilles » (mai 2025)"], [1, "https://www.publicsenat.fr/actualites/politique/gabriel-attal-denonce-la-grande-regression-climatique-y-compris-au-sein-meme-du-gouvernement-tout-en-assumant-son-vote-sur-la-loi-duplomb", "A voté la loi Duplomb (réautorisation de l'acétamipride) et assume ce vote, en renvoyant à l'avis de l'Anses (Public Sénat, juil. 2025)"], null, null, null, null, [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/8427", "CONTRE l'ensemble du projet de loi d'urgence agricole (CMP), dont le titre est « rendre possible la réautorisation de l'acétamipride » (scrutin n°8427, 20 juil. 2026)"], null, null, [-2, "https://lcp.fr/actualites/la-proposition-de-loi-lfi-visant-a-interdire-l-acetamipride-rejetee-en-commission-444131", "Groupe LFI : PPL visant à rétablir l'interdiction de l'acétamipride et du flupyradifurone (LCP, oct. 2026)"], null, [2, "https://republicains.fr/wp-content/uploads/2026/03/LR_Agriculture.pdf", "Livret LR : « Nous autoriserons de nouveau l'usage de certains néonicotinoïdes, dont l'acétamipride » (mars 2026)"], [-2, "https://www.pcf.fr/ue_25_discours_fr", "Salue les « 2 millions de personnes [qui] disent non à la loi Duplomb et à l'acétamipride », veut interdire les importations traitées (université d'été, août 2025)"], [-2, "https://nouspresident.fr/pour-une-exception-agriculturelle-francaise/", "Veut « se passer des néonicotinoïdes », critique la loi Duplomb (cahier agriculture, oct. 2026)"], [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "« Empêcher toute tentative de réintroduction des néonicotinoïdes » (programme, juil. 2026)"], null, null]}, {"id": "TR1", "tp": 4, "q": "Il faut investir massivement dans le train, notamment les petites lignes et les trains du quotidien.", "k": 0, "i": "Les « petites lignes » sont des lignes ferroviaires régionales peu fréquentées, dont beaucoup ont fermé ou sont dégradées. L'autoroute A69 entre Castres et Toulouse est l'exemple le plus connu de projet routier contesté.", "p": [null, null, null, null, [1, "https://www.debout-la-france.fr/projet/equilibre-territoire-monde-rural/", "« Maintenir et rénover le réseau ferroviaire traditionnel qui irrigue l'ensemble de nos territoires », sans plan massif chiffré (projet DLF)"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Plan rail, trains de nuit, LGV (Acte I PP)"], null, [1, "https://rassemblementnational.fr/documents/202411-programme-europeennes.pdf", "« Redéploiement massif du transport ferroviaire » (2024)"], null, [2, "https://melenchon2027.fr/programme/plans-thematiques/ruralite/", "« La réouverture des lignes du quotidien » et renforcement des petites lignes (plan ruralité, oct. 2026)"], null, null, [2, "https://assets.nationbuilder.com/pcf/pages/36198/attachments/original/1766073432/document_-_cahier_mobilite_ppp.pdf?1766073432", "Cahier PCF mobilités : « 10 milliards d'euros par an pendant 20 ans » pour le rail, défense des « petites lignes », relance des TER et Intercités"], [2, "https://nouspresident.fr/travaillisme-ecologique/", "Trains du quotidien : « plus de fréquence, plus de fiabilité, plus d'amplitude horaire », tripler le fret ferroviaire (cahier écologie, sept. 2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Régénérer le réseau, y compris les « petites » lignes rurales, loi de programmation ferroviaire (programme, juil. 2026)"], null, null]}, {"id": "TR3", "tp": 4, "q": "Il faut interdire les jets privés ou les taxer très fortement.", "k": 0, "i": "Un jet privé émet par passager 5 à 14 fois plus de CO₂ qu'un avion de ligne. Il existe depuis 2025 une taxe sur les billets d'avion plus élevée pour les vols en jet privé.", "p": [null, null, null, null, null, [2, "https://place-publique.eu/posts/4dFSUW5ZRZ36O2SvNhPLah/place-publique-jeunes-et-plus-de-50-elus-es-place-publique-pour-une-revolution-ecologique", "Position du parti : « Nous voulons taxer les superprofits et les jets privés » (tribune d'élus Place publique, juil. 2026)"], null, null, null, [2, "https://lcp.fr/actualites/jets-prives-une-proposition-de-loi-pour-interdire-leur-usage-en-france-137024", "2022 : PPL des députés LFI pour interdire les jets privés"], null, null, [1, "https://assets.nationbuilder.com/pcf/pages/36198/attachments/original/1766073432/document_-_cahier_mobilite_ppp.pdf?1766073432", "Cahier PCF : relever la taxe sur l'aviation d'affaires"], null, [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Interdire l'atterrissage des jets privés (2026)"], null, null]}, {"id": "TR4", "tp": 4, "q": "Les transports en commun devraient être gratuits.", "k": 0, "i": "La gratuité des transports en commun existe déjà dans une quarantaine de villes, comme Dunkerque ou Montpellier. Elle est financée par les impôts locaux et le versement mobilité payé par les entreprises, au lieu des tickets.", "p": [null, null, null, null, null, [0, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Ticket climat à tarif abordable, pas gratuité (Acte I PP)"], null, null, null, [1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : gratuité ciblée (jeunes, précaires)"], null, null, [2, "https://www.pcf.fr/objectif_4", "Programme PCF : gratuité des transports urbains instaurée"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Gratuité ciblée jeunes et précaires"], [1, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Gratuité ciblée jeunes et ménages précaires (2026)"], null, null]}, {"id": "TR5", "tp": 4, "q": "Il faut créer un crime d'écocide.", "k": 0, "i": "L'écocide désigne une atteinte grave et durable à l'environnement (pollution massive, destruction d'écosystèmes). La loi Climat de 2021 a créé un délit d'écocide ; en faire un crime le rendrait plus lourdement puni.", "p": [null, null, null, null, null, null, null, null, null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Reconnaître un crime d'écocide » (programme, juil. 2026)"], null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : crime d'écocide"], [1, "https://nouspresident.fr/travaillisme-ecologique/", "« Délit de faute systémique » pour dirigeants de grands pollueurs (2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Reconnaître le crime d'écocide"], null, null]}, {"id": "I1", "tp": 5, "q": "Il faut réduire fortement l'immigration légale.", "k": 1, "i": "L'immigration légale correspond aux titres de séjour délivrés chaque année, environ 340 000 en 2025 : études, famille, travail, asile. La réduire fortement suppose de restreindre une ou plusieurs de ces catégories.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure_caravane_2026-01_-_couleur.pdf", "2026 : liberté de circulation et d'installation"], [1, "https://attalpresident.fr/programme/frontieres", "« Accueillir moins pour accueillir mieux », système à points (2026)"], null, null, [2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Immigration économique conditionnée au chômage, regroupement strictement limité"], [-1, "https://lcp.fr/actualites/presidentielle-raphael-glucksmann-devoile-les-premieres-lignes-de-son-possible-programme", "« L'immigration zéro n'est ni souhaitable, ni possible » (2026)"], null, [2, "https://rassemblementnational.fr/documents/projet/projet-controle-de-limmigration.pdf", "« Maîtrise stricte des flux migratoires » (2022)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/immigration/", "« Diviser par huit la délivrance de titres de séjour » (programme, date non indiquée) ; « la diviser au moins par huit » (publication de D. Lisnard, 3 sept. 2026, cité sur le site)"], [-2, "https://melenchon2027.fr/synthese-des-contributions/", "« Faciliter l'accès aux visas, régulariser les travailleurs, étudiants, parents d'enfants scolarisés » (programme, juil. 2026)"], [2, "https://www.edouardphilippe.fr/actualites/trois-principales-annonces-dedouard-philippe-a-lheure-de-verite", "« Diviser par deux l'immigration » sur le quinquennat (L'Heure de vérité, oct. 2026)"], [2, "https://www.publicsenat.fr/actualites/politique/referendum-sur-limmigration-primaute-du-droit-national-le-projet-de-bruno-retailleau-est-il-faisable", "Référendum pour « réduire drastiquement l'immigration » (2026)"], [-2, "https://www.pcf.fr/moyen_3", "Programme PCF : ouvrir des voies légales et sécurisées aux migrants"], [0, "https://www.publicsenat.fr/actualites/politique/presidentielle-limmigration-nouveau-clivage-a-gauche", "« Hostile à l'immigration pour le travail », vision « humaniste » (2026)"], null, null, [2, "https://www.publicsenat.fr/actualites/politique/eric-zemmour-officialise-sa-candidature-a-la-presidentielle-2027", "« Des robots à la place des immigrés » pour remplacer l'immigration de travail ; expulsion après un an de chômage (BFMTV, sept. 2026)"]]}, {"id": "I2", "tp": 5, "q": "Les sans-papiers qui travaillent dans les métiers en tension doivent pouvoir être régularisés.", "k": 1, "i": "Une personne sans papiers est un étranger sans titre de séjour valide. La loi immigration de 2024 a créé, à titre expérimental, un titre de séjour pour ceux qui travaillent dans des métiers où les employeurs peinent à recruter (bâtiment, restauration, aide à domicile…).", "p": [[2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "2026 : régularisation de tous les sans-papiers"], null, [-2, "https://www.europe1.fr/politique/xavier-bertrand-devoile-ses-propositions-pour-reprendre-le-controle-de-limmigration-4075260", "« mettre fin au système actuel de régularisation » (Europe 1, novembre 2021). Déduit : rejet des régularisations, sans mention explicite des métiers en tension.", 1], null, [-2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Supprimer la régularisation des étrangers en situation irrégulière"], [2, "https://lcp.fr/actualites/glucksmann-face-a-royal-divisions-sur-lfi-lycees-ce-qu-il-faut-retenir-du-dernier-debat", "Régulariser travailleurs sans papiers : « Nous le ferons » (2026)"], null, [-2, "https://rassemblementnational.fr/documents/projet/projet-controle-de-limmigration.pdf", "Régularisation impossible sauf cas exceptionnels (2022)"], [-2, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« supprimer toute possibilité d’être régularisé après être entré clandestinement sur le territoire » (programme, date non indiquée)"], [2, "https://melenchon2027.fr/synthese-des-contributions/", "Régulariser notamment « les travailleurs et les parents d'élèves scolarisés » (programme, juil. 2026)"], null, [-2, "https://www.publicsenat.fr/actualites/societe/immigration-ce-qui-va-changer-avec-la-nouvelle-circulaire-de-fermete-de-bruno-retailleau", "Ministre : circulaire durcissant les régularisations (2025)"], [2, "https://www.publicsenat.fr/actualites/politique/immigration-fabien-roussel-propose-la-regularisation-de-tous-les-travailleurs-sans", "2022 : régulariser « tous les sans-papiers qui travaillent »"], [1, "https://www.sudradio.fr/linvite-politique/je-refuse-une-immigration-choisie-qui-vienne-combler-les-manques-estime-francois-ruffin", "Pour régulariser ceux qui travaillent déjà ici (Sud Radio, 2022)"], [2, "https://www.lagazettefrance.fr/article/presidentielle-tondelier-propose-un-socle-programmatique-aux-autres-partis-de-gauche", "Socle proposé à la gauche : « régularisation des travailleurs sans-papiers » (AFP, avril 2026)"], null, [-2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Interdire la régularisation des entrés illégalement (2022)"]]}, {"id": "I4", "tp": 5, "q": "Le droit du sol doit être supprimé ou fortement restreint.", "k": 1, "i": "Le droit du sol permet à un enfant né en France de parents étrangers de devenir français, au plus tard à sa majorité s'il a vécu en France plusieurs années. Il a été restreint à Mayotte en 2018 puis en 2025.", "p": [[-2, "https://www.lutte-ouvriere.org/portail/breves/droit-sol-xenophobie-decomplexee-181795.html", "LO : restreindre le droit du sol, une « surenchère xénophobe » (fév. 2025)"], [-1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "« Refusons la suppression du droit du sol » dans l'Hexagone (2025)"], null, null, [2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Supprimer le droit du sol par référendum"], null, null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Suppression du droit du sol (2024)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/immigration/", "« Mettre fin à l’automaticité du droit du sol » (programme, date non indiquée)"], [-2, "https://melenchon2027.fr/synthese-des-contributions/", "« Rétablir le droit du sol pour les enfants nés en France » (programme, juil. 2026)"], null, [2, "https://www.leclubdesjuristes.com/en-bref/presidentielle-2027-bruno-retailleau-veut-supprimer-le-droit-du-sol-par-referendum-17273/", "Veut « mettre fin au droit du sol » par référendum (2026)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : droit du sol intégral"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Rétablir le droit du sol intégral"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Rétablir le droit du sol intégral"], null, [2, "https://www.publicsenat.fr/actualites/politique/presidentielle-2022-eric-zemmour-detaille-son-programme-et-assume-le-terme", "Suppression du droit du sol (2022)"]]}, {"id": "I5", "tp": 5, "q": "L'Aide médicale d'État (AME) doit être supprimée ou réduite aux soins urgents.", "k": 1, "i": "L'Aide médicale d'État (AME) prend en charge les soins des étrangers en situation irrégulière vivant en France depuis plus de trois mois, avec de faibles ressources. Elle coûte environ 1,2 milliard d'euros par an. La réduire aux soins urgents la transformerait en « aide médicale d'urgence ».", "p": [[-2, "https://www.lutte-ouvriere.org/portail/journal/aide-medicale-detat-deux-decrets-scelerats-191415.html", "LO : décrets restreignant l'AME « scélérats » (fév. 2026)"], [-1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "« Réformer l'AME en mettant en œuvre les recommandations du rapport Evin-Stefanini », sans la supprimer (convention Renaissance, mai 2025)"], null, null, [2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Supprimer l’AME, dispensaire d’urgence par département"], null, null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "AME remplacée par une aide d’urgence vitale (2024)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/immigration/", "« Supprimer l’Aide Médicale d’État (AME) et la remplacer par une aide d’urgence » (programme, date non indiquée)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : garantir l'accès à l'AME"], null, [2, "https://www.publicsenat.fr/actualites/politique/suppression-de-lame-gerald-darmanin-fait-du-en-meme-temps-constate-bruno-retailleau", "Soutient la suppression de l'AME votée au Sénat (2023)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : garantir l'accès à l'AME"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Garantir l'accès à l'AME"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Garantir l'accès à l'AME"], null, [2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : fin de l'aide médicale d'État (2026)"]]}, {"id": "I6", "tp": 5, "q": "Il faut organiser un référendum sur l'immigration.", "k": 0, "i": "La Constitution ne permet aujourd'hui de soumettre à référendum que certains sujets (organisation des pouvoirs publics, politique économique, sociale ou environnementale). Un référendum sur l'immigration suppose, selon la plupart des juristes, de modifier d'abord la Constitution.", "p": [null, null, [2, "https://www.europe1.fr/politique/xavier-bertrand-devoile-ses-propositions-pour-reprendre-le-controle-de-limmigration-4075260", "Réviser par référendum la Constitution pour que chaque année « le Parlement fixe des quotas d'immigration » (Europe 1, novembre 2021)."], null, [2, "https://www.lejdd.fr/politique/presidentielle-nicolas-dupont-aignan-officialise-sa-candidature-et-fait-le-pari-du-frexit-183876", "Référendums sur l'immigration, les institutions, le Code pénal (sept. 2026)"], [0, "https://www.publicsenat.fr/actualites/politique/fiscalite-ecole-immigration-ce-que-propose-raphael-glucksmann", "Propose une convention citoyenne, pas un référendum (2026)"], null, [2, "https://rassemblementnational.fr/22-mesures", "Référendum sur l’immigration (2022, réaffirmé 2024)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« Un référendum sera nécessaire. » (programme, date non indiquée) ; réaffirmé au meeting de Saint-Raphaël (juil. 2026, cité sur le site)"], null, [0, "https://www.europe1.fr/politique/immigration-retraite-pouvoir-dachat-ce-quil-faut-retenir-de-linterview-dedouard-philippe-dans-lheure-de-verite-1133483", "« S'il faut modifier la Constitution, le peuple peut » être consulté (article 89) sur l'immigration (France 2, oct. 2026)", 1], [2, "https://www.leclubdesjuristes.com/en-bref/presidentielle-2027-bruno-retailleau-veut-supprimer-le-droit-du-sol-par-referendum-17273/", "Référendum sur les questions migratoires (2026)"], null, null, null, [-1, "https://lafrancehumaniste.fr/articles/chemin-gaulliste.html", "« le recours direct à l'article 11 pour faire adopter par référendum la préférence nationale » (chronique Le chemin gaulliste, mai 2026 ; critique du référendum utilisé pour ce thème, pas d'avis sur un référendum immigration en général)", 1], [2, "https://www.publicsenat.fr/actualites/politique/presidentielle-2022-eric-zemmour-detaille-son-programme-et-assume-le-terme", "Référendum sur l’immigration, la sécurité et la justice (2022)"]]}, {"id": "I7", "tp": 5, "q": "Le regroupement familial doit être fortement restreint ou supprimé.", "k": 0, "i": "Le regroupement familial permet à un étranger installé légalement en France depuis au moins 18 mois, avec des ressources et un logement suffisants, de faire venir son conjoint et ses enfants mineurs. Il concerne environ 15 000 personnes par an.", "p": [null, [1, "https://attalpresident.fr/programme/frontieres", "Regroupement familial « mieux encadré » et en baisse (2026)"], [2, "https://www.europe1.fr/politique/xavier-bertrand-devoile-ses-propositions-pour-reprendre-le-controle-de-limmigration-4075260", "« réduire en priorité l'immigration familiale » (Europe 1, novembre 2021)."], null, [2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "« Limiter strictement le regroupement familial »"], null, null, [1, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Durcir les conditions du regroupement familial (2024)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/immigration/", "« conditionner le regroupement familial à des critères de ressources et des tests d’intégration » (programme, date non indiquée) ; titres « vie privée et familiale » « strictement limités » (programme, même date)"], null, [2, "https://www.boursorama.com/actualite-economique/actualites/edouard-philippe-veut-diviser-par-deux-l-immigration-legale-et-un-moratoire-sur-le-regroupement-familial-37969ad94de781018cc34edaaa67f5db", "Moratoire sur le regroupement familial (2026)"], [1, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Réduction du regroupement familial chiffrée dans son plan (2026)"], null, null, null, null, [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "« Supprimer le droit au regroupement familial » (2022)"]]}, {"id": "I8", "tp": 5, "q": "La France doit accueillir davantage de réfugiés et ouvrir des voies légales d'accès.", "k": 0, "i": "Un réfugié est une personne protégée parce qu'elle risque des persécutions dans son pays. Les « voies légales » permettent de venir en Europe sans traversée dangereuse : visas humanitaires, réinstallation depuis des camps.", "p": [[2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "2026 : liberté de circulation et d'installation pour chacun"], null, null, null, [-2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Asile limité aux demandes aux frontières, retour des réfugiés"], [1, "https://www.publicsenat.fr/actualites/politique/europeennes-2024-raphael-glucksmann-prone-dans-son-programme-une-revolution-ecologique", "Voie légale européenne, devoir de sauvetage (européennes 2024)"], null, [-2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Demandes d’asile seulement en ambassades et consulats (2024)"], [-1, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« Le droit d’asile doit être réservé aux situations le justifiant. » (programme, date non indiquée) ; demandes d’asile à traiter dans les consulats (programme immigration)", 1], [2, "https://melenchon2027.fr/synthese-des-contributions/", "Faciliter l'accès aux visas et abroger le pacte européen asile et migration (programme, juil. 2026)"], [-1, "https://fr.euronews.com/2026/10/09/presidentielle-2027-edouard-philippe-mise-sur-le-travail-et-la-reduction-des-depenses-publ", "Liste UE de pays sûrs exclus de l'asile, asile « dévoyé » (2026)"], [-2, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Traitement des demandes d'asile hors des frontières (2026)"], [2, "https://www.pcf.fr/moyen_3", "Programme PCF : voies légales ; politique d'humanité d'accueil"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Ouvrir des voies légales d'immigration"], [1, "https://lesecologistes.fr/posts/63GKwLp9RJsHhcZA1rnvXq/centre-de-retention-administrative-a-nantes-marine-tondelier-rejoint-la-lutte", "« Politiques d'accueil dignes », fin du « tout-répressif » migratoire (2026)"], null, [-2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Asile limité à une centaine de personnes par an (2022)"]]}, {"id": "I9", "tp": 5, "q": "Les étrangers condamnés pour un crime ou un délit grave doivent être systématiquement expulsés.", "k": 0, "i": "Un étranger condamné peut déjà être expulsé, mais certaines protections existent (arrivé enfant, parent d'enfant français…) et l'expulsion dépend de l'accord du pays d'origine. La mesure rendrait l'expulsion automatique après certaines condamnations.", "p": [null, [1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "Interdiction du territoire pour tout délit, expulsions accélérées (2025)"], [2, "https://www.europe1.fr/politique/xavier-bertrand-devoile-ses-propositions-pour-reprendre-le-controle-de-limmigration-4075260", "Expulser « tout étranger condamné à de la prison ferme à l'issue de sa peine » (Europe 1, novembre 2021)."], null, [2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Tout étranger condamné à la prison ferme expulsé"], null, null, [2, "https://rassemblementnational.fr/documents/projet/projet-controle-de-limmigration.pdf", "Lever tous les obstacles à l’expulsion des condamnés (2022)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/immigration/", "« Expulser systématiquement les étrangers condamnés pour délits graves et les fichés S étrangers » (programme, date non indiquée) ; limité aux délits graves"], null, [2, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "« Étrangers délinquants expulsés », privés d'aides sociales (2026)"], [1, "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-veut-renverser-la-table-avec-une-profonde-reforme-constitutionnelle", "Faciliter l'éloignement des étrangers condamnés (2026)"], null, null, null, null, [2, "https://www.publicsenat.fr/actualites/politique/eric-zemmour-officialise-sa-candidature-a-la-presidentielle-2027", "Expulser détenus étrangers et condamnés sous bracelet ou TIG (BFMTV, sept. 2026)"]]}, {"id": "I10", "tp": 5, "q": "Il faut donner le droit de vote aux étrangers non européens aux élections locales.", "k": 0, "i": "Les citoyens de l'UE vivant en France peuvent déjà voter aux élections municipales et européennes. La mesure étendrait ce droit aux étrangers non européens résidant légalement en France, pour les élections municipales. Elle nécessite une révision de la Constitution.", "p": [null, null, null, null, [-2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Droit de vote réservé aux seuls nationaux"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Droit de vote des extra-communautaires aux élections locales (Acte I PP)"], null, [-2, "https://rassemblementnational.fr/documents/projet/projet-controle-de-limmigration.pdf", "Seuls les nationaux votent (hors municipales pour citoyens UE)"], null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Accorder le droit de vote des étrangers aux élections locales » (programme, juil. 2026)"], null, null, [2, "https://www.pcf.fr/moyen_2", "Programme PCF : vote des étrangers aux élections locales et européennes"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Droit de vote des étrangers aux locales"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Droit de vote des étrangers aux locales"], null, null]}, {"id": "I11", "tp": 5, "q": "La maîtrise du français doit conditionner tout titre de séjour de longue durée.", "k": 0, "i": "Depuis la loi de 2024, la carte de résident de 10 ans exige un certain niveau de français. La mesure étendrait et durcirait cette exigence à tous les titres de séjour longs.", "p": [null, [1, "https://attalpresident.fr/programme/frontieres", "Système à points incluant la maîtrise du français (2026)"], [1, "https://www.europe1.fr/politique/xavier-bertrand-devoile-ses-propositions-pour-reprendre-le-controle-de-limmigration-4075260", "Passeport républicain pour rejoindre son conjoint « à condition de maîtriser la langue française » (Europe 1, novembre 2021). Déduit : portée limitée au regroupement familial, pas à tout titre long.", 1], null, [1, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "Maîtrise de la langue pour naturalisation et regroupement conjoint"], null, null, [1, "https://rassemblementnational.fr/documents/projet/projet-controle-de-limmigration.pdf", "Titre de séjour subordonné à l’engagement d’assimilation (2022)"], null, null, null, [1, "https://www.publicsenat.fr/actualites/societe/immigration-ce-qui-va-changer-avec-la-nouvelle-circulaire-de-fermete-de-bruno-retailleau", "Ministre : français certifié valorisé pour être régularisé (2025)"], null, null, null, null, [1, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "« Parfaite maîtrise de la langue » pour la naturalisation (2022)"]]}, {"id": "I12", "tp": 5, "q": "La France doit pouvoir déroger à la Convention européenne des droits de l'homme (CEDH) sur l'immigration, voire en sortir.", "k": 0, "i": "La Convention européenne des droits de l'homme, que la France a ratifiée en 1974, est appliquée par la Cour de Strasbourg. Celle-ci a parfois condamné la France ou bloqué des expulsions. En déroger ou en sortir permettrait de durcir la politique migratoire, au prix de moindres garanties pour les droits fondamentaux.", "p": [null, null, null, null, [1, "https://www.debout-la-france.fr/projet/justice/", "Dénonce les arrêts CEDH/CJUE bloquant les expulsions, primauté du droit français à « rétablir par référendum », sans sortie explicite de la CEDH (projet DLF)", 1], null, null, [1, "https://rassemblementnational.fr/documents/projet/projet-controle-de-limmigration.pdf", "Rendre inapplicables certaines stipulations de la CEDH sur l'immigration, sans « dénonciation » de la Convention (projet 2022)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/immigration/", "« Sortir de la CEDH en dernier recours » (programme, date non indiquée) ; option conditionnelle, précédée d’un « bras de fer » avec la CEDH"], null, [0, "https://lcp.fr/actualites/edouard-philippe-veut-diviser-par-deux-l-immigration-legale-et-propose-un-moratoire-sur", "Pas de sortie ni de dérogation : veut un « protocole additionnel, discuté avec les autres États » sur le droit à la vie familiale (France 2, oct. 2026)"], [1, "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-propose-une-revolution-copernicienne-dans-laquelle-la-constitution-ne-serait-plus-le-bouclier-qui-prote", "« Qu'une loi organique puisse revenir sur une jurisprudence européenne » de la CEDH, sans sortie de la Convention (Le Figaro via Public Sénat, sept. 2026)"], [-2, "https://www.pcf.fr/moyen_3", "Programme PCF : la France « exigera de ses partenaires européens le respect de la Convention européenne des droits de l'Homme »"], null, null, null, [2, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "« Quitter la CEDH, modifier la réglementation européenne sur le non-refoulement » (programme européennes 2024)"]]}, {"id": "I13", "tp": 5, "q": "Il faut pouvoir retirer la nationalité française aux binationaux condamnés pour des crimes graves ou du terrorisme.", "k": 0, "i": "", "p": [null, null, null, null, [2, "https://twitter.com/dupontaignan/status/679619550850187264", "« Les binationaux doivent assumer le risque de perdre leur citoyenneté s'ils portent les armes contre notre pays » (compte officiel, déc. 2015)"], null, null, null, null, null, null, [2, "https://www.20min.ch/fr/story/france-retailleau-met-en-cause-les-binationaux-violents-qui-pillent-103652282", "« Quand on est un binational, on doit pouvoir être déchu de la nationalité française » (AFP via 20 minutes, oct. 2026)"], null, null, null, [-2, "https://lafrancehumaniste.fr/articles/appel-paix-civile-sociale.html", "« à leur déchéance de la nationalité française » (critique du RN, appel à la paix civile, oct. 2026 ; opposition explicite à la déchéance pour les binationaux, présentée comme dérive)", 1], [2, "https://www.europe1.fr/politique/en-direct-immigration-pouvoir-dachat-narcotrafic-ce-quil-faut-retenir-de-linterview-deric-zemmour-dans-la-france-en-face-936419", "Déchoir et renvoyer les binationaux condamnés, y compris trafiquants ; « erreur d'accepter la binationalité » (Europe 1/CNews, mai 2026)"]]}, {"id": "I14", "tp": 5, "q": "Il faut dénoncer l'accord franco-algérien de 1968 sur l'immigration.", "k": 1, "i": "L'accord de 1968 fixe des règles particulières pour l'entrée, le séjour et l'emploi des Algériens en France, plus favorables sur certains points que le droit commun. L'Assemblée a adopté en octobre 2025 une résolution du RN demandant de le dénoncer, sans effet juridique.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/france-algerie-entre-surencheres-interets-compris-188576.html", "LO : le vote RN-LR pour dénoncer l'accord de 1968 relève de « la surenchère xénophobe et anti-algérienne » (nov. 2025)"], [2, "https://www.europe1.fr/politique/gabriel-attal-appelle-denoncer-laccord-franco-algerien-de-1968-238850", "Appelle à « dénoncer l'accord franco-algérien de 1968 » (Europe 1, janv. 2025) ; son groupe s'est divisé sur la résolution RN d'oct. 2025 (30 contre sur 92)"], null, null, [2, "https://x.com/dupontaignan/status/1983831053740503229", "Souhaite que les députés « votent enfin la dénonciation des accords de 1968 avec l'Algérie » (compte officiel, oct. 2025)"], null, null, [2, "https://lcp.fr/actualites/denonciation-des-accords-franco-algeriens-de-1968-un-texte-du-rn-adopte-a-une-voix-pres", "Groupe RN : résolution visant à dénoncer l'accord de 1968, adoptée 185 voix contre 184, « journée historique » (oct. 2025)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/immigration/", "« Revenir sur l’accord franco-algérien de 1968 » (programme, date non indiquée) ; « dénonciation » des accords de 1968 réaffirmée (CNEWS/Europe 1, 27 oct. 2026, résumé)"], [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/3260", "Groupe LFI : 52 voix contre la résolution RN dénonçant l'accord de 1968 (scrutin n°3260, 30 oct. 2025)"], [2, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-sure", "« Dénoncer l'accord de 1968 avec l'Algérie » (programme, 2026)"], [2, "https://www.europe1.fr/politique/accords-de-1968-expulsions-bruno-retailleau-durcit-le-ton-face-a-alger-764621", "Veut « sortir des accords de 1968 » ; « favorable à la dénonciation » dès nov. 2024 (Europe 1, juil. 2025)"], [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/3260", "Groupe GDR : vote contre la résolution RN dénonçant l'accord franco-algérien de 1968 (scrutin n°3260, 30 oct. 2025)"], null, [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/3260", "Groupe écologiste : 32 contre la résolution RN dénonçant l'accord de 1968 (oct. 2025)"], null, null]}, {"id": "I15", "tp": 5, "q": "Il faut rétablir le délit de séjour irrégulier.", "k": 0, "i": "", "p": [null, null, null, null, [2, "https://www.debout-la-france.fr/projet/immigration-et-assimilation/", "« Rétablir le délit de séjour irrégulier puni d'emprisonnement ferme » (projet DLF)"], null, null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "« Retour du délit de séjour irrégulier » (programme législatives 2024)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/immigration/", "« Rétablir le délit de séjour irrégulier » (programme, date non indiquée)"], null, null, [2, "https://x.com/BrunoRetailleau/status/1863534435569717629", "« Il faut rétablir ce que François Hollande avait supprimé en 2012 : le délit de séjour irrégulier » (compte X officiel, déc. 2024)"], null, null, null, null, null]}, {"id": "I16", "tp": 5, "q": "Il faut instaurer la « priorité nationale » pour l'accès au logement social.", "k": 0, "i": "Les logements sociaux (HLM) sont attribués selon les ressources et la situation des ménages, sans condition de nationalité pour les étrangers en situation régulière. La « priorité nationale » donnerait la priorité aux Français. Beaucoup de juristes estiment qu'elle exige une révision de la Constitution.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/non-guerre-entre-travailleurs-197106.html", "Éditorial Arthaud contre la « préférence nationale » de Le Pen qui priverait de logement les travailleurs immigrés (sept. 2026)"], null, null, null, null, null, null, [2, "https://www.publicsenat.fr/actualites/politique/la-premiere-mesure-sociale-sera-de-garantir-a-tous-les-francais-detre-prioritaires-chez-eux-defend-laurent-jacobelli", "Priorité aux Français pour le logement social, « la famille française passe avant » (meeting d'Hénin-Beaumont, sept. 2026)"], null, null, null, [-1, "https://www.publicsenat.fr/actualites/politique/logement-bruno-retailleau-propose-de-deduire-de-l-imot-les-interets-d-emprunt-pour-un-pret-immobilier-en-fonction-du-nombre-d-enfants", "« N'a pas été jusqu'à promettre la priorité nationale » ; HLM réservés aux actifs « français ou étrangers en situation régulière » (Public Sénat, sept. 2026)", 1], [-2, "https://assets.nationbuilder.com/pcf/pages/36197/attachments/original/1766073372/document_-_cahier_logement_ppp.pdf?1766073372", "Cahier PCF logement : la « préférence nationale » dans le logement est une discrimination institutionnalisée (2025)"], null, null, [-2, "https://lafrancehumaniste.fr/articles/chemin-gaulliste.html", "« une préférence nationale qui bouleverserait l'égalité devant la loi » (chronique Le chemin gaulliste, mai 2026 ; priorité nationale au logement non citée)", 1], [2, "https://www.publicsenat.fr/actualites/politique/presidentielle-2022-eric-zemmour-detaille-son-programme-et-assume-le-terme", "Va plus loin : étrangers exclus du logement social (programme 2022, Public Sénat)"]]}, {"id": "I17", "tp": 5, "q": "Les aides sociales non contributives doivent être réservées aux étrangers résidant légalement en France depuis plusieurs années (par exemple 5 ans).", "k": 0, "i": "Les aides non contributives (RSA, allocations familiales, APL…) sont financées par l'impôt, sans cotisation préalable. Pour les étrangers non européens, le RSA exige déjà cinq ans de séjour régulier. La mesure étendrait une telle durée de résidence à d'autres aides.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/non-guerre-entre-travailleurs-197106.html", "Éditorial Arthaud : supprimer les APL « aux uns » sert à « renflouer les caisses de l'État » (sept. 2026)"], null, null, null, [2, "https://www.debout-la-france.fr/actualite/communique-nicolas-dupont-aignan-a-limoges/", "Va plus loin : « suppression des aides sociales non contributives aux étrangers » (20 mesures, Limoges, 20 oct. 2026)"], null, null, [2, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "« Réserver le bénéfice des prestations de solidarité aux étrangers ayant au moins 5 ans ETP travaillés en France » (contre-budget, oct. 2025)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/immigration/", "« aux étrangers résidant régulièrement sur le territoire national depuis au moins cinq ans » (programme, date non indiquée) ; réduction de prestations non contributives pour étrangers (CNEWS/Europe 1, 27 oct. 2026)"], null, null, [2, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Prestations non contributives réservées aux étrangers avec cinq ans de résidence et de travail (plan d'économies, Public Sénat, oct. 2026)"], null, null, null, null, [2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : va plus loin : prestations non contributives (RSA, APL, allocations familiales) réservées aux Français (2026)"]]}, {"id": "S1", "tp": 6, "q": "Il faut instaurer des peines planchers (peines minimales obligatoires).", "k": 1, "i": "Les peines planchers sont des peines minimales que le juge doit prononcer pour certains délits, sauf décision motivée. Elles ont existé de 2007 à 2014. Les prisons françaises comptent environ 62 000 places pour plus de 80 000 détenus.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/darmanin-surenchere-securitaire-184994.html", "LO dénonce les peines minimales de Darmanin, « l'équivalent des peines plancher de Sarkozy » (juin 2025)"], [1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "Seuils minimaux de peines, loi d'urgence prisons (convention, 2025)"], [2, "https://lessurligneurs.eu/pour-xavier-bertrand-lr-si-on-sen-prend-a-un-policier-a-un-gendarme-a-un-pompier-ou-un-maire-la-peine-de-prison-doit-etre-automatique/", "« la peine de prison doit être automatique » (Bertrand, tweet du 18 avril 2021, cité par Les Surligneurs, avril 2021), pour les agressions contre policier, gendarme, pompier ou maire. Les Surligneurs précise qu'il envisage une peine plancher d'un an par révision constitutionnelle."], null, [1, "https://www.debout-la-france.fr/actualite/communique-nicolas-dupont-aignan-a-limoges/", "Peines planchers pour les agressions de policiers, prison ferme pour les multirécidivistes (20 mesures, Limoges, 20 oct. 2026)"], null, null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Peines planchers et construction de prisons (2024)"], null, [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2020/04/avenir-en-commun-maj-avril-2020.pdf", "AEC 2020 : en finir avec le tout carcéral ; NFP surpopulation"], [1, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-sure", "Peines planchers pour les infractions les plus graves (programme, 2026)"], [2, "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-propose-une-revolution-copernicienne-dans-laquelle-la-constitution-ne-serait-plus-le-bouclier-qui-prote", "Peines minimales obligatoires constitutionnalisées (2026)"], [-1, "https://www.pcf.fr/moyen_2", "Programme PCF : limiter la détention, développer les alternatives"], null, null, [-1, "https://lafrancehumaniste.fr/articles/appel-paix-civile-sociale.html", "« exigence d'une justice d'abattage automatique » (appel à la paix civile, oct. 2026 ; peines planchers non nommées)", 1], [2, "https://www.lejdd.fr/politique/violences-urbaines-il-ny-aura-pas-de-retour-a-la-paix-sociale-sans-la-remigration-martele-eric-zemmour-186411", "Rétablir les peines planchers et la loi anticasseurs (CNews, oct. 2026)"]]}, {"id": "S2", "tp": 6, "q": "Les mineurs de 16 ans et plus doivent pouvoir être jugés comme des majeurs.", "k": 1, "i": "Les mineurs sont jugés par une justice spécifique qui privilégie l'éducation et prévoit des peines réduites de moitié (« excuse de minorité »). La mesure permettrait de juger les 16-18 ans comme des adultes, notamment pour les faits graves.", "p": [null, [1, "https://attalpresident.fr/actualites/gabriel-attal-rtl-retablir-ordre-jeunesse-avenir-france", "« Comparution immédiate pour les récidivistes dès 16 ans », fin de l'excuse de minorité pour les récidivistes (RTL, 19 oct. 2026)"], [2, "https://www.cnews.fr/france/2021-09-15/amendes-majorite-penale-places-de-prison-xavier-bertrand-passe-loffensive-et", "Majorité pénale ramenée à 15 ans, avec les mêmes peines que les adultes (paraphrase de CNews, septembre 2021). Déduit : la proposition porte sur 15 ans et non 16 ans.", 1], null, [2, "https://www.debout-la-france.fr/actualite/communique-nicolas-dupont-aignan-a-limoges/", "« Baisse de la majorité pénale à 16 ans » (20 oct. 2026)"], null, null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Majorité pénale abaissée à 16 ans (2024)"], [2, "https://www.unenouvelleenergie.fr/david-lisnard-sur-cnews-et-europe-1-je-ne-suis-pas-candidat-pour-un-poste-je-viens-pour-redresser-le-pays/", "résumé fidèle : « abaisser la majorité pénale à 16 ans » (CNEWS/Europe 1, 27 oct. 2026) ; réduction de l’excuse de minorité également citée"], [-2, "https://melenchon2027.fr/programme-partage-nupes-2022/chapitre-6/", "NUPES 2022 : respect des principes de l'ordonnance de 1945"], [1, "https://horizonsleparti.fr/le-plan-dedouard-philippe-contre-le-narcotrafic/", "Levée de l'excuse de minorité pour le narcotrafic (2026)"], null, [-2, "https://www.pcf.fr/moyen_2", "Programme PCF : supprimer l'enfermement des 13-16 ans, limiter 16-18"], [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/1624", "Vote contre loi Attal justice des mineurs (2025)"], [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/1624", "Groupe écologiste contre loi Attal mineurs (2025)"], null, [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Majorité pénale abaissée à 16 ans (2022)"]]}, {"id": "S3", "tp": 6, "q": "Il faut autoriser durablement la vidéosurveillance algorithmique (détection automatique de situations à risque).", "k": 0, "i": "La vidéosurveillance algorithmique utilise des logiciels pour repérer automatiquement des situations à risque (mouvements de foule, objets abandonnés) sur les images des caméras. Elle a été expérimentée pendant les JO de 2024. La reconnaissance faciale, qui identifie les personnes, reste interdite dans l'espace public.", "p": [null, [1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "« Prolonger et étendre l'expérimentation » de la vidéoprotection algorithmique (convention Renaissance, mai 2025)"], null, null, null, null, null, null, null, [-2, "https://melenchon2027.fr/synthese-des-contributions/", "Le programme rejette la vidéosurveillance de masse et la reconnaissance faciale (synthèse, juil. 2026)"], null, [1, "https://republicains.fr/wp-content/uploads/2026/07/LR_IA.pdf", "Livret IA LR : autoriser « la vision par ordinateur pour certains objectifs de sécurité », dans un cadre encadré (juil. 2026)"], [-1, "https://www.pcf.fr/moyen_2", "Programme PCF : « Une loi protégera nos concitoyen·ne·s de la surveillance numérique de masse » ; NFP 2024 : évaluer de manière indépendante la vidéosurveillance"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Interdire la reconnaissance faciale"], null, [-1, "https://lafrancehumaniste.fr/articles/appel-paix-civile-sociale.html", "« demande de surveillance généralisée qui finit toujours par porter atteinte à la vie privée » (appel à la paix civile, oct. 2026 ; vidéosurveillance algorithmique non nommée)", 1], null]}, {"id": "S4", "tp": 6, "q": "Il faut créer une présomption de légitime défense pour les policiers.", "k": 1, "i": "Aujourd'hui, un policier qui fait usage de son arme doit prouver qu'il était en situation de légitime défense ou d'absolue nécessité. Une présomption inverserait la charge : ce serait à l'accusation de prouver qu'il n'était pas en légitime défense.", "p": [[-2, "https://lutte-ouvriere.org/journal/article/bas-loi-permis-tuer-197118.html", "LO contre la présomption d'usage légitime de l'arme, « une loi inique qui doit être retirée » (sept. 2026)"], null, null, null, [2, "https://www.debout-la-france.fr/projet/securite/", "Présomption de légitime défense pour les policiers"], null, [-2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/7987", "CONTRE l'ensemble de la proposition de loi visant à reconnaître une présomption de légitime défense pour les forces de l'ordre (scrutin n°7987, 7 juil. 2026)"], [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Présomption de légitime défense pour policiers et gendarmes (2024)"], null, [-2, "https://melenchon2027.fr/programme-partage/chapitre-4/", "2026 : abroger la loi Cazeneuve sur le refus d'obtempérer"], null, [1, "https://lcp.fr/actualites/violences-du-17-octobre-qui-propose-quoi-sur-le-maintien-de-l-ordre-444073", "L'action d'un policier ne doit pas être « présumée fautive » (LCP, oct. 2026)"], [-1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : réviser la loi sur l'ouverture du feu"], [-1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Réformer l'usage des armes (refus d'obtempérer)"], [-2, "https://lcp.fr/actualites/violences-du-17-octobre-qui-propose-quoi-sur-le-maintien-de-l-ordre-444073", "Abroger la loi Cazeneuve de 2017 sur l'ouverture du feu (LCP, oct. 2026)"], null, [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Présomption de légitime défense pour policiers et gendarmes (2022)"]]}, {"id": "S5", "tp": 6, "q": "Il faut réformer la police (IGPN indépendante, interdiction de certaines techniques d'interpellation).", "k": 0, "i": "L'IGPN est l'inspection qui enquête sur les fautes des policiers ; elle dépend du ministère de l'Intérieur, et ses critiques lui reprochent un manque d'indépendance. Certaines techniques d'interpellation, comme le plaquage ventral ou la clé d'étranglement, sont accusées de provoquer des morts.", "p": [null, null, null, null, null, null, null, null, [1, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« les structures actuelles de la sécurité publique … doivent être profondément réformées » (programme, date non indiquée) ; IGPN non citée"], [2, "https://lcp.fr/actualites/violences-du-17-octobre-qui-propose-quoi-sur-le-maintien-de-l-ordre-444073", "Désescalade, interdire LBD et grenades, dissoudre la BRAV-M (LCP, oct. 2026)"], null, null, [2, "https://www.pcf.fr/moyen_2", "Programme PCF : instance indépendante de contrôle de la police"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Remplacer IGPN, interdire LBD, démanteler BRAV-M"], [2, "https://lcp.fr/actualites/violences-du-17-octobre-qui-propose-quoi-sur-le-maintien-de-l-ordre-444073", "Doctrine de désescalade, interdire LBD et grenades, démanteler la BRAV-M (LCP, oct. 2026)"], null, [-1, "https://www.lejdd.fr/politique/violences-urbaines-il-ny-aura-pas-de-retour-a-la-paix-sociale-sans-la-remigration-martele-eric-zemmour-186411", "Veut « en finir avec le syndrome Malik Oussekine » (CNews, oct. 2026)"]]}, {"id": "S6", "tp": 6, "q": "Les courtes peines de prison doivent être remplacées par des alternatives (travaux d'intérêt général, bracelet).", "k": 0, "i": "Une courte peine est une peine de prison de quelques mois. Depuis 2020, les peines de moins d'un mois sont interdites, et celles de moins de six mois doivent en principe être exécutées hors de prison (bracelet électronique, travail d'intérêt général).", "p": [null, null, [-2, "https://www.cnews.fr/france/2021-09-15/amendes-majorite-penale-places-de-prison-xavier-bertrand-passe-loffensive-et", "Rétablissement des courtes peines de prison, toutes à exécuter, même sous un mois (paraphrase de CNews, septembre 2021). Il s'oppose donc à leur remplacement par des alternatives."], null, [-2, "https://www.debout-la-france.fr/projet/justice/", "Abroger la loi de 2019 évitant la prison pour courtes peines"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Peines adaptées, TIG, contre surpopulation carcérale (Acte I PP)"], null, [-1, "https://rassemblementnational.fr/documents/projet/projet-la-securite.pdf", "Critique la loi de 2019 sur les courtes peines (2022)"], [1, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« le recours plus effectif des peines alternatives à la prison » (programme, date non indiquée) ; mais aussi « l’augmentation des places de prison »", 1], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2020/04/avenir-en-commun-maj-avril-2020.pdf", "AEC 2020 : peines alternatives à la prison"], [-2, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "Veut des peines de prison très courtes systématiques (2026)"], null, [1, "https://www.pcf.fr/moyen_2", "Programme PCF : développer les alternatives à l'incarcération"], null, null, null, [-2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Fin des aménagements de peine (2022)"]]}, {"id": "S7", "tp": 6, "q": "Les consommateurs de drogue doivent être plus sévèrement sanctionnés pour lutter contre le narcotrafic.", "k": 1, "i": "L'usage de stupéfiants est un délit puni d'une amende forfaitaire de 200 €, voire d'un an de prison. Durcir les sanctions vise à réduire la demande qui finance les trafics ; ses opposants estiment que la répression des usagers n'a pas fait baisser la consommation.", "p": [[-2, "https://www.lutte-ouvriere.org/portail/breves/drogue-poudre-yeux-195191.html", "LO dénonce la répression des usagers, la drogue étant « un véritable problème de santé publique » (juin 2026)"], [1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "Étendre les amendes forfaitaires délictuelles contre la drogue (2025)"], null, null, [2, "https://www.cnews.fr/france/2022-02-01/repression-legalisation-depenalisation-que-pensent-les-candidats-la-presidentielle", "Réprimer plus durement vendeurs et consommateurs (2022)"], [-2, "https://www.publicsenat.fr/actualites/politique/narcotrafic-de-courtes-peines-de-prison-pour-les-consommateurs-de-drogue-une-proposition-qui-divise-les-mondes-judiciaires-et-politiques", "Contre la chasse policière aux fumeurs de joints (2024)"], null, [1, "https://www.cnews.fr/france/2022-02-01/repression-legalisation-depenalisation-que-pensent-les-candidats-la-presidentielle", "Amende forfaitaire jugée « début de dépénalisation », plus de répression (2022)"], null, [-2, "https://melenchon2027.fr/comparateur-place-publique-2025/", "2025 : légalisation encadrée du cannabis, pas de répression accrue"], [2, "https://horizonsleparti.fr/le-plan-dedouard-philippe-contre-le-narcotrafic/", "Amendes, sanctions par les maires, opérations contre l'usage de stupéfiants (2026)"], [1, "https://www.publicsenat.fr/actualites/politique/au-bout-dun-joint-dun-rail-de-coke-il-y-a-des-criminels-bruno-retailleau-annonce-vouloir-sattaquer-aux-consommateurs-de-stupefiants", "Ministre : veut « s'attaquer » aux consommateurs, sans sanction précisée (2024)"], [-1, "https://www.pcf.fr/objectif_2", "2025 : « une politique répressive ne saurait être une réponse adaptée »"], null, null, null, null]}, {"id": "S9", "tp": 6, "q": "Les polices municipales doivent être armées et recevoir davantage de pouvoirs (contrôles d'identité, enquête).", "k": 0, "i": "Les policiers municipaux dépendent du maire. L'armement est décidé par chaque commune, et environ 60 % d'entre eux sont armés. Ils ne peuvent pas aujourd'hui faire de contrôles d'identité ni mener d'enquêtes, réservés à la police et à la gendarmerie nationales.", "p": [null, [2, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "« Rendre obligatoire l'armement des polices municipales », directeurs OPJ et amendes forfaitaires délictuelles (convention Renaissance, mai 2025)"], [2, "https://www.cnews.fr/france/2021-09-15/amendes-majorite-penale-places-de-prison-xavier-bertrand-passe-loffensive-et", "Renforcer les polices municipales, avec des officiers de police judiciaire territoriaux pouvant faire des contrôles d'identité (paraphrase de CNews, septembre 2021). Le caractère armé n'est pas mentionné.", 1], null, [1, "https://www.debout-la-france.fr/projet/securite/", "« Élargir le champ d'action des polices municipales », armement non précisé (projet DLF)"], null, null, null, [2, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« Les collectivités territoriales verront donc leurs compétences de police accrues » (programme, date non indiquée) ; police territoriale et officiers de police judiciaire ; armement non cité"], null, null, [1, "https://www.maire-info.com/polices-municipales/bruno-retailleau-tres-favorable-%EF%BF%BD-une-extension-des-pouvoirs-des-policiers-municipaux--article-28977", "Ministre : « très favorable à une extension du rôle des policiers municipaux », armement non évoqué (audition AN, oct. 2024)"], [0, "https://x.com/Fabien_Roussel/status/1942653151242510594", "« L'armer est le choix des maires. Mais en aucun cas, elle doit se substituer à la police nationale ! » (compte X officiel, juil. 2025)"], null, null, [1, "https://lafrancehumaniste.fr/articles/appel-paix-civile-sociale.html", "« développement de leurs effectifs de police municipale » (appel à la paix civile, oct. 2026 ; armement et pouvoirs non évoqués)", 1], null]}, {"id": "S10", "tp": 6, "q": "Il faut construire beaucoup plus de places de prison (au moins 15 000 à 20 000 de plus).", "k": 0, "i": "Les prisons françaises comptent environ 62 000 places pour plus de 80 000 détenus, un record. Un plan lancé en 2018 prévoit 15 000 places supplémentaires, avec beaucoup de retard. Une place de prison coûte plusieurs centaines de milliers d'euros à construire.", "p": [null, [1, "https://doc.parti.re/conventions/Restitution-Regalien-Une-Republique-ferme-une-France-apaisee.pdf", "Loi d'urgence pour la construction de prisons et 3 000 places de rétention, sans objectif chiffré de places de prison (convention Renaissance, mai 2025)"], [2, "https://www.cnews.fr/france/2021-09-15/amendes-majorite-penale-places-de-prison-xavier-bertrand-passe-loffensive-et", "Atteindre 80 000 places de prison, soit 20 000 de plus qu'aujourd'hui (paraphrase de CNews, septembre 2021)."], null, [2, "https://www.debout-la-france.fr/actualite/communique-nicolas-dupont-aignan-a-limoges/", "« Construction de 40 000 places de prison » (20 mesures, Limoges, 20 oct. 2026)"], null, null, [2, "https://rassemblementnational.fr/22-mesures", "« Atteindre 85 000 places de prison en 2027 » (programme 2022, construction de prisons réaffirmée en 2024)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« l’augmentation des places de prison » (programme, date non indiquée) ; chiffre de 15 000 à 20 000 places non précisé"], null, null, null, [-2, "https://www.pcf.fr/moyen_2", "Programme PCF : développer les alternatives à l'incarcération « plutôt que la construction de nouvelles prisons »"], null, null, null, null]}, {"id": "S11", "tp": 6, "q": "Il faut autoriser la reconnaissance faciale dans l'espace public pour identifier des suspects.", "k": 1, "i": "La reconnaissance faciale identifie une personne en comparant son visage à une base de données. Elle est interdite dans l'espace public en France, sauf exceptions très encadrées. Le règlement européen sur l'IA ne l'autorise en temps réel que pour des crimes graves, sur autorisation.", "p": [null, [2, "https://attalpresident.fr/actualites/gabriel-attal-retablir-ordre-mettre-fin-impunite", "Identifier et sanctionner les casseurs « repérés grâce à la reconnaissance faciale » (oct. 2026)"], null, null, null, null, null, null, null, [-2, "https://melenchon2027.fr/synthese-des-contributions/", "« Interdire la reconnaissance faciale » (programme, juil. 2026)"], [1, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-sure", "« Utilisation ciblée de la reconnaissance faciale » dans un « état d'urgence narco » limité dans le temps et l'espace (programme, 2026)"], [-1, "https://republicains.fr/wp-content/uploads/2026/07/LR_IA.pdf", "Livret IA LR : « interdiction de la reconnaissance faciale en temps réel dans l'espace public à des fins de surveillance de masse » (juil. 2026)"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : « Interdire la reconnaissance faciale »"], null, [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : « Interdire la reconnaissance faciale »"], [-1, "https://lafrancehumaniste.fr/articles/appel-paix-civile-sociale.html", "« demande de surveillance généralisée qui finit toujours par porter atteinte à la vie privée » (appel à la paix civile, oct. 2026 ; reconnaissance faciale non nommée)", 1], null]}, {"id": "H1", "tp": 7, "q": "Il faut réguler l'installation des médecins dans les zones déjà bien dotées.", "k": 1, "i": "Les médecins sont libres de s'installer où ils veulent. Plusieurs millions de Français vivent dans des « déserts médicaux ». Une proposition de loi transpartisane, adoptée par l'Assemblée en 2025, prévoit qu'un médecin ne puisse s'installer dans une zone bien dotée que si un autre en part.", "p": [null, [-1, "https://attalpresident.fr/actualites/gabriel-attal-debat-avec-les-francais-a-blois-et-a-bourges", "« Imposer aux généralistes leur lieu d'installation serait contre-productif » ; former 20 000 médecins (Blois, oct. 2026)"], null, null, null, null, null, [-1, "https://lcp.fr/actualites/deserts-medicaux-l-assemblee-adopte-la-proposition-de-loi-qui-prevoit-de-reguler-l", "Groupe RN abstenu, souhaite retirer l’article de régulation (2025)"], null, [2, "https://melenchon2027.fr/programme/plans-thematiques/sante/", "« Réguler l'installation des médecins » et quota horaire mensuel en zone de désert médical (plan santé, nov. 2026)"], null, null, [2, "https://www.pcf.fr/objectif_2", "Programme PCF : conventionnement sélectif en zones denses"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Réguler l'installation des médecins"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Réguler l'installation des médecins"], null, null]}, {"id": "H3", "tp": 7, "q": "Les franchises médicales et le reste à charge doivent augmenter pour financer la Sécurité sociale.", "k": 0, "i": "Les franchises médicales sont de petites sommes laissées à la charge des patients (1 € par boîte de médicaments, 2 € par consultation…), plafonnées par an. Le reste à charge est ce que le patient paie après le remboursement de la Sécu et de sa mutuelle.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/journalnumero/fichiers/2026/08/3030-web.pdf", "2026 : hausse des franchises = « amputations programmées »"], [1, "https://www.lequotidiendupharmacien.fr/exercice-pro/politique-de-sante/le-doublement-des-franchises-medicales-effectif-au-31-mars-2024", "PM : doublement des franchises médicales par décret (2024)"], null, null, null, [-2, "https://place-publique.eu/posts/5alHI42mxxIp7GNFA9ImFX/franchises-medicales-s-lecornu-envoie-la-facture-du-deficit-aux-malades", "S'oppose au doublement des franchises médicales (PP, 2026)"], null, null, null, [-2, "https://melenchon2027.fr/programme/plans-thematiques/sante/", "« Supprimer les franchises médicales et les participations forfaitair
