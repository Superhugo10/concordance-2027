  <div class="row between"><button class="btn ghost" id="home">← Accueil</button><span class="eyebrow">Étape 1 sur 2</span></div>
  <header class="stack">
    <h1>Qu'est-ce qui compte le plus pour toi ?</h1>
    <p class="lead">Range ces 10 sujets du plus important (en haut) au moins important (en bas), puis indique à quel point ton sujet n°1 compte plus que ton n°10. Les sujets intermédiaires sont pondérés entre les deux.</p>
  </header>
  <ol class="rank" id="rank">
    ${S.order.map((tp,r)=>`<li class="${lastMoved===tp?"moved":""}">
      <span class="pos">${r+1}</span>
      <span>${esc(TOPICS[tp])}</span>
      <span class="w">×${weight(tp).toFixed(1).replace(".",",")}</span>
      <span class="arrows">
        <button data-r="${r}" data-d="-1" aria-label="Monter ${esc(TOPICS[tp])}" ${r===0?"disabled":""}>↑</button>
        <button data-r="${r}" data-d="1" aria-label="Descendre ${esc(TOPICS[tp])}" ${r===9?"disabled":""}>↓</button>
      </span></li>`).join("")}
  </ol>
  <section class="stack">
    <h3>À quel point ton sujet n°1 est-il plus important que ton n°10 ?</h3>
    <div class="scale" role="group" aria-label="Écart d'importance">
      ${[1,2,3,4,5].map(v=>`<button data-x="${v}" class="${S.ratio===v?"sel":""}" aria-pressed="${S.ratio===v}"><b>${v}</b><span>${v===1?"Aussi important":"×"+v}</span></button>`).join("")}
    </div>
    <p class="muted small">${S.ratio===1?"Tous les sujets comptent autant : le classement n'influence pas le résultat.":`Une question « ${esc(TOPICS[S.order[0]])} » comptera ${S.ratio} fois plus qu'une question « ${esc(TOPICS[S.order[9]])} ».`}</p>
  </section>
  <div class="row between">
    <span class="muted small">Tu pourras revenir modifier ce classement ; les résultats se recalculent.</span>
    <button class="btn primary" id="next">Valider et commencer le questionnaire</button>
  </div>`;
  app.querySelectorAll("#rank button").forEach(b=>b.onclick=()=>{
    const r=+b.dataset.r, t=r+(+b.dataset.d); const o=S.order; [o[r],o[t]]=[o[t],o[r]]; lastMoved=o[t]; save(); render();
    const nb=app.querySelector(`#rank li:nth-child(${t+1}) button[data-d="${b.dataset.d}"]`)||app.querySelector(`#rank li:nth-child(${t+1}) button:not([disabled])`); if(nb) nb.focus();
  });
  document.getElementById("home").onclick=()=>go("intro");
  app.querySelectorAll(".scale button").forEach(b=>b.onclick=()=>{S.ratio=+b.dataset.x; save(); render(); app.querySelector(`.scale button[data-x="${S.ratio}"]`).focus();});
  document.getElementById("next").onclick=()=>{lastMoved=null; S.i=0; go("quiz");};
}

function renderQuiz(){
  const L=qlist(); if(S.i>=L.length) S.i=L.length-1;
  const q=L[S.i], a=ans(q)||{};
  app.innerHTML=`
  <div class="stack">
    <div class="row between">
      <div class="row"><button class="btn ghost" id="home">← Accueil</button><button class="btn ghost" id="rk">Mes priorités</button></div>
      <span class="eyebrow">${S.mode==="express"?"Express · ":""}${S.i+1} / ${L.length}</span>
    </div>
    <div class="progress" aria-hidden="true"><i style="width:${(S.i/L.length)*100}%"></i></div>
  </div>
  <section class="stack" style="gap:18px">
    <span class="qtheme">${esc(TOPICS[q.tp])} · priorité n°${S.order.indexOf(q.tp)+1}</span>
    <div class="qrow">
      <p class="qtext">${esc(q.q)}</p>
      ${q.i?`<button class="info" id="info" aria-expanded="${!!S.showInfo}" aria-controls="infop" title="Qu'est-ce que c'est ?">i</button>`:""}
    </div>
    ${q.i?`<div class="infop" id="infop" ${S.showInfo?"":"hidden"}><b>De quoi parle-t-on ?</b><p>${esc(q.i)}</p></div>`:""}
    <div class="answers" role="group" aria-label="Ta réponse">
      ${[2,1,0,-1,-2].map(v=>`<button class="ans${a.v===v?" sel":""}" data-v="${v}"><span class="dot ${CLS(v)}"></span>${LBL[v]}</button>`).join("")}
    </div>
    <button class="blk${a.blk?" on":""}" id="blk" aria-pressed="${!!a.blk}" ${!a.blk&&nBlk()>=MAXBLK?"disabled":""}>
      <span class="box">${a.blk?"✓":""}</span>
      <span><b>Point bloquant pour moi <span class="muted">(${nBlk()}/${MAXBLK})</span></b><span>${!a.blk&&nBlk()>=MAXBLK?`Tu as déjà ${MAXBLK} points bloquants. Retire-en un en revenant sur la question concernée pour en ajouter un autre.`:"Ne change pas le score. Si un candidat défend la position contraire à la tienne sur cette mesure, il recevra un drapeau rouge. À activer avant de répondre."}</span></span>
    </button>
  </section>
  <div class="row between">
    <button class="btn" id="prev" ${S.i===0?"disabled":""}>Précédente</button>
    <div class="row">
      <button class="btn ghost" id="skip">Passer</button>
      ${answered()>=5?`<button class="btn" id="finish">Voir les résultats</button>`:""}
    </div>
  </div>`;
  const next=()=>{ S.showInfo=false; if(S.i<L.length-1){S.i++; save(); render(); scrollTo(0,0);} else go("results"); };
  app.querySelectorAll(".ans").forEach(b=>b.onclick=()=>{ S.a[q.id]={v:+b.dataset.v,blk:!!(S.a[q.id]&&S.a[q.id].blk)}; next(); });
  document.getElementById("blk").onclick=()=>{ const cur=S.a[q.id]||{v:null}; if(!cur.blk&&nBlk()>=MAXBLK) return; S.a[q.id]=Object.assign({},cur,{blk:!cur.blk}); save(); render(); document.getElementById("blk").focus(); };
  const ib=document.getElementById("info"); if(ib) ib.onclick=()=>{ const pnl=document.getElementById("infop"); pnl.hidden=!pnl.hidden; S.showInfo=!pnl.hidden; ib.setAttribute("aria-expanded",String(!pnl.hidden)); };
  document.getElementById("skip").onclick=()=>{ S.a[q.id]={v:null,blk:false}; next(); };
  document.getElementById("prev").onclick=()=>{ if(S.i>0){S.i--; save(); render();} };
  document.getElementById("home").onclick=()=>go("intro");
  document.getElementById("rk").onclick=()=>go("rank");
  const f=document.getElementById("finish"); if(f) f.onclick=()=>go("results");
}

function renderResults(){
  const R=score(), nA=answered();
  if(nA===0){ S.screen="intro"; return render(); }
  if(!S.fiche || !C.some(c=>c.id===S.fiche)) S.fiche=R[0].c.id;
  const nb=Object.values(S.a).filter(a=>a&&a.blk&&hasV(a)&&a.v!==0).length;
  app.innerHTML=`
  <header class="stack">
    <div class="row between">
      <span class="eyebrow">Version ${S.mode==="express"?"express":"complète"} · ${nA} réponse${nA>1?"s":""} · ${nb} point${nb>1?"s":""} bloquant${nb>1?"s":""} · écart de priorité ×${S.ratio}</span>
      <div class="row">
        <button class="btn ghost" id="rk">Mes priorités</button>
        ${S.mode==="express"?`<button class="btn" id="more">Continuer avec les ${Q.length-qlist().length} autres questions</button>`:""}
        <button class="btn ghost" id="edit">Modifier mes réponses</button>
        <button class="btn ghost" id="reset">Recommencer</button>
      </div>
    </div>
    <h1>Tes proximités</h1>
    <p class="lead">Concordance entre tes réponses, pondérées par tes priorités, et les positions sourcées de chaque candidat. Choisis un nom pour voir sa fiche détaillée.</p>
  </header>

  <section class="res">
    ${R.map((r,k)=>`
      <button class="resrow${r.c.id===S.fiche?" cur":""}" data-id="${r.c.id}">
        <span class="rk">${k+1}</span>
        <span class="nm"><b>${esc(r.c.n)} <small>· ${esc(r.c.p)}</small></b>
          <span class="bar"><i style="width:${r.pct??0}%"></i></span>
          <span class="meta">
            <span>Calculé sur ${r.n} question${r.n>1?"s":""}</span>
            ${r.conflicts.length?`<span class="pill">⚑ ${r.conflicts.length} drapeau${r.conflicts.length>1?"x":""} rouge${r.conflicts.length>1?"s":""}</span>`:""}
            ${r.unknown.length?`<span class="pill low">? ${r.unknown.length} point${r.unknown.length>1?"s":""} bloquant${r.unknown.length>1?"s":""} sans position connue</span>`:""}
            ${r.n<Math.max(5,nA*0.5)?`<span class="pill low">Peu de positions sourcées</span>`:""}
          </span></span>
        <span class="pct">${r.pct===null?"—":r.pct+" %"}</span>
      </button>`).join("")}
  </section>
  <p class="notice">Ce classement mesure une proximité d'idées sur des mesures précises, à partir de positions publiques encore provisoires. Ce n'est pas une consigne de vote.</p>

  <section class="fiche" id="fiche">${ficheHTML(R.find(r=>r.c.id===S.fiche),R)}</section>

  <details class="box">
    <summary>Tableau complet : toutes les positions, question par question</summary>
    <div class="legend" style="margin-top:12px">
      <span><i class="d v2"></i>Tout à fait d'accord</span><span><i class="d v1"></i>Plutôt d'accord</span><span><i class="d v0"></i>Neutre / nuancé</span><span><i class="d vm1"></i>Plutôt pas d'accord</span><span><i class="d vm2"></i>Pas du tout d'accord</span><span><i class="d vn"></i>Non sourcé / passé</span>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th class="q">Affirmation (clique un point pour sa source)</th><th class="vert">Toi</th>${R.map(r=>`<th class="vert" title="${esc(r.c.n)}">${esc(r.c.n.split(" ").slice(1).join(" "))}</th>`).join("")}</tr></thead>
      <tbody>${qlist().map(q=>{const a=ans(q), av=hasV(a)?a.v:null;
        return `<tr><td class="q" title="${esc(q.i)}"><div class="t">${esc(TOPICS[q.tp])}${a&&a.blk?" · bloquant":""}</div>${esc(q.q)}</td>
        <td class="you"><i class="d ${CLS(av)}" title="Toi : ${av===null?"passé":LBL[av]}"></i></td>
        ${R.map(r=>{const p=q.p[r.ci]; return `<td>${p?`<a href="${esc(p[1])}" target="_blank" rel="noopener" title="${esc(r.c.n)} : ${esc(CLBL(p[0],p[3]))} — ${esc(p[2])}"><i class="d ${CLS(p[0])}"></i></a>`:`<i class="d vn" title="${esc(r.c.n)} : position non sourcée"></i>`}</td>`}).join("")}</tr>`}).join("")}
      </tbody></table></div>
  </details>
  ${methodHTML()}`;

  app.querySelectorAll(".resrow").forEach(b=>b.onclick=()=>{ S.fiche=b.dataset.id; save(); render(); document.getElementById("fiche").scrollIntoView({behavior:"smooth",block:"start"}); });
  const sel=document.getElementById("fsel"); sel.onchange=()=>{S.fiche=sel.value; save(); render(); document.getElementById("fsel").focus();};
  document.getElementById("rk").onclick=()=>go("rank");
  document.getElementById("edit").onclick=()=>{S.i=0; go("quiz");};
  const mo=document.getElementById("more"); if(mo) mo.onclick=()=>{S.mode="full"; const L=qlist(); const f=L.findIndex(q=>!ans(q)); S.i=f<0?0:f; go("quiz");};
  document.getElementById("reset").onclick=()=>{S={screen:"intro",mode:"full",ratio:3,order:TOPICS.map((_,i)=>i),i:0,a:{},fiche:null}; save(); render(); scrollTo(0,0);};
}

function ficheHTML(r,R){
  const rank=R.indexOf(r)+1;
  const groups=[
    {t:"Alignés",d:"Même position",f:x=>x.diff===0,cls:"v2"},
    {t:"Proches",d:"Un cran d'écart",f:x=>x.diff===1,cls:"v1"},
    {t:"Mitigés",d:"Deux crans d'écart",f:x=>x.diff===2,cls:"v0"},
    {t:"Opposés",d:"Positions contraires",f:x=>x.diff>=3,cls:"vm2"}
  ];
  const byPrio=(x,y)=>S.order.indexOf(x.q.tp)-S.order.indexOf(y.q.tp);
  const item=x=>{const a=ans(x.q); return `<li>
      <span>${esc(x.q.q)}${a.blk?` <span class="pill">bloquant</span>`:""}</span>
      ${x.q.i?`<details class="mini"><summary>De quoi parle-t-on ?</summary><p>${esc(x.q.i)}</p></details>`:""}
      <span class="pp">Toi : ${esc(LBL[a.v].toLowerCase())} · ${esc(r.c.n.split(" ").slice(-1)[0])} : ${esc(CLBL(x.p[0],x.p[3]).toLowerCase())}</span>
      <span class="pp">${esc(x.p[2])} · <a class="src" href="${esc(x.p[1])}" target="_blank" rel="noopener">${esc(host(x.p[1]))}</a></span></li>`;};
  return `
    <div class="row between">
      <div class="stack" style="gap:4px">
        <span class="eyebrow">Fiche d'alignement · n°${rank} de ton classement</span>
        <h2>${esc(r.c.n)}</h2>
        <span class="muted small">${esc(r.c.p)} · ${esc(r.c.s)}</span>
      </div>
      <div class="stack" style="gap:6px;align-items:flex-end">
        <span class="pct" style="font-size:1.8rem">${r.pct===null?"—":r.pct+" %"}</span>
        <label class="small muted" for="fsel">Voir un autre candidat</label>
        <select id="fsel">${R.map(x=>`<option value="${x.c.id}"${x.c.id===r.c.id?" selected":""}>${esc(x.c.n)}</option>`).join("")}</select>
      </div>
    </div>
    ${flagsHTML(r)}
    <p class="small muted">Document de référence : ${r.c.prog&&r.c.prog.url?`<a href="${esc(r.c.prog.url)}" target="_blank" rel="noopener">${esc(r.c.prog.titre)}</a>`:"aucun programme consolidé publié"}. Comparaison sur ${r.n} des questions auxquelles tu as répondu.</p>

    <div class="stack">
      <h3>Proximité par sujet, dans l'ordre de tes priorités</h3>
      <div class="tbars">${S.order.map(tp=>{const t=r.topics[tp]; return `<div class="tbar"><span>${esc(TOPICS[tp])} <span class="muted small">${t?`(${t.n})`:""}</span></span><span class="bar"><i style="width:${t?t.pct:0}%"></i></span><span class="pct">${t?t.pct+" %":"—"}</span></div>`}).join("")}</div>
    </div>

    <div class="groups">${groups.map(g=>{const L=r.per.filter(g.f).sort(byPrio); return `
      <div class="grp"><h3><i class="d ${g.cls}"></i>${g.t} <span class="c">${L.length} · ${g.d.toLowerCase()}</span></h3>
        ${L.length?`<ul>${L.map(item).join("")}</ul>`:`<p class="muted small">Aucune question.</p>`}</div>`}).join("")}
    </div>`;
}

function flagsHTML(r){
  const blks=Q.filter(q=>{const a=ans(q); return a&&a.blk&&hasV(a)&&a.v!==0;});
  if(!blks.length) return `<p class="notice">Tu n'as marqué aucun point bloquant. Active « Point bloquant pour moi » sur une question (jusqu'à ${MAXBLK}) pour repérer les lignes rouges de chaque candidat.</p>`;
  const last=r.c.n.split(" ").slice(-1)[0];
  const okN=blks.length-r.conflicts.length-r.unknown.length;
  return `<div class="flags${r.conflicts.length?" bad":""}">
    <h3>${r.conflicts.length?`⚑ ${r.conflicts.length} drapeau${r.conflicts.length>1?"x":""} rouge${r.conflicts.length>1?"s":""} sur tes points bloquants`:"Aucun drapeau rouge sur tes points bloquants"}</h3>
    <p class="small muted">${blks.length} point${blks.length>1?"s":""} bloquant${blks.length>1?"s":""} : ${r.conflicts.length} en opposition, ${r.unknown.length} sans position connue, ${okN} compatible${okN>1?"s":""} ou nuancé${okN>1?"s":""}. Les drapeaux ne modifient pas le score.</p>
    ${r.conflicts.length?`<ul>${r.conflicts.map(({q,p})=>`<li><b>${esc(q.q)}</b>
      <span class="pp">Toi : ${esc(LBL[ans(q).v].toLowerCase())} · ${esc(last)} : ${esc(CLBL(p[0],p[3]).toLowerCase())}</span>
      <span class="pp">${esc(p[2])} · <a href="${esc(p[1])}" target="_blank" rel="noopener">Vérifier la source (${esc(host(p[1]))})</a></span></li>`).join("")}</ul>`:""}
    ${r.unknown.length?`<p class="small"><b>Position inconnue</b> sur : ${r.unknown.map(q=>esc(q.q)).join(" · ")}</p>`:""}
  </div>`;
}

function methodHTML(){
  const nCodes=Q.reduce((s,q)=>s+q.p.filter(Boolean).length,0);
  return `
  <section class="stack">
    <h2>Méthode et limites</h2>
    <div class="stack small">
      <p><b>Calcul.</b> Chaque réponse va de −2 à +2. Sur une question, la proximité vaut 100 % si ta position et celle du candidat sont identiques, 75 % pour un cran d'écart, et 0 % si elles sont opposées. Le score est la moyenne pondérée de ces proximités : le poids dépend du rang du sujet dans ton classement : ×1 pour le n°10, jusqu'à l'écart que tu as choisi (×1 à ×5) pour le n°1, avec une progression régulière entre les deux. Les points bloquants (5 au maximum) ne modifient pas le score : quand un candidat est opposé à toi sur l'un d'eux (écart de 3 ou 4 crans), il reçoit un drapeau rouge, avec la source pour vérifier. Un point bloquant sur lequel sa position n'est pas sourcée est signalé comme « position inconnue ».</p>
      <p><b>Sources.</b> Les ${nCodes} positions viennent de sources primaires : programmes et sites officiels des candidats et des partis, programmes 2022 et législatives 2024, votes au Parlement, et déclarations publiées dans la presse de référence. Les agrégateurs et les sites de comparaison non officiels ont été exclus. Chaque position renvoie à sa source dans la fiche et dans le tableau. Quand aucune position propre n'a été trouvée pour un candidat de gauche, on a repris le programme du Nouveau Front populaire de 2024 qu'il a signé ; la note l'indique (« NFP 2024 »).</p>
      <p><b>Positions manquantes.</b> Quand aucune source n'a été trouvée, la question est simplement retirée du calcul pour ce candidat : son score est la moyenne sur les seules questions où sa position est connue, il n'est donc ni pénalisé ni avantagé par un silence. Quand le candidat ne s'est pas exprimé personnellement, on utilise d'abord la position de son parti ou le vote de son groupe parlementaire (indiqué dans la note). Quand la position n'est que déduite d'une prise de position voisine, elle est marquée « position déduite » et ne compte que pour moitié. Les questions sourcées pour moins de 4 candidats ne sont pas affichées. Un score calculé sur peu de questions est moins fiable : chaque ligne du classement indique sur combien de tes réponses il repose.</p>
      <p><b>Neutralité.</b> Aucune couleur de parti, candidats par ordre alphabétique, affirmations formulées tantôt dans un sens, tantôt dans l'autre. Le codage a été préparé avec l'aide d'une IA à partir des documents cités : vérifie les sources qui comptent pour toi. Dernière mise à jour : ${MAJ}.</p>
    </div>
    <details class="box"><summary>Documents de référence par candidat</summary>
      <ul class="sources">${C.map(c=>`<li><b>${esc(c.n)}</b> : ${c.prog&&c.prog.url?`<a href="${esc(c.prog.url)}" target="_blank" rel="noopener">${esc(c.prog.titre)}</a>`:"aucun document consolidé"}</li>`).join("")}</ul>
    </details>
  </section>`;
}

render();
</script>

</body></html>
