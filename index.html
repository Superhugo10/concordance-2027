const Q=[{"id": "R1", "tp": 1, "q": "L'âge légal de départ à la retraite doit être ramené à 62 ans ou moins.", "k": 1, "i": "L'âge légal est l'âge minimum pour partir à la retraite. La réforme de 2023 l'a porté progressivement de 62 à 64 ans ; son application a été suspendue fin 2025 jusqu'après la présidentielle. Ramener l'âge à 62 ans ou moins coûterait plusieurs milliards par an à financer.", "p": [[2, "https://www.lutte-ouvriere.org/journal/article/2022-04-06-nathalie-arthaud-la-lutte-de-classe-est-notre-boussole_251898.html", "« Pas seulement pour assurer la retraite à 60 ans » : se battre au-delà (meeting Arthaud, avril 2022)"], [-1, "https://attalpresident.fr/programme/travail-salaires", "Miser sur la durée de cotisation plutôt que sur l'âge de départ (programme, 2026)"], [-2, "https://www.europe1.fr/politique/retraites-je-crains-le-divorce-entre-le-gouvernement-et-les-francais-previent-xavier-bertrand-4165868", "« beaucoup de Français peuvent partir à 64 ans, mais pas tous » ; « La seule solution c'est de bosser un peu plus longtemps » (Europe 1, février 2023). Déduit : refus de ramener l'âge de départ sous 64 ans. Il dit aussi qu'une réforme juste doit permettre aux personnes « usées physiquement » de partir plus tôt (L'Observateur, octobre 2022), ce qui ne vise pas un âge général de 62 ans.", 1], null, [0, "https://www.europe1.fr/politique/presidentielle-2027-nicolas-dupont-aignan-promet-de-decoloniser-la-france-en-sortant-de-lue-1089125", "Âge de départ à 62 ans et 9 mois, pas de retour à 62 ans (AFP, sept. 2026)"], [2, "https://lcp.fr/actualites/glucksmann-face-a-royal-divisions-sur-lfi-lycees-ce-qu-il-faut-retenir-du-dernier-debat", "« On ne pourra pas faire 60 ans, ce sera 62 ans » (2026)"], [-1, "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "« Au 1er janvier 2028, l'âge légal sera aux alentours de 63 ans. » Il ne reviendrait pas à 62 ans (entretien au Point, rapporté par LCP, 27 aoû ": 1, "i": "Aujourd'hui, la retraite de base fonctionne par répartition : les cotisations des actifs paient les pensions des retraités. La capitalisation consiste à placer une partie des cotisations de chacun sur les marchés financiers pour financer sa propre retraite future.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure_caravane_2026-01_-_couleur.pdf", "2026 : dénonce le projet RN de capitalisation"], [2, "https://attalpresident.fr/actualites/gabriel-attal-rassemblement-eviter-second-tour-rn-lfi-hausse-salaires", "Retraites « reposant davantage sur la durée de cotisation et l'introduction d'une part de capitalisation » (2 nov. 2026)"], [1, "https://lcp.fr/actualites/presidentielle-xavier-bertrand-indique-tester-ses-idees-et-envisager-de-concourir-en", "Résumé journalistique de son projet : « défense de la retraite par capitalisation » (LCP, août 2026). Formulation de la journaliste, non verbatim ; le périmètre (système obligatoire ou non) n'est pas précisé.", 1], null, [1, "https://www.lejdd.fr/politique/presidentielle-nicolas-dupont-aignan-officialise-sa-candidature-et-fait-le-pari-du-frexit-183876", "Livret de 10 000 € par nouveau-né, « minimum retraite par capitalisation » (sept. 2026)"], null, [2, "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "Veut « ajouter une part de capitalisation » contrôlée par les partenaires sociaux (bonnes feuilles de son livre, relayées par LCP, 27 août 2026)"], [1, "https://www.lejdd.fr/politique/lycees-bardella-presidentielle-ce-quil-faut-retenir-de-linterview-de-marine-le-pen-sur-cnews-186144", "Réforme des retraites avec un « pilier de capitalisation », détails le 17 nov. (CNews, oct. 2026)"], [2, "https://www.unenouvelleenergie.fr/questions/que-pense-david-lisnard-du-systeme-de-retraite-par-repartition/", "« il faut qu’il y ait un régime de retraite par capitalisation obligatoire » (franceinfo, oct. 2024, cité sur le site ; date antérieure à 2025)"], null, [2, "https://www.publicsenat.fr/actualites/politique/reculer-ou-avancer-lage-legal-avec-ou-sans-capitalisation-ce-que-proposent-les-principaux-candidats-a-lelection-presidentielle-sur-les-retraites", "Fonds collectif obligatoire par capitalisation (2026)"], [2, "https://lcp.fr/actualites/retraites-bruno-retailleau-veut-un-age-minimal-de-depart-a-63-ans-et-un-taux-plein-a-65", "Capitalisation 25-30 % pour les jeunes entrants (2026)"], [-2, "https://assets.nationbuilder.com/pcf/pages/36196/attachments/original/1766073347/document_-_cahier_se%CC%81cu_v2.pdf?1766073347", "Cahier PCF 2025 : capitalisation, « système cannibale »"], null, null, [1, "https://lafrancehumaniste.fr/articles/protection-sociale.html", "« une part d'épargne retraite obligatoire, défiscalisée et avec des intérêts à 5 % garantis par l'État » (une des pistes, via le fonds souverain ; chronique Vers une protection sociale rénovée, déc. 2025)"], [2, "https://www.europe1.fr/politique/en-direct-immigration-pouvoir-dachat-narcotrafic-ce-quil-faut-retenir-de-linterview-deric-zemmour-dans-la-france-en-face-936419", "« Injecter une partie de capitalisation » dans la répartition (Europe 1, 2025)"]]}, {"id": "R3", "tp": 1, "q": "Aucune pension pour une carrière complète ne doit être inférieure au SMIC.", "k": 0, "i": "Le minimum contributif garantit un plancher aux personnes ayant cotisé toute leur carrière, mais il reste inférieur au SMIC net (environ 1 400 €). La mesure porterait toutes les pensions de carrière complète au moins à ce niveau.", "p": [null, null, null, null, null, null, null, null, null, [2, "https://melenchon2027.fr/programme-partage/chapitre-8/", "2026 : pensions a minima au niveau du SMIC revalorisé"], null, null, [2, "https://www.pcf.fr/ue_26_discours_fr", "Aucune retraite sous le SMIC (université d'été, août 2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Minimum contributif aligné sur surance-chômage » (chronique Un nouveau monde du travail, déc. 2025 ; durée non citée)", 1], null]}, {"id": "R6", "tp": 1, "q": "La lutte contre la fraude sociale doit être une priorité, quitte à durcir les contrôles des allocataires.", "k": 0, "i": "La fraude sociale désigne les prestations versées à tort de manière intentionnelle (fausses déclarations de ressources, d'adresse, arrêts de travail fictifs…). Elle est estimée à plusieurs milliards d'euros par an, à comparer à la fraude fiscale et aux cotisations non versées par certaines entreprises.", "p": [null, [1, "https://www.maire-info.com/fraude-sociale-un-vaste-plan-avec-une-mesure-phare-fusionner-carte-vitale-et-carte-d'identite-article2-27553", "Ministre : plan antifraude sociale, conditions de résidence durcies (AFP, 2023)"], null, null, [2, "https://www.debout-la-france.fr/projet/economie-travail/", "Renforcer les contrôles contre la fraude sociale, objectif 20 Md€"], null, [-1, "https://www.assemblee-nationale.fr/dyn/17/scrutins/6319", "CONTRE l'ensemble du projet de loi relatif à la lutte contre les fraudes sociales et fiscales (CMP) (scrutin n°6319, 5 mai 2026). Voir aussi CONTRE en 1re lecture (scrutin n°6023, 7 avr. 2026)", 1], [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Ministère dédié à la lutte contre la fraude (2024)"], null, null, [1, "https://lcp.fr/index%2Ephp/actualites/chomage-edouard-philippe-veut-abaisser-la-duree-d-indemnisation-a-douze-mois-maximum", "Veut « mettre fin à l'open bar » des arrêts maladie (2026)"], [1, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "5 Md€ attendus de la lutte contre la fraude (2026)"], null, null, null, [2, "https://lafrancehumaniste.fr/articles/protection-sociale.html", "« Désormais, la tolérance doit être nulle, les contrôles renforcés et mieux coordonnés » (chronique Vers une protection sociale rénovée, déc. 2025 ; CORRECTION : passe de 1 à 2)"], [2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : lutte contre la fraude sociale (2026)"]]}, {"id": "R7", "tp": 1, "q": "Les allocations familiales doivent être versées dès le premier enfant.", "k": 0, "i": "Les allocations familiales ne sont versées qu'à partir du deuxième enfant, et leur montant dépend des revenus depuis 2015. Les verser dès le premier enfant est présenté comme une mesure de soutien à la natalité.", "p": [null, null, null, null, null, null, null, null, null, [1, "https://www.assemblee-nationale.fr/dyn/17/amendements/0325/CION-SOC/AS1174.pdf", "Groupe LFI : amendement (rejeté) demandant un rapport sur « l'opportunité d'un versement des allocations familiales dès le premier enfant » (2024)", 1], [2, "https://www.edouardphilippe.fr/actualites/trois-principales-annonces-dedouard-philippe-a-lheure-de-verite", "Allocation familiale unique de 350 € par mois dès le premier enfant (L'Heure de vérité, oct. 2026)"], [2, "https://republicains.fr/wp-content/uploads/2026/05/LR_Famille_vFinale.pdf", "Revenu familial versé « dès le premier enfant » (LR, 2026)"], [2, "https://www.assemblee-nationale.fr/17/pdf/propositions/pion1342.pdf", "2025 : PPL GDR, allocations familiales dès le premier enfant"], null, [2, "https://lesecologistes.fr/document/1zrfjEXlD1ZXUpT2K7sLiu/livret-enfance-vf.pdf", "Allocations familiales : « attribuer un même montant dès le premier enfant » (livret enfance, sept. 2026)"], null, null]}, {"id": "R9", "tp": 1, "q": "L'âge légal de départ à la retraite doit être ramené à 60 ans.", "k": 1, "i": "L'âge légal est aujourd'hui de 62 ans et 9 mois pour les générations qui partent en 2026, la hausse vers 64 ans étant suspendue jusqu'après la présidentielle. Revenir à 60 ans, l'âge en vigueur de 1982 à 2010, coûterait nettement plus cher que revenir à 62 ans.", "p": [[2, "https://www.lutte-ouvriere.org/journal/article/2022-04-06-nathalie-arthaud-la-lutte-de-classe-est-notre-boussole_251898.html", "« Pas seulement pour assurer la retraite à 60 ans » : se battre au-delà (meeting Arthaud, avril 2022 ; rien de plus récent trouvé)"], [-1, "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "« L'âge légal, ce n'est plus le débat, il faut changer de système de retraites » (meeting de Paris, Public Sénat, mai 2026)"], [-2, "https://www.europe1.fr/politique/retraites-je-crains-le-divorce-entre-le-gouvernement-et-les-francais-previent-xavier-bertrand-4165868", "« La seule solution c'est de bosser un peu plus longtemps » (Europe 1, février 2023). Déduit : opposé à une retraite à 60 ans.", 1], [-1, "https://lcp.fr/actualites/presidentielle-pour-bernard-cazeneuve-lfi-n-est-pas-en-situation-de-gouverner-439773", "« la durée de cotisation est le levier le plus juste » (LCP, propos rapportés du 20 juillet 2026, juillet 2026)", 1], [-2, "https://www.europe1.fr/politique/retraites-nicolas-dupont-aignan-veut-une-capitalisation-publique-1138481", "Veut « rester là où on en est, c'est-à-dire 62 ans et 9 mois », pas de retour à 60 ans (Europe 1, oct. 2026)"], [-2, "https://www.publicsenat.fr/actualites/politique/fiscalite-ecole-immigration-ce-que-propose-raphael-glucksmann", "S'oppose au retour à 60 ans : « Ceux qui ont une espérance de vie en bonne santé plus longue doivent en revanche partir plus tard » (Public Sénat, août 2026)"], [-2, "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "Déduite : refuse le retour à 62 ans et fixe l'âge légal « aux alentours de 63 ans » (LCP, 27 août 2026)", 1], [-1, "https://www.publicsenat.fr/actualites/politique/au-rn-la-reforme-des-retraites-divise-jordan-bardella-et-marine-le-pen-sur-le-programme-pour-la-presidentielle-2027", "Retour à 62 ans, 60 ans seulement pour les carrières longues, mesure qui « reste d'actualité » (RTL, mai 2026)"], [-2, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« la norme de l’âge légal de 65 ans est un impératif national urgent » (programme, date non indiquée sur la page) ; il veut au contraire relever l’âge à 65 ans"], [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "Abroger la réforme Borne puis retour à la retraite à 60 ans avec 40 annuités sur le mandat (plan budgétaire, oct. 2026)"], [-2, "https://www.publicsenat.fr/actualites/politique/reculer-ou-avancer-lage-legal-avec-ou-sans-capitalisation-ce-que-proposent-les-principaux-candidats-a-lelection-presidentielle-sur-les-retraites", "Vise « un âge légal de départ à 65 ans » en moins de dix ans (vidéo de campagne, sept. 2026)"], [-2, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Départ possible dès 63 ans avec décote, taux plein à 65 ans, à l'opposé d'un retour à 60 ans (plan d'économies, Public Sénat, oct. 2026)"], [2, "https://www.pcf.fr/objectif_1", "Programme PCF : « Une loi rétablira la retraite à 60 ans, à taux plein » (programme Jours heureux, toujours en ligne)"], [2, "https://nouspresident.fr/statut-travailleurs-essentiels/", "Cahier de campagne : « la retraite à 60 ans » (cahier travailleurs essentiels, juin 2026)"], [1, "https://fr.finance.yahoo.com/actualites/presidentielle-2027-proposent-candidats-retraite-120000835.html", "« L'objectif d'un départ à 60 ans, en priorité pour les personnes ayant commencé à travailler tôt », modalités à préciser (Capital, sept. 2026)"], null, [-2, "https://www.europe1.fr/politique/la-france-en-face-on-va-etre-oblige-de-travailler-plus-longtemps-declare-eric-zemmour-936434", "« On ne peut pas avoir la retraite à 60 ans, ce n'est pas raisonnable » (Europe 1/CNews, mai 2026)"]]}, {"id": "T1", "tp": 0, "q": "Il faut augmenter fortement le SMIC (vers 1 600 € net ou plus).", "k": 1, "i": "Le SMIC est le salaire minimum légal. Il est d'environ 1 430 € net par mois pour un temps plein en 2026. Le porter à 1 600 € net ou plus est une hausse de plus de 10 %, que ses opposants jugent risquée pour l'emploi dans les petites entreprises.", "p": [[2, "https://www.lutte-ouvriere.org/portail/brochures/meeting-26-septembre-2026-discours-nathalie-arthaud-197446.html", "2026 : « SMIC à 2 200 € nets »"], null, null, null, null, [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "SMIC à 1 600 € net en deux ans (Acte I PP)"], null, [-1, "https://www.europe1.fr/politique/marine-le-pen-contre-une-augmentation-du-smic-si-elle-est-elue-2960186", "Contre une hausse du SMIC, « charge supplémentaire » pour les entreprises (2017)"], null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "SMIC à 1 700 € net (plan budgétaire, oct. 2026)"], null, null, [2, "https://www.pcf.fr/ue_26_discours_fr", "SMIC à 1 700 € net, +5 % pour tous les salaires (université d'été, août 2026)"], [2, "https://nouspresident.fr/statut-travailleurs-essentiels/", "Cahier campagne : « le SMIC à 1 600 € » (2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : SMIC net à 1 600 €"], null, null]}, {"id": "T2", "tp": 0, "q": "Il faut passer à la semaine de 32 heures.", "k": 0, "i": "La durée légale du travail est de 35 heures par semaine : au-delà, les heures sont payées en heures supplémentaires. Passer à 32 heures, sans baisse de salaire selon ses partisans, reviendrait à généraliser la semaine de quatre jours.", "p": [[1, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "2026 : baisser le temps de travail sans perte de salaire"], null, null, null, null, null, null, null, null, [1, "https://melenchon2027.fr/synthese-des-contributions/", "« Passer aux 32 heures de travail par semaine pour les métiers pénibles » (programme, juil. 2026)"], null, [-2, "https://www.publicsenat.fr/actualites/politique/la-fete-est-finie-bruno-retailleau-veut-supprimer-les-35-heures-inciter-a-la-reprise-dactivite-et-plafonner-les-aides-sociales-pour-relancer-lemploi", "Veut sortir des 35 heures et allonger la durée annuelle (2026)"], [2, "https://www.pcf.fr/objectif_1", "Programme PCF : 32 heures sans diminution de salaire"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : 32 h seulement métiers pénibles ou de nuit"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : 32 h seulement métiers pénibles ou de nuit"], null, null]}, {"id": "T3", "tp": 0, "q": "Il faut assouplir ou supprimer les 35 heures.", "k": 1, "i": "Les 35 heures, instaurées en 2000, fixent le seuil à partir duquel les heures sont majorées. Les assouplir permettrait de travailler plus longtemps sans payer ces majorations, ou de négocier la durée entreprise par entreprise.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "2026 : baisser le temps et la charge de travail"], [1, "https://attalpresident.fr/programme/travail-salaires", "« Constitution du travail » : organisation fixée par branche et entreprise, fin du plafond de 220 h sup (2026)"], null, null, null, null, null, [-1, "https://www.europe1.fr/politique/35-heures-retraite-a-60-ans-robert-menard-compare-marine-le-pen-a-un-leader-de-la-cgt-3418643", "Maintien des 35 h légales, dérogations par accords de branche (2017)"], [1, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« mener l’assouplissement des règles du Code du Travail » (programme, date non indiquée) ; les 35 heures ne sont pas nommées", 1], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : rétablir la durée effective de 35 heures"], [2, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "« Fixer librement le temps de travail pour sortir des 35h » (programme, 2026)"], [2, "https://www.publicsenat.fr/actualites/politique/la-fete-est-finie-bruno-retailleau-veut-supprimer-les-35-heures-inciter-a-la-reprise-dactivite-et-plafonner-les-aides-sociales-pour-relancer-lemploi", "Sortir des 35 heures par annualisation (2026)"], [-2, "https://www.pcf.fr/objectif_1", "Programme PCF : semaine de 32 heures"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Retour effectif aux 35 heures"], [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Retour effectif aux 35 heures"], [1, "https://lafrancehumaniste.fr/articles/un-nouveau-monde-du-travail.html", "« sortir de la cote unique et de tenir compte des exigences particulières de certains métiers » (chronique Un nouveau monde du travail, déc. 2025 ; question posée à propos des 35 heures et des heures sup, pas de suppression explicite)", 1], null]}, {"id": "T4", "tp": 0, "q": "Les heures supplémentaires doivent être exonérées d'impôts et de cotisations.", "k": 1, "i": "Les heures supplémentaires sont aujourd'hui exonérées d'impôt sur le revenu jusqu'à environ 7 500 € par an et partiellement de cotisations salariales. La mesure étendrait ces exonérations, ce qui augmente le salaire net mais réduit les recettes publiques.", "p": [null, null, null, null, [2, "https://www.debout-la-france.fr/projet/economie-travail/", "Heures au-delà de 1 607 h/an défiscalisées « dans la limite de 300 heures/an », sans cotisations salariales (projet DLF, nov. 2026)"], null, null, [1, "https://rassemblementnational.fr/documents/WEB-GRN-LIVRET-ENTREPRISE.pdf", "Stabiliser défiscalisation et désocialisation des heures sup"], null, [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : soumettre les heures supplémentaires à cotisation"], [2, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "Heures en plus exonérées de cotisations et d'impôt sur le revenu (programme, 2026)"], [2, "https://www.publicsenat.fr/actualites/politique/la-fete-est-finie-bruno-retailleau-veut-supprimer-les-35-heures-inciter-a-la-reprise-dactivite-et-plafonner-les-aides-sociales-pour-relancer-lemploi", "« Zéro cotisation et zéro impôt » au-delà de 1 607 h (2026)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 (signé PCF) : heures sup soumises à cotisation"], [-1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Soumettre heures sup à cotisations"], [-1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Soumettre heures sup à cotisations"], null, [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Heures sup totalement exonérées d’impôts et de charges (2022)"]]}, {"id": "T6", "tp": 0, "q": "Les salariés doivent avoir beaucoup plus de sièges dans les conseils d'administration.", "k": 0, "i": "Dans les grandes entreprises, les salariés ont aujourd'hui un ou deux représentants au conseil d'administration, qui décide de la stratégie. En Allemagne (codétermination), ils peuvent occuper jusqu'à la moitié des sièges.", "p": [null, null, null, null, [1, "https://www.debout-la-france.fr/projet/economie-travail/", "Baisse d’IS pour entreprises ouvrant leur CA aux salariés"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Plus de salariés aux CA dès 100 salariés (Acte I PP)"], null, null, null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "Salariés à « au moins un tiers » des instances de décision des grandes entreprises (programme, juil. 2026)"], null, null, [2, "https://www.pcf.fr/fete_de_lhumanite_2026_discours_de_fabien_roussel", "Autant d'administrateurs salariés que d'actionnaires (Fête de l'Huma, sept. 2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Un tiers des sièges d'administrateurs aux salariés"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Un tiers des sièges d'administrateurs aux salariés"], [2, "https://lafrancehumaniste.fr/articles/la-rupture-du-pacte-social.html", "« une plus grande participation des salariés aux résultats de l'entreprise et à ses décisions » (chronique La rupture du pacte social, déc. 2025 ; reprise dans la chronique Un nouveau monde du travail)"], null]}, {"id": "T7", "tp": 0, "q": "La participation et l'intéressement doivent être étendus à toutes les entreprises.", "k": 0, "i": "", "p": [null, [2, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "Tout employeur doit proposer intéressement, participation ou prime (convention, 2025)"], null, null, [1, "https://www.debout-la-france.fr/projet/economie-travail/", "« Participation gaullienne » encouragée par baisse d’IS"], null, null, null, null, null, null, null, null, null, null, [1, "https://lafrancehumaniste.fr/articles/un-nouveau-monde-du-travail.html", "« L'une des voies serait la généralisation de l'actionnariat salarial en nom collectif » (chronique Un nouveau monde du travail, déc. 2025 ; présentée comme une voie, non comme mesure chiffrée)"], [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Participation étendue aux entreprises de plus de 11 salariés (2022)"]]}, {"id": "T8", "tp": 0, "q": "Les salaires doivent être indexés automatiquement sur l'inflation.", "k": 0, "i": "Indexer les salaires sur l'inflation signifie les augmenter automatiquement quand les prix montent, comme c'est déjà le cas pour le SMIC. Cette « échelle mobile des salaires » existait en France jusqu'en 1983.", "p": [[2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure_caravane_2026-01_-_couleur.pdf", "2026 : « quand les prix montent, notre salaire doit suivre »"], null, null, null, [1, "https://www.debout-la-france.fr/projet/economie-travail/", "Réindexer pensions et traitements des fonctionnaires sur l’inflation"], [0, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Seul le point d'indice indexé sur l'inflation (Acte I PP)"], null, null, null, [2, "https://melenchon.fr/2026/11/07/grand-meeting-du-bourget-notre-programme-de-gouvernement/", "« augmenter le SMIC, indexer les salaires sur l'inflation » (discours du Bourget, 7 nov. 2026)"], null, null, [2, "https://www.pcf.fr/ue_26_discours_fr", "Rétablir l'échelle mobile des salaires (université d'été, août 2026)"], [2, "https://nouspresident.fr/statut-travailleurs-essentiels/", "« Nous indexerons les salaires sur l'inflation » (2026)"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Indexation des salaires sur l'inflation"], null, null]}, {"id": "T9", "tp": 0, "q": "Les Français doivent travailler davantage dans l'année (suppression d'un jour férié, par exemple) pour financer les dépenses publiques.", "k": 1, "i": "La France compte 11 jours fériés. En 2025, le gouvernement Bayrou a proposé d'en supprimer deux pour financer le budget, avant d'y renoncer. La journée de solidarité (lundi de Pentecôte) fonctionne déjà sur ce principe.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/evenement/fichiers/2025/07/Tract_fête_Lyon_2025.pdf", "2025 : dénonce la feuille de route Bayrou « nous faire travailler plus »"], null, null, null, null, null, null, [-2, "https://www.publicsenat.fr/actualites/politique/francois-bayrou-pret-a-renoncer-a-la-suppression-de-deux-jours-feries-sous-condition-de-propositions-alternatives", "Le RN dénonce la suppression de deux jours fériés, « une attaque directe contre la France du travail » (Public Sénat, sept. 2025)"], [1, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« les incitations à travailler davantage doivent stimuler la capacité de croissance française » (programme, date non indiquée) ; jour férié non cité", 1], [-2, "https://lcp.fr/actualites/ces-nouveaux-jours-feries-que-lfi-voudrait-voir-instaures-434818", "Groupe LFI : propose sept nouveaux jours fériés, « priver un seul salarié d'un jour férié » refusé (LCP, avr. 2026)"], [1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-du-conseil-national-a-reims-10-mai-2026/", "« Travailler collectivement un peu plus et un peu plus longtemps » (2026)"], [0, "https://www.publicsenat.fr/actualites/politique/la-fete-est-finie-bruno-retailleau-veut-supprimer-les-35-heures-inciter-a-la-reprise-dactivite-et-plafonner-les-aides-sociales-pour-relancer-lemploi", "1 623 h annuelles, deux jours de plus mais rémunérés (2026)"], [-2, "https://www.pcf.fr/moyen_2", "2025 : propose d'instaurer un jour férié national supplémentaire"], [-2, "https://www.brut.media/fr/articles/france/politique/budget-les-oppositions-menacent-de-censure-le-gouvernement-la-macronie-salue-un-moment-de-courage", "Dénonce « jours fériés sacrifiés », promet la censure (AFP, 2025)"], [-1, "https://www.brut.media/fr/articles/france/politique/budget-les-oppositions-menacent-de-censure-le-gouvernement-la-macronie-salue-un-moment-de-courage", "Critique la suppression du 8 mai férié (AFP, 2025)"], null, [1, "https://www.europe1.fr/politique/en-direct-immigration-pouvoir-dachat-narcotrafic-ce-quil-faut-retenir-de-linterview-deric-zemmour-dans-la-france-en-face-936419", "« Il faut globalement travailler plus », cotiser 44-46 ans (2025)"]]}, {"id": "T10", "tp": 0, "q": "Il faut baisser les cotisations payées par les salariés pour augmenter le salaire net.", "k": 1, "i": "Sur un salaire brut, le salarié paie environ 22 % de cotisations et de CSG, qui financent la retraite, la santé et le chômage. Les baisser augmente le salaire net, mais il faut compenser les recettes perdues par d'autres impôts ou par des économies.", "p": [null, [2, "https://attalpresident.fr/actualites/gabriel-attal-rassemblement-eviter-second-tour-rn-lfi-hausse-salaires", "« Aller droit au brut » en baissant les charges sur les salaires (2 nov. 2026)"], null, null, null, [2, "https://lcp.fr/actualites/glucksmann-face-a-royal-divisions-sur-lfi-lycees-ce-qu-il-faut-retenir-du-dernier-debat", "Financer par la taxe sur les méga-héritages « une réduction de la CSG sur les salaires » pour augmenter le net (débat de la primaire, LCP, oct. 2026)"], [2, "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "Veut « rapprocher le salaire net du brut » en baissant les cotisations salariales (LCP, 27 août 2026)"], null, [2, "https://www.unenouvelleenergie.fr/david-lisnard-sur-cnews-et-europe-1-je-ne-suis-pas-candidat-pour-un-poste-je-viens-pour-redresser-le-pays/", "« Cotiser moins pour gagner plus. » : baisse de la CSG sur revenus d’activité de 9,2 % à 6,6 % pour augmenter le salaire net (CNEWS/Europe 1, 27 oct. 2026) ; CSG et non cotisations salariales au sens strict", 1], null, [1, "https://www.publicsenat.fr/actualites/emploi/presidentielle-le-regain-dinteret-pour-la-tva-sociale-idee-clivante-pour-augmenter-le-salaire-net", "Élargir le financement de la protection sociale, indispensable « si on veut ramener le brut proche du net » (débat présidentiel, août 2026)"], null, [-1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : « Augmenter de 0,25 point par an pendant 5 ans les cotisations vieillesse » ; hausse des salaires par l'employeur plutôt que baisse des cotisations"], null, null, [2, "https://lafrancehumaniste.fr/programme/economie.html", "« Plus de 200 Md€ de cotisations basculés vers une CSG universelle » (proposition 1, programme économique, 2026, date non affichée)"], null]}, {"id": "T11", "tp": 0, "q": "L'État doit bloquer ou plafonner les prix des produits de première nécessité (alimentation, énergie).", "k": 0, "i": "Bloquer les prix consiste à interdire par décret de dépasser un certain prix, ou à plafonner les marges, pour une liste de produits essentiels. Cela a été fait en France pour l'électricité et le gaz en 2022-2023 (bouclier tarifaire). Ses opposants craignent des pénuries ou un coût pour les finances publiques.", "p": [[1, "https://www.lutte-ouvriere.org/portail/brochures/meeting-26-septembre-2026-discours-nathalie-arthaud-197446.html", "Arthaud : « obliger Total à vendre son carburant à prix coûtant » (meeting, 26 sept. 2026)", 1], null, null, null, null, null, null, null, null, [2, "https://melenchon.fr/2026/11/07/grand-meeting-du-bourget-notre-programme-de-gouvernement/", "Il faut « bloquer les prix » (discours du Bourget, 7 nov. 2026)"], null, null, [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : « Bloquer les prix des biens de première nécessité dans l'alimentation, l'énergie et les carburants par décret »"], null, [1, "https://lesecologistes.fr/document/2jMAmmuTuvrct5nbKLuPd2/dp-bouclier-social-pour-envoi.pdf", "« Bloquer les prix des produits alimentaires qui subiraient une inflation anormale » (bouclier social, sept. 2026)"], null, null]}, {"id": "F2", "tp": 2, "q": "Il faut réduire fortement les dépenses publiques (plus de 100 milliards d'euros d'économies sur le quinquennat).", "k": 1, "i": "La dépense publique représente environ 57 % de la richesse produite en France, l'un des niveaux les plus élevés d'Europe. La réduire fortement passe par des économies sur les services publics, les prestations sociales ou les effectifs de fonctionnaires (environ 5,7 millions).", "p": [[-2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure_caravane_2026-01_-_couleur.pdf", "2026 : milliards pour hôpitaux, écoles ; embauches massives"], [2, "https://attalpresident.fr/actualites/gabriel-attal-vision-economique-liberer-innover-independance-france", "« 150 milliards d'euros d'économies sur cinq ans » et règle d'or dans la Constitution (vision économique, 28 oct. 2026)"], null, null, [1, "https://www.debout-la-france.fr/projet/economie-travail/", "« Économiser 40 milliards par an au terme de 5 ans » sur l'État, plus 20 Md€ attendus de la fraude sociale et 20 Md€ de la fraude fiscale (projet DLF, nov. 2026)", 1], null, null, [2, "https://www.europe1.fr/politique/budget-2027-marine-le-pen-promet-140-milliards-deuros-nets-deconomies-dici-2032-pour-eviter-a-la-france-le-defaut-de-paiement-1126400", "« 140 milliards d'euros nets d'économie » d'ici 2032, mais avec 30 Md€ de baisses d'impôts (contre-budget, oct. 2026)"], [2, "https://www.unenouvelleenergie.fr/david-lisnard-sur-cnews-et-europe-1-je-ne-suis-pas-candidat-pour-un-poste-je-viens-pour-redresser-le-pays/", "« 80 milliards d’euros d’économies dès la première année » puis 200 milliards à l’horizon 2032 (résumé fidèle, CNEWS/Europe 1, 27 oct. 2026) ; voir aussi i24NEWS, juin 2026 : « On doit baisser la dépense publique dès la première année »"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "2026 : refuse les coupes, veut restaurer les services publics"], [1, "https://www.sudradio.fr/societe/a-lheure-de-verite-philippe-ebauche-une-france-a-nouveau-commandee-et-gouvernee", "Déficit ramené « en dessous de la barrière des 3 %, c'est-à-dire 2 % », moitié de l'effort sur les dépenses sociales, sans montant en milliards (L'Heure de vérité, oct. 2026)"], [2, "https://lcp.fr/index%2ephp/actualites/face-a-une-france-quasiment-en-faillite-bruno-retailleau-presente-un-plan-d-economies-de", "197 Md€ d'économies, 400 000 fonctionnaires non remplacés (2026)"], [-2, "https://www.pcf.fr/objectif_2", "Programme PCF : 500 000 emplois publics ; 2026 contre l'austérité"], [-1, "https://nouspresident.fr/plan-de-redressement/", "Rejette « une politique d'austérité » ; ajustement surtout par les recettes, environ 22 Md€ d'économies ciblées (aides aux entreprises, CIR) (plan de redressement, oct. 2026)"], [-1, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "Limite la « maîtrise des dépenses » à 16,6 Md€ en 2026, priorité aux recettes fiscales (plan de sortie de crise, sept. 2025)"], [2, "https://lafrancehumaniste.fr/articles/big-bang-la-regle-republicaine.html", "« La baisse de la dépense publique fera l'essentiel de cet effort » (chronique Big bang, août 2026)"], [2, "https://www.europe1.fr/politique/en-direct-immigration-pouvoir-dachat-narcotrafic-ce-quil-faut-retenir-de-linterview-deric-zemmour-dans-la-france-en-face-936419", "Baisse des dépenses publiques d'au moins 100 Md€ par an, plan budget2027 à 140 Md€ (Europe 1/CNews, mai 2026)"]]}, {"id": "F3", "tp": 2, "q": "Il faut augmenter les droits de succession sur les gros héritages.", "k": 1, "i": "Les droits de succession sont l'impôt payé sur un héritage. Chaque enfant bénéficie aujourd'hui d'un abattement de 100 000 € par parent, puis le taux monte progressivement jusqu'à 45 %. La mesure viserait les héritages les plus importants.", "p": [null, [-2, "https://attalpresident.fr/actualites/aux-assises-de-l-afer-gabriel-attal-defend-une-epargne-qui-finance-l-economie-francaise", "« Opposition à toute hausse de la fiscalité sur l'héritage », préfère faciliter les donations (Assises de l'AFER, sept. 2026)"], null, null, [-1, "https://www.debout-la-france.fr/projet/economie-travail/", "Exonérations de succession (résidence principale, entreprises)"], [2, "https://lcp.fr/actualites/glucksmann-face-a-royal-divisions-sur-lfi-lycees-ce-qu-il-faut-retenir-du-dernier-debat", "Taxer les « méga héritages » > 2 M€ (2026)"], [2, "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "Contribution « qui toucherait une partie des grosses successions » pour financer la baisse des cotisations salariales (LCP, 27 août 2026)", 1], [-1, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Supprimer les droits de succession des familles modestes et moyennes (2024)"], null, [2, "https://melenchon2027.fr/programme-partage/chapitre-6/", "2026 : refonte des successions, héritage maximal"], [-1, "https://lcp.fr/index%2Ephp/actualites/chomage-edouard-philippe-veut-abaisser-la-duree-d-indemnisation-a-douze-mois-maximum", "Défend le pacte Dutreil, hausse des plafonds de donation (2026)"], [-2, "https://republicains.fr/actualites/2026/08/26/je-serai-le-president-qui-baissera-les-impots-de-succession/", "Baisser les droits de succession « au maximum du possible » (L'Opinion, août 2026)"], [2, "https://www.pcf.fr/moyen_1", "Programme PCF : barème successions doublé, franchise 170 000 €"], [2, "https://nouspresident.fr/plan-de-redressement/", "« Imposer les grandes successions », taux marginal de 50 % au-delà de 6 M€ (plan de redressement, oct. 2026)"], [2, "https://lesecologistes.fr/document/3uFsOCRc1JbiqUtDqkoLVd/dossierpresse-budget2027.pdf", "+10 % sur héritages > 4 M€, +10 % > 13 M€ (2026)"], [2, "https://lafrancehumaniste.fr/programme/economie.html", "« Aucun droit sous 1 M€, droits progressifs au-delà » (proposition 9, programme économique, 2026, date non affichée)"], [-1, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Supprimer les droits sur les transmissions d’entreprises familiales (2022)"]]}, {"id": "F4", "tp": 0, "q": "La TVA sur l'énergie (électricité, gaz, carburants) doit baisser à 5,5 %.", "k": 0, "i": "La TVA est aujourd'hui de 20 % sur l'électricité, le gaz et les carburants. La baisser à 5,5 % (taux des produits de première nécessité) réduirait les factures, mais coûterait plusieurs milliards d'euros de recettes par an.", "p": [null, [-1, "https://attalpresident.fr/actualites/gabriel-attal-sur-rtl-je-suis-candidat-pour-gagner-cette-election-presidentielle", "Refuse de baisser les taxes sur l'énergie, préfère une aide ciblée (RTL, sept. 2026)"], null, null, [1, "https://www.debout-la-france.fr/projet/economie-travail/", "Supprimer TVA sur TICPE, électricité à 10 c/kWh (autre mécanisme)"], null, [2, "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "Veut ramener la TVA sur l'énergie, carburants compris, à 0 % au lieu de 5,5 % : va plus loin que l'affirmation (LCP, 27 août 2026)"], [2, "https://rassemblementnational.fr/22-mesures", "TVA de 20 % à 5,5 % sur carburants, fioul, gaz, électricité (2022)"], null, null, null, null, [2, "https://www.pcf.fr/objectif_4", "Programme PCF : TVA sur l'électricité et le gaz à 5,5 %"], null, [0, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Baisser TVA sur abonnement électrique seulement (2026)"], null, null]}, {"id": "F5", "tp": 2, "q": "La France doit revenir rapidement à l'équilibre budgétaire, même au prix d'efforts importants.", "k": 0, "i": "Le déficit public (l'écart entre dépenses et recettes de l'État et des administrations) est d'environ 5 % du PIB, et la dette publique dépasse 115 % du PIB. Les règles européennes demandent de revenir sous 3 % de déficit.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/journalnumero/fichiers/2026/08/3030-web.pdf", "2026 : contre l'austérité, dette à annuler"], [1, "https://attalpresident.fr/actualites/gabriel-attal-lettre-aux-francais-plan-finances-publiques", "Déficit sous 3 % avant 2032, zéro déficit en 2037, double règle d'or (lettre aux Français, oct. 2026)"], null, null, null, null, [-1, "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "Parle de « rétablir sur plusieurs années les comptes publics », pas d'un retour rapide (LCP, 27 août 2026)", 1], [1, "https://www.europe1.fr/politique/budget-2027-marine-le-pen-promet-140-milliards-deuros-deconomies-dici-2032-pour-eviter-a-la-france-le-defaut-de-paiement-1126400", "Équilibre primaire en 18 mois, déficit sous 3 % en 2030 (contre-budget, oct. 2026)"], [2, "https://www.unenouvelleenergie.fr/notre-programme/etre-maitre-de-notre-destin/", "« L’impératif absolu de la maîtrise des déficits publics et de la dette » ; « sans attendre 2027 comme l’indiquent les projections actuelles » (programme, date non indiquée)"], [-2, "https://melenchon2027.fr/programme-partage/chapitre-6/", "2026 : supprimer la règle des 3 % de déficit"], [1, "https://www.boursedirect.fr/fr/actualites/categorie/politique/a-l-heure-de-verite-philippe-ebauche-une-france-a-nouveau-commandee-et-gouvernee-afp-b61ead8f6279ef25847a715f537619cb6675d12c", "Déficit ramené à 2 % fin de quinquennat (AFP, 2026)"], [1, "https://lcp.fr/index%2ephp/actualites/face-a-une-france-quasiment-en-faillite-bruno-retailleau-presente-un-plan-d-economies-de", "Déficit à 2,2 % en 2032, pas l'équilibre (2026)"], [-2, "https://www.pcf.fr/moyen_3", "Programme PCF : fin des 3 % ; 2026 refuse les coupes"], null, [-1, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Rejette l'austérité ; seulement « maîtrise des déficits » (2026)"], [1, "https://lafrancehumaniste.fr/articles/big-bang-la-regle-republicaine.html", "« Je m'engage à les ramener sous les 3% en 2031 » (déficit public, chronique Big bang, août 2026)"], null]}, {"id": "F6", "tp": 2, "q": "L'impôt sur le revenu doit être plus progressif, avec davantage de tranches.", "k": 0, "i": "L'impôt sur le revenu compte aujourd'hui cinq tranches, de 0 % à 45 %. Le rendre plus progressif consiste à créer davantage de tranches pour taxer plus les hauts revenus et moins les revenus moyens.", "p": [null, null, null, null, null, null, null, null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "2026 : impôt sur le revenu à 14 tranches"], null, [-1, "https://lcp.fr/index%2ephp/actualites/face-a-une-france-quasiment-en-faillite-bruno-retailleau-presente-un-plan-d-economies-de", "Déduit du plan de 197 Md€ « sans augmentation d'impôts » ; rien de précis sur le barème de l'IR (2026)", 1], [2, "https://www.pcf.fr/moyen_1", "Programme PCF : impôt sur le revenu à 15 tranches"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Impôt sur le revenu à 14 tranches"], [2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Impôt sur le revenu à 14 tranches"], null, null]}, {"id": "F7", "tp": 2, "q": "Il faut taxer les superprofits des grandes entreprises.", "k": 1, "i": "Les superprofits sont des bénéfices exceptionnels liés à une situation particulière (crise énergétique, hausse des prix) plutôt qu'à l'activité normale de l'entreprise. Une taxe dédiée prélèverait une partie de ces bénéfices.", "p": [[2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure_caravane_2026-01_-_couleur.pdf", "2026 : confisquer les bénéfices des profiteurs de guerre"], null, null, null, null, [2, "https://place-publique.eu/posts/4dFSUW5ZRZ36O2SvNhPLah/place-publique-jeunes-et-plus-de-50-elus-es-place-publique-pour-une-revolution-ecologique", "Position du parti : « Nous voulons taxer les superprofits et les jets privés » (tribune d'élus Place publique, juil. 2026)"], [1, "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "Demande de « ne pas oublier les superprofits des entreprises » dans un effort partagé (LCP, 27 août 2026)", 1], null, null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "2026 : « véritable taxe sur les superprofits »"], [-2, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "« Je ne taxerai pas davantage les entreprises » (2026)"], [-1, "https://lcp.fr/index%2ephp/actualites/face-a-une-france-quasiment-en-faillite-bruno-retailleau-presente-un-plan-d-economies-de", "Déduit du plan de 197 Md€ « sans augmentation d'impôts » ; rien de précis sur les superprofits (2026)", 1], [2, "https://www.pcf.fr/moyen_1", "Programme PCF : contribution exceptionnelle sur profits des grands groupes"], [2, "https://nouspresident.fr/plan-de-redressement/", "« Contribution exceptionnelle sur les surprofits des entreprises pétrolières et du raffinage » (plan de redressement, oct. 2026)"], [2, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "Taxer les superprofits (plan de sortie de crise, sept. 2025)"], null, null]}, {"id": "F8", "tp": 2, "q": "Les dividendes et les rachats d'actions doivent être davantage taxés.", "k": 0, "i": "Les dividendes sont les bénéfices versés aux actionnaires ; les rachats d'actions permettent à une entreprise de racheter ses propres titres, ce qui fait monter leur valeur. Les revenus du capital sont aujourd'hui taxés à 30 % (« flat tax »).", "p": [null, null, null, null, null, null, null, [2, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "Taxe sur rachats d’actions et superdividendes (2025)"], null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "Taxer davantage les rachats d'actions (2,5 Md€ attendus) (plan budgétaire, oct. 2026)"], null, [-1, "https://lcp.fr/index%2ephp/actualites/face-a-une-france-quasiment-en-faillite-bruno-retailleau-presente-un-plan-d-economies-de", "Déduit du plan de 197 Md€ « sans augmentation d'impôts » ; rien de précis sur les dividendes (2026)", 1], [2, "https://www.pcf.fr/fete_de_lhumanite_2026_discours_de_fabien_roussel", "Cotisations sur revenus financiers et dividendes (Fête de l'Huma, sept. 2026)"], [2, "https://nouspresident.fr/travaillisme-ecologique/", "Taxe de 4 % sur les dividendes (2026)"], [1, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : Soumettre dividendes à cotisations"], [1, "https://lafrancehumaniste.fr/articles/protection-sociale.html", "« Il s'agit simplement d'aligner les règles du capital sur celles du revenu du travail » (chronique Vers une protection sociale rénovée, déc. 2025 ; dividendes et rachats non nommés)", 1], null]}, {"id": "F9", "tp": 2, "q": "Les retraités aisés doivent contribuer davantage (fin de l'abattement fiscal de 10 % sur les pensions, sous-indexation des pensions élevées).", "k": 0, "i": "Les retraités bénéficient d'un abattement de 10 % sur leurs pensions pour le calcul de l'impôt sur le revenu, comme les salariés pour leurs frais professionnels. La sous-indexation consiste à augmenter les pensions élevées moins vite que les prix.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/journalnumero/fichiers/2026/08/3030-web.pdf", "LO dénonce la sous-indexation des pensions des retraités « aisés » comme une nouvelle attaque (LO n°3030, août 2026)"], [1, "https://www.lejdd.fr/politique/presidentielle-le-plan-de-gabriel-attal-pour-redresser-les-finances-publiques-177987", "« Année blanche sur l'ensemble des prestations sociales » en épargnant les petites retraites (Le Parisien via JDD, juil. 2026)"], null, null, [-1, "https://www.debout-la-france.fr/projet/retraites/", "Indexer les retraites, dénonce hausses de CSG et rabots fiscaux"], [1, "https://lcp.fr/actualites/presidentielle-raphael-glucksmann-devoile-les-premieres-lignes-de-son-possible-programme", "Rééquilibrer la taxation entre travail, capital, héritage et retraites (2026)"], [1, "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "Désindexation partielle des retraites envisageable « au-delà d'un certain seuil de revenus » (LCP, 27 août 2026)", 1], [-2, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "Indexation des retraites, maintien de l’abattement de 10 % (2025)"], [2, "https://www.unenouvelleenergie.fr/david-lisnard-sur-cnews-et-europe-1-je-ne-suis-pas-candidat-pour-un-poste-je-viens-pour-redresser-le-pays/", "résumé fidèle : ne pas revaloriser les pensions supérieures à 2 200 € (CNEWS/Europe 1, 27 oct. 2026) ; désindexation au-delà de 2 000 € citée (Sud Radio, juin 2025) ; abattement de 10 % : « peut paraître bizarre » (Europe 1, avr. 2025)"], [-1, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "2026 : refuse la désindexation, indexe toutes les pensions"], [1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "Demande aux retraités de « contribuer davantage » au modèle social (2026)"], [-1, "https://www.publicsenat.fr/actualites/politique/budget-bruno-retailleau-demande-au-gouvernement-le-retour-de-la-reforme-des-retraites", "« Hors de question de voter un appauvrissement des retraités » face aux pistes du gouvernement (franceinfo via Public Sénat, sept. 2026)"], null, [-1, "https://www.brut.media/fr/articles/france/politique/budget-les-oppositions-menacent-de-censure-le-gouvernement-la-macronie-salue-un-moment-de-courage", "Dénonce un budget où les « retraités [sont] visés » (AFP, 2025)"], null, [1, "https://lafrancehumaniste.fr/articles/big-bang-la-regle-republicaine.html", "« les revenus du capital, les monopoles numériques et les retraites contribueront » (via la CSG élargie, chronique Big bang, août 2026)"], null]}, {"id": "F10", "tp": 2, "q": "Il faut supprimer ou fusionner un grand nombre d'agences et d'opérateurs de l'État.", "k": 0, "i": "L'État s'appuie sur plusieurs centaines d'agences et d'opérateurs (France Travail, Ademe, agences de l'eau, ARS…) qui emploient des centaines de milliers de personnes. Les supprimer ou les fusionner vise à faire des économies  sociale » consiste à augmenter la TVA, payée sur la consommation y compris des produits importés, pour baisser les cotisations sur les salaires. Ses partisans y voient un gain de compétitivité ; ses opposants une hausse des prix qui pèse sur les ménages modestes.", "p": [null, null, null, null, [-2, "https://www.debout-la-france.fr/actualite/communique-nicolas-dupont-aignan-a-limoges/", "« TVA à 0 % pour les produits de première nécessité » (20 oct. 2026)"], null, [1, "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "Baisse des cotisations salariales financée en partie par une hausse du taux normal de TVA de 20 % à 24 % (LCP, 27 août 2026). Partiel", 1], [-1, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "Baisses de TVA (énergie, 100 produits), aucune hausse de TVA (2025)"], [0, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« C’est un sujet qui n’a pas été tranché au sein des groupes de travail » (programme, date non indiquée) ; position non tranchée"], [-1, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : baisser la TVA (transports en commun à 5,5 %)"], [1, "https://www.publicsenat.fr/actualites/emploi/presidentielle-le-regain-dinteret-pour-la-tva-sociale-idee-clivante-pour-augmenter-le-salaire-net", "« Toute la population » doit financer la protection sociale, logique TVA sociale (2026)"], null, [-2, "https://www.pcf.fr/moyen_2", "2025 : TVA impôt injuste, à baisser sur produits essentiels"], null, null, null, null]}, {"id": "F14", "tp": 2, "q": "Il faut instaurer la taxe Zucman (impôt minimum de 2 % sur les patrimoines de plus de 100 millions d'euros).", "k": 1, "i": "La taxe proposée par l'économiste Gabriel Zucman instaurerait un impôt minimum de 2 % par an sur les patrimoines supérieurs à 100 millions d'euros, soit environ 1 800 foyers. Adoptée par l'Assemblée en février 2025, elle a été rejetée par le Sénat puis lors du budget 2026.", "p": [[0, "https://lutte-ouvriere.org/portail/editoriaux/quils-ont-lont-vole-188208.html", "Éditorial Arthaud : la taxe Zucman « donnait juste l'illusion d'un peu plus de justice sociale », prône la propriété collective (nov. 2025)"], [-2, "https://lcp.fr/actualites/a-arras-gabriel-attal-prone-une-nouvelle-republique-en-vue-de-l-election-presidentielle", "Continue de dire non à la taxe Zucman (rentrée de Renaissance à Arras, LCP, sept. 2025)"], null, null, null, [1, "https://lcp.fr/actualites/budget-2026-la-taxe-zucman-sur-les-ultrariches-au-centre-de-l-equation-politique-398413", "Taxe sur les plus grandes fortunes « base de tout accord », mais « on peut discuter des modalités, de l'assiette, du montant » (RTL via LCP, sept. 2025)"], [2, "https://www.assemblee-nationale.fr/dyn/17/scrutins/3300", "POUR l'instauration de la taxe Zucman sur les patrimoines supérieurs à 100 millions d'euros (scrutin n°3300, 31 oct. 2025)"], [-2, "https://www.publicsenat.fr/actualites/economie/contre-budget-du-rn-des-propositions-qui-manquent-de-credibilite-economique-mais-trahissent-une-veritable-coherence-doctrinale", "Le RN s'oppose à la taxe Zucman, lui préférant un impôt sur la fortune financière (contre-budget 2026, oct. 2025)"], null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "Taxe Zucman sur les patrimoines de « plus de 100 millions d'euros », 15 Md€ attendus (plan budgétaire, oct. 2026)"], [-2, "https://lcp.fr/actualites/budget-2026-la-taxe-zucman-rejetee-par-l-assemblee-nationale-413632", "Groupe Horizons : contre la taxe Zucman lors du budget 2026 (Assemblée, 2025)"], [-2, "https://lcp.fr/actualites/budget-2026-la-taxe-zucman-rejetee-par-l-assemblee-nationale-413632", "Groupe LR : opposé à la taxe Zucman à l'Assemblée (LCP, oct. 2025) ; plan 2026 « sans augmentation d'impôts »"], [2, "https://groupe-communiste.assemblee-nationale.fr/actualites/questions-au-gouvernement/article/taxe-zucman", "Groupe GDR : soutient la taxe Zucman de 2 % au-delà de 100 M€, « la plus petite goutte de justice sociale » (QAG Y. Monnet, juin 2025)"], [2, "https://nouspresident.fr/plan-de-redressement/", "Instaurer « une taxe annuelle de 2 % sur les patrimoines supérieurs à 100 M€ » (plan de redressement, oct. 2026)"], [2, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "Taxe Zucman « sur les fortunes de plus de 100 millions d'euros », au moins 2 % du patrimoine (plan de sortie de crise, sept. 2025 ; repris dans le dossier budget 2027)"], [1, "https://lafrancehumaniste.fr/programme/economie.html", "« Dès 2,2 M€, fortement progressif. » (impôt unique sur le patrimoine des 1 %, proposition 8, programme économique, 2026, date non affichée ; la taxe Zucman n'est pas nommée)", 1], null]}, {"id": "F15", "tp": 2, "q": "Il faut rétablir un impôt sur la fortune (ISF) incluant le patrimoine financier.", "k": 0, "i": "L'ISF taxait chaque année l'ensemble du patrimoine au-delà de 1,3 million d'euros (immobilier, actions, épargne). Il a été remplacé en 2018 par l'IFI, qui ne porte plus que sur l'immobilier. La question est de savoir s'il faut à nouveau taxer aussi le patrimoine financier.", "p": [[0, "https://www.lutte-ouvriere.org/medias/journalnumero/fichiers/2026/08/3030-web.pdf", "LO juge « dérisoires » les impôts sur les grandes fortunes, qui n'empêchent pas leur croissance ; prône l'expropriation (LO n°3030, août 2026)"], [-1, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "Convention Renaissance : la suppression de l'ISF et la flat tax présentées comme des acquis ; plan d'économies « sans augmenter les impôts » (2025-2026)", 1], null, null, null, null, null, [1, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "« IFF à la place de la taxe sur les holdings et de l'IFI » : impôt sur la fortune financière, sans l'immobilier (contre-budget, oct. 2025, reconduit oct. 2026)"], null, [2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "« Rétablissement d'un impôt sur la fortune renforcé (10 milliards d'euros) » (plan budgétaire, oct. 2026)"], [-1, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "Moratoire fiscal : « pas de nouvelle norme et de nouvel impôt sur le quinquennat », ce qui exclut un ISF (programme, 2026)"], null, [2, "https://www.pcf.fr/moyen_1", "Programme PCF : « L'impôt sur la fortune sera rétabli », taux et progressivité accentués, montant triplé"], null, [2, "https://lesecologistes.fr/document/3uFsOCRc1JbiqUtDqkoLVd/dossierpresse-budget2027.pdf", "« Un vrai ISF, avec un seuil d'entrée à 1,3 Millions d'euros », avec volet climatique (dossier budget 2027, 2026)"], [2, "https://lafrancehumaniste.fr/articles/big-bang-la-regle-republicaine.html", "« un impôt unique sur le patrimoine, incluant l'ensemble des sources de la fortune » (chronique Big bang, août 2026 ; l'ISF n'est pas nommé)", 1], null]}, {"id": "F16", "tp": 2, "q": "Il faut réduire fortement le nombre de fonctionnaires.", "k": 1, "i": "La fonction publique compte environ 5,7 millions d'agents (État, collectivités, hôpitaux). Les réduire passe en général par le non-remplacement d'une partie des départs à la retraite ; les opposants craignent une dégradation des services publics.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "Embauches massives dans santé, Ehpad, éducation : « des centaines de milliers d'emplois à créer » (brochure LO, été 2026)"], [1, "https://attalpresident.fr/actualites/gabriel-attal-lettre-aux-francais-plan-finances-publiques", "Supprimer 100 000 postes de fonctionnaires par départs volontaires, hors Éducation, Armées, Justice, Intérieur (lettre aux Français, oct. 2026)"], null, null, null, null, null, [1, "https://acteurspublics.fr/articles/la-reforme-de-letat-et-des-collectivites-au-coeur-des-economies-programmees-par-le-rn/", "« Une diminution du nombre d'agents publics nécessaires » par non-remplacement, douanes et DGCCRF renforcées (contre-budget, oct. 2026)"], [2, "https://www.unenouvelleenergie.fr/david-lisnard-sur-cnews-et-europe-1-je-ne-suis-pas-candidat-pour-un-poste-je-viens-pour-redresser-le-pays/", "résumé fidèle : « plus de 400 000 suppressions de postes » dans le scénario présenté ; environ 12 % des effectifs publics visés (CNEWS/Europe 1, 27 oct. 2026)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "Créer 10 000 postes dans l'éducation et au moins 10 000 soignants, point d'indice +10 % (plan budgétaire, oct. 2026)"], [2, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "« Supprimer un tiers des fonctionnaires partant à la retraite », soit plus de 250 000 postes (programme, 2026)"], [2, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Non-remplacement de 400 000 fonctionnaires partant à la retraite sur le quinquennat (plan d'économies, Public Sénat, oct. 2026)"], [-2, "https://www.pcf.fr/objectif_2", "Programme PCF : « Il sera créé 500 000 emplois dans la fonction publique et les services publics » (programme 2022, toujours en ligne)"], null, [-2, "https://lafranceinsoumise.fr/wp-content/uploads/2024/06/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : « Lancer le rattrapage des postes manquants de fonctionnaires »"], null, [2, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : non-remplacement de 800 000 départs de fonctionnaires sur le quinquennat (2026)"]]}, {"id": "E1", "tp": 3, "q": "Les cotisations patronales doivent baisser pour soutenir la compétitivité des entreprises.", "k": 1, "i": "Les cotisations patronales sont les sommes que l'employeur verse en plus du salaire brut pour financer la Sécurité sociale. Elles ont déjà été fortement allégées sur les bas salaires depuis les années 1990.", "p": [null, [1, "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "« Droit au brut » : baisser cotisations patronales et salariales (2026)"], null, null, [1, "https://www.debout-la-france.fr/projet/economie-travail/", "Exonérations patronales ciblées, baisse des impôts de production"], null, null, [1, "https://rassemblementnational.fr/documents/WEB-GRN-LIVRET-ENTREPRISE.pdf", "Exonération de cotisations sur hausses de salaires de 10 %"], [2, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« Un système de charges patronales négatives pour les embauches de personnes au RSA depuis plus de 2 ans » ; suppression de la C3S et de la CVAE (programme, date non indiquée)"], [-2, "https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf", "2026 : réduire les exonérations de cotisations au-delà de 2 SMIC"], [1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-du-conseil-national-a-reims-10-mai-2026/", "50 Md€ de baisse d'impôts de production contre baisse d'aides (2026)"], [2, "https://republicains.fr/wp-content/uploads/2026/02/LR_Produire_Plus_LIVRET.pdf", "Baisse directe des cotisations patronales non contributives (LR, 2026)"], [-2, "https://www.pcf.fr/moyen_1", "Programme PCF : supprimer exonérations sociales qui gonflent les profits"], [-1, "https://nouspresident.fr/plan-de-redressement/", "Lisser les réductions de cotisations patronales et « les geler à leur niveau actuel » (plan de redressement, oct. 2026)"], [-1, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "Exonérations recentrées jusqu'à 2 SMIC, sous conditions (sept. 2025)"], [2, "https:// duits importés (droits de douane) ou à fixer des quotas pour protéger la production locale. Les droits de douane relèvent aujourd'hui de l'Union européenne, pas de la France seule.", "p": [[-2, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure-ete-2026.pdf", "2026 : « Le protectionnisme ne protège ni l'emploi ni les salaires »"], [1, "https://www.linfodurable.fr/politique/attal-propose-une-nouvelle-donne-ecologique-en-meme-temps-queconomique-52224", "« Assumer une part de protectionnisme » (AFP, 2025)"], null, null, [2, "https://www.debout-la-france.fr/projet/produire-en-france/", "« Protectionnisme intelligent », droits de douane compensateurs"], [1, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "« Protectionnisme ciblé et intelligent » (Acte I PP)"], null, [1, "https://rassemblementnational.fr/documents/202411-programme-europeennes.pdf", "Préférence nationale et européenne, moratoire sur les accords de libre-échange (2024)"], [1, "https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/", "« en établissant une équité fiscale sur les importations » (programme, date non indiquée) ; droits de douane non chiffrés", 1], [2, "https://melenchon2027.fr/wp-content/uploads/2026/04/PROGRAMME-FRONT-POPULAIRE.pdf", "NFP 2024 : protectionnisme écologique et social aux frontières UE"], [1, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-conquerante", "Prix du carbone aux frontières européennes (programme, 2026)"], [1, "https://republicains.fr/wp-content/uploads/2026/02/LR_Produire_Plus_LIVRET.pdf", "Livret LR : « clauses de réciprocité dans tous les accords commerciaux » (févr. 2026)"], [2, "https://www.pcf.fr/objectif_4", "Programme PCF : taxer lourdement les importations moins-disantes"], [2, "https://nouspresident.fr/pour-une-exception-agriculturelle-francaise/", "Quotas d'importation, barrières douanières agricoles (2026)"], [1, "https://lesecologistes.fr/document/3N4JsAEmq ogramme, juil. 2026)"], [-1, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "Baisse de 50 Md€ des impôts de production et « pas de nouvel impôt sur le quinquennat » ; pas de position explicite sur la surtaxe d'IS (programme, 2026)"], null, [1, "https://www.pcf.fr/moyen_1", "Programme PCF : « Un nouvel impôt sur les sociétés » progressif selon le chiffre d'affaires et les résultats, alourdi pour les groupes pollueurs"], null, [2, "https://lesecologistes.fr/document/21lvzpwEXkL8pJg16dsil4/25-09-plan-de-sortie-de-crise.pdf", "« Prolongation de la contribution exceptionnelle des grandes entreprises » (plan de sortie de crise, sept. 2025)"], null, null]}, {"id": "E10", "tp": 3, "q": "Les autoroutes doivent être renationalisées (gestion publique à la fin ou avant la fin des concessions).", "k": 0, "i": "Les autoroutes ont été privatisées en 2006 et sont exploitées par des sociétés privées (Vinci, Eiffage, Abertis) sous contrat jusqu'en 2031-2036 environ. Les renationaliser avant l'échéance obligerait à indemniser ces sociétés ; attendre la fin des contrats ne coûterait pas d'indemnité.", "p": [null, null, null, null, [2, "https://www.debout-la-france.fr/projet/transport-automobilistes/", "« Renationaliser les autoroutes » sans indemniser les concessionnaires, fin des péages d'ici 2030 (projet DLF)"], null, null, [2, "https://rassemblementnational.fr/22-mesures", "« Renationaliser les autoroutes pour baisser de 15 % les péages » (2022), autoroutes nationalisées toujours chiffrées dans le contre-budget d'oct. 2026"], null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Renationalisation des autoroutes », mesure déjà au programme (synthèse des contributions, juil. 2026)"], null, null, [2, "https://assets.nationbuilder.com/pcf/pages/36198/attachments/original/1766073432/document_-_cahier_mobilite_ppp.pdf?1766073432", "Cahier PCF mobilités : nationaliser les autoroutes, privatisation qualifiée de « scandaleux hold-up » (cahiers Jours heureux)"], [2, "https://nouspresident.fr/temps-loisirs/", "« Reprise en main des autoroutes (fin des concessions, tarification publique) » (cahier loisirs, sept. 2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "« Renationaliser progressivement les autoroutes » (programme, juil. 2026)"], [2, "https://lafrancehumaniste.fr/programme/economie.html", "« Retour des autoroutes en régie publique à l'échéance des concessions. » (proposition 13, programme économique, 2026, date non affichée)"], [-1, "https://www.cnews.fr/france/2022-02-02/marine-le-pen-eric-zemmour-ce-qui-differencie-leurs-programmes-1177398", "Opposé à la renationalisation des autoroutes, jugée trop coûteuse (CNews, 2022)", 1]]}, {"id": "E11", "tp": 3, "q": "L'État doit nationaliser des entreprises stratégiques (énergie, banques, industrie).", "k": 0, "i": "L'État détient déjà EDF à 100 % et des participations dans plusieurs grandes entreprises (Engie, Airbus, Renault…). Nationaliser consisterait à prendre le contrôle complet d'entreprises privées jugées stratégiques, comme des banques ou TotalEnergies, en indemnisant leurs actionnaires.", "p": [[1, "https://www.lutte-ouvriere.org/medias/document/fichiers/2026/06/brochure_caravane_2026-01_-_couleur.pdf", "Expropriation « sans indemnité ni rachat », d'abord pétrole et armement, mais rejette les simples « nationalisations » réformistes (brochure LO, 2026)", 1], null, null, null, [1, "https://www.debout-la-france.fr/projet/economie-travail/", "Rétablir « le monopole de production et de distribution d'EDF » et le monopole public du gaz, pas de nationalisations plus larges (projet DLF)"], null, null, [0, "https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf", "Pas de nationalisation mais « achat d'une golden share dans ATOS, Arcelor et Opella » (contre-budget, oct. 2025)"], null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Renationaliser des secteurs ciblés », dont EDF et Engie, e s usages « appuyée sur le nucléaire et les énergies renouvelables assumée » (résumé PRG de la lettre, juillet 2026). Pas de mention explicite de nouveaux réacteurs, d'où inf.", 1], [2, "https://www.debout-la-france.fr/projet/environnement-energie/", "Réacteurs de 4e génération, nucléaire ≥70 % de l’électricité"], [2, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Conforter le nucléaire, nouvelles unités ; « besoin des deux » (Acte I PP)"], null, [2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Plan de relance du nucléaire : EPR, SMR, neutrons rapides (2024)"], null, [-2, "https://melenchon.fr/2026/11/07/grand-meeting-du-bourget-notre-programme-de-gouvernement/", "« abandonner le programme macroniste du \"nouveau nucléaire français\" », au profit des renouvelables (discours du Bourget, 7 nov. 2026)"], [2, "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-conquerante", "8 EPR supplémentaires en plus des 6 prévus (programme, 2026)"], [2, "https://www.europe1.fr/politique/economiquement-vertueuse-ecologiquement-responsable-bruno-retailleau-clarifie-la-position-des-republicains-sur-les-energies-renouvelables-762050", "Nucléaire « priorité nationale », renouvellement du parc (2025)"], [2, "https://www.pcf.fr/ue_25_discours_fr", "2025 : construire 20 nouvelles centrales nucléaires"], [2, "https://nouspresident.fr/travaillisme-ecologique/", "Poursuivre six EPR2, prolonger centrales (2026)"], [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Fin des programmes EPR2 et SMR (2026)"], [2, "https://lafrancehumaniste.fr/programme/economie.html", "« 6 EPR2, éolien en mer industrialisé » (proposition 16 ; « nouveau nucléaire » en proposition 14, programme économique, 2026, date non affichée)"], [2, "https://www.publicsenat.fr/actualites/politique/presidentielle-2022-eric-zemmour-detaille-son-programme-et-assume-le-terme", "14 nouveaux réacteurs EPR (2022)"]]}, {"id": "EN2", "tp": 4, "q": "Il faut arrêter de développer de nouvelles éoliennes.", "k": 1, "i": "Les éoliennes produisent environ 10 % de l'électricité française. Elles sont critiquées pour leur impact sur les paysages et leur intermittence, et défendues comme un moyen rapide et peu coûteux de produire une électricité bas carbone.", "p": [null, [-1, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "Accélérer l'éolien en mer (convention Renaissance, 2025)"], [1, "https://www.lejdd.fr/Politique/xavier-bertrand-se-dit-pronucleaire-et-veut-attaquer-en-justice-les-projets-de-construction-deoliennes-4032812", "Éoliennes : « scandale national » ; il annonce que la Région financera des associations qui engageront « certainement des actions en justice » contre les projets (LeJDD, mars 2021). Déduit : hostilité aux nouveaux parcs, sans appel explicite à arrêter les existants.", 1], null, [2, "https://www.debout-la-france.fr/projet/equilibre-territoire-monde-rural/", "« Stopper les projets éoliens »"], [-2, "https://lcp.fr/actualites/glucksmann-face-a-royal-divisions-sur-lfi-lycees-ce-qu-il-faut-retenir-du-dernier-debat", "« La France a besoin des deux » nucléaire et renouvelables (2026)"], null, [2, "https://vert.eco/chaleurs-actuelles/marine-le-pen-presente-le-contre-budget-du-rn-pour-2027-une-attaque-contre-les-renouvelables-et-les-agences-environnementales/", "Moratoire sur les nouveaux projets éoliens et solaires, fin des subventions (contre-budget, oct. 2026)"], null, [-2, "https://melenchon2027.fr/synthese-des-contributions/", "« Plan d'urgence pour l'éolien maritime » et 100 % renouvelables en 2050 (programme, juil. 2026)"], [-1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "Vante l'usine d'éoliennes offshore du Havre, mise sur les renouvelables (2026)"], [1, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Fin du soutien public aux nouvelles éoliennes (2026)"], [-1, "https://www.pcf.fr/objectif_4", "Programme PCF : investir dans solaire, éolien, hydraulique"], [-2, "https://nouspresident.fr/travaillisme-ecologique/", "« Poursuivrons le développement de l'énergie éolienne » (2026)"], [-2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Développer éolien offshore et terrestre (2026)"], [-2, "https://lafrancehumaniste.fr/programme/economie.html", "« éolien en mer industrialisé » (proposition 16, programme économique, 2026, date non affichée ; prise de position pro-éolien, non « arrêter les éoliennes » en général)", 1], [2, "https://xn--ambitionsant2022-mqb.fhf.fr/medias/ez-programme-2022-final6-compressed-623218e2a2ef4036050815.pdf", "Fin de tous les projets éoliens actuels et futurs (2022)"]]}, {"id": "EN3", "tp": 4, "q": "Il faut maintenir la fin de la vente de voitures thermiques neuves en 2035.", "k": 0, "i": "L'Union européenne a décidé en 2023 d'interdire la vente de voitures neuves à moteur essence ou diesel à partir de 2035, pour imposer l'électrique. Les voitures d'occasion resteraient autorisées. La Commission européenne a proposé fin 2025 de l'assouplir.", "p": [null, null, null, null, [-2, "https://www.debout-la-france.fr/projet/transport-automobilistes/", "Supprimer l’interdiction des thermiques en 2035"], null, null, [-2, "https://rassemblementnational.fr/documents/202406-programme.pdf", "Renoncer à l’interdiction des thermiques en 2035 (2024)"], null, [2, "https://melenchon2027.fr/programme/plans-investissement/automobile/", "Anticiper la fin du thermique neuf de 2035 (plan automobile, oct. 2026)"], null, null, [-1, "https://assets.nationbuilder.com/pcf/pages/36198/attachments/original/1766073432/document_-_cahier_mobilite_ppp.pdf?1766073432", "Cahier PCF mobilités : « la production de voitures thermiques peu polluantes doit être développée » (pas de mention de 2035)", 1], null, [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "Maintenir 100 % véhicules neufs zéro émission en 2035 (2026)"], [1, "https://lafrancehumaniste.fr/articles/moment-europeen-europe-souveraine.html", "« La réduction récente de l'ambition sur les deux premiers est une fragilisation majeure » (objectifs 2035/2040, manifeste européen, mars 2026 ; fin du thermique neuf non nommée)", 1], [-2, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Supprimer l’interdiction des thermiques en 2035 (européennes 2024)"]]}, {"id": "EN4", "tp": 4, "q": "La France doit sortir du marché européen de l'électricité pour fixer ses propres prix.", "k": 1, "i": "Le prix de l'électricité en Europe est fixé sur un marché commun, souvent aligné sur le coût des centrales à gaz, même si la France produit surtout du nucléaire bon marché. En sortir permettrait de fixer des prix nationaux, mais réduirait les échanges d'électricité avec les voisins.", "p": [null, [-1, "https://doc.parti.re/Conventions-thematiques_Nouvelle-donne.pdf", "« Poursuivrons la réforme de l'Europe de l'énergie », sans proposer de sortir du marché européen (convention Renaissance, 2025)", 1], null, null, [2, "https://www.debout-la-france.fr/actualite/communique-nicolas-dupont-aignan-a-limoges/", "Électricité -50 % « par la sortie du marché européen » (20 oct. 2026)"], [0, "https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf", "Réformer prix électricité vers coûts de production, pas sortie (Acte I PP)"], null, [1, "https://www.publicsenat.fr/actualites/politique/marche-europeen-de-lelectricite-sortie-ou-reforme-les-paradoxes-de-la-normalisation-du-rn", "Position du parti : Jordan Bardella, président du RN, veut rester dans le marché européen mais changer la fixation des prix (avr. 2026)"], null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "Sortir du marché européen de l'électricité et du gaz, mesure présente au programme (synthèse, juil. 2026)"], null, [-2, "https://www.publicsenat.fr/actualites/politique/marche-europeen-de-lelectricite-sortie-ou-reforme-les-paradoxes-de-la-normalisation-du-rn", "Sortir du marché européen : « une fausse piste » (X, avr. 2026)"], [2, "https://www.pcf.fr/40e_congres_discours_de_cloture_de_fabien_roussel", "2026 : « sortie du marché spéculatif européen de l'électricité »"], [1, "https://nouspresident.fr/travaillisme-ecologique/", "Supprimer la concurrence sur la vente d'électricité (2026)"], null, [-1, "https://lafrancehumaniste.fr/articles/moment-europeen-europe-souveraine.html", "« coordonne, développe et finance ensemble les grands réseaux » (pacte énergétique européen, mars 2026)", 1], [1, "https://assets.ericzemmour.fr/document/Programme%20Reconqu%C3%AAte%20Europ%C3%A9ennes%202024.pdf", "Supprimer les règles de concurrence du marché européen de l’électricité (2024)"]]}, {"id": "EN5", "tp": 4, "q": "Il faut développer massivement le solaire.", "k": 1, "i": "Le solaire et l'éolien représentent environ 15 % de l'électricité française. La programmation énergétique prévoit de les augmenter fortement d'ici 2035, en complément du nucléaire.", "p": [null, [1, "https://attalpresident.fr/actualites/gabriel-attal-presente-un-plan-de-desendettement-et-un-messmer-ii-pour-sortir-des-dependances-francaises", "Accélérer les renouvelables, en « neutralité technologique » (2026)"], null, null, [-2, "https://www.lejdd.fr/politique/presidentielle-nicolas-dupont-aignan-officialise-sa-candidature-et-fait-le-pari-du-frexit-183876", "Supprimer les 12 Md€ d'aides à l'éolien et au solaire (sept. 2026)"], [1, "https://www.publicsenat.fr/actualites/politique/europeennes-2024-raphael-glucksmann-prone-dans-son-programme-une-revolution-ecologique", "Investissement « massif » dans les renouvelables, sans mention spécifique du solaire (européennes 2024)"], null, [-2, "https://vert.eco/chaleurs-actuelles/marine-le-pen-presente-le-contre-budget-du-rn-pour-2027-une-attaque-contre-les-renouvelables-et-les-agences-environnementales/", "Moratoire sur tous les nouveaux projets éoliens et solaires, « on n'en a pas besoin » (contre-budget, oct. 2026)"], null, [2, "https://melenchon2027.fr/synthese-des-contributions/", "« Organiser le 100 % d'énergies renouvelables en 2050 », solaire et éolien compris (programme, juil. 2026)"], [1, "https://horizonsleparti.fr/discours-dedouard-philippe-lors-de-son-grand-meeting-a-ladidas-arena-5-juillet-2026/", "Énergie décarbonée : nucléaire et renouvelables (2026)"], [-2, "https://www.publicsenat.fr/actualites/economie/presidentielle-2027-bruno-retailleau-sengage-sur-un-plan-deconomies-de-pres-de-200-milliards-deuros-sil-est-elu", "Fin du soutien au photovoltaïque et à l'éolien (2026)"], [1, "https://www.pcf.fr/ue_26_discours_fr", "Doubler l'électricité décarbonée « autant des énergies renouvelables que du nucléaire » ; programme : solaire et éolien mais « surtout » l'hydraulique (université d'été, août 2026)"], [1, "https://nouspresident.fr/travaillisme-ecologique/", "Soutient l'essor solaire et éolien, sans cible (2026)"], [2, "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "44 % d'ENR dans l'électricité en 2030 (2026)"], [1, "https://lafrancehumaniste.fr/articles/souverainete-agricole-et-alimentaire.html", "« le déploiement des énergies renouvelables sur les terres agricoles » (chronique agricole, févr. 2026 ; solaire non nommé)", 1], [-1, "https://www.budget2027.fr/", "Plan de Sarah Knafo (Reconquête) : fin du soutien public aux renouvelables intermittentes (2026)"]]}, {"id": "EN7", "tp": 4, "q": "Les zones à faibles émissions (ZFE) doivent être supprimées.", "k": 1, "i": "Les ZFE (zones à faibles émissions) sont des périmètres, dans une vingtaine de grandes agglomérations, où les véhicules les plus polluants (classés selon leur vignette Crit'Air) ne peuvent plus circuler. Elles visent à réduire la pollution de l'air ; elles sont critiquées parce qu'elles pénalisent les ménages modest
